packages:
  - apps/*
  - packages/*
  - gateway

# Shared version floor for the design system, locked once here so every
# frontend app stays aligned. Apps reference it with `"fold-ng": "catalog:"`;
# bump the version in this one place. Exact pin (no caret) — fold-ng is pre-1.0,
# so a minor can carry a breaking change; we adopt new versions deliberately.
catalog:
  fold-ng: 0.11.1
  # Le navigateur des tests e2e front. Épinglé ici pour que toutes les apps qui
  # en prendront soient sur LA MÊME version : Playwright télécharge des binaires
  # de navigateur liés à sa version, et deux versions dans le dépôt en
  # téléchargeraient deux jeux.
  "@playwright/test": 1.62.1
  # TypeScript, aligné une seule fois pour les backs et les packages Node.
  # 6.0 est la DERNIÈRE version JavaScript du compilateur : elle signale en
  # dépréciation ce que 7.0 (port Go) refuse en erreur dure. On s'y installe
  # pour voir venir — 7.0 ne ship aucune API programmatique, donc `nest build`,
  # ts-jest et les règles ESLint type-aware ne tournent pas dessus.
  typescript: ~6.0.3
  # NestJS et ses deux pairs obligatoires. Le noyau (`common`/`core`/
  # `platform-express`/`testing`) bouge d'un seul bloc — un décalage entre eux
  # se paie en erreurs de DI illisibles au démarrage, pas à la compilation.
  # Pin exact : on adopte une version, on ne la subit pas.
  "@nestjs/common": 11.2.1
  "@nestjs/core": 11.2.1
  "@nestjs/platform-express": 11.2.1
  "@nestjs/testing": 11.2.1
  "@nestjs/config": 4.0.4
  "@nestjs/cqrs": 11.0.3
  "@nestjs/throttler": 6.5.0
  "@nestjs/cli": 11.0.24
  "@nestjs/schematics": 11.1.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  # Zod — la source de vérité des contrats. Deux copies dans un même processus,
  # et deux schémas « identiques » cessent de s'accepter : la validation croisée
  # échoue sans rien dire d'utile. Une seule version, donc.
  zod: 4.4.3
  # Le harnais de test, partagé par lfd-api et les neuf packages.
  #
  # 🔴 Jest reste en 29, DÉLIBÉRÉMENT. Jest 30 a été essayé et rendu : sous ESM
  # (`--experimental-vm-modules`, notre mode), le `require('net')` interne de
  # `pg` retourne `undefined` et toutes les suites e2e qui touchent Postgres
  # meurent au démarrage sur « Cannot read properties of undefined (reading
  # 'Socket') ». `customExportConditions: ['node']` n'y change rien — c'est la
  # résolution des modules du coeur de Node dans le registre ESM de Jest 30 qui
  # est en cause. À rouvrir quand jest ou pg aura corrigé, pas avant.
  jest: 29.7.0
  ts-jest: 29.4.12
  "@types/jest": 29.5.14
  # Angular, pour les quatre fronts et les deux libs de présentation. Deux
  # lignes de version, comme chez Angular : le framework d'un côté, l'outillage
  # (CLI + build) de l'autre — elles n'avancent pas au même rythme.
  #
  # ⚠️ Les `peerDependencies` de @lfd/b2b-ui et @lfd/catalog-ui restent des
  # PLAGES (`^22.0.0`) et ne passent PAS par le catalogue : un pair épinglé
  # exact interdirait à un consommateur d'être sur la mineure suivante.
  "@angular/common": 22.1.2
  "@angular/compiler": 22.1.2
  "@angular/core": 22.1.2
  "@angular/forms": 22.1.2
  "@angular/platform-browser": 22.1.2
  "@angular/router": 22.1.2
  "@angular/compiler-cli": 22.1.2
  "@angular/cli": 22.1.4
  "@angular/build": 22.1.4
  tslib: 2.8.1

# `@angular/build` déclare @angular/platform-server et @angular/ssr en pairs
# OPTIONNELS. pnpm les installe quand même — et, faute de contrainte, les
# laissait figés sur l'ancienne 22.0.7, ce qui faisait réclamer 22.0.7 à tout
# l'arbre alors que le framework est en 22.1.2. Aucune app ne fait de SSR :
# on ne les ajoute pas aux dépendances, on les force simplement à suivre.
overrides:
  "@angular/platform-server": 22.1.2
  "@angular/ssr": 22.1.4

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"
  - lmdb
  - msgpackr-extract
