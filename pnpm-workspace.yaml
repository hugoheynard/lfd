packages:
  - apps/*
  - packages/*
  - gateway

# Shared version floor for the design system, locked once here so every
# frontend app stays aligned. Apps reference it with `"fold-ng": "catalog:"`;
# bump the version in this one place. Exact pin (no caret) — fold-ng is pre-1.0,
# so a minor can carry a breaking change; we adopt new versions deliberately.
catalog:
  fold-ng: 0.10.1
  # Le navigateur des tests e2e front. Épinglé ici pour que toutes les apps qui
  # en prendront soient sur LA MÊME version : Playwright télécharge des binaires
  # de navigateur liés à sa version, et deux versions dans le dépôt en
  # téléchargeraient deux jeux.
  "@playwright/test": 1.62.1

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"
  - lmdb
  - msgpackr-extract
