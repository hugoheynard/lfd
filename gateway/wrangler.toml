# Passerelle de la suite LFC (Cloudflare Worker). UN worker possède toute la zone :
# il route CHAQUE sous-domaine (option B, cf.
# documentation/architecture-suite-gateway-scaling.md) vers son upstream — fronts
# (Pages) et backends (Containers) en prod, serveurs dev locaux en dev.
#
# En DEV : `wrangler dev` sert sur 127.0.0.1:8787 et route les `*.localhost:8787`
# vers les serveurs locaux (voir src/routes.ts, dérivé de @lfd/endpoints). Les
# navigateurs résolvent `*.localhost` → 127.0.0.1 sans /etc/hosts.
#
# En PROD : les `routes` sur la zone réelle seront ajoutées ici au déploiement
# (Phase 4 du plan) ; la carte prod vit dans src/routes.ts.
name = "lfc-suite-gateway"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[dev]
ip = "127.0.0.1"
port = 8787

# Service bindings vers les backends : appels INTERNES au compte, sans passer par
# le réseau public. C'est la pièce qui rend la passerelle non contournable — une
# fois `workers_dev = false` posé sur les deux backends, ils n'auront plus aucune
# adresse publique et ce binding sera leur seul chemin d'entrée.
#
# ⚠️ Ordre de bascule impératif : brancher ici, repointer les fronts, VÉRIFIER,
# et seulement ensuite éteindre `workers.dev` côté backends. L'inverse coupe la
# production entre deux déploiements.
#
# Absents en `wrangler dev` (le routage local passe par les sous-domaines
# `*.localhost` et des URL publiques) : `Env` les déclare optionnels, et un
# binding manquant rend un 503 explicite plutôt qu'un repli silencieux.
[[services]]
binding = "B2B_BACKEND"
service = "lfc-b2b-backend"

[[services]]
binding = "PIM_BACKEND"
service = "lfc-pim-backend"
