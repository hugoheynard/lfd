# Passerelle de la suite LFC (Cloudflare Worker) — **la seule porte d'entrée**.
#
# En PROD : routage par **préfixe de chemin** (`/api/lfd`, cf.
# src/routes.ts) vers des **service bindings**, déclarés en fin de fichier. Les
# backends n'ont plus aucune adresse publique ; ce Worker est le seul chemin.
#
# ⚠️ L'en-tête précédent décrivait un routage par SOUS-DOMAINE sur « la zone » —
# il n'a jamais été appliqué, faute de zone à l'époque, et rien ne pointait vers
# cette passerelle. Le routage par chemin donne le même résultat sans posséder de
# domaine ; on repassera aux sous-domaines sans toucher aux backends (le préfixe
# est retiré avant transmission).
#
# ⚠️ « Aucune zone » n'est PLUS VRAI depuis le 2026-08-16 : `lafoliecoffee.info`
# est servie par Cloudflare (cf. documentation/ops/mailer-resend.md). Rien n'a
# encore bougé ici — la passerelle reste sur workers.dev — mais la raison qui
# imposait le routage par chemin a disparu ; c'est désormais un choix, pas une
# contrainte. Le premier usage de la zone est le domaine média
# (documentation/ops/architecture-stockage-media.md).
#
# En DEV : `wrangler dev` sert sur 127.0.0.1:8787 et route les `*.localhost:8787`
# vers les serveurs locaux — inchangé. `*.localhost` résout en loopback sans
# /etc/hosts. Les service bindings sont absents en dev, et un binding manquant
# rend un 503 explicite plutôt qu'un repli silencieux sur un appel public.
#
# Détail et diagrammes : documentation/ops/architecture-deploiement.md
# Renommée `lfc-suite-gateway` → `lfd-gateway` le 2026-08-20. Le nom disait
# « suite » pour une passerelle qui n'a jamais été une pièce de la suite mais la
# frontière de confiance des backends — et il survivait au retrait de celle-ci.
#
# ⚠️ Ce nom EST l'adresse publique de l'API (`workers.dev` — la zone existe mais
#    ne sert rien, cf. ci-dessus). Le changer déplace donc `LFD_API_URL`, qui est compilée
#    DANS les bundles des deux fronts au moment du build : ils doivent être
#    reconstruits, sans quoi ils appellent une adresse qui rend 404 sur tout.
#    C'est arrivé le jour même du renommage.
name = "lfd-gateway"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[dev]
ip = "127.0.0.1"
port = 8787

# ── Le front CLIENT, servi sous /pro ───────────────────────────────────────────
# `lafoliecoffee.info/pro` est un CHEMIN, pas un sous-domaine. Un sous-domaine se
# réglerait par un domaine personnalisé sur le projet Pages, sans une ligne de
# code ; un chemin oblige la passerelle à le porter, et l'app à connaître son
# préfixe (`baseHref: "/pro/"`, cf. sa configuration de build `cloudflare`). Les
# deux moitiés doivent rester d'accord : l'une sans l'autre, ce sont des 404 sur
# tous les assets.
#
# L'origine du front n'est PAS une variable d'ici : elle est lue dans
# `@lfd/endpoints`, la même constante que la liste CORS. Le nom du projet Pages
# est `lfc-b2b`, mais Cloudflare a suffixé son sous-domaine en silence — c'est
# `lfc-b2b-eu7.pages.dev` qui sert, et l'autre rend une build plus ancienne. Le
# dépôt a déjà payé ce piège une fois ; deux endroits qui écrivent l'adresse à la
# main le paieraient une deuxième.
#
# ⚠️ IL MANQUE TROIS CHOSES, toutes hors du dépôt, pour que l'adresse réponde :
#   1. le token `CLOUDFLARE_LFD_GATEWAY` est « Account · Workers Scripts · Edit »
#      (cf. l'en-tête de deploy_lfd_gateway.yml) : il ne peut PAS créer de route
#      de zone. Y ajouter « Zone · Workers Routes · Edit » sur lafoliecoffee.info ;
#   2. la zone n'a AUCUN enregistrement à l'apex — vérifié : `dig lafoliecoffee.info`
#      ne rend rien, et l'appel HTTP n'aboutit pas. Une route Worker sans
#      enregistrement proxifié ne reçoit jamais de trafic ;
#   3. alors seulement, décommenter le bloc `routes` ci-dessous.
#
# Le poser AVANT (1) casserait le déploiement de la passerelle, qui marche
# aujourd'hui — c'est pourquoi il est écrit mais inerte.
#
# [[routes]]
# pattern = "lafoliecoffee.info/pro*"
# zone_name = "lafoliecoffee.info"

# Service bindings vers les backends : appels INTERNES au compte, sans passer par
# le réseau public. C'est la pièce qui rend la passerelle non contournable — une
# fois `workers_dev = false` posé sur les deux backends, ils n'auront plus aucune
# adresse publique et ce binding sera leur seul chemin d'entrée.
#
# ⚠️ Ordre de bascule impératif : brancher ici, repointer les fronts, VÉRIFIER,
# et seulement ensuite éteindre `workers.dev` côté backends. L'inverse coupe la
# production entre deux déploiements.
#
# Absents en `wrangler dev` (le routage local passe par les sous-domaines
# `*.localhost` et des URL publiques) : `Env` les déclare optionnels, et un
# binding manquant rend un 503 explicite plutôt qu'un repli silencieux.
# POUSSÉE 2 SUR 2 du renommage du Worker (2026-08-20). La 1 a créé `lfd-api` et
# laissé `lfc-b2b-backend` servir ; celle-ci fait basculer le trafic.
#
# ⚠️ La sonde de fin du déploiement backend interroge `${LFD_API_URL}/health`
#    — donc À TRAVERS cette passerelle. Tant que le binding vise l'ancien Worker,
#    elle lit l'ancienne révision et le workflow échoue APRÈS avoir tout réussi.
#    C'est ce qui s'est passé à 15h36 : image poussée, secrets synchronisés, base
#    migrée, `lfd-api` déployé — et la sonde qui regarde ailleurs.
[[services]]
binding = "LFD_BACKEND"
service = "lfd-api"


# ── Observation du trafic (OPS J1) ─────────────────────────────────────────────
# La passerelle est le SEUL chemin : elle est donc le seul endroit qui puisse
# dire, sans rien demander à personne, ce qui est parti vers chaque backend et
# ce qui en est revenu. C'est la troisième source d'OPS, à côté du heartbeat
# (auto-déclaré) et du probe (externe) — cf.
# documentation/suite/architecture-ops-ecosystem-health.md §12.
#
# Un point par requête, agrégé À LA LECTURE en SQL. Rien ne va en Postgres : les
# points vivent chez Cloudflare, trois mois. Aucun identifiant client, aucune IP,
# aucun chemin complet n'y entre (cf. src/traffic.ts).
#
# `dataset` doit rester identique à `TRAFFIC_DATASET` dans src/traffic.ts —
# c'est la seule couture entre la configuration et le code.
#
# Absent en `wrangler dev` : `Env.TRAFFIC` est optionnel, et une écriture
# impossible ne doit jamais empêcher une requête de passer. OPS observe, il
# n'arbitre rien.
[[analytics_engine_datasets]]
binding = "TRAFFIC"
dataset = "lfc_gateway_traffic"
