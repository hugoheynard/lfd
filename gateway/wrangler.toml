# Passerelle de la suite LFC (Cloudflare Worker) — **la seule porte d'entrée**.
#
# En PROD : routage par **préfixe de chemin** (`/api/b2b`, `/api/pim`, cf.
# src/routes.ts) vers des **service bindings**, déclarés en fin de fichier. Les
# backends n'ont plus aucune adresse publique ; ce Worker est le seul chemin.
#
# ⚠️ L'en-tête précédent décrivait un routage par SOUS-DOMAINE sur « la zone » —
# il n'a jamais été appliqué : le compte Cloudflare n'a aucune zone, et rien ne
# pointait vers cette passerelle. Le routage par chemin donne le même résultat
# sans posséder de domaine ; on repassera aux sous-domaines le jour où il y en
# aura un, sans toucher aux backends (le préfixe est retiré avant transmission).
#
# En DEV : `wrangler dev` sert sur 127.0.0.1:8787 et route les `*.localhost:8787`
# vers les serveurs locaux — inchangé. `*.localhost` résout en loopback sans
# /etc/hosts. Les service bindings sont absents en dev, et un binding manquant
# rend un 503 explicite plutôt qu'un repli silencieux sur un appel public.
#
# Détail et diagrammes : documentation/ops/architecture-deploiement.md
name = "lfc-suite-gateway"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[dev]
ip = "127.0.0.1"
port = 8787

# Service bindings vers les backends : appels INTERNES au compte, sans passer par
# le réseau public. C'est la pièce qui rend la passerelle non contournable — une
# fois `workers_dev = false` posé sur les deux backends, ils n'auront plus aucune
# adresse publique et ce binding sera leur seul chemin d'entrée.
#
# ⚠️ Ordre de bascule impératif : brancher ici, repointer les fronts, VÉRIFIER,
# et seulement ensuite éteindre `workers.dev` côté backends. L'inverse coupe la
# production entre deux déploiements.
#
# Absents en `wrangler dev` (le routage local passe par les sous-domaines
# `*.localhost` et des URL publiques) : `Env` les déclare optionnels, et un
# binding manquant rend un 503 explicite plutôt qu'un repli silencieux.
[[services]]
binding = "B2B_BACKEND"
service = "lfc-b2b-backend"

[[services]]
binding = "PIM_BACKEND"
service = "lfc-pim-backend"
