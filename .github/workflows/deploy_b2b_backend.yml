name: deploy_b2b_backend

# Déploie le backend B2B (lfc-b2b-platform-backend, NestJS + Prisma) sur Cloudflare
# **Containers** : build de l'image depuis la racine monorepo → push registre
# Cloudflare → deploy du Worker. À chaque push sur main touchant le backend B2B.
#
# Scaffold : wrangler.jsonc + Dockerfile + container/worker.ts. Points à valider au
# 1er run (contexte de build, pnpm deploy, secrets runtime) : documentation/CONTAINERIZE-NOTES.md.
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   LFC_B2B_BACKEND_WORKER — token « Account · Workers Scripts · Edit » + « Containers · Edit ».
#   CLOUDFLARE_ACCOUNT_ID — account id partagé (injecté dans l'image au deploy).
#
# Secrets RUNTIME (≠ GitHub) posés une fois via `wrangler secret put` :
#   DATABASE_B2B_URL, Auth0, RESEND_MAILER_B2B_API_KEY, STRIPE_*, … — la liste
#   qui fait foi est la boucle `for name in …` ci-dessous, tenue à jour avec
#   `.env.example`. Un réglage absent de cette boucle N'ATTEINT PAS le Worker,
#   même posé dans GitHub : il n'y a aucun message pour le dire.

on:
  push:
    branches: [main]
    paths:
      - "apps/lfc-B2B-platform-backend/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy_b2b_backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy_b2b_backend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_b2b_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les types partagés doivent être buildés avant le typecheck du backend.
      - name: Build shared packages
        run: pnpm --filter "@lfd/contracts" build

      - name: Typecheck
        run: pnpm --filter lfc-b2b-platform-backend exec tsc --noEmit

      # 0) Le schéma AVANT le code. L'ordre inverse met en ligne un backend qui
      #    interroge des colonnes absentes : constaté le 2026-08-12 en dev, où
      #    l'admin racine n'a pas pu être semé et le symptôme visible est devenu
      #    « Aucun accès » — un message qui n'oriente vers rien.
      #
      #    `migrate deploy` n'applique QUE les migrations existantes : il n'en
      #    génère aucune et ne réinitialise jamais. Il échoue plutôt que de
      #    forcer, ce qui bloque le déploiement — c'est le comportement voulu :
      #    mieux vaut l'ancienne version en ligne qu'une nouvelle sur un schéma
      #    à moitié migré.
      - name: Migrer la base
        working-directory: apps/lfc-B2B-platform-backend
        env:
          DATABASE_B2B_URL: ${{ secrets.DATABASE_B2B_URL }}
        run: pnpm exec prisma migrate deploy

      # 1) Build l'image depuis la RACINE du monorepo (contexte complet), puis la
      #    pousse sur le registre Cloudflare via wrangler (auth automatique).
      - name: Build image (contexte racine)
        run: docker build -f apps/lfc-B2B-platform-backend/Dockerfile -t lfc-b2b-backend:latest .

      - name: Push image → registre Cloudflare
        working-directory: apps/lfc-B2B-platform-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LFC_B2B_BACKEND_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler containers push lfc-b2b-backend:latest

      # 2) Les secrets AVANT le déploiement : un container qui démarre sans
      #    DATABASE_B2B_URL meurt au boot (`required()` lève), puis redémarre une
      #    fois les secrets arrivés. Ça se répare tout seul, mais ça produit une
      #    fenêtre d'indisponibilité et une erreur qui inquiète pour rien.
      #
      #    Les secrets d'un Worker PERSISTENT d'un déploiement à l'autre : cette
      #    étape est donc un no-op sur les runs suivants, sauf quand une valeur
      #    change — et c'est précisément là qu'elle doit passer en premier, pour
      #    que le nouveau code trouve la nouvelle valeur déjà posée.
      #
      #    `continue-on-error` couvre le SEUL cas où elle ne peut pas réussir :
      #    le tout premier run, quand le Worker n'existe pas encore et qu'on ne
      #    peut donc rien lui attacher. Le déploiement suivant le crée, l'étape
      #    passe au run d'après, et l'ordre nominal reprend. Sans cette
      #    tolérance, le premier déploiement échouerait sans rien livrer.
      - name: Sync runtime secrets
        continue-on-error: true
        working-directory: apps/lfc-B2B-platform-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LFC_B2B_BACKEND_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_B2B_URL: ${{ secrets.DATABASE_B2B_URL }}
          # Identifiants Auth0 = PUBLICS → GitHub VARIABLES (pas Secrets). Tenant PROD.
          AUTH0_DOMAIN: ${{ vars.B2B_AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.B2B_AUTH0_AUDIENCE }}
          AUTH0_ADMIN_AUDIENCE: ${{ vars.AUTH0_ADMIN_AUDIENCE }}
          AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
          AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
          # Connexion staff : distincte de la connexion client, c'est le mur qui
          # empêche un client de s'authentifier contre le back-office.
          AUTH0_STAFF_CONNECTION: ${{ vars.AUTH0_STAFF_CONNECTION }}
          # L'adresse de l'admin RACINE — une adresse, pas un secret. Sans elle,
          # le code retombe sur son défaut, et la porte de secours ne pointe pas
          # vers la boîte qu'on relève.
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
          # Racines publiques : elles décident où atterrit quelqu'un APRÈS avoir
          # posé son mot de passe. Absentes, il reste sur une page Auth0.
          #
          # `B2B_ADMIN_BASE_URL` est PARTAGÉE avec la boutique cliente, qui en a
          # besoin pour le QR de retrait — c'est le staff qui le scanne, il doit
          # donc pointer vers le back-office. Une seule variable pour les deux
          # usages : deux copies à tenir identiques finiraient par diverger, et
          # le QR mènerait alors nulle part sans que rien ne le signale.
          CLIENT_BASE_URL: ${{ vars.B2B_CLIENT_BASE_URL }}
          ADMIN_BASE_URL: ${{ vars.B2B_ADMIN_BASE_URL }}
          # Courrier : sans la clé, aucune invitation ne part — ni pour l'équipe,
          # ni pour un client.
          RESEND_MAILER_B2B_API_KEY: ${{ secrets.RESEND_MAILER_B2B_API_KEY }}
          MAILER_FROM_ADDRESS: ${{ vars.MAILER_FROM_ADDRESS }}
          MAILER_STAFF_INBOX: ${{ vars.MAILER_STAFF_INBOX }}
          # Stockage R2 : endpoint et région sont des faits du COMPTE ; le bucket
          # et les clés appartiennent à l'USAGE, pour qu'un jeton n'ouvre que le
          # sien. Un stockage de plus = un bloc de trois, isolé du reste.
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_KBIS_BUCKET: ${{ vars.R2_KBIS_BUCKET }}
          R2_KBIS_ACCESS_KEY_ID: ${{ secrets.R2_KBIS_ACCESS_KEY_ID }}
          R2_KBIS_SECRET_ACCESS_KEY: ${{ secrets.R2_KBIS_SECRET_ACCESS_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          for name in DATABASE_B2B_URL AUTH0_DOMAIN AUTH0_AUDIENCE AUTH0_ADMIN_AUDIENCE \
                      AUTH0_M2M_CLIENT_ID AUTH0_M2M_CLIENT_SECRET AUTH0_STAFF_CONNECTION \
                      BOOTSTRAP_ADMIN_EMAIL CLIENT_BASE_URL ADMIN_BASE_URL \
                      RESEND_MAILER_B2B_API_KEY MAILER_FROM_ADDRESS MAILER_STAFF_INBOX \
                      R2_ENDPOINT R2_REGION \
                      R2_KBIS_BUCKET R2_KBIS_ACCESS_KEY_ID R2_KBIS_SECRET_ACCESS_KEY \
                      STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name"
            fi
          done

      # 3) Injecte l'account id dans l'`image` du wrangler (jamais commité), puis déploie
      #    le Worker qui référence l'image poussée.
      - name: Deploy Worker
        working-directory: apps/lfc-B2B-platform-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LFC_B2B_BACKEND_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i "s/__CF_ACCOUNT_ID__/${CLOUDFLARE_ACCOUNT_ID}/" wrangler.jsonc
          pnpm exec wrangler deploy
