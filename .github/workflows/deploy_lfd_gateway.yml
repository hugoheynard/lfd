name: deploy_lfd_gateway

# Déploie le Worker passerelle de la Suite LFC (gateway/) sur Cloudflare, à chaque
# push sur main qui touche gateway/**.
#
# ⚠️ PHASE 4 non terminée : `PROD_ROUTES` (gateway/src/routes.ts) est VIDE → ce
# déploiement met le Worker en ligne mais il n'est attaché à AUCUNE route de prod,
# et router vers des backends pas encore hébergés (Phase 0) n'aurait rien à servir.
# Le Worker devient utile quand les routes prod + les upstreams (Containers)
# existent. On peut déjà le déployer sans risque (il ne capte aucun trafic).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_LFD_GATEWAY — token « Account · Workers Scripts · Edit » ET
#     « All zones · Workers Routes · Edit ». Le second a longtemps manqué à cette
#     note alors que le token le portait : vérifié au tableau de bord le
#     2026-08-27. Il est nécessaire depuis que `wrangler.toml` déclare une route
#     de zone (`lafoliecoffee.info/pro*`) — sans lui, le déploiement échoue.
#     (+ « Zone · Workers Routes · Edit » le jour où on posera les routes prod).
#   CLOUDFLARE_ACCOUNT_ID — l'account id partagé.

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/deploy_lfd_gateway.yml"
  workflow_dispatch:

concurrency:
  group: deploy_lfd_gateway
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # lire le verdict des autres workflows

jobs:
  deploy_lfd_gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── La porte ────────────────────────────────────────────────────────────
      # Jusqu'au 2026-08-27, ce déploiement partait dès le push sur `main`, sans
      # rien savoir de la CI : elle tournait EN MÊME TEMPS, et son verdict
      # arrivait après coup. Un commit rouge se déployait quand même.
      - name: Attendre que la CI soit verte
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/attendre-un-run
        with:
          workflow: ci.yml

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter lfd-gateway run typecheck

      # wrangler est installé dans le paquet gateway (devDep) — on l'invoque via
      # `exec` (pas `dlx`) pour utiliser la version pinnée. Il lit le token et
      # l'account id depuis l'environnement, et `gateway/wrangler.toml` pour le reste.
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_GATEWAY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter lfd-gateway exec wrangler deploy
