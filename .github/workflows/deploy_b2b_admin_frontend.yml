name: deploy_b2b_admin_frontend

# Build browser-only du B2B admin front (lfc-B2B-admin-frontend) → Cloudflare Pages, à
# chaque push sur main. Pas de SSR. wrangler ne fait qu'uploader le statique déjà buildé.
#
# Secrets requis :
#   CLOUDFLARE_LFC_B2B_ADMIN_PAGES — token « Account · Cloudflare Pages · Edit ».
#   CLOUDFLARE_ACCOUNT_ID — account id partagé.
# Variable PUBLIQUE (onglet Variables — pas un secret) :
#   B2B_ADMIN_API_BASE_URL — URL du backend B2B (le sous-domaine gateway en prod).
# Projet Pages `lfc-b2b-admin` (créé au 1er run).

on:
  push:
    branches: [main]
    paths:
      - "apps/lfc-B2B-admin-frontend/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy_b2b_admin_frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy_b2b_admin_frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_b2b_admin_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate API config (public build var)
        working-directory: apps/lfc-B2B-admin-frontend
        env:
          B2B_ADMIN_API_BASE_URL: ${{ vars.B2B_ADMIN_API_BASE_URL }}
        run: node scripts/generate-api-config.mjs

      - name: Typecheck
        run: pnpm --filter lfc-b2b-admin-frontend exec tsc --noEmit

      - name: Build (static, browser-only)
        run: pnpm --filter lfc-b2b-admin-frontend exec ng build --configuration cloudflare

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFC_B2B_ADMIN_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages project create lfc-b2b-admin
          --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFC_B2B_ADMIN_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages deploy
          apps/lfc-B2B-admin-frontend/dist/lfc-b2b-admin-frontend/browser
          --project-name=lfc-b2b-admin
          --branch=main
