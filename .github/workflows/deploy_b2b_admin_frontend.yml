name: deploy_b2b_admin_frontend

# Build browser-only du B2B admin front (lfc-B2B-admin-frontend) → Cloudflare Pages, à
# chaque push sur main. Pas de SSR. wrangler ne fait qu'uploader le statique déjà buildé.
#
# Secrets requis :
#   CLOUDFLARE_LFD_BACKOFFICE_PAGES — token « Account · Cloudflare Pages · Edit ».
#   CLOUDFLARE_ACCOUNT_ID — account id partagé.
# Variables PUBLIQUES (onglet Variables — jamais des secrets : elles finissent dans
# le bundle navigateur, et c'est prévu) :
#   B2B_API_BASE_URL — URL du backend B2B, PARTAGÉE avec la boutique cliente :
#     un seul backend, deux publics (Invariant C). Une seule variable pour les deux.
#   B2B_ADMIN_AUTH0_DOMAIN · B2B_ADMIN_AUTH0_CLIENT_ID · B2B_ADMIN_AUTH0_AUDIENCE
#     — connexion staff quand l'app tourne HORS du shell. Sous le shell, la suite
#       possède la session et ces trois valeurs ne servent pas.
#     ⚠️ _AUDIENCE = l'AUTH0_ADMIN_AUDIENCE du backend (surface staff), jamais son
#       AUTH0_AUDIENCE (surface client).
# Projet Pages `lfd-backoffice` (créé au 1er run ; `lfc-b2b-admin` avant le 2026-08-20).

on:
  push:
    branches: [main]
    paths:
      - "apps/lfc-B2B-admin-frontend/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy_b2b_admin_frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy_b2b_admin_frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_b2b_admin_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les paquets partagés AVANT le build : `tsc` résout `@lfd/contracts` par
      # les chemins du tsconfig (donc la SOURCE) et passe sans `dist/`, mais le
      # bundler d'Angular, lui, suit le `exports` du package.json et cherche
      # `dist/index.js`. Sans cette étape le typecheck est vert et le build
      # échoue — c'est ce qui est arrivé au 1er déploiement (2026-08-13).
      # La CI, elle, ne le voyait pas : `ci.yml` construit déjà les paquets.
      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      # UNE seule variable pour les deux fronts : ils tapent le MÊME backend B2B
      # (Invariant C — un backend, deux publics, séparés par l'audience du jeton).
      # Deux variables à tenir identiques sans que rien ne le vérifie, c'est une
      # divergence qui attend son heure : on en change une, on oublie l'autre, et
      # un front parle à une URL morte sans rien dire de plus que « l'app ne
      # marche pas ». Le nom d'env local reste celui qu'attend le script.
      - name: Generate API config (public build var)
        working-directory: apps/lfc-B2B-admin-frontend
        env:
          # L'identité du BUILD, pour Sentry : c'est par elle qu'il rapproche une
          # pile minifiée de ses source maps. Le SHA court, comme `APP_REVISION`
          # côté backend — surtout pas une valeur constante, qui ferait détenir
          # à Sentry des cartes qu'il n'appliquerait jamais.
          APP_REVISION: ${{ github.sha }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          B2B_ADMIN_API_BASE_URL: ${{ vars.B2B_API_BASE_URL }}
        run: node scripts/generate-api-config.mjs

      - name: Generate Auth0 config (public build vars)
        working-directory: apps/lfc-B2B-admin-frontend
        env:
          B2B_ADMIN_AUTH0_DOMAIN: ${{ vars.B2B_ADMIN_AUTH0_DOMAIN }}
          B2B_ADMIN_AUTH0_CLIENT_ID: ${{ vars.B2B_ADMIN_AUTH0_CLIENT_ID }}
          B2B_ADMIN_AUTH0_AUDIENCE: ${{ vars.B2B_ADMIN_AUTH0_AUDIENCE }}
        run: node scripts/generate-auth-config.mjs

      - name: Typecheck
        run: pnpm --filter lfc-b2b-admin-frontend exec tsc --noEmit

      - name: Build (static, browser-only)
        run: pnpm --filter lfc-b2b-admin-frontend exec ng build --configuration cloudflare

      # 🔴 `lfd-backoffice` depuis le 2026-08-20 : le projet s'appelait
      #    `lfc-b2b-admin`. Cloudflare ne renomme PAS un projet Pages — celui-ci
      #    est donc NEUF, et l'ancien continue de servir jusqu'à suppression
      #    manuelle. C'est ce qui rend la bascule sans coupure, à condition que
      #    les DEUX origines soient autorisées en CORS (elles le sont, cf.
      #    `packages/endpoints` → `LEGACY_B2B_ADMIN_FRONT`) et déclarées chez
      #    Auth0.
      #
      # ⚠️ APRÈS LE PREMIER DÉPLOIEMENT, LIRE L'URL RENDUE ICI. Si le nom court
      #    était pris, Cloudflare suffixe le sous-domaine SANS RIEN DIRE — c'est
      #    l'accident `lfc-b2b` → `lfc-b2b-eu7`, qui a laissé la boutique hors
      #    CORS pendant des jours sans que personne ne le voie. L'origine réelle
      #    doit être recopiée dans `PROD_FRONT_ORIGINS.b2bAdminFront`.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_BACKOFFICE_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages project create lfd-backoffice
          --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_BACKOFFICE_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages deploy
          apps/lfc-B2B-admin-frontend/dist/lfc-b2b-admin-frontend/browser
          --project-name=lfd-backoffice
          --branch=main
