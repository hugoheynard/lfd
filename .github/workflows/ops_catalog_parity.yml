name: ops_catalog_parity

# Compare, EN PRODUCTION, ce que le RÉFÉRENTIEL publierait à ce que la
# PLATEFORME vend — « le miroir est-il fidèle ? ».
#
# ⚠️ Ce workflow a comparé autre chose. Il servait de feu vert avant la bascule
# du seed : seed en place contre catalogue reçu, une fois, pour autoriser un
# changement d'autorité de prix. Cette bascule est faite, la comparaison a changé
# de sujet — et le workflow, lui, était resté sur l'ancienne forme du rapport. Il
# lisait `seedCount`, `identical`, `extra`, `gap['seed']` : huit champs qui
# n'existent plus. Il plantait sur sa première ligne, en silence, parce qu'on ne
# le déclenche qu'à la main (réparé le 2026-09-02).
#
# Il n'est donc PAS temporaire, contrairement à ce qu'il affirmait : la question
# « le miroir a-t-il décroché » ne se referme jamais.
#
# Pourquoi un workflow : la route est gardée par `RECOMPUTE_TOKEN`, secret
# GitHub donc en écriture seule. Même raison que `ops_logs`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Comparer le référentiel au miroir de la plateforme
        env:
          API_BASE_URL: ${{ vars.LFD_API_URL }}
          RECOMPUTE_TOKEN: ${{ secrets.RECOMPUTE_TOKEN }}
        run: |
          set -uo pipefail
          report=$(curl --fail-with-body --silent --show-error --max-time 30 \
                   "${API_BASE_URL}/admin/catalog/parity" \
                   -H "x-lfc-recompute-token: ${RECOMPUTE_TOKEN}") || {
            echo "::error::Comparaison injoignable — la porte machine-à-machine a refusé."
            exit 1
          }

          REPORT="${report}" python3 <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os

          report = json.loads(os.environ["REPORT"])

          def euros(millicents):
              # Millicentimes (10⁻⁵ €) → euros, comme `formatEuros` du dépôt :
              # jusqu'à cinq décimales mais au moins deux. Arrondir au centime
              # masquerait précisément l'écart que ce tableau vient signaler —
              # deux prix distincts s'afficheraient « 2,10 € » et « 2,10 € ».
              texte = f"{millicents / 100_000:.5f}".rstrip("0")
              if len(texte.split(".")[1]) < 2:
                  texte = f"{millicents / 100_000:.2f}"
              return texte.replace(".", ",") + " €"

          def taux(value):
              return "—" if value is None else f"{value} %".replace(".", ",")

          print("## Parité du catalogue\n")
          print(f"- Publié par le référentiel : **{report['referenceCount']}** articles")
          print(f"- Tenu par la plateforme : **{report['mirrorCount']}** articles\n")

          if report["inSync"]:
              print("✅ **Le miroir est fidèle.** Rien ne diffère.")
              raise SystemExit(0)

          print("⚠️ **Le miroir diffère du référentiel** — chaque ligne doit s'expliquer.\n")

          if report["missing"]:
              print("### 🔴 Publiés par le référentiel, absents du miroir\n")
              print("Le pire cas : la boutique ne sait pas les vendre, et le client ne")
              print("comprend pas pourquoi.\n")
              print(", ".join(f"`{sku}`" for sku in report["missing"]) + "\n")

          if report["stale"]:
              print("### 🔴 Dans le miroir, plus publiés\n")
              print("Vendus alors que le référentiel les a retirés — l'autre moitié du")
              print("même défaut.\n")
              print(", ".join(f"`{sku}`" for sku in report["stale"]) + "\n")

          if report["priceGaps"]:
              print("### 💶 Prix qui diffèrent\n")
              print("Le prix **canonique** des deux côtés — jamais le prix négocié, qui")
              print("est une décision légitime de la plateforme. Chaque ligne est de l'argent.\n")
              print("| SKU | Référentiel | Plateforme |")
              print("| --- | --- | --- |")
              for gap in report["priceGaps"]:
                  print(f"| `{gap['sku']}` | {euros(gap['reference'])} | {euros(gap['mirror'])} |")
              print()

          if report["vatGaps"]:
              print("### 🧾 Taux de TVA qui diffèrent\n")
              print("Chaque ligne est un montant de TVA facturé à tort. `—` = article que")
              print("la plateforme ne sait pas facturer (famille non réglée dans le PIM).\n")
              print("| SKU | Référentiel | Plateforme |")
              print("| --- | --- | --- |")
              for gap in report["vatGaps"]:
                  print(f"| `{gap['sku']}` | {taux(gap['reference'])} | {taux(gap['mirror'])} |")
              print()

          if report["nameGaps"]:
              print("### ✏️ Noms qui diffèrent\n")
              for gap in report["nameGaps"]:
                  print(f"- `{gap['sku']}` : référentiel « {gap['reference']} » → plateforme « {gap['mirror']} »")
              print()
          PY

          # Le job ne rougit PAS sur un écart, et la raison a changé avec le
          # sujet de la comparaison : un écart peut être du travail PIM NON
          # ENCORE POUSSÉ, ce qui est parfaitement normal. Ce workflow ne sait
          # pas distinguer « pas encore poussé » de « le miroir a décroché » —
          # c'est le découpage en trois lignes de
          # `documentation/pim/conception-stage-evaluer-pousser.md` (§5.1 bis)
          # qui le rendra possible. En attendant, on veut LIRE les écarts ;
          # rougir ferait de ce rapport une alarme qu'on apprend à ignorer.
          echo "Rapport lu — voir le résumé du job."
