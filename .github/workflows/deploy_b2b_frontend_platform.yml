name: deploy_b2b_frontend_platform

# Builds the browser-only static bundle of lfc-B2B-platform-frontend and pushes
# it to Cloudflare Pages on every push to main. No SSR (the B2B space needs no
# SEO), so the output is plain files served straight from Pages.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN_B2B_PLATFORM — token with "Account · Cloudflare Pages ·
#     Edit" (per-app name: this repo hosts several static apps, each gets its own
#     token so they rotate/revoke independently).
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id (shared across every app —
#     one account, one id).
# and a Pages project named `lfc-b2b` (create it once: `npx wrangler pages
# project create lfc-b2b`, or the first manual `wrangler pages deploy`).

on:
  push:
    branches: [main]
    # Only what actually affects the B2B build. The app's own code, and
    # pnpm-workspace.yaml (the `catalog:` pin — where a fold-ng bump lands). NOT
    # pnpm-lock.yaml (any other app installing a dep would redeploy B2B for
    # nothing) nor packages/** (B2B consumes no local package). Force a rebuild
    # anytime via Actions → Run workflow (workflow_dispatch).
    paths:
      - "apps/lfc-B2B-platform-frontend/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy_b2b_frontend_platform.yml"
  workflow_dispatch:

# One live deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy_b2b_frontend_platform
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_b2b_frontend_platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate: a red typecheck must never reach Pages. The AOT build below also
      # type-checks the app + templates, so together they fail fast on any error.
      - name: Typecheck
        run: pnpm --filter lfc-b2b-platform-frontend exec tsc --noEmit

      - name: Build (static, browser-only)
        run: pnpm --filter lfc-b2b-platform-frontend exec ng build --configuration cloudflare

      # Crée le projet Pages au premier run s'il n'existe pas (idempotent : le
      # `|| true` avale le "already exists" des runs suivants). Évite toute étape
      # manuelle dans le dashboard.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_B2B_PLATFORM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages project create lfc-b2b
          --production-branch=main || true

      # `cloudflare/wrangler-action` tente d'installer wrangler via `pnpm add` à
      # la racine du workspace → ERR_PNPM_ADDING_TO_ROOT. On l'invoque plutôt en
      # direct avec `pnpm dlx` (fetch éphémère, ne touche pas le workspace).
      # wrangler lit le token + l'account id depuis l'environnement.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_B2B_PLATFORM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages deploy
          apps/lfc-B2B-platform-frontend/dist/lfc-b2b-platform-frontend/browser
          --project-name=lfc-b2b
          --branch=main
