name: ops_b2b_logs

# Lit les dernières lignes d'incident de l'instance B2B en production.
#
# Pourquoi un workflow : la route est gardée par `RECOMPUTE_TOKEN`, un secret
# GitHub — donc en écriture seule. La clé n'est détenue que par la CI, c'est
# donc depuis la CI que ça se lit. Même raison que `ops_b2b_identity_probe`.
#
# Ce qu'on lit est un TAMPON EN MÉMOIRE, borné et perdu au redémarrage : il
# répond à « que vient-il de se passer ? », pas à « qu'est-il arrivé cette
# nuit ? ». Cloudflare ne remonte pas la sortie d'un container.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de lignes (1 à 200, défaut 50)"
        required: false
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Lire les dernières lignes
        env:
          API_BASE_URL: ${{ vars.B2B_API_BASE_URL }}
          RECOMPUTE_TOKEN: ${{ secrets.RECOMPUTE_TOKEN }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          report=$(curl --fail-with-body --silent --show-error --max-time 30 \
                   "${API_BASE_URL}/admin/ops/logs?limit=${LIMIT}" \
                   -H "x-lfc-recompute-token: ${RECOMPUTE_TOKEN}") || {
            echo "::error::Journaux injoignables — la porte machine-à-machine a refusé."
            exit 1
          }

          REPORT="${report}" python3 <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          report = json.loads(os.environ["REPORT"])
          print(f"## Journaux — révision `{report['revision']}` ({report['kept']} lignes gardées)\n")
          lines = report["lines"]
          if not lines:
              print("_Aucune erreur ni alerte depuis le démarrage de cette instance._")
          else:
              print("| Quand | Niveau | Contexte | Message |")
              print("| --- | --- | --- | --- |")
              for entry in lines:
                  message = entry["message"].replace("|", "\\|").replace("\n", " ")
                  print(f"| {entry['at']} | {entry['level']} | {entry['context'] or '—'} | {message} |")
          PY
