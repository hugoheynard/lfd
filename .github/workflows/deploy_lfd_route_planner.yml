name: deploy_lfd_route_planner

# Déploie `lfd-route-planner` — le calcul d'itinéraires routiers de la Savoie — sur
# Cloudflare Containers (plan de tournée, lot 8, forme B-ter :
# documentation/livraisons/plan-preparation-de-tournee.md, L8-C10/C11).
#
# L'IMAGE EST LA CARTE. Chaque exécution télécharge l'extrait OpenStreetMap du
# jour, découpe la Savoie, prépare le graphe, le vérifie, et le met dans
# l'image. Le tag
# `savoie-AAAAMMJJ-osrm<version>` dit laquelle tourne ; revenir à la carte
# précédente = redéployer son tag (documentation/ops/runbook.md, « La carte
# routière »).
#
# LES TUILES DE LA CARTE (lot 10 ter, L10t-C1/C2) partent, elles, dans le
# bucket R2 `lfd-map-tiles`, fabriquées depuis LE MÊME extrait que le graphe :
# déposées sous un préfixe daté `AAAA-MM-JJ/`, puis `current.json` réécrit EN
# DERNIER — la bascule est l'écriture de ce seul fichier, et une fabrication
# ratée ne l'atteint jamais. Deux préfixes sont gardés ; le plus ancien n'est
# supprimé qu'APRÈS la bascule. Tout cela AVANT `wrangler deploy`, qui refuse
# une liaison vers un bucket absent.
#
# Trois déclencheurs :
#   · MENSUEL — les routes de montagne changent peu, mais une route fermée ou
#     ouverte change des tournées (L8-C4) ;
#   · MANUEL — refaire la carte tout de suite, ou après un échec du mensuel ;
#   · PUSH sur `main` filtré sur `apps/lfd-route-planner/**` — un changement du Worker,
#     du Dockerfile ou de la version d'OSRM.
#
# ⚠️ Un workflow n'est lu que par GitHub : aucune porte locale ne le vérifie.
# Si le MENSUEL échoue, il échoue VISIBLEMENT (aucun `continue-on-error`) :
# GitHub prévient l'auteur du dernier changement de ce fichier, et la carte
# précédente continue de servir — elle vieillit, elle ne disparaît pas.
#
# Secrets GitHub :
#   CLOUDFLARE_LFD_ROUTE_PLANNER — le jeton de CE déploiement seul (créé par
#     Hugo le 2026-09-29) : « Workers Scripts · Edit », « Account Settings ·
#     Read », « Cloudflare Images · Edit » (ce dernier couvre le registre de
#     conteneurs, malgré son nom) — les permissions du jeton de l'API,
#     relevées sur lui — plus « Workers R2 Storage · Edit » (ajoutée par Hugo
#     le 2026-09-29, lot 10 ter) pour créer le bucket et y déposer les tuiles.
#     Un jeton par déploiement : une fuite n'ouvre que son
#     service.
#   CLOUDFLARE_ACCOUNT_ID — injecté dans `wrangler.jsonc` au déploiement.
# Aucun secret RUNTIME : OSRM ne lit rien de l'environnement.
#
# AUCUNE ADRESSE PUBLIQUE (`workers_dev: false`) : son seul appelant est la
# passerelle, par service binding, sous `/api/route-planner` et derrière un jeton
# qu'ELLE vérifie (lot 8 bis). ⚠️ `wrangler` résout chaque service binding au
# moment de publier : ce Worker doit être déployé AVANT la passerelle qui le
# nomme (documentation/ops/planificateur-de-tournees.md, « Mettre en service »).

on:
  schedule:
    # Le 3 de chaque mois, 02:17 UTC : hors des heures de tournée, et loin de
    # l'heure pile où les exécutions planifiées de GitHub s'embouteillent.
    - cron: "17 2 3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/lfd-route-planner/**"
      - ".github/workflows/deploy_lfd_route_planner.yml"

concurrency:
  group: deploy_lfd_route_planner
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # lire le verdict de la CI

jobs:
  deploy_lfd_route_planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La CI (`ci.yml`) connaît ce paquet depuis le 2026-09-29 : job
      # `route-planner`, périmètre `route_planner` dans
      # `dev-toolbox/ci/affected.mjs` (vérifié le 2026-10-07). Ses contrôles
      # tournent quand même ICI, avant tout geste vers Cloudflare : sur un push,
      # ils doublent ceux de la CI, qu'on attend plus bas ; le mensuel et le
      # manuel n'ont aucune CI à attendre.
      - name: Typecheck, lint et tests du Worker
        run: |
          pnpm --filter lfd-route-planner exec tsc --noEmit
          pnpm --filter lfd-route-planner lint
          pnpm --filter lfd-route-planner test

      # Le tag de la CARTE : date de l'extrait (UTC) + version d'OSRM. La
      # version vient de `osrm-version.env`, la seule source — celle que lisent
      # aussi le script de préparation et le Dockerfile.
      - name: Nommer la carte
        id: map
        run: |
          source apps/lfd-route-planner/osrm-version.env
          tag="savoie-$(date -u +%Y%m%d)-osrm${OSRM_VERSION}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "osrm_image=${OSRM_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Carte : ${tag}"

      # Le graphe HORS du dépôt (`$RUNNER_TEMP`) : il sert de contexte au
      # `docker build`, et le `.dockerignore` racine ne le connaît pas. Le
      # script échoue si `osrm-routed` ne charge pas le graphe ou ne rend pas
      # l'itinéraire Val d'Isère → Arc 1800.
      - name: Préparer et vérifier le graphe
        run: apps/lfd-route-planner/scripts/build-graph.sh "$RUNNER_TEMP/osrm-graph"

      # Les tuiles depuis l'extrait que l'étape précédente a laissé dans son
      # dossier. Le script échoue si l'un des deux fichiers ne se relit pas
      # (`pmtiles show` sans zooms) : rien n'est alors déposé.
      - name: Fabriquer et vérifier les tuiles
        run: |
          apps/lfd-route-planner/scripts/build-tiles.sh \
            "$RUNNER_TEMP/osrm-graph/savoie.osm.pbf" "$RUNNER_TEMP/map-tiles"
          test -s "$RUNNER_TEMP/map-tiles/savoie.pmtiles"
          test -s "$RUNNER_TEMP/map-tiles/savoie-relief.pmtiles"

      - name: Construire l'image (linux/amd64)
        run: |
          docker build --platform linux/amd64 \
            --build-arg OSRM_IMAGE="${{ steps.map.outputs.osrm_image }}" \
            -f apps/lfd-route-planner/Dockerfile \
            -t lfd-osrm:"${{ steps.map.outputs.tag }}" \
            "$RUNNER_TEMP/osrm-graph"

      - name: Pousser l'image → registre Cloudflare
        working-directory: apps/lfd-route-planner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_ROUTE_PLANNER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler containers push lfd-osrm:"${{ steps.map.outputs.tag }}"

      # Sur un push, on attend la CI comme `lfd-api` : un commit rouge ne se
      # déploie pas. Le mensuel et le manuel n'ont pas de commit neuf à juger.
      - name: Attendre que la CI soit verte
        if: github.event_name == 'push'
        uses: ./.github/actions/attendre-un-run
        with:
          workflow: ci.yml

      # Idempotent : « existe déjà » (code 10004) est un succès, toute autre
      # erreur arrête le déploiement.
      - name: Créer le bucket des tuiles s'il manque
        working-directory: apps/lfd-route-planner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_ROUTE_PLANNER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if output="$(pnpm exec wrangler r2 bucket create lfd-map-tiles 2>&1)"; then
            echo "Bucket lfd-map-tiles créé."
          elif grep -qiE "already exists|10004" <<<"$output"; then
            echo "Bucket lfd-map-tiles déjà présent."
          else
            echo "$output" >&2
            exit 1
          fi

      # Dépôt sous le préfixe daté, puis bascule, puis ménage — dans cet ordre.
      # `current.json` porte aussi le préfixe PRÉCÉDENT (`previous`) : `wrangler`
      # ne sait pas lister un bucket, et c'est cette chaîne qui dit lequel
      # supprimer. Sans elle (première fois, lecture impossible), on ne
      # supprime rien : on perd de la place, jamais une carte.
      - name: Déposer les tuiles, puis basculer current.json
        working-directory: apps/lfd-route-planner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_ROUTE_PLANNER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TILES: ${{ runner.temp }}/map-tiles
        run: |
          prefix="$(date -u +%Y-%m-%d)"
          put() {
            pnpm exec wrangler r2 object put "lfd-map-tiles/$1" --file "$2" \
              --content-type "$3" --remote
          }
          put "${prefix}/rues.pmtiles" "$TILES/savoie.pmtiles" application/vnd.pmtiles
          put "${prefix}/relief.pmtiles" "$TILES/savoie-relief.pmtiles" application/vnd.pmtiles

          old_json="$(pnpm exec wrangler r2 object get lfd-map-tiles/current.json \
            --pipe --remote 2>/dev/null || true)"
          old="$(jq -r '.prefix // empty' <<<"$old_json" 2>/dev/null || true)"
          older="$(jq -r '.previous // empty' <<<"$old_json" 2>/dev/null || true)"
          if [ "$old" = "$prefix" ]; then
            previous="$older"; stale=""   # même jour, refabriqué : la chaîne ne bouge pas
          else
            previous="$old"; stale="$older"
          fi

          jq -n --arg prefix "$prefix" --arg previous "$previous" \
            '{prefix: $prefix, previous: (if $previous == "" then null else $previous end)}' \
            > "$RUNNER_TEMP/current.json"
          put current.json "$RUNNER_TEMP/current.json" application/json
          echo "### Tuiles en service : \`${prefix}\` (précédentes : \`${previous:-aucune}\`)" >> "$GITHUB_STEP_SUMMARY"

          # APRÈS la bascule, et seulement un préfixe daté distinct des deux gardés.
          if [[ "$stale" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
            && [ "$stale" != "$prefix" ] && [ "$stale" != "$previous" ]; then
            for file in rues.pmtiles relief.pmtiles; do
              pnpm exec wrangler r2 object delete "lfd-map-tiles/${stale}/${file}" --remote
            done
            echo "Préfixe ${stale} supprimé."
          fi

      - name: Déployer le Worker
        working-directory: apps/lfd-route-planner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_ROUTE_PLANNER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAP_TAG: ${{ steps.map.outputs.tag }}
        run: |
          sed -i "s/__CF_ACCOUNT_ID__/${CLOUDFLARE_ACCOUNT_ID}/" wrangler.jsonc
          sed -i "s/__IMAGE_TAG__/${MAP_TAG}/" wrangler.jsonc
          pnpm exec wrangler deploy
          echo "### Carte déployée : \`${MAP_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
