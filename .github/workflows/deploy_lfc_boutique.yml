name: deploy_lfc_boutique

# Builds the browser-only static bundle of lfc-B2B-platform-frontend and pushes
# it to Cloudflare Pages on every push to main. No SSR (the B2B space needs no
# SEO), so the output is plain files served straight from Pages.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_LFC_B2B_PLATFORM_PAGES — token with "Account · Cloudflare Pages ·
#     Edit" (per-app name: this repo hosts several static apps, each gets its own
#     token so they rotate/revoke independently).
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id (shared across every app —
#     one account, one id).
# and a Pages project named `lfc-b2b` (create it once: `npx wrangler pages
# project create lfc-b2b`, or the first manual `wrangler pages deploy`).
#
# Plus four repo VARIABLES (Settings → Secrets and variables → Actions →
# *Variables* tab — NOT secrets: it's the SPA's PUBLIC Auth0 config, it ships in
# the browser bundle). They feed generate-auth-config.mjs at build time:
#   B2B_AUTH0_DOMAIN · B2B_AUTH0_CLIENT_ID · B2B_AUTH0_AUDIENCE · LFD_API_URL
# The build runs HERE (GitHub Actions), then wrangler only UPLOADS the static
# output — so these live in Actions, not in Cloudflare Pages env vars.

on:
  push:
    branches: [main]
    # Ce qui entre RÉELLEMENT dans le build : le code de l'app, les paquets
    # locaux qu'elle embarque, et `pnpm-workspace.yaml` (le `catalog:`, où
    # atterrit une montée de fold-ng).
    #
    # ⚠️ Il était écrit ici « nor packages/** (B2B consumes no local package) ».
    # C'était vrai, et ça a cessé de l'être : la boutique en embarque cinq,
    # dont `@lfd/b2b-ui` — celui qui FORMATE ses prix. Un correctif de prix
    # dans ce paquet ne la redéployait donc pas. Une justification devenue
    # fausse est pire qu'un filtre absent : personne ne la relit.
    #
    # PAS `pnpm-lock.yaml` : n'importe quelle autre app installant une
    # dépendance redéploierait la boutique pour rien. Cette raison-là tient
    # toujours.
    paths:
      - "apps/lfc-B2B-platform-frontend/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy_lfc_boutique.yml"
  workflow_dispatch:

# One live deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy_lfc_boutique
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # lire le verdict des autres workflows

jobs:
  deploy_lfc_boutique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── La porte ────────────────────────────────────────────────────────────
      # Jusqu'au 2026-08-27, ce déploiement partait dès le push sur `main`, sans
      # rien savoir de la CI : elle tournait EN MÊME TEMPS, et son verdict
      # arrivait après coup. Un commit rouge se déployait quand même.
      - name: Attendre que la CI soit verte
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/attendre-un-run
        with:
          workflow: ci.yml

      # Et le backend AVANT le front : le front neuf appelle des routes que
      # l'ancienne API ne sert pas encore. Si ce commit ne touche pas le
      # backend, aucun run n'existe et l'attente rend la main d'elle-même.
      - name: Attendre le backend
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/attendre-un-run
        with:
          workflow: deploy_lfd_api.yml
          exiger: "false"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les paquets partagés AVANT le build : `tsc` résout `@lfd/contracts` par
      # les chemins du tsconfig (donc la SOURCE) et passe sans `dist/`, mais le
      # bundler d'Angular suit le `exports` du package.json et cherche
      # `dist/index.js`. Sans cette étape le typecheck est vert et le build
      # échoue — c'est ce qui est arrivé au 1er déploiement (2026-08-13).
      # La CI ne le voyait pas : `ci.yml` construit déjà les paquets.
      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      # Injecte la config Auth0 PUBLIQUE (domain/clientId/audience/apiBaseUrl) dans
      # `auth.env.generated.ts` depuis les *Variables* du repo — avant typecheck ET
      # build, pour que les deux voient les vraies valeurs. Rien de secret ici.
      - name: Generate Auth0 config (public build vars)
        working-directory: apps/lfc-B2B-platform-frontend
        env:
          # L'identité du BUILD, pour Sentry : c'est par elle qu'il rapproche une
          # pile minifiée de ses source maps. Le SHA court, comme `APP_REVISION`
          # côté backend — surtout pas une valeur constante, qui ferait détenir
          # à Sentry des cartes qu'il n'appliquerait jamais.
          APP_REVISION: ${{ github.sha }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_LFC_BOUTIQUE_CLIENT_ID }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE_CUSTOMERS }}
          API_BASE_URL: ${{ vars.LFD_API_URL }}
          # Origine de l'app ADMIN — le QR de retrait que ce front affiche pointe
          # vers le back-office, puisque c'est le staff qui le scanne. Absente,
          # le front n'affiche AUCUN code plutôt qu'un code menant nulle part.
          ADMIN_BASE_URL: ${{ vars.LFD_BACKOFFICE_URL }}
        run: node scripts/generate-auth-config.mjs

      # Gate: a red typecheck must never reach Pages. The AOT build below also
      # type-checks the app + templates, so together they fail fast on any error.
      - name: Typecheck
        run: pnpm --filter lfc-b2b-platform-frontend exec tsc --noEmit

      - name: Build (static, browser-only)
        run: pnpm --filter lfc-b2b-platform-frontend exec ng build --configuration cloudflare

      # Crée le projet Pages au premier run s'il n'existe pas (idempotent : le
      # `|| true` avale le "already exists" des runs suivants). Évite toute étape
      # manuelle dans le dashboard.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFC_B2B_PLATFORM_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages project create lfc-b2b
          --production-branch=main || true

      # `cloudflare/wrangler-action` tente d'installer wrangler via `pnpm add` à
      # la racine du workspace → ERR_PNPM_ADDING_TO_ROOT. On l'invoque plutôt en
      # direct avec `pnpm dlx` (fetch éphémère, ne touche pas le workspace).
      # wrangler lit le token + l'account id depuis l'environnement.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFC_B2B_PLATFORM_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages deploy
          apps/lfc-B2B-platform-frontend/dist/lfc-b2b-platform-frontend/browser
          --project-name=lfc-b2b
          --branch=main
