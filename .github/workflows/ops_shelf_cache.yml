name: ops_shelf_cache

# L'interrupteur du cache des rayons, en PRODUCTION, à la demande
# (`documentation/caching-usage/plan-cache-du-catalogue.md`, « L'interrupteur »).
#
# Quand l'utiliser :
#   - off        : le cache sert un rayon FAUX (un prix, un article qui ne
#                  devrait pas y être) — on éteint TOUT, pro ET public : chaque
#                  rayon est recalculé depuis la base comme avant le cache,
#                  tout ce qui était rangé est effacé, Workers Cache est purgé ;
#   - on         : la cause est corrigée — on rallume le cache des PROS, il se
#                  remplit à la prochaine visite de chaque société. Le public
#                  reste dans son état : il se rallume par `public-on` ;
#   - purge      : un doute sur ce qui est rangé, sans vouloir éteindre — on
#                  vide tout, pro et public, chaque cache reste dans son état ;
#   - public-on  : le rayon PUBLIC (`/shop/catalogue`, `/shop/featured`) se
#                  laisse garder par Workers Cache, 30 s. ÉTEINT par défaut
#                  (lot C3) : à allumer une fois la clé de Workers Cache et le
#                  `Vary: Origin` vus en production ;
#   - public-off : le rayon public n'est plus gardé, Workers Cache est purgé.
#
# Ni redéploiement, ni redémarrage du conteneur : l'état vit dans l'objet des
# rayons, et vaut pour toutes les instances de l'API.
#
# Pourquoi un workflow : la route est gardée par `RECOMPUTE_TOKEN`, un secret
# GitHub en écriture seule (même raison que `ops_identity_probe.yml`).
#
# Le résumé dit si la purge de Workers Cache a abouti (`publicPurge`) : un
# `failed` laisse vivre une réponse publique déjà gardée jusqu'à 30 s.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "off = tout éteindre et vider · on = rallumer les pros · purge = vider sans éteindre · public-on / public-off = le rayon public"
        required: true
        type: choice
        options:
          - "off"
          - "on"
          - purge
          - public-on
          - public-off

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Actionner l'interrupteur
        env:
          API_BASE_URL: ${{ vars.LFD_API_URL }}
          RECOMPUTE_TOKEN: ${{ secrets.RECOMPUTE_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          set -uo pipefail
          state=$(curl --fail-with-body --silent --show-error --max-time 30 \
                  -X POST "${API_BASE_URL}/admin/ops/shelf-cache" \
                  -H "x-lfc-recompute-token: ${RECOMPUTE_TOKEN}" \
                  -H "content-type: application/json" \
                  --data "{\"action\":\"${ACTION}\"}") || {
            echo "::error::L'interrupteur a refusé : ${state:-aucune réponse}"
            exit 1
          }

          STATE="${state}" python3 <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          state = json.loads(os.environ["STATE"])
          print(f"## Cache des rayons — geste `{os.environ['ACTION']}`\n")
          print(f"- pros allumé : **{state['enabled']}**")
          print(f"- public allumé : **{state['publicEnabled']}**")
          print(f"- version : **{state['version']}**")
          print(f"- purge de Workers Cache : **{state['publicPurge']}**")
          PY
