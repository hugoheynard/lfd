name: deploy_pim_backend

# Déploie le backend PIM (lfc-pim-backend, NestJS) sur Cloudflare **Containers** :
# build image (racine monorepo) → push registre Cloudflare → deploy du Worker.
# À chaque push sur main touchant le backend PIM.
#
# Scaffold + points à valider au 1er run : documentation/CONTAINERIZE-NOTES.md.
#
# Secrets GitHub requis :
#   LFC_PIM_BACKEND_WORKER — token « Account · Workers Scripts · Edit » + « Containers · Edit ».
#   CLOUDFLARE_ACCOUNT_ID — account id partagé (injecté dans l'image au deploy).
# Secrets RUNTIME (`wrangler secret put`) : PIM_DATABASE_URL, Auth0, … — la
# liste qui fait foi est la boucle `for name in …` en fin de fichier.
#
# ⚠️ `PIM_DATABASE_URL` sert DEUX fois : la migration (étape 2) et la variable
# `DATABASE_URL` du container. Elle doit donc être posée AVANT le premier
# déploiement, sinon la migration ne crée rien et le PIM démarre sans tables.

on:
  push:
    branches: [main]
    paths:
      - "apps/lfc-PIM-backend/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy_pim_backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy_pim_backend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_pim_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les types partagés doivent être buildés avant le typecheck du backend.
      - name: Build shared packages
        run: pnpm --filter "@lfd/contracts" build

      - name: Typecheck
        run: pnpm --filter lfc-pim-backend exec tsc --noEmit

      # 1) Build depuis la RACINE du monorepo, puis push sur le registre Cloudflare.
      - name: Build image (contexte racine)
        run: docker build -f apps/lfc-PIM-backend/Dockerfile -t lfc-pim-backend:"$GITHUB_SHA" .

      - name: Push image → registre Cloudflare
        working-directory: apps/lfc-PIM-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LFC_PIM_BACKEND_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler containers push lfc-pim-backend:"$GITHUB_SHA"

      # 2) Le schéma AVANT le code — mais le plus TARD possible avant lui.
      #
      #    Cette étape manquait : le PIM se déployait contre une base dont
      #    personne n'avait jamais créé les tables. Même raisonnement que le
      #    backend B2B, et même placement (cf. deploy_b2b_backend.yml) : migrer
      #    en tête de workflow intercalerait le build et le push de l'image
      #    entre le nouveau schéma et le nouveau code, soit plusieurs minutes
      #    pendant lesquelles l'ANCIEN container servirait le trafic contre le
      #    NOUVEAU schéma. Ici la fenêtre se réduit au `wrangler deploy`.
      #
      #    ⚠️ Elle ne disparaît pas : un déplacement de données sur une base
      #    VIVANTE se fait en trois déploiements (étendre / basculer /
      #    resserrer), jamais en une migration qui `DROP` ce que le code lit
      #    encore. Cf. documentation/suite/CONTAINERIZE-NOTES.md.
      #
      #    Le nom de la variable diffère du B2B : le schéma PIM lit `DATABASE_URL`
      #    (cf. prisma.config.ts), alimenté par le secret `PIM_DATABASE_URL` —
      #    la même paire que la boucle de synchronisation plus bas.
      #
      #    `migrate deploy` n'applique QUE les migrations existantes : il n'en
      #    génère aucune et ne réinitialise jamais. Il échoue plutôt que de
      #    forcer, ce qui bloque le déploiement — c'est voulu : mieux vaut
      #    l'ancienne version en ligne qu'une nouvelle sur un schéma à moitié
      #    migré. Le coût d'un échec ici est une image construite pour rien.
      - name: Migrer la base
        working-directory: apps/lfc-PIM-backend
        env:
          DATABASE_URL: ${{ secrets.PIM_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      # 3) Injecte l'account id puis déploie le Worker.
      - name: Deploy Worker
        working-directory: apps/lfc-PIM-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LFC_PIM_BACKEND_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i "s/__CF_ACCOUNT_ID__/${CLOUDFLARE_ACCOUNT_ID}/" wrangler.jsonc
          sed -i "s/__IMAGE_TAG__/${GITHUB_SHA}/" wrangler.jsonc
          pnpm exec wrangler deploy

      # 4) Auto-sync des secrets RUNTIME depuis les secrets GitHub (source unique).
      #    Ne pousse QUE ceux renseignés. Liste = apps/lfc-PIM-backend/.env.example.
      - name: Sync runtime secrets
        working-directory: apps/lfc-PIM-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LFC_PIM_BACKEND_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.PIM_DATABASE_URL }}
          # Identifiants Auth0 = PUBLICS → GitHub VARIABLES (pas Secrets). Tenant PROD.
          AUTH0_DOMAIN: ${{ vars.SUITE_AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.SUITE_AUTH0_AUDIENCE_PIM }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          for name in DATABASE_URL AUTH0_DOMAIN AUTH0_AUDIENCE \
                      SHOPIFY_ADMIN_TOKEN SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name"
            fi
          done
