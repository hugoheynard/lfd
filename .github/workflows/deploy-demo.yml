name: Deploy PIM demo

# Publishes the frontend-only PIM POC to GitHub Pages on every push to main.
# The app is SSR-configured for local dev, so we build the browser-only
# `github-pages` configuration (base-href /lfd/, no server, no prerender) and
# ship a 404.html SPA fallback so deep links resolve client-side.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (browser-only, base-href /lfd/)
        run: pnpm --filter lfc-pim-frontend exec ng build --configuration github-pages

      - name: SPA fallback + disable Jekyll
        working-directory: apps/lfc-PIM-frontend/dist/lfc-pim-frontend/browser
        run: |
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/lfc-PIM-frontend/dist/lfc-pim-frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
