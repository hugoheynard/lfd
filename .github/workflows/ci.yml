name: CI

# La porte de qualité — la seule chose qui tourne AVANT un déploiement.
#
# Jusqu'ici le dépôt n'avait que des workflows de déploiement : ils faisaient un
# `tsc --noEmit` puis poussaient l'image. Aucun lint, aucun test, sur aucune app,
# et rien du tout sur les Pull Requests. Conséquence observée le 2026-08-09 : les
# tests de `@lfd/contracts` étaient rouges sur `dev` depuis plusieurs jours sans
# que rien ne le signale — aucune commande d'app ne les exécute.
#
# Trois jobs qui tournent en parallèle, et un `ci-gate` qui les agrège : c'est
# LUI qu'on met en statut requis sur la branche, pas les trois — ainsi ajouter un
# job plus tard ne demande pas de retoucher les réglages du dépôt.
#
# Ce que cette CI ne couvre PAS, et pourquoi (cf. documentation/todos/todo-qualite-tests.md) :
#   · les 4 apps Angular n'ont **aucune configuration ESLint** — il n'y a rien à
#     lancer. Elles sont couvertes par le typecheck, les tests et le build ;
#   · plus rien pour les specs : le typecheck de `tsconfig.test.json` est passé
#     de 194 erreurs à zéro le 2026-08-22, et il est branché ci-dessous. C'est
#     lui qui empêche un double de test de dériver du port qu'il prétend jouer
#     — la panne qui rend un test VERT sur du code qui n'existe plus.

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  # Une PR qui reçoit trois commits d'affilée n'occupe pas trois runners.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Les paquets partagés ────────────────────────────────────────────────────
  # En premier et à part : c'est le trou qu'aucune commande d'app ne couvrait.
  packages:
    name: Paquets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire les paquets
        run: pnpm --filter "./packages/**" build
      - name: Lint
        run: pnpm --filter "./packages/**" lint:ci
      - name: Tests
        run: pnpm --filter "./packages/**" test

  # ── Le backend B2B ──────────────────────────────────────────────────────────
  # Ses tests e2e frappent un vrai Postgres : le harnais attend le port 5433 et
  # crée lui-même la base `lfc_b2b_test` (`db:test:setup`, idempotent). Ils
  # frappent aussi un vrai stockage objet (MinIO, port 9100) : les pièces —
  # KBIS, mandat signé — partent pour de bon. Le bucket, lui, est créé par le
  # harnais (`ensureTestBucket`), donc rien à provisionner ici.
  b2b-backend:
    name: Backend B2B
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lfc
          POSTGRES_PASSWORD: lfc
          POSTGRES_DB: lfc_b2b_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lfc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire les paquets dont dépend le backend
        run: pnpm --filter "./packages/**" build
      - name: Typecheck
        run: pnpm --filter lfd-api exec tsc --noEmit
      # Les SPECS, que le typecheck ci-dessus ignore (`tsconfig.json` exclut
      # `test/` et `**/*.spec.ts`) et que Jest transpile sans vérifier. Sans
      # cette porte, un double de test survit à la disparition de la méthode
      # qu'il simule : le test reste vert, et ce qu'il prouve a disparu. Deux
      # cas réels le jour où elle a été posée — `setChannels({b1, b2})` et
      # `setTva("tva_5", null)`, deux signatures mortes, deux tests verts.
      - name: "Typecheck des specs"
        run: pnpm --filter lfd-api exec tsc --noEmit -p tsconfig.test.json
      - name: Lint
        run: pnpm --filter lfd-api lint:ci
      # Un abonné d'événement qui ne s'inscrit pas au travail de fond ne casse
      # aucun test le jour où on l'écrit : il casse un AUTRE test, plus tard,
      # une fois sur sept. Ce gate le refuse à l'entrée.
      - name: "Gate : abonnés d'événement suivis"
        run: pnpm lint:events-tracked

      # Les deux murs de la fusion à venir (cf.
      # documentation/suite/architecture-topologie-apps.md, étape B1). Ils sont
      # posés AVANT que les contextes se rejoignent : un mur ajouté une fois la
      # brèche ouverte ne ferme plus rien, il ne fait que constater.
      - name: "Gate : frontières de contexte"
        run: pnpm lint:context-boundaries

      - name: "Gate : aucune jointure inter-schéma"
        run: pnpm lint:cross-schema-join

      # Une dépendance partagée par deux paquets vient du catalogue, pas d'une
      # plage recopiée. Deux versions d'un même paquet dans un monorepo ne se
      # voient pas — elles se découvrent, et toujours au pire moment.
      - name: "Gate : dépendances partagées au catalogue"
        run: pnpm lint:catalog-shared-deps

      # Un `files` sur une app conteneurisée amputerait ce que `pnpm deploy`
      # emporte dans l'image — sans rendre aucune étape de build rouge. La panne
      # n'apparaîtrait qu'au démarrage du container, en production.
      - name: "Gate : pas de `files` sur une app conteneurisée"
        run: pnpm lint:deployed-app-files

      # `docker run` plutôt qu'un `services:` : l'image MinIO a besoin d'une
      # commande (`server /data`), et un bloc `services` ne sait pas en passer.
      - name: Démarrer le stockage objet (MinIO)
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=lfc -e MINIO_ROOT_PASSWORD=lfclfclfc \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:9100/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO n'a pas démarré à temps" >&2
          docker logs minio >&2
          exit 1
      - name: Préparer la base de test
        run: pnpm --filter lfd-api run db:test:setup
      - name: Tests (unitaires + e2e)
        run: pnpm --filter lfd-api test

  # ── Les fronts et le PIM ────────────────────────────────────────────────────
  # Le build de production est le seul endroit qui exerce la compilation AOT des
  # templates : un typecheck vert ne dit rien d'un binding cassé dans un .html.
  fronts-et-pim:
    name: Fronts + PIM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire les paquets
        run: pnpm --filter "./packages/**" build

      # Une variable CSS inconnue ne casse ni le build ni les tests : elle est
      # ignorée, et la page a l'air correcte jusqu'au jour où le thème change.
      # Ce gate la refuse à l'entrée.
      - name: "Gate : variables fold existantes"
        run: pnpm lint:fold-tokens

      # Une taille écrite à la main ne casse rien non plus — elle diverge de
      # 0,03rem par écran, et le système se dissout par des différences que
      # personne ne remarque une par une. Le gate tient les dossiers drainés et
      # affiche le solde restant plutôt que de le taire.
      - name: "Gate : typographie fold"
        run: pnpm lint:fold-typography

      # La langue des identifiants. Le gate ne juge que les dossiers DRAINÉS —
      # il compte le reste et l'affiche, pour que la dette ne se taise pas.
      - name: "Gate : les identifiants sont en anglais"
        run: pnpm lint:code-language

      # Un `routerLink` absolu qui ne mène nulle part compile, démarre et passe
      # les tests : il casse au CLIC, en NG04002, devant l'utilisateur. Le PIM en
      # portait cinq, survivants de sa fusion dans le back-office — ses routes
      # étaient passées de `/produits` à `/pim/produits`, les liens non.
      - name: "Gate : les liens absolus mènent quelque part"
        run: pnpm lint:router-links

      # La couche modèle du référentiel portait `tvaTagFromPercent`,
      # `generateFiches` et un `collections.ts` entier : quatre mots de Shopify
      # au milieu du vocabulaire du catalogue. Six écrans qui n'ont rien à voir
      # avec Shopify le traînaient dans leur bundle. Un déplacement sans porte
      # se défait ; celle-ci tient la direction — un canal lit le catalogue, le
      # catalogue ignore les canaux.
      - name: "Gate : le modèle du référentiel ignore les canaux"
        run: pnpm lint:pim-data-neutral

      # Un cycle d'import ne se voit NULLE PART : tsc n'en dit rien, les tests
      # passent, la compilation de production réussit. Seul le navigateur tombe,
      # à l'exécution, sur la page concernée — « Failed to fetch dynamically
      # imported module », qui ne nomme ni le cycle ni les fichiers.
      - name: "Gate : aucun cycle d'import"
        run: pnpm lint:import-cycles

      # Admin seul pour l'instant : le front plateforme n'a pas encore de config
      # ESLint, et en fabriquer une à l'aveugle poserait une porte sans savoir ce
      # qu'elle laisse passer.
      - name: "Lint : admin"
        run: pnpm --filter lfc-b2b-admin-frontend lint:ci

      - name: Typecheck des fronts
        run: |
          # `-p tsconfig.app.json` et NON `tsc --noEmit` : le tsconfig racine de
          # ces apps est une config « solution », qui ne porte que des
          # `references` et aucun `include`. `tsc --noEmit` dessus ne compile
          # donc RIEN — il rendait vert sans rien lire. Vérifié le 2026-08-18 en
          # y glissant un appel de méthode inexistante : aucune erreur.
          pnpm --filter lfc-b2b-admin-frontend exec tsc -p tsconfig.app.json --noEmit
          pnpm --filter lfc-b2b-platform-frontend exec tsc -p tsconfig.app.json --noEmit
      - name: Tests des fronts
        run: |
          pnpm --filter lfc-b2b-admin-frontend test
          pnpm --filter lfc-b2b-platform-frontend test
      - name: Build de production (compilation AOT)
        run: |
          pnpm --filter lfc-b2b-admin-frontend build
          pnpm --filter lfc-b2b-platform-frontend build

  # ── La porte ────────────────────────────────────────────────────────────────
  # Le SEUL statut à exiger sur la branche. `always()` + le test explicite sur
  # `result` est ce qui fait qu'un job annulé ou sauté ne passe pas pour un
  # succès — un `needs` seul laisserait filer un `skipped`.
  # ── La passerelle ───────────────────────────────────────────────────────────
  # Le Worker que TOUT le trafic traverse depuis le 2026-08-13 : les backends
  # n'ont plus d'adresse publique, elle est le seul chemin. Elle était pourtant
  # le seul morceau du dépôt sans aucune couverture — une régression de routage
  # ne se serait découverte qu'en production.
  #
  # Ses tests portent sur `routes.ts`, où vivent TOUTES les décisions (`index.ts`
  # n'exécute que le transport) : préfixe retiré avant transmission, préfixe
  # voisin qui ne vole pas les requêtes, sous-domaines de dev intacts.
  gateway:
    name: Passerelle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Elle importe `@lfd/endpoints` (ports et sous-domaines de dev) : sans ce
      # build, le typecheck échoue sur un paquet non compilé.
      - name: Construire les paquets
        run: pnpm --filter "./packages/**" build
      - name: Typecheck
        run: pnpm --filter lfd-gateway exec tsc --noEmit
      - name: Lint
        run: pnpm --filter lfd-gateway lint
      - name: Tests
        run: pnpm --filter lfd-gateway test

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [packages, b2b-backend, fronts-et-pim, gateway]
    if: always()
    steps:
      - name: Vérifier que tout est vert
        run: |
          echo "packages      : ${{ needs.packages.result }}"
          echo "b2b-backend   : ${{ needs.b2b-backend.result }}"
          echo "fronts-et-pim : ${{ needs.fronts-et-pim.result }}"
          echo "gateway       : ${{ needs.gateway.result }}"
          if [ "${{ needs.packages.result }}" != "success" ] \
            || [ "${{ needs.b2b-backend.result }}" != "success" ] \
            || [ "${{ needs.fronts-et-pim.result }}" != "success" ] \
            || [ "${{ needs.gateway.result }}" != "success" ]; then
            echo "::error::Un job de la CI n'est pas au vert."
            exit 1
          fi
