name: CI

# La porte de qualité — la seule chose qui tourne AVANT un déploiement.
#
# Jusqu'ici le dépôt n'avait que des workflows de déploiement : ils faisaient un
# `tsc --noEmit` puis poussaient l'image. Aucun lint, aucun test, sur aucune app,
# et rien du tout sur les Pull Requests. Conséquence observée le 2026-08-09 : les
# tests de `@lfd/contracts` étaient rouges sur `dev` depuis plusieurs jours sans
# que rien ne le signale — aucune commande d'app ne les exécute.
#
# Cinq jobs qui tournent en parallèle, et un `ci-gate` qui les agrège : c'est
# LUI qu'on met en statut requis sur la branche, pas les trois — ainsi ajouter un
# job plus tard ne demande pas de retoucher les réglages du dépôt.
#
# Ce que cette CI ne couvre PAS, et pourquoi (cf. documentation/todos/todo-qualite-tests.md) :
#   · les 4 apps Angular n'ont **aucune configuration ESLint** — il n'y a rien à
#     lancer. Elles sont couvertes par le typecheck, les tests et le build ;
#   · plus rien pour les specs : le typecheck de `tsconfig.test.json` est passé
#     de 194 erreurs à zéro le 2026-08-22, et il est branché ci-dessous. C'est
#     lui qui empêche un double de test de dériver du port qu'il prétend jouer
#     — la panne qui rend un test VERT sur du code qui n'existe plus.

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  # Une PR qui reçoit trois commits d'affilée n'occupe pas trois runners.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Le périmètre ────────────────────────────────────────────────────────────
  # Quels chantiers ce commit concerne-t-il VRAIMENT ?
  #
  # turborepo est dans le dépôt depuis toujours et la CI ne s'en servait pas :
  # elle relançait les quatre chantiers à chaque push. La promotion du
  # 2026-08-29 portait 369 fichiers de front pour 14 de backend, et les e2e
  # backend — qui tiennent le chemin critique — ont tourné pour rien.
  #
  # On ne réécrit pas les étapes à travers turbo : on lui demande la seule chose
  # que `git diff` ignore, le GRAPHE. Toucher `packages/contracts` concerne les
  # trois apps qui le consomment, et lui seul le sait.
  #
  # ⚠️ Dans le doute, le script rend « tout » (cf. dev-toolbox/ci/affected.mjs).
  # Un job lancé pour rien coûte des minutes ; un job sauté à tort laisse passer
  # une régression. Les deux erreurs ne se paient pas dans la même monnaie.
  changes:
    name: Périmètre
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
      api: ${{ steps.scope.outputs.api }}
      front_admin: ${{ steps.scope.outputs.front_admin }}
      front_platform: ${{ steps.scope.outputs.front_platform }}
      gateway: ${{ steps.scope.outputs.gateway }}
    steps:
      # `fetch-depth: 0` — sans l'historique, aucune base n'est résoluble et le
      # script rendrait « tout » à chaque fois. Le filtrage serait inerte, et
      # rien ne le dirait.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Calculer le périmètre
        id: scope
        # Sur une PR, la base est la branche visée. Sur un push, c'est l'état
        # d'avant — et au premier push d'une branche il vaut quarante zéros,
        # que turbo ne sait pas résoudre : le script rend « tout », ce qui est
        # exactement ce qu'on veut d'une branche neuve.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          node dev-toolbox/ci/affected.mjs "$base" >> "$GITHUB_OUTPUT"

  # ── Les gates du dépôt ──────────────────────────────────────────────────────
  # Quatorze portes qui balaient TOUT le dépôt, et non l'app d'à côté.
  #
  # Elles vivaient réparties entre le job backend et le job des fronts, ce qui
  # ne se voyait pas tant que ces deux-là tournaient à chaque push. Depuis que
  # le périmètre peut les sauter, la répartition devient un TROU : un commit qui
  # ne touche que le backend sauterait `fronts-et-pim`, et avec lui la porte des
  # cycles d'import — qui, elle, lit `apps/**` en entier.
  #
  # Une porte globale appartient donc à un job global. Elles coûtent quelques
  # secondes ; c'est leur mise en place qui coûte une minute, et elle est
  # partagée.
  gates:
    name: Gates du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `lint:fold-tokens` lit les tokens de la version de fold-ng INSTALLÉE, et
      # plusieurs gates résolvent des imports de `packages/**`.
      - name: Construire les paquets
        run: pnpm --filter "./packages/**" build

      # Un abonné d'événement qui ne s'inscrit pas au travail de fond ne casse
      # aucun test le jour où on l'écrit : il casse un AUTRE test, plus tard,
      # une fois sur sept. Ce gate le refuse à l'entrée.
      - name: "Gate : abonnés d'événement suivis"
        run: pnpm lint:events-tracked

      # Les deux murs de la fusion à venir (cf.
      # documentation/suite/architecture-topologie-apps.md, étape B1). Ils sont
      # posés AVANT que les contextes se rejoignent : un mur ajouté une fois la
      # brèche ouverte ne ferme plus rien, il ne fait que constater.
      - name: "Gate : frontières de contexte"
        run: pnpm lint:context-boundaries

      - name: "Gate : aucune jointure inter-schéma"
        run: pnpm lint:cross-schema-join

      # Une dépendance partagée par deux paquets vient du catalogue, pas d'une
      # plage recopiée. Deux versions d'un même paquet dans un monorepo ne se
      # voient pas — elles se découvrent, et toujours au pire moment.
      - name: "Gate : dépendances partagées au catalogue"
        run: pnpm lint:catalog-shared-deps

      # Un `files` sur une app conteneurisée amputerait ce que `pnpm deploy`
      # emporte dans l'image — sans rendre aucune étape de build rouge. La panne
      # n'apparaîtrait qu'au démarrage du container, en production.
      - name: "Gate : pas de `files` sur une app conteneurisée"
        run: pnpm lint:deployed-app-files

      # Une variable CSS inconnue ne casse ni le build ni les tests : elle est
      # ignorée, et la page a l'air correcte jusqu'au jour où le thème change.
      # Ce gate la refuse à l'entrée.
      - name: "Gate : variables fold existantes"
        run: pnpm lint:fold-tokens

      # Une taille écrite à la main ne casse rien non plus — elle diverge de
      # 0,03rem par écran, et le système se dissout par des différences que
      # personne ne remarque une par une. Le gate tient les dossiers drainés et
      # affiche le solde restant plutôt que de le taire.
      - name: "Gate : typographie fold"
        run: pnpm lint:fold-typography

      # La langue des identifiants. Le gate ne juge que les dossiers DRAINÉS —
      # il compte le reste et l'affiche, pour que la dette ne se taise pas.
      - name: "Gate : les identifiants sont en anglais"
        run: pnpm lint:code-language

      # Un `routerLink` absolu qui ne mène nulle part compile, démarre et passe
      # les tests : il casse au CLIC, en NG04002, devant l'utilisateur. Le PIM en
      # portait cinq, survivants de sa fusion dans le back-office — ses routes
      # étaient passées de `/produits` à `/pim/produits`, les liens non.
      - name: "Gate : les liens absolus mènent quelque part"
        run: pnpm lint:router-links

      # La couche modèle du référentiel portait `tvaTagFromPercent`,
      # `generateFiches` et un `collections.ts` entier : quatre mots de Shopify
      # au milieu du vocabulaire du catalogue. Six écrans qui n'ont rien à voir
      # avec Shopify le traînaient dans leur bundle. Un déplacement sans porte
      # se défait ; celle-ci tient la direction — un canal lit le catalogue, le
      # catalogue ignore les canaux.
      - name: "Gate : le modèle du référentiel ignore les canaux"
        run: pnpm lint:pim-data-neutral

      # Un cycle d'import ne se voit NULLE PART : tsc n'en dit rien, les tests
      # passent, la compilation de production réussit. Seul le navigateur tombe,
      # à l'exécution, sur la page concernée — « Failed to fetch dynamically
      # imported module », qui ne nomme ni le cycle ni les fichiers.
      - name: "Gate : aucun cycle d'import"
        run: pnpm lint:import-cycles

      # Un handler du référentiel qui écrit sans trace ne se voit nulle part :
      # tsc est content, les tests passent, l'écran fonctionne. Ça se découvre le
      # jour où l'on demande « qui a changé ça » — et ce jour-là, le blanc ne se
      # comble plus. La dette du 2026-08-25 est déclarée dans la porte ; elle ne
      # peut que rétrécir.
      - name: "Gate : le référentiel journalise ce qu'il écrit"
        run: pnpm lint:journal-tracked

      # Une date en dur dans une fixture de journal est une bombe à retardement :
      # verte jusqu'au jour où le calendrier franchit un seuil, rouge le
      # lendemain sur du code inchangé. Le 2026-08-29, deux suites sont tombées
      # ainsi — une commande semée au 15 août est sortie de la fenêtre de
      # momentum pendant la nuit.
      - name: "Gate : aucune date absolue dans une fixture"
        run: pnpm lint:test-dates

      # Le découpage des shards e2e se fait par durée. Une suite sans mesure
      # tourne quand même — le périmètre vient du disque — mais avec un poids
      # par défaut. Une seule s'oublie sans conséquence ; dix, et l'équilibre se
      # dissout sans que rien ne rougisse.
      - name: "Gate : chaque suite e2e a sa durée"
        run: pnpm lint:e2e-durations

  # ── Les paquets partagés ────────────────────────────────────────────────────
  # En premier et à part : c'est le trou qu'aucune commande d'app ne couvrait.
  packages:
    name: Paquets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire les paquets
        run: pnpm --filter "./packages/**" build
      - name: Lint
        run: pnpm --filter "./packages/**" lint:ci
      - name: Tests
        run: pnpm --filter "./packages/**" test

  # ── Le backend B2B, ses contrôles ──────────────────────────────────────────
  # Tout ce qui NE demande ni base ni stockage : typechecks, lint, gates, et les
  # 207 suites unitaires.
  #
  # Elles vivaient dans le job d'à côté, derrière les e2e, et le `maxWorkers: 1`
  # que les e2e imposent les tenait en file une par une. Mesuré le 2026-08-29 :
  # 8 min pour les 258 suites ensemble, contre 7 SECONDES pour les 207 unitaires
  # seules, à sept cœurs. Ce ne sont pas les tests qui étaient lents, c'est la
  # file d'attente.
  #
  # Le job ne monte donc aucun conteneur : c'est ce qui le rend court, et c'est
  # `jest.unit.cjs` qui garantit qu'aucune de ces specs n'en a besoin.
  b2b-checks:
    name: Backend B2B · contrôles
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire les paquets dont dépend le backend
        run: pnpm --filter "./packages/**" build
      - name: Typecheck
        run: pnpm --filter lfd-api exec tsc --noEmit
      # Les SPECS, que le typecheck ci-dessus ignore (`tsconfig.json` exclut
      # `test/` et `**/*.spec.ts`) et que Jest transpile sans vérifier. Sans
      # cette porte, un double de test survit à la disparition de la méthode
      # qu'il simule : le test reste vert, et ce qu'il prouve a disparu. Deux
      # cas réels le jour où elle a été posée — `setChannels({b1, b2})` et
      # `setTva("tva_5", null)`, deux signatures mortes, deux tests verts.
      - name: "Typecheck des specs"
        run: pnpm --filter lfd-api exec tsc --noEmit -p tsconfig.test.json
      - name: Lint
        run: pnpm --filter lfd-api lint:ci
      - name: Tests unitaires
        run: pnpm --filter lfd-api test:unit

  # ── Le backend B2B, ses e2e ─────────────────────────────────────────────────
  # Ce job ne fait plus QUE les e2e — ses typechecks, son lint et ses gates sont
  # partis dans `b2b-checks` ci-dessus — et il tourne en QUATRE exemplaires.
  #
  # Le `maxWorkers: 1` des e2e ne disparaît pas : il reste vrai à l'intérieur
  # d'un shard, et c'est ce qu'il protège. Ce qui change, c'est qu'ils sont
  # quatre à l'être en parallèle, chacun sur SA machine, donc chacun avec sa
  # propre base et son propre stockage. Deux suites ne peuvent pas plus se
  # tronquer la base qu'avant — elles ne partagent plus rien du tout. Ce qui reste ici est ce qui a besoin
  # d'une infrastructure, et rien d'autre : le chemin critique de la CI, c'est
  # lui, donc tout ce qu'on lui retire est du temps rendu au déploiement.
  #
  # Ses tests e2e frappent un vrai Postgres : le harnais attend le port 5433 et
  # crée lui-même la base `lfc_b2b_test` (`db:test:setup`, idempotent). Ils
  # frappent aussi un vrai stockage objet (MinIO, port 9100) : les pièces —
  # KBIS, mandat signé — partent pour de bon. Le bucket, lui, est créé par le
  # harnais (`ensureTestBucket`), donc rien à provisionner ici.
  b2b-backend:
    name: Backend B2B · e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    strategy:
      # QUATRE RUNNERS, un quart des suites chacun.
      #
      # Le chronomètre par suite (`test/slow-suites.reporter.cjs`) a montré une
      # distribution PLATE : ~5 s par suite, dominées par l'amorçage de
      # l'application Nest, et une seule suite au-dessus (`admin-pricing`, 8 %).
      # Un découpage par chemin répartit donc proprement — ce qui ne serait pas
      # vrai si une suite pesait la moitié du total.
      #
      # Ça amortit aussi la VARIANCE, qui est le vrai problème : les mêmes 51
      # suites ont pris 6 min 40 puis 16 min 45 sur deux runs consécutifs. Un
      # runner lent ne coûte plus que le quart.
      #
      # `fail-fast: false` : un shard rouge ne doit pas annuler les trois autres,
      # sinon on corrige une panne, on repousse, et on en découvre une seconde.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lfc
          POSTGRES_PASSWORD: lfc
          POSTGRES_DB: lfc_b2b_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lfc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire les paquets dont dépend le backend
        run: pnpm --filter "./packages/**" build
      # `docker run` plutôt qu'un `services:` : l'image MinIO a besoin d'une
      # commande (`server /data`), et un bloc `services` ne sait pas en passer.
      - name: Démarrer le stockage objet (MinIO)
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=lfc -e MINIO_ROOT_PASSWORD=lfclfclfc \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:9100/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO n'a pas démarré à temps" >&2
          docker logs minio >&2
          exit 1
      - name: Préparer les bases de test
        # Une base PAR WORKER (`lfc_b2b_test_w1`, `_w2`, …) : les suites
        # tronquent la leur entre chaque cas, et deux workers qui partageraient
        # une base s'effaceraient leurs fixtures.
        env:
          E2E_WORKERS: 2
        run: pnpm --filter lfd-api run db:test:setup
      # ⚠️ PAS de `--` avant `--shard` : pnpm le transmet tel quel, et Jest lit
      # alors « --shard=1/4 » comme un motif de chemin de test. Zéro suite
      # trouvée, et un échec qui parle de tout sauf de la vraie cause.
      - name: Tests e2e
        # `E2E_WORKERS` gouverne À LA FOIS le nombre de workers Jest et le nombre
        # de bases provisionnées à l'étape précédente — une seule source, sinon
        # un worker sans base retomberait dans le partage qu'on vient de fermer.
        #
        # 2 et non 4 : le runner porte 2 vCPU, et il fait déjà tourner Postgres
        # et MinIO. Le parallélisme large est fourni par les shards, qui sont sur
        # QUATRE machines ; empiler 4 workers sur 2 cœurs échangerait du gain
        # contre du thrash. À remonter si les runners grossissent.
        env:
          E2E_WORKERS: 2
        # La liste des suites vient de `e2e-shard.mjs`, qui répartit PAR DURÉE.
        # `--shard` de Jest coupait par ordre alphabétique : 1 min 46 pour le
        # shard 1, 4 min 05 pour le shard 3, et c'est le plus lent qui tient la
        # CI. `--runTestsByPath` prend des chemins littéraux, pas des motifs.
        run: |
          pnpm --filter lfd-api run test:e2e --runTestsByPath \
            $(node dev-toolbox/ci/e2e-shard.mjs ${{ matrix.shard }} 4)

  # ── Les fronts et le PIM ────────────────────────────────────────────────────
  # Le build de production est le seul endroit qui exerce la compilation AOT des
  # templates : un typecheck vert ne dit rien d'un binding cassé dans un .html.
  # ── Les fronts, un job CHACUN ───────────────────────────────────────────────
  # Ils tournaient ensemble, et donc EN SÉRIE : tests puis tests, build puis
  # build. Mesuré sur le run vert du 2026-08-29, l'étape « Tests des fronts »
  # pesait 2 min 16 à elle seule, sur un job de 3 min 53.
  #
  # Séparés, ils tournent en parallèle sur deux machines. Et surtout ils ont
  # chacun leur périmètre : un commit qui ne touche que la boutique ne relance
  # plus les 745 tests de l'admin ni sa compilation AOT.
  #
  # Ce qu'ils partagent — les gates du dépôt — vit dans le job `gates`, pas ici.
  front-admin:
    name: Front admin (+ PIM)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.front_admin == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire les paquets
        run: pnpm --filter "./packages/**" build
      - name: Lint
        run: pnpm --filter lfc-b2b-admin-frontend lint:ci
      # `-p tsconfig.app.json` et NON `tsc --noEmit` : le tsconfig racine de ces
      # apps est une config « solution », qui ne porte que des `references` et
      # aucun `include`. `tsc --noEmit` dessus ne compile donc RIEN — il rendait
      # vert sans rien lire. Vérifié le 2026-08-18 en y glissant un appel de
      # méthode inexistante : aucune erreur.
      - name: Typecheck
        run: pnpm --filter lfc-b2b-admin-frontend exec tsc -p tsconfig.app.json --noEmit
      - name: Tests
        run: pnpm --filter lfc-b2b-admin-frontend test
      # Le build de production est le seul endroit qui exerce la compilation AOT
      # des templates : un typecheck vert ne dit rien d'un binding cassé dans un
      # `.html`.
      - name: Build de production (compilation AOT)
        run: pnpm --filter lfc-b2b-admin-frontend build

  front-platform:
    name: Front boutique
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.front_platform == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire les paquets
        run: pnpm --filter "./packages/**" build
      # Pas de lint ici : ce front n'a pas encore de configuration ESLint, et en
      # fabriquer une à l'aveugle poserait une porte sans savoir ce qu'elle
      # laisse passer. Il est couvert par le typecheck, les tests et le build.
      - name: Typecheck
        run: pnpm --filter lfc-b2b-platform-frontend exec tsc -p tsconfig.app.json --noEmit
      - name: Tests
        run: pnpm --filter lfc-b2b-platform-frontend test
      - name: Build de production (compilation AOT)
        run: pnpm --filter lfc-b2b-platform-frontend build

  # ── La porte ────────────────────────────────────────────────────────────────
  # Le SEUL statut à exiger sur la branche. `always()` + le test explicite sur
  # `result` est ce qui fait qu'un job annulé ou sauté ne passe pas pour un
  # succès — un `needs` seul laisserait filer un `skipped`.
  # ── La passerelle ───────────────────────────────────────────────────────────
  # Le Worker que TOUT le trafic traverse depuis le 2026-08-13 : les backends
  # n'ont plus d'adresse publique, elle est le seul chemin. Elle était pourtant
  # le seul morceau du dépôt sans aucune couverture — une régression de routage
  # ne se serait découverte qu'en production.
  #
  # Ses tests portent sur `routes.ts`, où vivent TOUTES les décisions (`index.ts`
  # n'exécute que le transport) : préfixe retiré avant transmission, préfixe
  # voisin qui ne vole pas les requêtes, sous-domaines de dev intacts.
  gateway:
    name: Passerelle
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Elle importe `@lfd/endpoints` (ports et sous-domaines de dev) : sans ce
      # build, le typecheck échoue sur un paquet non compilé.
      - name: Construire les paquets
        run: pnpm --filter "./packages/**" build
      - name: Typecheck
        run: pnpm --filter lfd-gateway exec tsc --noEmit
      - name: Lint
        run: pnpm --filter lfd-gateway lint
      - name: Tests
        run: pnpm --filter lfd-gateway test

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [changes, gates, packages, b2b-checks, b2b-backend, front-admin, front-platform, gateway]
    if: always()
    steps:
      # `skipped` VAUT vert, et c'est la seule chose que le filtrage a changé
      # ici : un job hors périmètre n'a rien à prouver. Mais lui seul —
      # `cancelled`, `failure` et tout état inconnu restent rouges, sinon un job
      # annulé passerait pour un job non concerné.
      #
      # ⚠️ `changes` n'a PAS droit au sauté : c'est lui qui décide des autres.
      # S'il échoue, personne n'a été mesuré, et laisser filer une CI où rien
      # n'a tourné serait pire que tout ce que cette porte protège.
      - name: Vérifier que tout est vert
        run: |
          echo "changes       : ${{ needs.changes.result }}"
          echo "packages      : ${{ needs.packages.result }}"
          echo "b2b-checks    : ${{ needs.b2b-checks.result }}"
          echo "b2b-backend   : ${{ needs.b2b-backend.result }}"
          echo "front-admin   : ${{ needs.front-admin.result }}"
          echo "front-platform: ${{ needs.front-platform.result }}"
          echo "gateway       : ${{ needs.gateway.result }}"

          echo "gates         : ${{ needs.gates.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Le calcul du périmètre a échoué — aucun job n'a été décidé."
            exit 1
          fi

          if [ "${{ needs.gates.result }}" != "success" ]; then
            echo "::error::Les gates du dépôt ne sont pas au vert."
            exit 1
          fi

          rouge=0
          for etat in \
            "${{ needs.packages.result }}" \
            "${{ needs.b2b-checks.result }}" \
            "${{ needs.b2b-backend.result }}" \
            "${{ needs.front-admin.result }}" \
            "${{ needs.front-platform.result }}" \
            "${{ needs.gateway.result }}"; do
            case "$etat" in
              success | skipped) ;;
              *) rouge=1 ;;
            esac
          done

          if [ "$rouge" = "1" ]; then
            echo "::error::Un job de la CI n'est pas au vert."
            exit 1
          fi
