name: deploy_suite_shell

# Build browser-only du shell staff (lfc-suite-shell) → Cloudflare Pages, à chaque
# push sur main. Pas de SSR. wrangler ne fait qu'uploader le statique déjà buildé.
#
# Secrets requis (Settings → Secrets and variables → Actions → Secrets) :
#   CLOUDFLARE_LFC_ADMIN_SUITE_SHELL_PAGES — token « Account · Cloudflare Pages · Edit ».
#   CLOUDFLARE_ACCOUNT_ID — account id partagé.
# Variables PUBLIQUES (onglet Variables — pas des secrets : config Auth0 dans le bundle) :
#   SUITE_AUTH0_DOMAIN · SUITE_AUTH0_CLIENT_ID
#   SUITE_AUTH0_AUDIENCE_SELF · SUITE_AUTH0_AUDIENCE_B2B ·
#   SUITE_AUTH0_AUDIENCE_B2B_ADMIN
#   (une par SURFACE adressée, pas par backend : le B2B en expose deux, et _B2B et
#    _B2B_ADMIN ne doivent JAMAIS porter la même valeur.)
# Projet Pages `lfc-suite` (créé au 1er run).

on:
  push:
    branches: [main]
    paths:
      - "apps/lfc-suite-shell/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy_suite_shell.yml"
  workflow_dispatch:

concurrency:
  group: deploy_suite_shell
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_suite_shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Auth0 config (public build vars)
        working-directory: apps/lfc-suite-shell
        env:
          # L'identité du BUILD, pour Sentry : c'est par elle qu'il rapproche une
          # pile minifiée de ses source maps. Le SHA court, comme `APP_REVISION`
          # côté backend — surtout pas une valeur constante, qui ferait détenir
          # à Sentry des cartes qu'il n'appliquerait jamais.
          APP_REVISION: ${{ github.sha }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SUITE_AUTH0_DOMAIN: ${{ vars.SUITE_AUTH0_DOMAIN }}
          SUITE_AUTH0_CLIENT_ID: ${{ vars.SUITE_AUTH0_CLIENT_ID }}
          SUITE_AUTH0_AUDIENCE_SELF: ${{ vars.SUITE_AUTH0_AUDIENCE_SELF }}
          SUITE_AUTH0_AUDIENCE_B2B: ${{ vars.SUITE_AUTH0_AUDIENCE_B2B }}
          SUITE_AUTH0_AUDIENCE_B2B_ADMIN: ${{ vars.SUITE_AUTH0_AUDIENCE_B2B_ADMIN }}
        run: node scripts/generate-auth-config.mjs

      - name: Typecheck
        run: pnpm --filter lfc-suite-shell exec tsc --noEmit

      - name: Build (static, browser-only)
        run: pnpm --filter lfc-suite-shell exec ng build --configuration cloudflare

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFC_ADMIN_SUITE_SHELL_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages project create lfc-suite
          --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFC_ADMIN_SUITE_SHELL_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler pages deploy
          apps/lfc-suite-shell/dist/lfc-suite-shell/browser
          --project-name=lfc-suite
          --branch=main
