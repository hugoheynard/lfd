name: deploy_lfd_api

# Déploie le backend B2B (lfd-api, NestJS + Prisma) sur Cloudflare
# **Containers** : build de l'image depuis la racine monorepo → push registre
# Cloudflare → deploy du Worker. À chaque push sur main touchant le backend B2B.
#
# Scaffold : wrangler.jsonc + Dockerfile + container/worker.ts. Points à valider au
# 1er run (contexte de build, pnpm deploy, secrets runtime) : documentation/CONTAINERIZE-NOTES.md.
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_LFD_API_WORKER — token « Account · Workers Scripts · Edit » + « Containers · Edit ».
#   CLOUDFLARE_ACCOUNT_ID — account id partagé (injecté dans l'image au deploy).
#
# Secrets RUNTIME (≠ GitHub) posés une fois via `wrangler secret put` :
#   DATABASE_LFD_URL, Auth0, RESEND_MAILER_B2B_API_KEY, STRIPE_*, … — la liste
#   qui fait foi est la boucle `for name in …` ci-dessous, tenue à jour avec
#   `.env.example`. Un réglage absent de cette boucle N'ATTEINT PAS le Worker,
#   même posé dans GitHub : il n'y a aucun message pour le dire.

on:
  push:
    branches: [main]
    paths:
      - "apps/lfd-api/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy_lfd_api.yml"
  workflow_dispatch:

concurrency:
  group: deploy_lfd_api
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_lfd_api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les types partagés doivent être buildés avant le typecheck du backend.
      - name: Build shared packages
        run: pnpm --filter "@lfd/contracts" build

      - name: Typecheck
        run: pnpm --filter lfd-api exec tsc --noEmit

      # 1) Build l'image depuis la RACINE du monorepo (contexte complet), puis la
      #    pousse sur le registre Cloudflare via wrangler (auth automatique).
      - name: Build image (contexte racine)
        # `APP_REVISION` est gravée dans l'image : c'est elle que `/health`
        # renverra, et donc ce qui permet d'attendre l'image NEUVE plutôt qu'un
        # simple 200 que l'ancienne rend tout aussi bien.
        run: |
          docker build -f apps/lfd-api/Dockerfile \
            --build-arg APP_REVISION="${GITHUB_SHA:0:7}" \
            -t lfd-api:"$GITHUB_SHA" .

      - name: Push image → registre Cloudflare
        working-directory: apps/lfd-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_API_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler containers push lfd-api:"$GITHUB_SHA"

      # 2) Les secrets AVANT le déploiement : un container qui démarre sans
      #    DATABASE_LFD_URL meurt au boot (`required()` lève), puis redémarre une
      #    fois les secrets arrivés. Ça se répare tout seul, mais ça produit une
      #    fenêtre d'indisponibilité et une erreur qui inquiète pour rien.
      #
      #    Les secrets d'un Worker PERSISTENT d'un déploiement à l'autre : cette
      #    étape est donc un no-op sur les runs suivants, sauf quand une valeur
      #    change — et c'est précisément là qu'elle doit passer en premier, pour
      #    que le nouveau code trouve la nouvelle valeur déjà posée.
      #
      #    `continue-on-error` couvre le SEUL cas où elle ne peut pas réussir :
      #    le tout premier run, quand le Worker n'existe pas encore et qu'on ne
      #    peut donc rien lui attacher. Le déploiement suivant le crée, l'étape
      #    passe au run d'après, et l'ordre nominal reprend. Sans cette
      #    tolérance, le premier déploiement échouerait sans rien livrer.
      - name: Sync runtime secrets
        continue-on-error: true
        working-directory: apps/lfd-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_API_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_LFD_URL: ${{ secrets.DATABASE_LFD_URL }}
          # Identifiants Auth0 = PUBLICS → GitHub VARIABLES (pas Secrets). Tenant PROD.
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE_CUSTOMERS }}
          AUTH0_ADMIN_AUDIENCE: ${{ vars.AUTH0_AUDIENCE_STAFF }}
          AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
          AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
          # Connexion staff : distincte de la connexion client, c'est le mur qui
          # empêche un client de s'authentifier contre le back-office.
          AUTH0_STAFF_CONNECTION: ${{ vars.AUTH0_STAFF_CONNECTION }}
          AUTH0_CUSTOMER_CONNECTION: ${{ vars.AUTH0_CUSTOMER_CONNECTION }}
          # L'adresse de l'admin RACINE — une adresse, pas un secret. Sans elle,
          # le code retombe sur son défaut, et la porte de secours ne pointe pas
          # vers la boîte qu'on relève.
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
          # Racines publiques : elles décident où atterrit quelqu'un APRÈS avoir
          # posé son mot de passe. Absentes, il reste sur une page Auth0.
          #
          # `LFD_BACKOFFICE_URL` est PARTAGÉE avec la boutique cliente, qui en a
          # besoin pour le QR de retrait — c'est le staff qui le scanne, il doit
          # donc pointer vers le back-office. Une seule variable pour les deux
          # usages : deux copies à tenir identiques finiraient par diverger, et
          # le QR mènerait alors nulle part sans que rien ne le signale.
          CLIENT_BASE_URL: ${{ vars.LFC_BOUTIQUE_URL }}
          ADMIN_BASE_URL: ${{ vars.LFD_BACKOFFICE_URL }}
          # Courrier : sans la clé, aucune invitation ne part — ni pour l'équipe,
          # ni pour un client.
          #
          # `MAILER_FROM_ADDRESS` doit être sur un domaine VÉRIFIÉ chez Resend :
          # une adresse d'expédition sur un domaine non vérifié fait refuser
          # l'envoi côté fournisseur, et le symptôme est un e-mail qui ne part
          # jamais — pas une erreur au démarrage.
          #
          # `MAILER_REPLY_TO` est l'adresse où atterrit une RÉPONSE. L'expéditeur
          # est un `no-reply` : sans elle, une personne qui répond à son
          # invitation écrit dans le vide.
          RESEND_MAILER_B2B_API_KEY: ${{ secrets.RESEND_MAILER_B2B_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          MAILER_FROM_ADDRESS: ${{ vars.MAILER_FROM_ADDRESS }}
          MAILER_REPLY_TO: ${{ vars.MAILER_REPLY_TO }}
          MAILER_STAFF_INBOX: ${{ vars.MAILER_STAFF_INBOX }}
          # Stockage R2 : endpoint et région sont des faits du COMPTE ; le bucket
          # et les clés appartiennent à l'USAGE, pour qu'un jeton n'ouvre que le
          # sien. Un stockage de plus = un bloc de trois, isolé du reste.
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          # L'endpoint dépend de la JURIDICTION du bucket, pas du compte : les
          # KBIS sont en juridiction EU (`.eu.r2.cloudflarestorage.com`), les
          # médias non. `R2_ENDPOINT` reste le repli commun.
          R2_KBIS_ENDPOINT: ${{ vars.R2_KBIS_ENDPOINT }}
          R2_MEDIA_ENDPOINT: ${{ vars.R2_MEDIA_ENDPOINT }}
          R2_KBIS_BUCKET: ${{ vars.R2_KBIS_BUCKET }}
          R2_KBIS_ACCESS_KEY_ID: ${{ secrets.R2_KBIS_ACCESS_KEY_ID }}
          R2_KBIS_SECRET_ACCESS_KEY: ${{ secrets.R2_KBIS_SECRET_ACCESS_KEY }}
          # Second usage : les visuels du catalogue. Bucket et jeton distincts
          # des KBIS — un jeton média fuité ne doit pas ouvrir les papiers des
          # clients. L'adresse publique est une VARIABLE : elle finit dans le
          # HTML de chaque fiche produit, elle ne protège rien.
          R2_MEDIA_BUCKET: ${{ vars.R2_MEDIA_BUCKET }}
          R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          R2_MEDIA_PUBLIC_BASE_URL: ${{ vars.R2_MEDIA_PUBLIC_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Jeton interne des portes machine-à-machine (recompute, contrôle du
          # courrier). Il était posé À LA MAIN, donc sans source de vérité : une
          # rotation se serait faite quelque part, sans trace, et le Cron aurait
          # cessé de passer sans que rien ne le dise.
          RECOMPUTE_TOKEN: ${{ secrets.RECOMPUTE_TOKEN }}
          # La base du référentiel produit — il vit dans cette image depuis B2c,
          # avec son propre client Prisma. Deux bases, un seul processus.
          # Identifiants Shopify du référentiel. Un seul des deux chemins suffit ;
          # absents, le canal de publication est éteint (et le dit).
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Lecture d'Analytics Engine par OPS (la carte de santé). L'ÉCRITURE se
          # fait dans la passerelle par un binding, sans aucun secret : seul le
          # lecteur s'authentifie. Absents, OPS rend une fenêtre de RÉPÉTITION et
          # l'annonce dans sa réponse — il ne se tait pas.
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          # La paire VAPID qui SIGNE nos envois Web Push. La publique voyage
          # dans chaque abonnement de navigateur — elle est publique par
          # construction — mais elle passe par le même chemin que la privée :
          # les deux vont ensemble, et une seule des deux fait échouer le
          # démarrage. Absentes, la cloche sonne toujours à l'écran ; seul le
          # téléphone reste muet.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          for name in DATABASE_LFD_URL \
                      AUTH0_DOMAIN AUTH0_AUDIENCE AUTH0_ADMIN_AUDIENCE \
                      AUTH0_M2M_CLIENT_ID AUTH0_M2M_CLIENT_SECRET \
                      AUTH0_STAFF_CONNECTION AUTH0_CUSTOMER_CONNECTION \
                      BOOTSTRAP_ADMIN_EMAIL CLIENT_BASE_URL ADMIN_BASE_URL \
                      RESEND_MAILER_B2B_API_KEY RESEND_WEBHOOK_SECRET \
                      MAILER_FROM_ADDRESS MAILER_REPLY_TO MAILER_STAFF_INBOX \
                      R2_ENDPOINT R2_REGION R2_KBIS_ENDPOINT R2_MEDIA_ENDPOINT \
                      R2_KBIS_BUCKET R2_KBIS_ACCESS_KEY_ID R2_KBIS_SECRET_ACCESS_KEY \
                      R2_MEDIA_BUCKET R2_MEDIA_ACCESS_KEY_ID R2_MEDIA_SECRET_ACCESS_KEY \
                      R2_MEDIA_PUBLIC_BASE_URL \
                      STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET \
                      SHOPIFY_ADMIN_TOKEN SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET \
                      CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ANALYTICS_TOKEN \
                      VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT \
                      RECOMPUTE_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name"
            fi
          done

      # 3) Le schéma AVANT le code — mais le plus TARD possible avant lui.
      #
      #    L'ordre inverse (code avant schéma) met en ligne un backend qui
      #    interroge des colonnes absentes : constaté le 2026-08-12 en dev, où
      #    l'admin racine n'a pas pu être semé et le symptôme visible est devenu
      #    « Aucun accès » — un message qui n'oriente vers rien.
      #
      #    Mais migrer en TÊTE de workflow était l'autre extrême : entre la
      #    migration et le déploiement s'intercalaient le build et le push de
      #    l'image, soit plusieurs minutes pendant lesquelles l'ANCIEN container
      #    servait le trafic contre le NOUVEAU schéma. Une migration qui retire
      #    une colonne encore lue par le code en ligne, et c'est une fenêtre de
      #    500 large comme un `docker build`. Ici, cette fenêtre se réduit aux
      #    quelques secondes du `wrangler deploy` qui suit.
      #
      #    Elle ne disparaît pas pour autant : un déplacement de données sur une
      #    base VIVANTE se fait en trois déploiements (étendre / basculer /
      #    resserrer), jamais en une migration qui `DROP` ce que le code lit
      #    encore. Cf. documentation/suite/CONTAINERIZE-NOTES.md.
      #
      #    `migrate deploy` n'applique QUE les migrations existantes : il n'en
      #    génère aucune et ne réinitialise jamais. Il échoue plutôt que de
      #    forcer, ce qui bloque le déploiement — c'est le comportement voulu :
      #    mieux vaut l'ancienne version en ligne qu'une nouvelle sur un schéma
      #    à moitié migré. Le coût d'un échec ici est une image construite pour
      #    rien : du temps de CI, pas une indisponibilité.
      - name: Migrer la base
        working-directory: apps/lfd-api
        env:
          DATABASE_LFD_URL: ${{ secrets.DATABASE_LFD_URL }}
        run: pnpm exec prisma migrate deploy

      # 4) Injecte l'account id dans l'`image` du wrangler (jamais commité), puis déploie
      #    le Worker qui référence l'image poussée.
      - name: Deploy Worker
        working-directory: apps/lfd-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LFD_API_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i "s/__CF_ACCOUNT_ID__/${CLOUDFLARE_ACCOUNT_ID}/" wrangler.jsonc
          sed -i "s/__IMAGE_TAG__/${GITHUB_SHA}/" wrangler.jsonc
          pnpm exec wrangler deploy

      # 5) LA PREUVE — un e-mail réellement reçu, pas un déploiement vert.
      #
      #    Le mailer ne tombe jamais en panne visible : sans clé il journalise et
      #    rend la main, et avec un expéditeur non vérifié le fournisseur refuse
      #    en silence. Un canal mort ressemble exactement à un canal qui marche.
      #    Le seul contrôle qui ne ment pas est un message arrivé.
      #
      #    L'appel part d'ICI mais l'envoi part du CONTAINER : c'est ce qui
      #    couvre le dernier maillon (RUNTIME_KEYS → envVars → process.env), le
      #    seul qui ait réellement cassé. Il réveille aussi le container endormi,
      #    donc il prouve que l'IMAGE NEUVE démarre — pas seulement que
      #    `wrangler deploy` a rendu 200.
      #
      #    L'étape échoue si l'envoi échoue, délibérément : un contrôle qui
      #    journalise sans rien casser est ignoré en trois semaines.
      #
      #    ⏱ ELLE ATTEND UNE CONDITION, PAS UNE DURÉE. `wrangler deploy` rend la
      #    main quand le Worker est à jour, pas quand l'instance sert l'image
      #    neuve : l'ANCIENNE répond encore une à deux minutes. Constaté le
      #    2026-08-16, par un 404 sur une route qui existait déjà.
      #
      #    Attendre un `/health` à 200 ne corrigerait RIEN — l'ancienne image le
      #    rend tout aussi bien. C'est pourquoi `/health` publie la révision
      #    gravée dans l'image : on attend que ce soit CELLE QU'ON VIENT DE
      #    POUSSER qui réponde. La condition est vraie ou fausse, elle ne se
      #    devine pas.
      - name: Attendre que l'image neuve serve
        env:
          API_BASE_URL: ${{ vars.LFD_API_URL }}
        run: |
          set -uo pipefail
          expected="${GITHUB_SHA:0:7}"
          echo "Révision attendue : ${expected}"

          for attempt in $(seq 1 40); do
            served=$(curl --silent --max-time 20 "${API_BASE_URL}/health" \
                     | python3 -c "import json,sys; print(json.load(sys.stdin).get('revision',''))" 2>/dev/null || echo "")

            if [ "${served}" = "${expected}" ]; then
              echo "L'image ${expected} répond (tentative ${attempt})."
              exit 0
            fi
            echo "Tentative ${attempt}/40 — révision servie : « ${served:-aucune réponse} »."
            sleep 10
          done

          echo "::error::L'image ${expected} ne répond toujours pas après ~7 minutes."
          exit 1

      - name: Vérifier le courrier sortant
        env:
          API_BASE_URL: ${{ vars.LFD_API_URL }}
          RECOMPUTE_TOKEN: ${{ secrets.RECOMPUTE_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${RECOMPUTE_TOKEN}" ]; then
            echo "::error::RECOMPUTE_TOKEN absent des secrets GitHub — la porte machine-à-machine ne peut pas être franchie."
            exit 1
          fi
          # Un seul appel : l'étape précédente a établi que la bonne image sert.
          # Reprendre ici masquerait un vrai échec d'envoi derrière une attente.
          # --fail-with-body : échoue sur 4xx/5xx SANS masquer le corps, qui
          # porte la raison (jeton refusé, envoi refusé par Resend…).
          curl --fail-with-body --silent --show-error --max-time 90 \
               -X POST "${API_BASE_URL}/admin/ops/mail-check" \
               -H "x-lfc-recompute-token: ${RECOMPUTE_TOKEN}"
          echo
          echo "E-mail de contrôle expédié — vérifiez la boîte de l'admin de secours."

      # 6) LE CANAL D'IDENTITÉ — jumeau du contrôle du courrier.
      #
      #    Même défaut structurel : mal configuré, il ne tombe pas en panne, il
      #    ressemble à un canal qui marche jusqu'à ce que quelqu'un s'en serve.
      #    L'inventaire (étape suivante) dit que les identifiants SONT là ; il ne
      #    dit pas que le tenant les accepte, ni que le jeton obtenu ouvre les
      #    gestes que les écrans proposent. C'est ce que celle-ci vérifie.
      #
      #    Strictement en lecture : elle échange un jeton et lit ce qu'il ouvre.
      #    Aucun compte n'est créé, donc elle peut tourner à chaque déploiement.
      - name: Vérifier le canal d'identité
        env:
          API_BASE_URL: ${{ vars.LFD_API_URL }}
          RECOMPUTE_TOKEN: ${{ secrets.RECOMPUTE_TOKEN }}
        run: |
          set -uo pipefail
          report=$(curl --fail-with-body --silent --show-error --max-time 30 \
                   "${API_BASE_URL}/admin/ops/identity-check" \
                   -H "x-lfc-recompute-token: ${RECOMPUTE_TOKEN}") || {
            echo "::error::Contrôle d'identité injoignable — la porte machine-à-machine a refusé."
            exit 1
          }

          REPORT="${report}" python3 <<'PY'
          import json, os, sys
          report = json.loads(os.environ["REPORT"])
          if not report["configured"]:
              print("::error::Identifiants M2M absents du container (AUTH0_M2M_CLIENT_ID / _SECRET).")
              sys.exit(1)
          if not report["tokenGranted"]:
              print(f"::error::Le tenant {report['domain']} a refusé le jeton M2M "
                    f"({report.get('tokenStatus')}) : {report.get('tokenError')}")
              sys.exit(1)
          missing = report["missingScopes"]
          if missing:
              print(f"::error::Autorisations manquantes sur l'application M2M : {', '.join(missing)} "
                    f"— à accorder dans Auth0 → Applications → APIs → Management API.")
              sys.exit(1)
          print(f"Canal d'identité opérationnel sur {report['domain']} — "
                f"clients : {report['customerConnection']}, équipe : {report['staffConnection']}.")
          PY

      # 7) L'INVENTAIRE — ce que l'instance en ligne ne saura pas faire.
      #
      #    Le backend le sait depuis toujours et l'écrit à son démarrage… dans un
      #    journal que personne ne captait. Le 2026-08-16, un `500` sur
      #    l'ouverture d'un accès a coûté une demi-heure d'enquête à travers
      #    Cloudflare, Resend et Auth0 pendant que le bulletin de démarrage
      #    portait déjà la réponse.
      #
      #    L'étape ÉCHOUE sur un canal bloquant. Elle vient après `wrangler
      #    deploy` : le code est donc déjà en ligne, et un échec ici ne
      #    l'annule pas — il rend visible un réglage absent au lieu de le
      #    laisser se manifester trois jours plus tard sous la forme d'un
      #    bouton qui rend 500. Un contrôle qui n'arrête rien est ignoré en
      #    trois semaines.
      - name: Inventaire des canaux
        env:
          API_BASE_URL: ${{ vars.LFD_API_URL }}
          RECOMPUTE_TOKEN: ${{ secrets.RECOMPUTE_TOKEN }}
        run: |
          set -uo pipefail
          report=$(curl --fail-with-body --silent --show-error --max-time 30 \
                   "${API_BASE_URL}/admin/ops/capabilities" \
                   -H "x-lfc-recompute-token: ${RECOMPUTE_TOKEN}") || {
            echo "::error::Inventaire injoignable — la porte machine-à-machine a refusé."
            exit 1
          }

          # Le rapport passe par l'ENVIRONNEMENT, pas par l'entrée standard :
          # celle-ci est déjà prise par le script lui-même (`<<'PY'`).
          REPORT="${report}" python3 <<'PY'
          import json, os, sys
          report = json.loads(os.environ["REPORT"])
          missing = report["missing"]
          if not missing:
              print(f"Révision {report['revision']} — tous les canaux sont configurés.")
              sys.exit(0)
          for entry in missing:
              level = "error" if entry["severity"] == "blocking" else "warning"
              print(f"::{level}::{entry['capability']} — poser {entry['setting']} "
                    f"(sinon : {entry['consequence']})")
          sys.exit(1 if any(e["severity"] == "blocking" for e in missing) else 0)
          PY
