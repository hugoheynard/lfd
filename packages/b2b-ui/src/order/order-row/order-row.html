<button
  type="button"
  class="row"
  [class.is-selected]="selected()"
  [attr.aria-pressed]="selected() ? true : null"
  (click)="open.emit(order())"
>
  <span class="row-ref">{{ order().orderNumber }}</span>
  <span class="row-total">{{ total() }}</span>

  <span class="row-meta">
    <span class="row-date">{{ placedAt() }}</span>
    @if (origin(); as pill) {
      <fold-badge variant="info" [content]="pill" />
    }
    @if (states()) {
      <fold-badge [variant]="statusTone()" [content]="status()" />
      <fold-badge [variant]="paymentTone()" [content]="payment()" />
    }
  </span>
</button>
