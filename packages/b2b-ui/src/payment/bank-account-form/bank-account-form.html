<!-- 🔴 L'IBAN est toujours vide à l'ouverture, même quand un compte existe : il
     ne revient d'aucune route. Tout le reste se réaffiche — rien de cela n'est
     un secret, et le relire est justement ce qu'on veut avant d'imprimer un
     mandat. -->
<div class="row">
  <fold-input
    [label]="labels().holder"
    [placeholder]="labels().holderPlaceholder ?? ''"
    [value]="value().holder"
    (valueChange)="set('holder', $event)"
  />
  <!-- Facultative en CORE, exigée en interentreprises : c'est l'écran qui sait
       sous quel schéma le mandat sera frappé, et qui le dit par
       `holderLegalFormRequired`. Requise, elle se présente comme les autres
       champs obligatoires : sans marque « facultatif ». -->
  <fold-listbox
    [label]="labels().holderLegalForm"
    [placeholder]="labels().holderLegalFormPlaceholder ?? ''"
    [hint]="labels().holderLegalFormHint"
    [optional]="!holderLegalFormRequired()"
    [options]="holderLegalFormOptions()"
    [value]="holderLegalFormSelection()"
    (selectionChange)="chooseLegalForm($event)"
  />
  <!-- « Autre » : une forme rare, courte. Une valeur d'avant la liste fermée
       (« Col Pers SAS ») s'y réaffiche telle quelle — on la corrige, on ne la
       perd pas. -->
  @if (otherOpen()) {
    <fold-input
      [label]="labels().holderLegalFormOther"
      [placeholder]="labels().holderLegalFormOtherPlaceholder ?? ''"
      [value]="holderLegalFormState().other"
      (valueChange)="typeOtherLegalForm($event)"
    />
  }
</div>

<!-- Le bloc titulaire tel que le mandat l'imprime : la forme, puis le nom. Une
     forme qui répète le nom se voit ici avant d'être refusée. -->
@if (preview(); as printed) {
  <p class="preview">
    <span class="preview-label">{{ labels().holderPreview }}</span>
    <span class="preview-value">{{ printed }}</span>
  </p>
}
