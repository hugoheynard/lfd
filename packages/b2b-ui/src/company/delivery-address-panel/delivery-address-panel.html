<fold-panel-header [title]="heading()" subtitle="Une adresse postale complète." />

<fold-panel-body>
  <!-- Le rang, le lieu et les consignes : le formulaire partagé avec le
       dialogue client. Les libellés par défaut sont ceux d'avant. -->
  <lfd-delivery-address-form
    [(value)]="draft"
    [signatureFloor]="data().signatureFloor"
    [knownContacts]="data().knownContacts"
    [showStopMinutes]="data().showStopMinutes ?? false"
    [globalWindowMode]="data().globalWindowMode ?? 'slot'"
  />
</fold-panel-body>

<fold-panel-footer>
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton intent="primary" [disabled]="!canSubmit() || pending()" (click)="submit()">
    {{ isCreate() ? 'Ajouter' : 'Enregistrer' }}
  </button>
</fold-panel-footer>
