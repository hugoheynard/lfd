<lfd-photo-cards-editor
  emptyIcon="door"
  [gateway]="steps()"
  [labels]="cardLabels()"
  [limits]="limits"
  [canEdit]="canEdit()"
  (countChange)="stepCountChange.emit($event)"
>
  <ng-template lfdPhotoCardForm let-form>
    <lfd-delivery-step-form
      [(value)]="form.draft"
      [labels]="labels().form"
      [currentPhotoUrl]="form.currentPhotoUrl()"
      [currentPhotoUnavailable]="form.currentPhotoUnavailable()"
    />
  </ng-template>
</lfd-photo-cards-editor>
