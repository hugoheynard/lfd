<!-- Le point GPS n'a de sens qu'en livraison : c'est le livreur qui cherche
     l'entrée, pas le comptable qui poste une facture. -->
<lfd-address-form
  line2Hint="bâtiment, étage, instructions de livraison…"
  coordinatesHint="lieux difficiles à localiser"
  [fields]="postalFields()"
  [value]="postal()"
  (valueChange)="setPostal($event)"
/>

@if (isLivraison()) {
  <fold-checkbox
    label="Adresse de livraison par défaut"
    hint="utilisée d'office pour vos prochaines commandes"
    [checked]="value().isDefault"
    (checkedChange)="set('isDefault', $event)"
  />

  <hr class="sep" />

  <label class="field">
    <span class="field-label">Note pour les livreurs <em>(optionnel)</em></span>
    <textarea
      class="note"
      rows="3"
      placeholder="Code d'accès, étage, contact sur place, consignes de dépôt…"
      [value]="value().note"
      (input)="set('note', inputValue($event))"
    ></textarea>
  </label>

  <fieldset class="slots">
    <legend class="field-label">Créneaux de livraison préférés</legend>

    <fold-checkbox
      label="Le même créneau tous les jours"
      hint="décochez pour définir un créneau par jour"
      [checked]="value().sameEveryDay"
      (checkedChange)="set('sameEveryDay', $event)"
    />

    <!-- Une ligne « Tous les jours », ou sept : le socle rend les lignes
         qu'on lui donne, c'est ici qu'on décide lesquelles. -->
    <lfd-hours-form [value]="slotEntries()" (valueChange)="setSlotEntries($event)" />
  </fieldset>

  <hr class="sep" />

  <fieldset class="contact">
    <legend class="field-label">Contact sur place à la livraison</legend>

    <fold-checkbox
      label="Pas de contact de livraison dédié"
      hint="cochez si le livreur n'a personne à prévenir sur place"
      [checked]="value().noContact"
      (checkedChange)="set('noContact', $event)"
    />

    @if (!value().noContact) {
      @if (knownContacts().length > 0) {
        <!-- Raccourci de saisie, pas un champ : la valeur reste vide après le
             choix, parce que ce qui compte est ce qu'il a REMPLI en dessous. -->
        <fold-listbox
          label="Reprendre un contact connu"
          optional
          placeholder="Choisir un contact…"
          [options]="knownContactOptions()"
          [value]="null"
          (selectionChange)="onPickContact($event)"
        />
      }

      <div class="row">
        <fold-input
          class="grow"
          label="Prénom"
          required
          [value]="value().contactPrenom"
          (valueChange)="set('contactPrenom', $event)"
        />
        <fold-input
          class="grow"
          label="Nom"
          required
          [value]="value().contactNom"
          (valueChange)="set('contactNom', $event)"
        />
      </div>
      <fold-input
        label="Téléphone"
        required
        [value]="value().contactTel"
        (valueChange)="set('contactTel', $event)"
      />

      @if (contactIssue()) {
        <p class="slot-issue">{{ contactIssue() }}</p>
      }
    }
  </fieldset>

  <fold-checkbox
    label="Signature exigée à la remise"
    hint="préremplit vos commandes livrées ici ; modifiable au panier"
    [checked]="value().signatureRequired"
    (checkedChange)="set('signatureRequired', $event)"
  />
}
