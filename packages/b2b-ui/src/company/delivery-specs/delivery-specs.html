<!-- Quand et à qui : les deux moitiés d'une même question, « comment ça se
     passe une fois sur place ». Elles gardent chacune leur nom — un groupe
     imbriqué ne répète pas celui de son parent, il le précise, et « Créneaux
     de livraison préférés » sous « Détail de livraison » disait deux fois le
     même mot. -->
<fold-fieldset legend="Détail de livraison" legendVariant="heading" appearance="border">
  <fold-fieldset class="slots" legend="Créneaux préférés" legendVariant="heading">
    <fold-checkbox
      label="Le même créneau tous les jours"
      hint="décochez pour définir un créneau par jour"
      [checked]="value().sameEveryDay"
      (checkedChange)="set('sameEveryDay', $event)"
    />

    <!-- Une ligne « Tous les jours », ou sept : le socle rend les lignes
         qu'on lui donne, c'est ici qu'on décide lesquelles. -->
    <lfd-hours-form [value]="slotEntries()" (valueChange)="setSlotEntries($event)" />
  </fold-fieldset>

  <fold-fieldset legend="Contact sur place" legendVariant="heading">
    <fold-checkbox
      label="Pas de contact de livraison dédié"
      hint="cochez si le livreur n'a personne à prévenir sur place"
      [checked]="value().noContact"
      (checkedChange)="set('noContact', $event)"
    />

    @if (!value().noContact) {
      @if (knownContacts().length > 0) {
        <!-- Raccourci de saisie, pas un champ : la valeur reste vide après le
             choix, parce que ce qui compte est ce qu'il a REMPLI en dessous. -->
        <fold-listbox
          label="Reprendre un contact connu"
          optional
          placeholder="Choisir un contact…"
          [options]="knownContactOptions()"
          [value]="null"
          (selectionChange)="onPickContact($event)"
        />
      }

      <div class="row">
        <fold-input
          class="grow"
          label="Prénom"
          required
          [value]="value().contactPrenom"
          (valueChange)="set('contactPrenom', $event)"
        />
        <fold-input
          class="grow"
          label="Nom"
          required
          [value]="value().contactNom"
          (valueChange)="set('contactNom', $event)"
        />
      </div>
      <fold-input
        label="Téléphone"
        required
        [value]="value().contactTel"
        (valueChange)="set('contactTel', $event)"
      />

      @if (contactIssue()) {
        <p class="contact-issue">{{ contactIssue() }}</p>
      }
    }
  </fold-fieldset>
</fold-fieldset>

<!-- Trois états, et non une case : « on ne signe pas ici » et « on fait comme
     d'habitude » sont deux réponses différentes. Les confondre figerait la
     seconde le jour où l'habitude change — c'est-à-dire au moment précis où
     l'héritage devait servir. -->
<fold-listbox
  label="Signature à la remise"
  hint="préremplit les commandes livrées ici ; modifiable au panier"
  [options]="signatureOptions()"
  [value]="signatureChoice()"
  (selectionChange)="setSignature($event)"
/>
