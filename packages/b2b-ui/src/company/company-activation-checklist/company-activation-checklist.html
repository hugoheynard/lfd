<fold-callout variant="warning">
  <ng-content select="[intro]"></ng-content>

  @if (ready()) {
    <p class="ready">{{ readyNote() }}</p>
  }

  <ng-content select="[support]"></ng-content>

  <ul class="steps">
    @for (step of steps(); track step.key) {
      <li class="step">
        <div class="step-text">
          <!-- Une puce CREUSE, jamais une coche. Cette liste ne contient QUE ce
               qui manque (`activationSteps` filtre sur `!done`) : chaque ligne
               affichée est une chose À FAIRE. Elle portait `check-circle`, le
               symbole universel de « c'est fait » — cinq coches en face de
               « 5 points à régler ». Dessinée en CSS et non tirée du registre
               d'icônes : aucun nom fold ne dit « à faire », et une puce ne peut
               ni manquer ni changer de sens. -->
          <span class="step-mark" aria-hidden="true"></span>
          <span
            ><strong>{{ step.title }}</strong> — {{ step.detail }}</span
          >
        </div>

        @if (step.cta === '') {
          <!-- Rien : l'étape se lit, elle ne se clique pas. -->
        } @else if (step.kind === 'file') {
          <input
            #fileInput
            type="file"
            accept="application/pdf"
            hidden
            (change)="onFile($event, step.key)"
          />
          <button
            foldButton
            intent="warning"
            emphasis="soft"
            size="sm"
            icon="upload"
            (click)="fileInput.click()"
          >
            {{ step.cta }}
          </button>
        } @else {
          <button
            foldButton
            intent="warning"
            emphasis="soft"
            size="sm"
            (click)="stepAction.emit(step.key)"
          >
            {{ step.cta }}
          </button>
        }
      </li>
    }
  </ul>
</fold-callout>
