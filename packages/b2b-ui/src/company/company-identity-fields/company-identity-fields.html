<!-- L'ENSEIGNE d'abord : c'est le nom sur la devanture, celui que le commercial
     a en tête et que le client donne au téléphone. La raison sociale est une
     donnée de greffe — elle appartient au bloc légal, avec le SIRET. -->
<fold-input
  label="Enseigne"
  [hint]="
    enseigneOptional()
      ? 'nom commercial, s\'il diffère de la raison sociale'
      : 'le nom sous lequel l\'établissement est connu'
  "
  [required]="!enseigneOptional()"
  [optional]="enseigneOptional()"
  [value]="value().enseigne"
  (valueChange)="setEnseigne($event)"
/>
<fold-input
  label="Raison sociale"
  [hint]="
    legalDeferred()
      ? 'la dénomination au registre — à compléter avec le SIRET'
      : 'la dénomination légale, telle qu\'elle figure au registre'
  "
  [required]="!legalDeferred()"
  [optional]="legalDeferred()"
  [value]="value().raisonSociale"
  (valueChange)="setRaisonSociale($event)"
/>

<div class="row">
  <!-- Une LISTE, pas un champ libre : c'est la forme juridique qui décide de
       l'assujettissement à la TVA, et une saisie hors catalogue tombait du
       mauvais côté sans que personne le voie. -->
  <fold-listbox
    class="forme"
    label="Forme juridique"
    placeholder="À choisir"
    [required]="!legalDeferred()"
    [optional]="legalDeferred()"
    [options]="legalForms"
    [value]="value().formeJuridique"
    (selectionChange)="setFormeJuridique($event)"
  />
  <!-- Le SIREN SOUS le SIRET : il en est le préfixe quand celui-ci le porte, et
       le formulaire le propose alors. Saisi à part parce qu'il ne l'est pas
       toujours — et exigé par le mandat interentreprises. -->
  <div class="ids">
    <fold-input
      class="siret"
      label="SIRET"
      placeholder="812 456 789 00021"
      [hint]="
        legalDeferred()
          ? 'à compléter plus tard s’il n’est pas connu — la clé de contrôle est vérifiée'
          : '14 chiffres — la clé de contrôle est vérifiée'
      "
      [required]="!legalDeferred()"
      [optional]="legalDeferred()"
      [value]="value().siret"
      (valueChange)="setSiret($event)"
    />
    <fold-input
      class="siren"
      label="SIREN"
      placeholder="732 829 320"
      hint="9 chiffres — proposé depuis le SIRET quand il le porte ; exigé par le mandat interentreprises"
      [optional]="true"
      [value]="value().siren"
      (valueChange)="setSiren($event)"
    />
  </div>
</div>

<!-- Le caractère obligatoire suit la forme choisie : on ne le devine plus, on
     le lit dans le catalogue. -->
<fold-input
  label="TVA intracommunautaire"
  [hint]="
    vatUndecided()
      ? 'obligatoire ou non selon la forme juridique'
      : vatRequired()
        ? 'obligatoire pour cette forme juridique'
        : 'facultatif pour cette forme — franchise en base'
  "
  [required]="vatRequired() && !legalDeferred()"
  [optional]="!vatRequired()"
  [value]="value().vatNumber"
  (valueChange)="setVatNumber($event)"
/>
