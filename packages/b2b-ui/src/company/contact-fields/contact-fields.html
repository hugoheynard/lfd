<!-- L'adresse d'abord : c'est par elle qu'on joint la personne, et c'est le
     seul champ exigé. Le nom vient ensuite, facultatif — l'imposer bloquerait
     une saisie faite au téléphone. -->
<fold-input
  type="email"
  required
  [readOnly]="readOnly()"
  [label]="labels().email"
  [hint]="labels().emailHint"
  [value]="value().email"
  (valueChange)="setEmail($event)"
/>

@if (withRole()) {
  <fold-listbox
    required
    [disabled]="readOnly()"
    [label]="labels().role"
    [placeholder]="labels().rolePlaceholder"
    [options]="roles()"
    [value]="value().role"
    (selectionChange)="setRole($event)"
  />
}

<div class="row">
  <fold-input
    optional
    [readOnly]="readOnly()"
    [label]="labels().firstName"
    [value]="value().firstName"
    (valueChange)="setFirstName($event)"
  />
  <fold-input
    optional
    [readOnly]="readOnly()"
    [label]="labels().lastName"
    [value]="value().lastName"
    (valueChange)="setLastName($event)"
  />
</div>

<fold-input
  optional
  [readOnly]="readOnly()"
  [label]="labels().fonction"
  [placeholder]="labels().fonctionPlaceholder"
  [value]="value().fonction"
  (valueChange)="setFonction($event)"
/>
<fold-input
  type="tel"
  optional
  [readOnly]="readOnly()"
  [label]="labels().phone"
  [value]="value().phone"
  (valueChange)="setPhone($event)"
/>
