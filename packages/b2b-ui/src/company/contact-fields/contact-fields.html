<!-- L'adresse d'abord : c'est par elle qu'on joint la personne, et c'est le
     seul champ exigé. Le nom vient ensuite, facultatif — l'imposer bloquerait
     une saisie faite au téléphone. -->
<fold-input
  label="E-mail"
  type="email"
  required
  hint="c'est par là qu'un accès lui serait envoyé"
  [value]="value().email"
  (valueChange)="setEmail($event)"
/>

@if (withRole()) {
  <fold-listbox
    label="Rôle dans la société"
    required
    placeholder="À choisir"
    [options]="roles"
    [value]="value().role"
    (selectionChange)="setRole($event)"
  />
}

<div class="row">
  <fold-input
    label="Prénom"
    optional
    optionalLabel="facultatif"
    [value]="value().firstName"
    (valueChange)="setFirstName($event)"
  />
  <fold-input
    label="Nom"
    optional
    optionalLabel="facultatif"
    [value]="value().lastName"
    (valueChange)="setLastName($event)"
  />
</div>

<fold-input
  label="Fonction"
  placeholder="ex. Responsable achats"
  optional
  optionalLabel="facultatif"
  [value]="value().fonction"
  (valueChange)="setFonction($event)"
/>
<fold-input
  label="Téléphone"
  type="tel"
  optional
  optionalLabel="facultatif"
  [value]="value().phone"
  (valueChange)="setPhone($event)"
/>
