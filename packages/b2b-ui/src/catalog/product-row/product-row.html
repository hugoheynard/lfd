@let p = product();
<div class="pr" [class.is-out]="isOut()">
  <div class="pr-thumb">
    @if (p.image) {
      <img class="pr-img" [src]="p.image" [alt]="p.imageAlt ?? p.name" loading="lazy" />
    } @else {
      <span class="pr-initial" aria-hidden="true">{{ initial() }}</span>
    }
    @if (favoritable()) {
      <fold-toggle-icon
        class="pr-fav"
        icon="heart"
        size="sm"
        [active]="favorite()"
        [tooltip]="favorite() ? 'Retirer des favoris' : 'Ajouter aux favoris'"
        (toggled)="onFavorite()"
      />
    }
  </div>

  <div class="pr-main">
    <div class="pr-line1">
      <span class="pr-name">{{ p.name }}</span>
    </div>
    <div class="pr-line2">
      @if (p.price) {
        <span class="pr-price">
          {{ p.price }}
          @if (priceSuffix(); as s) {
            <span class="pr-suffix">{{ s }}</span>
          }
          @if (p.unit) {
            <span class="pr-unit">{{ p.unit }}</span>
          }
        </span>
      }
      @if (hasPack()) {
        <div class="pr-mode" role="group" aria-label="Mode de commande">
          <button
            type="button"
            class="pr-mode-opt"
            [class.is-on]="!byPack()"
            [attr.aria-pressed]="!byPack()"
            (click)="byPack.set(false)"
          >
            Unité
          </button>
          <button
            type="button"
            class="pr-mode-opt"
            [class.is-on]="byPack()"
            [attr.aria-pressed]="byPack()"
            (click)="byPack.set(true)"
          >
            {{ packOptionLabel() }}
          </button>
        </div>
      }
    </div>
  </div>

  <div class="pr-actions">
    @if (isOut()) {
      <button
        foldButton
        type="button"
        emphasis="outline"
        intent="neutral"
        size="sm"
        icon="bell"
        (click)="onNotify()"
      >
        {{ notifyLabel() }}
      </button>
    } @else {
      <!-- Un seul geste, celui du rayon de la boutique (Hugo, 2026-11-21) : le
           « + » ne bouge jamais — il ajoute, puis augmente. Le « − » et la
           quantité ont leur place réservée dès zéro, invisibles, pour que
           rien ne glisse sous le doigt à la première pièce. -->
      <button
        foldButton
        type="button"
        emphasis="outline"
        [intent]="atFloor() ? 'danger' : 'neutral'"
        size="sm"
        class="pr-step"
        [class.is-reserved]="!inCartMode()"
        [disabled]="!inCartMode()"
        [attr.aria-hidden]="!inCartMode() || null"
        [icon]="atFloor() ? 'bin' : 'minus'"
        [attr.aria-label]="atFloor() ? removeText() : 'Diminuer'"
        (click)="onDecrement()"
      ></button>
      <fold-number-input
        class="pr-qty"
        [class.is-reserved]="!inCartMode()"
        spinner="none"
        size="sm"
        align="center"
        integer
        [attr.aria-hidden]="!inCartMode() || null"
        [attr.aria-label]="byWeight() ? 'Poids au panier, en grammes' : 'Quantité au panier'"
        [min]="minQty()"
        [step]="step()"
        [(value)]="cartDraft"
        (focusout)="onCommitDraft()"
        (keydown.enter)="onCommitDraft()"
      />
      <button
        foldButton
        type="button"
        [emphasis]="inCartMode() ? 'outline' : 'solid'"
        [intent]="inCartMode() ? 'neutral' : 'primary'"
        size="sm"
        icon="plus"
        [attr.aria-label]="inCartMode() ? 'Augmenter' : addText()"
        (click)="inCartMode() ? onIncrement() : onAction()"
      ></button>
    }
  </div>
</div>
