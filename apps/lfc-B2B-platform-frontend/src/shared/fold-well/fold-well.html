@if (title()) {
  <header class="head">
    <ng-content select="[wellLead]" />
    <fold-element-title class="titles" [title]="title()" [subtitle]="subtitle()">
      <!-- Re-projected under the SAME name fold uses. A slot renamed on the
           way through would never match: the inner component selects on the
           attribute the caller wrote, not on the one we forwarded it with. -->
      <ng-content select="[titleAction]" />
    </fold-element-title>
  </header>
}

<div #body class="body" (scroll)="onScroll()">
  <ng-content />
</div>

<ng-content select="[wellFoot]" />
