<!-- Le shell garde son défilement, même si l'écran ouvre le sien : c'est le
     FILET. Si jamais la hauteur d'un écran ne se borne pas, la page défile
     comme avant — dégradée, pas coupée. Avec `stage`, la même erreur clipperait
     le contenu en silence. -->
<fold-app-shell mobileNav="none" scroll="scroll" footerBehavior="scroll">
  <div header class="bar">
    @if (chrome.back()) {
      <button class="back" type="button" aria-label="Retour" (click)="goBack()">
        <fold-icon name="chevron-left" />
      </button>
    }
    <span class="mark" aria-hidden="true">
      <img src="brand/lfc-mark.png" alt="" />
    </span>
    <span class="brand">
      <span class="brand-name">La Folie Coffee</span>
      @if (chrome.kicker(); as kicker) {
        <span class="brand-kicker">{{ kicker }}</span>
      }
    </span>
    <app-lang-switch />
  </div>

  <router-outlet />

  <!-- Le pied de l'app : une encre PLUS PROFONDE que la barre, pour fermer la
       page sans la répéter. Il n'apparaît qu'au-delà du pli — sur un téléphone,
       un pied de page est du contenu qu'on fait défiler pour rien. -->
  <div footer class="foot">
    <span class="foot-brand">La Folie Coffee</span>
    <span class="foot-place">Le Labo · Route de la Balme, Val d'Isère</span>
    <span class="foot-hours">Ouvert de 7 h à 19 h</span>
  </div>
</fold-app-shell>
