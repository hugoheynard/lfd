<!-- `scroll="stage"` : le shell ne défile PAS. La zone de contenu est un cadre
     fixe, et c'est l'écran qui ouvre sa propre boîte de défilement là où il le
     veut — ici dans la feuille crème, pour que sa forme ne bouge jamais. -->
<fold-app-shell mobileNav="none" scroll="stage">
  <div header class="bar">
    @if (chrome.back()) {
      <button class="back" type="button" aria-label="Retour" (click)="goBack()">
        <fold-icon name="chevron-left" />
      </button>
    }
    <span class="mark" aria-hidden="true">LFC</span>
    <span class="brand">
      <span class="brand-name">La Folie Coffee</span>
      @if (chrome.kicker(); as kicker) {
        <span class="brand-kicker">{{ kicker }}</span>
      }
    </span>
    <app-lang-switch />
  </div>

  <router-outlet />
</fold-app-shell>
