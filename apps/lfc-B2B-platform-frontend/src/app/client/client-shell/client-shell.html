<!-- Le shell garde son défilement, même si l'écran ouvre le sien : c'est le
     FILET. Si jamais la hauteur d'un écran ne se borne pas, la page défile
     comme avant — dégradée, pas coupée. Avec `stage`, la même erreur clipperait
     le contenu en silence. -->
<fold-app-shell mobileNav="none" scroll="scroll">
  <div header class="bar">
    @if (chrome.back()) {
      <button class="back" type="button" aria-label="Retour" (click)="goBack()">
        <fold-icon name="chevron-left" />
      </button>
    }
    <span class="mark" aria-hidden="true">LFC</span>
    <span class="brand">
      <span class="brand-name">La Folie Coffee</span>
      @if (chrome.kicker(); as kicker) {
        <span class="brand-kicker">{{ kicker }}</span>
      }
    </span>
    <app-lang-switch />
  </div>

  <router-outlet />
</fold-app-shell>
