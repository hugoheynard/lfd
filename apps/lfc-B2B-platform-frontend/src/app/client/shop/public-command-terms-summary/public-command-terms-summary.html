<!-- Sans choix, RIEN : visiter le rayon sans avoir dit où l'on est servi est ce
     que la boutique promet, et une carte vide en ferait un manque. -->
@if (choice(); as service) {
  <div class="terms">
    <span class="said">
      <span class="label">{{ c().title }}</span>
      <span class="value">
        <span class="place">{{ service.place }}</span>
        <span class="sep" aria-hidden="true">·</span>
        <span class="when">{{ when() }}</span>

        <!-- La remise du point, quand il y en a une VRAIE. Relue du point et
             non portée par le choix : elle dépend de la clientèle. -->
        @if (offer(); as label) {
          <span class="offer">{{ label }}</span>
        }
      </span>
    </span>

    <!-- À l'opposé : deux gestes distincts. Changer d'heure ne fait pas
         re-choisir la maison. -->
    <span class="acts">
      <button class="act" type="button" (click)="houseRequested.emit()">
        {{ c().changeHouse }}
      </button>
      <button class="act is-primary" type="button" (click)="timeRequested.emit()">
        {{ c().changeTime }}
      </button>
    </span>
  </div>
}
