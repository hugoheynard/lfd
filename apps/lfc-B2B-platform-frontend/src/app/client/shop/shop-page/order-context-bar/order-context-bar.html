@if (service(); as choice) {
  <button class="bar" type="button" (click)="changeRequested.emit()">
    <span class="badge">{{
      choice.mode === 'pickup' ? t().cart.pickupGroup : t().cart.deliveryGroup
    }}</span>
    <span class="where">{{ choice.place }} · {{ choice.slot }}</span>
    <span class="change">{{ t().shop.changeService }}</span>
  </button>
} @else {
  <!-- Visiter d'abord, choisir ensuite : la barre demande le mode au lieu de le
       rappeler, et rien n'est bloqué avant le règlement. -->
  <button class="bar ask" type="button" (click)="changeRequested.emit()">
    <span class="where">
      <span class="ask-title">{{ t().shop.pickService }}</span>
      <span class="ask-hint">{{ t().shop.pickServiceHint }}</span>
    </span>
    <span class="change">{{ t().shop.changeService }}</span>
  </button>
}
