<!-- LE BANDEAU — la boutique a le même en-tête que les autres écrans. Le titre
     du rayon y monte : il l'écrivait une seconde fois sous la recherche, dans un
     registre plus faible que celui de la page qu'il nomme. -->
<ng-template clientBanner>
  <app-client-banner-block [kicker]="chrome.kicker()" [title]="shop.heading()">
    <app-cart-banner-card
      banner-action
      (opened)="cartOpen.set(true)"
      (serviceRequested)="backToService()"
      (paid)="pay()"
    />
  </app-client-banner-block>
</ng-template>

<div class="shop">
  <fold-search
    class="search"
    [(value)]="shop.query"
    [placeholder]="t().shop.searchPlaceholder"
    [ariaLabel]="t().shop.searchPlaceholder"
    [clearLabel]="t().shop.clearSearch"
    [resultCount]="shop.products().length"
    [resultLabel]="t().shop.piecesUnit"
  />

  <app-shelf-nav class="shelves" [active]="shop.activeShelf()" (picked)="shop.browse($event)" />

  <app-shelf-banner class="banner" [shelf]="shop.shelf()" (opened)="openStory.set(shop.shelf())" />

  @switch (status()) {
    @case ('failed') {
      <!-- L'échec est un ÉTAT, pas un écran vide : on dit ce qui s'est passé et
           on offre le seul geste utile. -->
      <fold-empty-state
        class="grid"
        tone="alert"
        [title]="t().shop.loadFailedTitle"
        [subtitle]="t().shop.loadFailedHint"
      >
        <button foldButton type="button" (click)="retry()">{{ t().shop.loadRetry }}</button>
      </fold-empty-state>
    }
    @case ('ready') {
      <app-shelf-grid class="grid" [products]="shop.products()" (opened)="openPiece.set($event)" />
    }
    @default {
      <fold-loading class="grid" [message]="t().shop.loading" />
    }
  }
</div>

<!-- La barre du bas suit le rayon à TOUTES les largeurs : le bandeau, lui,
     défile avec la page, et le compte disparaîtrait au premier écran parcouru.
     Elle ouvre le tiroir plutôt que de changer d'écran — on n'a pas fini de
     choisir quand on vérifie ce qu'on a pris. -->
@if (!cart.isEmpty()) {
  <app-cart-bar
    class="cartbar"
    [label]="cartLabel()"
    [where]="whereLabel()"
    [total]="totalLabel()"
    (opened)="cartOpen.set(true)"
  />
}

<app-cart-panel [open]="cartOpen()" (closed)="cartOpen.set(false)" (paid)="pay()" />

<app-product-sheet
  [product]="piece()"
  [quantity]="pieceQuantity()"
  (closed)="openPiece.set(null)"
  (added)="cart.add(openPiece() ?? '')"
  (removed)="cart.remove(openPiece() ?? '')"
/>

<app-shelf-sheet [shelf]="openStory()" (closed)="openStory.set(null)" />
