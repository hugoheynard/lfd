<app-order-context-bar (changeRequested)="backToService()" />

<div class="shop">
  <fold-search
    class="search"
    [(value)]="shop.query"
    [placeholder]="t().shop.searchPlaceholder"
    [ariaLabel]="t().shop.searchPlaceholder"
    [clearLabel]="t().shop.clearSearch"
    [resultCount]="shop.products().length"
    [resultLabel]="t().shop.piecesUnit"
  />

  <app-shelf-nav class="shelves" [active]="shop.activeShelf()" (picked)="shop.browse($event)" />

  <fold-element-title class="head" variant="caps" [level]="1" [title]="shop.heading()" />

  <app-shelf-banner class="banner" [shelf]="shop.shelf()" (opened)="openStory.set(shop.shelf())" />

  @switch (status()) {
    @case ('failed') {
      <!-- L'échec est un ÉTAT, pas un écran vide : on dit ce qui s'est passé et
           on offre le seul geste utile. -->
      <fold-empty-state
        class="grid"
        tone="alert"
        [title]="t().shop.loadFailedTitle"
        [subtitle]="t().shop.loadFailedHint"
      >
        <button foldButton type="button" (click)="retry()">{{ t().shop.loadRetry }}</button>
      </fold-empty-state>
    }
    @case ('ready') {
      <app-shelf-grid class="grid" [products]="shop.products()" (opened)="openPiece.set($event)" />
    }
    @default {
      <fold-loading class="grid" [message]="t().shop.loading" />
    }
  }

  <!-- LE PANIER PERMANENT, au-delà du pli seulement. En pile, c'est la barre du
       bas qui en tient lieu : 320 px de colonne sur 390 px d'écran, il ne
       resterait rien pour le rayon. -->
  <aside class="basket wide-only">
    <div class="basket-head">
      <h2>{{ t().shop.cartTitle }}</h2>
      <span>{{ cartLabel() }}</span>
    </div>
    <app-cart-summary />
    <button class="pay" type="button" [disabled]="cart.isEmpty()" (click)="pay()">
      {{ needsService() ? t().shop.pickService : payLabel() }}
    </button>
    <p class="pay-hint">{{ t().cart.payHint }}</p>
  </aside>
</div>

@if (!cart.isEmpty()) {
  <app-cart-bar
    class="cartbar narrow-only"
    [label]="cartLabel()"
    [where]="whereLabel()"
    [total]="totalLabel()"
    (opened)="goToCart()"
  />
}

<app-product-sheet
  [product]="piece()"
  [quantity]="pieceQuantity()"
  (closed)="openPiece.set(null)"
  (added)="cart.add(openPiece() ?? '')"
  (removed)="cart.remove(openPiece() ?? '')"
/>

<app-shelf-sheet [shelf]="openStory()" (closed)="openStory.set(null)" />
