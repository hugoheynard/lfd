@if (product(); as piece) {
  <app-client-dialog
    placement="sheet"
    [open]="true"
    [kicker]="shelf()"
    [title]="piece.name"
    (closed)="closed.emit()"
  >
    <span dialog-media class="photo">
      @if (art(); as visual) {
        <img [src]="visual.url" [attr.alt]="visual.alt" />
      }
      @if (piece.isFeatured) {
        <span class="signature">{{ t().product.signature }}</span>
      }
    </span>

    <div class="sheet">
      <p class="note">{{ piece.note }}</p>

      <dl class="facts">
        @for (fact of facts(); track fact.key) {
          <div class="fact">
            <dt>{{ fact.key }}</dt>
            <dd>{{ fact.value }}</dd>
          </div>
        }
      </dl>
    </div>

    <div dialog-foot class="foot">
      <app-quantity-rail
        size="lg"
        [quantity]="quantity()"
        [addLabel]="addLabel()"
        [removeLabel]="removeLabel()"
        (added)="added.emit()"
        (removed)="removed.emit()"
      />

      <button class="cta" type="button" (click)="added.emit()">{{ cta() }}</button>
    </div>
  </app-client-dialog>
}
