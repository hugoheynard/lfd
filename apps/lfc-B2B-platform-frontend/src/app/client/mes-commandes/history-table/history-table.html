<fold-data-table
  narrowLayout="cards"
  [columns]="columns()"
  [rows]="orders()"
  [rowKey]="key"
  [labels]="labels()"
>
  <ng-template foldCell="reference" let-order>
    <span class="ref">
      <span class="ref-num">{{ order.reference }}</span>
      <!-- La pastille d'origine ne dit que l'EXCEPTION : une commande passée
           dans l'app n'a rien à annoncer, et l'écrire partout ferait
           disparaître les deux qui comptent. -->
      @if (order.origin !== '') {
        <span class="origin">{{ order.origin }}</span>
      }
    </span>
  </ng-template>

  <!-- La cellule d'IDENTITÉ du système : la maison au-dessus, la personne
       dessous, et la pastille carrée qui ancre l'enseigne. Un compte
       multi-espaces doit dire pour quelle maison on a commandé, et une
       initiale se retrouve dans une colonne plus vite qu'un nom. -->
  <ng-template foldCell="by" let-order>
    <fold-avatar-detail size="sm" square [primary]="order.org" [secondary]="order.who" />
  </ng-template>

  <ng-template foldCell="mode" let-order>
    <span class="stack">
      <span class="mode-label">{{ order.mode }}</span>
      <span class="mode-pieces">{{ pieces(order) }}</span>
    </span>
  </ng-template>

  <ng-template foldCell="date" let-order>
    <span class="date">{{ order.date }}</span>
  </ng-template>

  <ng-template foldCell="status" let-order>
    <span class="tag" [attr.data-status]="order.status">{{ statusLabel(order.status) }}</span>
  </ng-template>

  <ng-template foldCell="payment" let-order>
    <span class="tag" [attr.data-payment]="order.payment">{{ paymentLabel(order.payment) }}</span>
  </ng-template>

  <!-- LE TIROIR. Il ouvre DANS la liste : un écran de détail à ouvrir puis à
       quitter ferait perdre la place qu'on vient de trouver. Son contenu est un
       composant à lui — le gabarit d'une cellule tient sur une ligne, celui du
       tiroir tenait sur soixante. -->
  <ng-template foldRowDetail let-order>
    <app-order-detail
      [order]="order"
      [rate]="rating(order.reference)"
      (rated)="rate(order.reference, $event)"
      (problemRaised)="problemRaised.emit(order)"
    />
  </ng-template>
</fold-data-table>
