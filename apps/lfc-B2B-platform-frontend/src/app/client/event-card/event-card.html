<button class="card" type="button" (click)="opened.emit()">
  <span class="photo">
    <span class="veil" aria-hidden="true"></span>
    <span class="badge">{{ t().event.badge }}</span>
    <span class="over-title">{{ t().event.title }}</span>
  </span>
  <span class="body">
    <span class="in-title">{{ t().event.title }}</span>
    <span class="pitch">{{ t().event.pitch }}</span>
    <span class="cta">{{ t().event.cta }}</span>
  </span>
</button>
