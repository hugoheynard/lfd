<h2 class="title">{{ t().account.sections.users }}</h2>
<app-completion-callout [items]="completion()" (act)="completionAction.emit($event)" />
<app-users-list [people]="false" />
<div class="feet">
  <app-card-foot [label]="t().account.details" (pressed)="openList()" />
  @if (canAdd()) {
    <app-card-foot [label]="t().account.usersAddShort" (pressed)="openAdd()" />
  }
</div>
