<fold-panel-header
  [title]="t().account.mandateSend"
  [subtitle]="reference() ?? ''"
  [closeLabel]="t().dialog.close"
/>

<fold-panel-body>
  @if (refusal(); as message) {
    <fold-callout variant="alert" announce>
      {{ t().account.mandateUploadFailed }} {{ message }}
    </fold-callout>
  }

  <fold-callout appearance="inset" variant="info">{{ body() }}</fold-callout>

  @if (detail(); as precision) {
    <p class="meta">{{ precision }}</p>
  }

  <fold-file-dropzone
    [accept]="accept"
    [multiple]="false"
    [label]="dropLabel()"
    [hint]="t().account.mandateDropHint"
    [busy]="uploading()"
    [busyLabel]="t().account.mandateUploading"
    (filesPicked)="upload($event)"
  />

  <!-- Aucun prestataire n'est branché : visible, désactivé, et dit pourquoi
       (plan §5.1). L'autre façon de renvoyer le mandat signé, donc ici. -->
  @if (stage() === 'awaiting') {
    <div class="esign">
      <button
        foldButton
        class="esign-button"
        emphasis="outline"
        intent="neutral"
        type="button"
        [disabled]="true"
      >
        {{ t().account.mandateEsign }}
      </button>
      <fold-badge variant="neutral" [content]="t().account.mandateEsignSoon" />
    </div>
  }
</fold-panel-body>
