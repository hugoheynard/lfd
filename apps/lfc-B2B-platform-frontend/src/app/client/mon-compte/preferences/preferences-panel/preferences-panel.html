<fold-panel-header [title]="t().account.sections.preferences" [closeLabel]="t().dialog.close" />

<fold-panel-body>
  <dl class="facts">
    <div class="fact">
      <dt>{{ t().account.prefPickup }}</dt>
      <dd>{{ preferences.habit() }}</dd>
    </div>
    <div class="fact">
      <dt>{{ t().account.prefLang }}</dt>
      <dd>{{ preferences.language() }}</dd>
    </div>
  </dl>
  <p class="note">{{ t().account.prefNote }}</p>
</fold-panel-body>
