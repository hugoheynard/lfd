<fold-panel-header
  [title]="t().account.sections.bank"
  [subtitle]="saved()"
  [closeLabel]="t().dialog.close"
/>

<fold-panel-body>
  @if (refusal(); as message) {
    <fold-callout variant="alert" announce>
      {{ t().account.bankSaveFailed }} {{ message }}
    </fold-callout>
  }

  <!-- Ce que la banque connaît, et ce qu'un changement de compte coûte au
       prélèvement : dit AVANT les champs, pas découvert après. -->
  <fold-callout appearance="inset" variant="info">{{ t().account.bankNotice }}</fold-callout>

  <!-- Le formulaire partagé avec la fiche staff. 🔴 L'IBAN y entre vide : il ne
       revient d'aucune route. -->
  <div class="rows">
    <lfd-bank-account-form
      [(value)]="draft"
      [labels]="t().account.bankForm"
      [holderLegalFormRequired]="holderLegalFormRequired()"
    />
  </div>
</fold-panel-body>

<fold-panel-footer>
  <button foldButton emphasis="outline" intent="neutral" type="button" (click)="cancel()">
    {{ t().account.cancel }}
  </button>
  <button
    foldButton
    intent="primary"
    type="button"
    [loading]="saving()"
    [disabled]="!canSave()"
    (click)="save()"
  >
    {{ submitLabel() }}
  </button>
</fold-panel-footer>
