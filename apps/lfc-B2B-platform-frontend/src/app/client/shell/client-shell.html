<!-- Le shell garde son défilement, même si l'écran ouvre le sien : c'est le
     FILET. Si jamais la hauteur d'un écran ne se borne pas, la page défile
     comme avant — dégradée, pas coupée. Avec `stage`, la même erreur clipperait
     le contenu en silence. -->
<fold-app-shell mobileNav="none" scroll="scroll" footerBehavior="scroll">
  <div header class="bar">
    <!-- Un seul occupant à gauche, et l'ordre dit la priorité : d'où l'on
         revient prime sur ce qu'on peut ouvrir, qui prime sur la marque. -->
    @if (chrome.back()) {
      <button class="back" type="button" [attr.aria-label]="t().chrome.back" (click)="goBack()">
        <fold-icon name="chevron-left" />
      </button>
    } @else {
      <!-- Le menu est une affordance de POCHE : au-delà du pli, la barre a la
           place de nommer ses destinations, et c'est la marque qui reprend le
           coin. Les deux vivent dans le DOM, le CSS choisit — le pli est une
           affaire de largeur, que le rendu serveur ne connaît pas. -->
      @if (chrome.menu()) {
        <button
          class="menu narrow-only"
          type="button"
          [attr.aria-label]="t().chrome.menu"
          (click)="openMenu()"
        >
          <!-- Trois traits dessinés, et pas le glyphe générique : le troisième
               est plus court et CHAUD. C'est ce qui distingue ce menu-ci d'une
               icône de menu, et il le dit sans pastille ni compteur. -->
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
      }
      <span class="mark" [class.wide-only]="!!chrome.menu()" aria-hidden="true">
        <img src="brand/lfc-mark.png" alt="" />
      </span>
    }
    <span class="brand">
      <span class="brand-name">La Folie Coffee</span>
      @if (chrome.kicker(); as kicker) {
        <span class="brand-kicker">{{ kicker }}</span>
      }
    </span>
    <!-- La barre d'un client reconnu porte déjà le menu et le panier : le
         sélecteur s'y réduit à un globe, faute de place pour trois segments.
         ⚠️ La condition est le CLIENT RECONNU, pas la cloche. Elle l'a été, du
         temps où la cloche était le seul autre occupant — et le jour où un
         écran a cessé d'en poser une, les trois segments sont revenus manger la
         place du panier. Un proxy finit toujours par se désaccorder de ce qu'il
         représentait. -->
    <app-lang-switch [compact]="chrome.menu()" />

    @if (chrome.bell()) {
      <button class="bell" type="button" [attr.aria-label]="bellLabel()" (click)="openBell()">
        <fold-icon name="bell" />
        @if (chrome.bellCount(); as count) {
          <span class="badge" aria-hidden="true">{{ count }}</span>
        }
      </button>
    }

    <!-- Le panier vit ICI et plus dans le menu : une quantité qui change en
         permanence appartient au chrome permanent, pas à une liste qu'on
         parcourt. Il ne paraît qu'à un client reconnu — la même condition que
         le menu, parce que c'est la même chose : avoir des affaires ici. -->
    @if (chrome.menu()) {
      <app-client-cart-pill />

      <!-- L'identité ferme la rangée. Pas de sélecteur d'espace : il n'existe
           qu'à partir de deux espaces, et le compte n'en a qu'un — la réf
           interdit d'ouvrir un déroulant qui ne mène nulle part. -->
      <span class="who wide-only">
        @if (identity.firstName(); as name) {
          <span class="who-name">{{ name }}</span>
        }
        <span class="who-chip" aria-hidden="true">{{ initials() }}</span>
      </span>
    }
  </div>

  <!-- LA DESCENTE : le bandeau de l'écran, puis la sous-barre. Elle n'existe
       que pour un client reconnu — un visiteur n'a pas de destinations à
       parcourir — et la bande du shell se replie quand rien n'y est projeté. -->
  @if (chrome.menu()) {
    <app-client-band subheader />
  }

  <router-outlet />

  <!-- Le menu de poche : toujours dans l'arbre, ouvert par la barre. Il se
       ferme tout seul au-delà du pli, où la sous-barre le remplace. -->
  <app-client-menu [open]="menuOpen()" (closed)="menuOpen.set(false)" />

  <!-- Le pied de l'app. Il n'apparaît qu'au-delà du pli — sur un téléphone, un
       pied de page est du contenu qu'on fait défiler pour rien — et il se peint
       lui-même : la rangée du shell se replie quand il ne prend pas de place. -->
  <app-client-foot footer />
</fold-app-shell>
