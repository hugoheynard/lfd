<app-client-page
  layout="stacked"
  [heading]="heading()"
  [intro]="intro()"
  [introWide]="t().commande.newOrderSub"
  [kicker]="t().commande.newOrderTitle"
  [big]="!panelOpen()"
>
  <div aside-foot class="aside-foot"></div>

  @if (panelOpen()) {
    <app-rappel-panel [phone]="phone() ?? ''" (booked)="book($event)" />
  } @else {
    <div class="stack">
      <app-offer-carousel [labels]="sections()" [dotsLabel]="t().commande.sectionsLabel">
        <app-section-panel
          tone="well"
          sign="+"
          [title]="t().commande.newOrderTitle"
          [sub]="t().commande.newOrderSub"
        >
          <app-offer-card
            shape="hero"
            tone="ink"
            photo="labo"
            [badge]="t().commande.pickupBadge"
            [title]="t().commande.pickupTitle"
            [detail]="t().commande.pickupDetail"
            [note]="t().commande.pickupNote"
            [detailWide]="t().commande.pickupDetailWide"
            [ctaLabel]="t().commande.pickupCta"
            [noteWide]="t().commande.pickupNoteWide"
            (chosen)="openDialog('pickup')"
          />
          <app-offer-card
            shape="hero"
            tone="butter"
            photo="coursier"
            noteTone="accent"
            [badge]="t().commande.deliveryBadge"
            [title]="t().commande.deliveryTitle"
            [detail]="t().commande.deliveryDetail"
            [note]="t().commande.deliveryNote"
            [detailWide]="t().commande.deliveryDetailWide"
            [ctaLabel]="t().commande.deliveryCta"
            [noteWide]="t().commande.deliveryNoteWide"
            (chosen)="openDialog('address')"
          />
        </app-section-panel>

        <app-section-panel tone="band" sign="★" [title]="t().commande.nowTitle">
          <app-offer-card
            shape="row"
            tone="vivid"
            photo="noel"
            [badge]="t().commande.eventBadge"
            [title]="t().commande.eventTitle"
            [detail]="t().commande.eventDetail"
            [note]="t().commande.eventNote"
            (chosen)="notYet()"
          />
          <app-offer-card
            shape="row"
            tone="butter"
            photo="coursier"
            [badge]="t().commande.cateringBadge"
            [title]="t().commande.cateringTitle"
            [detail]="t().commande.cateringDetail"
            [note]="t().commande.cateringNote"
            (chosen)="notYet()"
          />
        </app-section-panel>
      </app-offer-carousel>

      <div class="resume">
        <app-shortcut-row
          class="again"
          tone="draft"
          shape="bar"
          icon="reload"
          [lead]="t().commande.againLead"
          [title]="t().commande.againTitle"
          [sub]="t().commande.againSub"
          [action]="t().commande.againAction"
          (opened)="notYet()"
        />

        <app-shortcut-row
          class="browse"
          tone="warm"
          shape="bar"
          icon="search"
          [title]="t().commande.browseTitle"
          [sub]="t().commande.browseSub"
          (opened)="browse()"
        />
      </div>

      @if (pending()) {
        <fold-callout variant="info">{{ t().commande.pending }}</fold-callout>
      }

      <app-callback-block
        [title]="t().commande.urgenceTitle"
        [pitch]="t().commande.urgencePitch"
        [cta]="t().commande.urgenceCta"
        [phone]="phone() ?? ''"
        [bookedSlot]="bookedSlot()"
        [showPhone]="true"
        (wantsCallback)="openPanel()"
        (cancelled)="bookedSlot.set(null)"
      />
    </div>

    <app-pickup-dialog
      [open]="dialog() === 'pickup'"
      (closed)="dialog.set(null)"
      (done)="fillBasket($event)"
    />

    <app-address-dialog
      [open]="dialog() === 'address'"
      (closed)="dialog.set(null)"
      (done)="fillBasket($event)"
    />
  }
</app-client-page>
