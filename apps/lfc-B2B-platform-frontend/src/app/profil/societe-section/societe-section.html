<fold-page-section
  title="Établissement"
  icon="company"
  description="L'identité légale de votre société."
>
  @if (!editing()) {
    <button
      sectionActions
      foldButton
      emphasis="outline"
      size="sm"
      icon="edit"
      (click)="startEdit()"
    >
      Modifier
    </button>
  }

  <fold-card>
    @if (!editing()) {
      @let e = etablissement();
      <fold-field-list>
        <fold-field label="Raison sociale">{{ e.raisonSociale }}</fold-field>
        <fold-field label="Enseigne" [empty]="!e.enseigne">{{ e.enseigne }}</fold-field>
        <fold-field label="Forme juridique" [empty]="!e.formeJuridique">{{
          e.formeJuridique
        }}</fold-field>
        <fold-field label="SIRET">{{ e.siret }}</fold-field>
        <fold-field label="N° TVA intracom" [empty]="!e.tvaIntracom">{{
          e.tvaIntracom
        }}</fold-field>
      </fold-field-list>
    } @else {
      <form class="edit" (submit)="$event.preventDefault(); save()">
        <fold-input
          label="Raison sociale"
          required
          [value]="raisonSociale()"
          (valueChange)="raisonSociale.set($event)"
        />
        <fold-input
          label="Enseigne"
          hint="nom commercial, si différent"
          optional
          [value]="enseigne()"
          (valueChange)="enseigne.set($event)"
        />
        <fold-input
          label="Forme juridique"
          placeholder="ex. SAS, SARL, EI…"
          [value]="formeJuridique()"
          (valueChange)="formeJuridique.set($event)"
        />
        <fold-input
          label="SIRET"
          placeholder="14 chiffres"
          required
          [value]="siret()"
          (valueChange)="siret.set($event)"
        />
        <fold-input
          label="N° de TVA intracommunautaire"
          placeholder="ex. FR32 812456789"
          optional
          [value]="tvaIntracom()"
          (valueChange)="tvaIntracom.set($event)"
        />

        <div class="edit-actions">
          <button foldButton type="button" emphasis="outline" intent="neutral" (click)="cancel()">
            Annuler
          </button>
          <button foldButton type="submit" intent="primary" [disabled]="!canSave()">
            Enregistrer
          </button>
        </div>
      </form>
    }
  </fold-card>
</fold-page-section>
