<fold-page-layout>
  <fold-page-section bleed>
    <fold-banner-carousel
      [banners]="banners"
      [leadId]="leadBannerId"
      [intervalMs]="5000"
      controls="both"
      ariaLabel="Mises en avant boutique"
    />
  </fold-page-section>

  <fold-page-section bleed>
    <app-discover-bands />
  </fold-page-section>

  <fold-page-section
    title="À la une"
    icon="star"
    description="Notre sélection du moment pour les professionnels."
  >
    <app-featured-rail [items]="featured" (add)="onAdd($event)" (notify)="onNotify($event)" />
  </fold-page-section>

  <fold-page-section
    id="catalogue"
    title="Le catalogue"
    icon="grid"
    description="Filtrez par catégorie, cherchez, ajoutez à vos favoris."
    stack
  >
    <fold-view-toggle
      sectionActions
      size="sm"
      ariaLabel="Affichage du catalogue"
      [options]="catalogueViewOptions"
      [value]="cat.view()"
      (valueChange)="cat.setView($event)"
    />
    <app-product-catalogue
      #cat
      [products]="products"
      [categories]="categories"
      (add)="onAdd($event)"
      (notify)="onNotify($event)"
    />
  </fold-page-section>
</fold-page-layout>
