<fold-page-layout icon="settings" title="Réglages">
  <p description>Votre profil et les réglages de votre espace B2B La Folie Coffee.</p>

  <app-profil-section />

  <fold-page-section
    title="Session"
    icon="logout"
    description="Fermer votre session sur cet appareil."
  >
    <fold-card class="stack">
      <p class="muted">La déconnexion est aussi accessible en bas du menu, à tout moment.</p>
      <div class="actions">
        <button foldButton emphasis="outline" intent="danger" icon="logout" (click)="logout()">
          Se déconnecter
        </button>
      </div>
    </fold-card>
  </fold-page-section>
</fold-page-layout>
