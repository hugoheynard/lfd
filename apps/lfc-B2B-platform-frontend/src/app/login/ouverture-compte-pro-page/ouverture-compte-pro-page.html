<app-client-page [heading]="copy().door.heading" [intro]="copy().door.intro">
  <div class="door">
    <div class="head">
      <p class="eyebrow">{{ copy().door.eyebrow }}</p>
      <p class="already">
        {{ copy().door.alreadyLead }}
        <button
          foldButton
          class="sign-in"
          emphasis="soft"
          intent="neutral"
          size="sm"
          type="button"
          (click)="signIn()"
        >
          {{ copy().door.alreadyLink }}
        </button>
      </p>
    </div>

    <!-- La promesse, sous le titre et avant le formulaire (plan §3.1). -->
    @if (shopLevel(); as level) {
      <app-shop-promise [level]="level" />
    }

    <fold-card>
      <form class="form" (submit)="$event.preventDefault(); submit()">
        <p class="pitch">{{ copy().door.pitch }}</p>

        <div class="fields">
          <fold-input
            size="lg"
            [label]="copy().fields.firstName"
            autocomplete="given-name"
            [(value)]="firstName"
          />
          <fold-input
            size="lg"
            [label]="copy().fields.lastName"
            autocomplete="family-name"
            [(value)]="lastName"
          />
          <fold-input
            class="wide"
            size="lg"
            type="email"
            [label]="copy().fields.email"
            autocomplete="email"
            [placeholder]="copy().fields.emailPlaceholder"
            [(value)]="email"
          />
          <fold-input
            size="lg"
            type="tel"
            [label]="copy().fields.phone"
            autocomplete="tel"
            [placeholder]="copy().fields.phonePlaceholder"
            [hint]="copy().fields.phoneHint"
            [(value)]="phone"
          />
          <fold-input
            size="lg"
            [label]="copy().fields.enseigne"
            autocomplete="organization"
            [placeholder]="copy().fields.enseignePlaceholder"
            [(value)]="enseigne"
          />
        </div>

        <button
          foldButton
          class="cta"
          emphasis="solid"
          intent="primary"
          size="lg"
          type="submit"
          [disabled]="!complete()"
        >
          {{ copy().door.submit }}
        </button>
      </form>
    </fold-card>

    <p class="fine">{{ copy().door.fine }}</p>
  </div>
</app-client-page>
