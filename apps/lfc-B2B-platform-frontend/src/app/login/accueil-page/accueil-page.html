<!-- Le corps défile sur le bleu : l'accroche d'abord, puis la feuille crème qui
     monte sur le chrome — d'où son rayon haut. -->
<div class="scroll">
  <div class="hero" foldSurface="chrome">
    <h1 class="hero-title" [class.big]="bigHeading()">{{ heading() }}</h1>
    <p class="hero-intro">{{ intro() }}</p>
  </div>

  <div class="sheet">
    @if (panelOpen()) {
      <app-rappel-panel [phone]="phone" (booked)="book($event)" />
    } @else {
      @switch (step()) {
        @case ('welcome') {
          <app-welcome-step
            [phone]="phone"
            [bookedSlot]="bookedSlot()"
            (signedUp)="goTo('entered')"
            (wantsLogin)="goTo('login')"
            (wantsCallback)="openPanel()"
            (cancelledCallback)="bookedSlot.set(null)"
          />
        }
        @case ('login') {
          <app-login-step
            (entered)="goTo('entered')"
            (wantsSignup)="goTo('welcome')"
            (sentChange)="linkSent.set($event)"
          />
        }
        @case ('entered') {
          <app-entered-step />
        }
      }
    }
  </div>
</div>
