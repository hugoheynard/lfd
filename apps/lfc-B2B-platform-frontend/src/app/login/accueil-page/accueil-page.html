<app-client-page [heading]="heading()" [intro]="intro()" [big]="bigHeading()">
  <div aside-foot class="aside-foot">
    @if (showProof()) {
      <ul class="proof">
        @for (point of t().aside.proof; track point) {
          <li class="proof-item">
            <span class="proof-tick" aria-hidden="true">✓</span>
            <span>{{ point }}</span>
          </li>
        }
      </ul>
      <p class="address">{{ t().aside.address }}</p>
    }
  </div>

  @if (panelOpen()) {
    <app-rappel-panel [phone]="phone" (booked)="book($event)" />
  } @else {
    @switch (step()) {
      @case ('welcome') {
        <app-welcome-step
          [phone]="phone"
          [bookedSlot]="bookedSlot()"
          (signedUp)="goTo('entered')"
          (wantsLogin)="goTo('login')"
          (wantsCallback)="openPanel()"
          [quotePending]="quotePending()"
          (wantsQuote)="openQuote()"
          (cancelledCallback)="bookedSlot.set(null)"
        />
      }
      @case ('login') {
        <app-login-step
          (entered)="goTo('entered')"
          (wantsSignup)="goTo('welcome')"
          (sentChange)="linkSent.set($event)"
        />
      }
      @case ('entered') {
        <app-entered-step />
      }
    }
  }
</app-client-page>
