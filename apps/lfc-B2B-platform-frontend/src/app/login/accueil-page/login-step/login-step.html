@if (sent()) {
  <fold-card class="panel">
    <div class="sent">
      <span class="sent-icon" aria-hidden="true"><fold-icon name="mail" size="lg" /></span>
      <h2 class="sent-title">{{ t().login.sentTitle }}</h2>
      <p class="sent-body">{{ sentLine() }}</p>
      <button
        foldButton
        class="cta accent"
        emphasis="solid"
        intent="primary"
        size="lg"
        block
        type="button"
        (click)="entered.emit()"
      >
        {{ t().login.simulate }}
      </button>
    </div>
  </fold-card>

  @if (resent()) {
    <fold-callout variant="success" announce>{{ t().login.resent }}</fold-callout>
  }

  <div class="quiet-actions">
    <button class="quiet" type="button" (click)="resend()">{{ t().login.resend }}</button>
    <span class="dot" aria-hidden="true">·</span>
    <button class="quiet muted" type="button" (click)="editEmail()">
      {{ t().login.editEmail }}
    </button>
  </div>
} @else {
  <fold-card class="panel">
    <form class="form" (submit)="$event.preventDefault(); send()">
      <fold-input
        size="lg"
        type="email"
        [label]="t().login.email"
        autocomplete="email"
        [placeholder]="t().login.emailPlaceholder"
        [autofocus]="true"
        [(value)]="email"
      />
      <button
        foldButton
        class="cta"
        emphasis="solid"
        intent="primary"
        size="lg"
        block
        type="submit"
        [disabled]="!looksValid()"
      >
        {{ t().login.send }}
      </button>
    </form>
  </fold-card>

  <p class="fine">{{ t().login.fine }}</p>
}

<app-rule-ou />

<app-door-card
  icon="edit"
  [title]="t().doors.firstTitle"
  [sub]="t().doors.firstSub"
  (opened)="wantsSignup.emit()"
/>
