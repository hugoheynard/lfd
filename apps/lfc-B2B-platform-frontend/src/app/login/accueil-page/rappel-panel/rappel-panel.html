<section class="group">
  <p class="eyebrow">{{ t().rappel.asapGroup }}</p>
  <button
    class="asap"
    type="button"
    role="radio"
    [attr.aria-checked]="picked() === asap"
    [class.on]="picked() === asap"
    (click)="picked.set(asap)"
  >
    <span class="ring" aria-hidden="true"><span class="core"></span></span>
    <span class="asap-text">
      <span class="asap-title">{{ t().rappel.asapTitle }}</span>
      <span class="asap-sub">{{ t().rappel.asapSub }}</span>
    </span>
  </button>
</section>

<section class="group">
  <p class="eyebrow" id="rappel-today">{{ t().rappel.todayGroup }}</p>
  <div class="grid" role="radiogroup" aria-labelledby="rappel-today">
    @for (slot of slots(); track slot.id) {
      <button
        class="slot"
        type="button"
        role="radio"
        [class.on]="picked() === slot.id"
        [class.closed]="slot.closed"
        [disabled]="slot.closed"
        [attr.aria-checked]="picked() === slot.id"
        (click)="pick(slot)"
      >
        <span class="slot-label">{{ slot.label }}</span>
        <span class="slot-sub">{{ slot.sub }}</span>
      </button>
    }
  </div>
</section>

<p class="note">
  <span class="note-dot" aria-hidden="true"></span>
  <span> Entre 12 h et 14 h on est au four : on ne prend pas d'appel, et on préfère le dire. </span>
</p>

<p class="phone">
  On vous rappellera au <span class="num">{{ phone() }}</span
  >.
</p>

<button
  foldButton
  class="cta"
  emphasis="solid"
  intent="primary"
  size="lg"
  block
  type="button"
  [disabled]="picked() === null"
  (click)="confirm()"
>
  {{ ctaLabel() }}
</button>
