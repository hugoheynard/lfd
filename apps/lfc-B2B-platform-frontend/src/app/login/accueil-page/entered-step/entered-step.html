<fold-card class="panel">
  <div class="done">
    <span class="tick" aria-hidden="true"><fold-icon name="check" /></span>
    <span class="text">
      <span class="title">{{ t().entered.title }}</span>
      <span class="sub">{{ t().entered.sub }}</span>
    </span>
  </div>
</fold-card>

<fold-callout variant="info">{{ t().entered.next }}</fold-callout>
