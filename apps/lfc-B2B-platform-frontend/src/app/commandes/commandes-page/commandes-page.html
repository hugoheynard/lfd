<fold-page-layout icon="contracts" title="Mes commandes">
  <p description>Vos commandes La Folie Coffee — relevés par période et bons de commande.</p>

  <app-commerce-nav />

  @if (!hasCompany()) {
    <fold-callout appearance="inset" variant="info">
      Créez une entreprise dans « Mes entreprises » pour passer et suivre vos commandes.
    </fold-callout>
  } @else {
    <div class="toolbar">
      <fold-view-toggle
        [options]="viewOptions"
        [value]="view()"
        (valueChange)="setView($event)"
        ariaLabel="Représentation des commandes"
      />
    </div>

    <!-- Navigateur d'année : filtre de pagination naturel (défaut année en cours). -->
    <div class="year-nav">
      <fold-button-icon
        icon="chevron-left"
        size="sm"
        tooltip="Année précédente"
        (clicked)="prevYear()"
      />
      <span class="year">{{ year() }}</span>
      <fold-button-icon
        icon="chevron-right"
        size="sm"
        tooltip="Année suivante"
        [disabled]="year() >= currentYear"
        (clicked)="nextYear()"
      />
    </div>

    @if (view() === 'periods') {
      <app-billing-periods-view
        [periods]="periods()"
        [immediateOrders]="immediateOrders()"
        [regimeChanges]="regimeChanges"
        (downloadOrder)="downloadBon($event)"
        (settlePeriod)="settlePeriod($event)"
      />
    } @else {
      <app-orders-table [year]="year()" />
    }
  }
</fold-page-layout>
