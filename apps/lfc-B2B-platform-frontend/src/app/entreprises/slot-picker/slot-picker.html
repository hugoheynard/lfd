<div class="sp">
  <div class="sp-head">
    <span class="sp-title">Choisissez un créneau</span>
    <span class="sp-count">{{ count() }} {{ count() > 1 ? 'créneaux' : 'créneau' }}</span>
  </div>

  <!-- Le filtre n'apparaît que si les deux demi-journées existent : sinon il ne
       pourrait que vider l'écran. -->
  @if (showFilter()) {
    <fold-choice-row
      class="sp-filter"
      layout="chips"
      ariaLabel="Filtrer par demi-journée"
      [options]="periods"
      [activeKey]="period()"
      (selected)="onPeriod($event)"
    />
  }

  <!-- Un jour ouvert à la fois : sur trois semaines, tout déplier fait défiler
       une page entière pour choisir une heure. Le compte en en-tête permet de
       viser un jour sans avoir à l'ouvrir. -->
  @for (day of days(); track day.day) {
    <fold-disclosure
      class="sp-day"
      [open]="openDay() === day.day"
      (openChange)="setOpen(day.day, $event)"
    >
      <span summary class="sp-day-summary">
        <span class="sp-day-label">{{ day.label }}</span>
        <fold-badge variant="neutral" [content]="availability(day.slots.length)" />
      </span>

      <div class="sp-times">
        @for (slot of day.slots; track slot.startAt) {
          <button
            type="button"
            class="sp-time"
            [class.sp-time--on]="chosen() === slot.startAt"
            [attr.aria-pressed]="chosen() === slot.startAt"
            (click)="chosen.set(slot.startAt)"
          >
            {{ slot.time }}
          </button>
        }
      </div>
    </fold-disclosure>
  } @empty {
    <p class="sp-empty">Aucun créneau sur cette demi-journée. Essayez l'autre.</p>
  }
</div>
