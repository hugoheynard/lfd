<fold-page-section
  title="Identité légale"
  icon="company"
  description="Les informations enregistrées pour cet établissement."
>
  <div sectionActions class="badges">
    <fold-badge [content]="statusLabel()" [variant]="statusVariant()" />
    <fold-badge [content]="roleLabel()" variant="neutral" />
  </div>

  @let c = company();
  <fold-card>
    <fold-field-list>
      <fold-field label="Raison sociale">{{ c.raisonSociale }}</fold-field>
      <fold-field label="Enseigne" [empty]="!c.enseigne">{{ c.enseigne }}</fold-field>
      <fold-field label="Forme juridique">{{ c.formeJuridique }}</fold-field>
      <fold-field label="SIRET">{{ siret() }}</fold-field>
      <fold-field label="TVA intracommunautaire" [empty]="!c.tvaIntracom">
        {{ c.tvaIntracom }}
      </fold-field>
    </fold-field-list>
  </fold-card>
</fold-page-section>
