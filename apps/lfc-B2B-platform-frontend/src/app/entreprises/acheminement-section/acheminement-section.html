<!-- Voix CLIENT : la carte est partagée avec le back-office et ne sait pas qui
     la regarde. Ce qui change de camp entre par ses `input()`. -->
<lfd-company-fulfillment-card
  [preference]="company().fulfillmentPreference"
  [pickups]="pickups()"
  [deliveries]="deliveries()"
  [deliveryOffered]="deliveryOffered"
  [canManage]="canManage()"
  [saving]="saving()"
  description="Comment vous êtes servi d'habitude. C'est le point de départ de vos commandes — vous pourrez en changer au panier."
  noPreferenceHint="Aucune préférence : vous choisissez votre acheminement à chaque commande."
  noDeliveryHint="Vous n'avez pas encore d'adresse de livraison. Ajoutez-en une pour pouvoir en choisir une par défaut."
  (preferenceChange)="save($event)"
/>
