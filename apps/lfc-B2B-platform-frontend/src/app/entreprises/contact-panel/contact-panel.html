<fold-panel-header [title]="heading()" subtitle="Coordonnées de l'interlocuteur." />

<div class="body">
  @if (error(); as message) {
    <fold-callout variant="alert" announce>{{ message }}</fold-callout>
  }

  <lfd-contact-fields [value]="draft()" (valueChange)="draft.set($event)" />
</div>

<footer class="foot">
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton intent="primary" [disabled]="!canSubmit() || submitting()" (click)="submit()">
    Enregistrer
  </button>
</footer>
