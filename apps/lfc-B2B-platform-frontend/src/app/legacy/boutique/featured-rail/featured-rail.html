<div class="rail">
  <button
    type="button"
    class="rail-nav rail-prev"
    aria-label="Produits précédents"
    (click)="scrollByCards(-1)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
      <path
        d="M15 5 L8 12 L15 19"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <div #track class="rail-track">
    @for (item of items(); track item.product.id) {
      <div class="featured-item" [class.is-highlight]="item.highlight">
        @if (item.flag) {
          <span class="featured-flag">
            <span class="ff-mark" aria-hidden="true"></span>
            {{ item.flag }}
          </span>
        }
        <fold-product-card
          [product]="item.product"
          [highlight]="item.highlight"
          [favorite]="favorites.has(item.product.id)"
          [inCart]="cart.qtyOf(item.product.id)"
          [priceFormat]="formatEur"
          priceSuffix="HT"
          (favoriteToggle)="onFav($event)"
          (action)="onAdd($event)"
          (notify)="onNotify($event)"
        />
      </div>
    }
  </div>

  <button
    type="button"
    class="rail-nav rail-next"
    aria-label="Produits suivants"
    (click)="scrollByCards(1)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
      <path
        d="M9 5 L16 12 L9 19"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>
