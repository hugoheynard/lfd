<!doctype html>
<html lang="fr" data-theme="navi">
  <head>
    <meta charset="utf-8" />
    <title>La Folie Coffee — B2B</title>
    <base href="/" />
    <!-- `viewport-fit=cover` : sans lui, iOS n'expose PAS `env(safe-area-inset-*)`
         et la barre de marque se cale sous l'encoche au lieu de l'englober. La
         barre du client lit déjà cette variable. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- La teinte que le système peint autour de l'app (barre d'état Android,
         chrome du navigateur) : l'encre de marque, comme l'en-tête. -->
    <meta name="theme-color" content="#12307f" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- La marque de l'app cliente : le bonhomme seul, sans le mot. Déclarée
         après le .ico, elle le supplante sur tout navigateur moderne. -->
    <link rel="icon" type="image/png" href="brand/lfc-mark.png" />

    <!-- Polices de l'app client : Archivo (display, 800/900 uniquement) et
         Outfit (courant). Voir `01-tokens-fold.md` §5. Archivo est une
         interprétation du rendu du site public : à confirmer avec la marque. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Outfit:wght@300..700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
