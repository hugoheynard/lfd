@if (shortfall().supply === 'shelf') {
  <!-- Lot L6 : prise sur le stock de la vitrine, pas fabriquée pour elle. -->
  <fold-badge class="shelf" variant="success" content="Sur stock" data-shortfall-shelf />
}
<ul class="missing" data-shortfall-missing>
  @for (text of missing(); track $index) {
    <li>{{ text }}</li>
  }
</ul>
@if (allowed()) {
  <app-order-shortfall-decision
    [orderId]="shortfall().orderId"
    [shortfall]="asOrderShortfall()"
    [lines]="names()"
    (decided)="decided.emit()"
  />
} @else {
  <p class="waiting" data-shortfall-waiting>En attente de la décision d'un manager</p>
}
