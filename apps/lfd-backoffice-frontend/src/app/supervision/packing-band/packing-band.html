<span class="cue">Par heure de remise</span>
<fold-multiselect
  class="filter"
  size="sm"
  placeholder="Tous les acheminements"
  placement="bottom-end"
  allowClear
  clearLabel="Tout montrer"
  [class.is-active]="active()"
  [options]="options()"
  [value]="routes()"
  (valueChange)="routes.set($event)"
>
  <ng-template #option let-o>
    <!-- Le compte passe par `::after` : fold prend le TEXTE de l'option pour
         libeller son bouton, et un compte écrit en DOM s'y collait
         (« Tous les rayons25 », vu le 2026-09-28). -->
    <span class="option" [attr.data-count]="byValue().get(o.value)?.count">
      @if (byValue().get(o.value); as route) {
        <app-logistics-swatch [category]="route.category" />
      }
    </span>
  </ng-template>
</fold-multiselect>
