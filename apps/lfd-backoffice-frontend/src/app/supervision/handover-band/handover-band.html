<fold-tabs
  direction="horizontal"
  size="compact"
  background="transparent"
  [tabs]="tabs()"
  [activeKey]="method()"
  (activeKeyChange)="method.set($event)"
/>
@if (method() === 'pickup' && options().length > 1) {
  <fold-multiselect
    class="filter"
    [class.is-active]="routes().length > 0"
    size="sm"
    placeholder="Tous les points"
    placement="bottom-end"
    allowClear
    clearLabel="Tout montrer"
    [options]="options()"
    [value]="routes()"
    (valueChange)="routes.set($event)"
  >
    <ng-template #option let-o>
      <span class="option" [attr.data-count]="byValue().get(o.value)?.count">
        @if (byValue().get(o.value); as route) {
          <app-logistics-swatch [category]="route.category" />
        }
      </span>
    </ng-template>
  </fold-multiselect>
}
