<svg
  class="diagram"
  viewBox="0 0 740 262"
  role="img"
  aria-label="Trois portes séparent une fiche vide d'une fiche publiée : la barre de complétude informe, la déclaration publiable signe sans changer le statut, et seule la publication au catalogue refuse"
>
  <text class="step" x="14" y="14">De la fiche vide à la fiche publiée</text>

  <g>
    <rect class="box" x="14" y="26" width="230" height="98" rx="10" />
    <text class="box-title" x="129" y="50">① La barre de complétude</text>
    <text class="box-sub" x="129" y="72">nom · famille · prix · allergènes</text>
    <text class="box-sub" x="129" y="90">description · au moins un visuel</text>
    <text class="box-sub" x="129" y="108">chaque langue compte pour une</text>
  </g>
  <rect class="verdict" x="14" y="132" width="230" height="28" rx="7" />
  <text class="verdict-text" x="129" y="151">elle informe</text>

  <g>
    <rect class="box" x="255" y="26" width="230" height="98" rx="10" />
    <text class="box-title" x="370" y="50">② La déclaration « publiable »</text>
    <text class="box-sub" x="370" y="72">quelqu'un affirme que c'est juste</text>
    <text class="box-sub" x="370" y="90">la signature porte une date</text>
    <text class="box-sub" x="370" y="108">elle ne se périme pas toute seule</text>
  </g>
  <rect class="verdict" x="255" y="132" width="230" height="28" rx="7" />
  <text class="verdict-text" x="370" y="151">elle ne touche pas au statut</text>

  <g>
    <rect class="box box-accent" x="496" y="26" width="230" height="98" rx="10" />
    <text class="box-title on-accent" x="611" y="50">③ La publication</text>
    <text class="box-sub on-accent" x="611" y="72">le seul geste qui change l'état</text>
    <text class="box-sub on-accent" x="611" y="90">brouillon → publié</text>
    <text class="box-sub on-accent" x="611" y="108">porté par l'agrégat, pas par l'écran</text>
  </g>
  <rect class="verdict verdict-strong" x="496" y="132" width="230" height="28" rx="7" />
  <text class="verdict-text verdict-text-strong" x="611" y="151">ELLE REFUSE</text>

  <rect class="rule-box" x="14" y="178" width="712" height="70" rx="10" />
  <text class="rule-title" x="30" y="204">
    La seule condition qui bloque : toute déclinaison ACTIVE porte une fiche réglementaire.
  </text>
  <text class="rule-line" x="30" y="224">
    « Aucun allergène » compte comme déclarée — c'est une affirmation, pas une absence de réponse.
  </text>
  <text class="rule-line" x="30" y="240">
    Une déclinaison arrêtée ne compte pas. Un produit archivé se restaure d'abord.
  </text>
</svg>
