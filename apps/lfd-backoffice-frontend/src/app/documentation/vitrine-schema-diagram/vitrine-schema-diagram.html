<svg
  class="diagram"
  viewBox="0 0 760 484"
  role="img"
  aria-label="Le catalogue contient des rayons, des articles et des opérations ; un article renvoie à son rayon par shelfId et à son opération par operation.key ; une opération liste ses articles par skus ; un article porte deux images, chacune avec un point focal. Les textes sont servis à part ; une notification nomme des clés de ces quatre ensembles."
>
  <defs>
    <marker
      id="vschema-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path class="head" d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <!-- La racine -->
  <rect class="root" x="250" y="10" width="260" height="56" rx="8" />
  <text class="title" x="380" y="34">{{ boxes.catalogue.title }}</text>
  @for (line of boxes.catalogue.lines; track $index) {
    <text class="sub" x="380" [attr.y]="54 + $index * 16">{{ line }}</text>
  }

  <!-- Contenance -->
  <line class="has" x1="300" y1="66" x2="105" y2="120" />
  <line class="has" x1="370" y1="66" x2="370" y2="120" />
  <line class="has" x1="460" y1="66" x2="655" y2="120" />

  <!-- Rayon -->
  <rect class="box" x="20" y="120" width="170" height="76" rx="8" />
  <text class="title" x="105" y="144">{{ boxes.shelf.title }}</text>
  @for (line of boxes.shelf.lines; track $index) {
    <text class="field" x="34" [attr.y]="166 + $index * 18">{{ line }}</text>
  }

  <!-- Article -->
  <rect class="box" x="270" y="120" width="200" height="130" rx="8" />
  <text class="title" x="370" y="144">{{ boxes.item.title }}</text>
  @for (line of boxes.item.lines; track $index) {
    <text class="field" x="284" [attr.y]="166 + $index * 18">{{ line }}</text>
  }

  <!-- Opération -->
  <rect class="box" x="570" y="120" width="170" height="130" rx="8" />
  <text class="title" x="655" y="144">{{ boxes.operation.title }}</text>
  @for (line of boxes.operation.lines; track $index) {
    <text class="field" x="584" [attr.y]="166 + $index * 18">{{ line }}</text>
  }

  <!-- Renvois par clé -->
  <line class="ref" x1="270" y1="176" x2="194" y2="176" marker-end="url(#vschema-arrow)" />
  <text class="ref-label" x="230" y="170">{{ references.shelf.label }}</text>
  <line class="ref" x1="470" y1="160" x2="566" y2="160" marker-end="url(#vschema-arrow)" />
  <text class="ref-label" x="520" y="154">{{ references.operation.label }}</text>
  <line class="ref" x1="570" y1="214" x2="474" y2="214" marker-end="url(#vschema-arrow)" />
  <text class="ref-label" x="520" y="208">{{ references.skus.label }}</text>

  <!-- Image et point focal -->
  <line class="has" x1="370" y1="250" x2="370" y2="290" />
  <rect class="box" x="270" y="290" width="200" height="58" rx="8" />
  <text class="title" x="370" y="312">{{ boxes.image.title }}</text>
  @for (line of boxes.image.lines; track $index) {
    <text class="sub" x="370" [attr.y]="332 + $index * 16">{{ line }}</text>
  }
  <line class="has" x1="470" y1="319" x2="570" y2="319" />
  <rect class="box" x="570" y="296" width="180" height="46" rx="8" />
  <text class="title" x="655" y="318">{{ boxes.focal.title }}</text>
  @for (line of boxes.focal.lines; track $index) {
    <text class="sub" x="655" [attr.y]="334 + $index * 16">{{ line }}</text>
  }

  <line class="rule" x1="20" y1="368" x2="740" y2="368" />

  <!-- À part : les textes et la notification -->
  <rect class="box alt" x="20" y="384" width="220" height="70" rx="8" />
  <text class="title" x="130" y="408">{{ boxes.texts.title }}</text>
  @for (line of boxes.texts.lines; track $index) {
    <text class="sub" x="130" [attr.y]="428 + $index * 16">{{ line }}</text>
  }

  <rect class="box alt" x="300" y="384" width="440" height="70" rx="8" />
  <text class="title" x="520" y="408">{{ boxes.notification.title }}</text>
  @for (line of boxes.notification.lines; track $index) {
    <text class="sub" x="520" [attr.y]="428 + $index * 16">{{ line }}</text>
  }

  <text class="legend" x="20" y="476">{{ legend }}</text>
</svg>
