<!-- La bande des onglets, au-dessus des vues : elle reste quand on change d'onglet. -->
<header class="masthead" foldSurface="chrome">
  <fold-view-nav
    [items]="views()"
    direction="horizontal"
    size="compact"
    activeStyle="fill"
    background="transparent"
  />
  <!-- La grosse horloge du fournil (Hugo, 2026-11-01) : la journée par tranche
       se lit contre l'heure, ici comme au four. -->
  <app-workshop-wall-clock class="masthead-clock" />
</header>
<router-outlet />
