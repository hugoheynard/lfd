<fold-card data-live-stock-alerts>
  <fold-element-title
    cardHeader
    variant="title"
    title="Alertes des points"
    subtitle="Ruptures et stocks faibles déclarés au comptoir, jusqu'à la réception d'un réassort ou leur levée."
  />

  <div class="body">
    @if (alerts().length === 0) {
      <p class="notice" data-live-stock-alerts-empty>Aucune alerte en cours.</p>
    } @else {
      <ul class="alerts">
        @for (entry of alerts(); track entry.alert.id) {
          <li [attr.data-live-stock-alert]="entry.siteId + ':' + entry.alert.sku">
            <span class="sentence" [class.out]="entry.alert.level === 'out_of_stock'">
              {{ sentence(entry) }}
            </span>
            @if (canPlace()) {
              @if (opened() === entry.alert.id) {
                <div class="launch" data-live-stock-alert-launch>
                  <fold-number-input
                    size="sm"
                    label="Quantité"
                    [value]="quantity()"
                    (valueChange)="quantity.set($event)"
                    [min]="1"
                    integer
                  />
                  <button
                    foldButton
                    size="sm"
                    data-live-stock-alert-place
                    [disabled]="quantity() === null"
                    [loading]="pending()"
                    (click)="launch(entry)"
                  >
                    Passer au plus tôt
                  </button>
                  <button foldButton size="sm" emphasis="soft" (click)="close()">Annuler</button>
                </div>
              } @else {
                <button
                  foldButton
                  size="sm"
                  emphasis="outline"
                  data-live-stock-alert-open
                  (click)="open(entry)"
                >
                  Lancer un réassort au plus tôt
                </button>
              }
            }
          </li>
        }
      </ul>
    }

    @if (failure(); as message) {
      <fold-callout variant="alert" announce>{{ message }}</fold-callout>
    }
  </div>
</fold-card>
