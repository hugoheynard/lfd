<fold-card data-live-stock-alerts>
  <fold-element-title
    cardHeader
    variant="title"
    title="Alertes des points"
    subtitle="Ruptures et stocks faibles déclarés au comptoir, jusqu'à la réception d'un réassort ou leur levée. Pour information : pour y répondre, envoyez un réassort au point."
  />

  <div class="body">
    @if (alerts().length === 0) {
      <p class="notice" data-live-stock-alerts-empty>Aucune alerte en cours.</p>
    } @else {
      <ul class="alerts">
        @for (entry of alerts(); track entry.alert.id) {
          <li [attr.data-live-stock-alert]="entry.siteId + ':' + entry.alert.sku">
            <span class="sentence" [class.out]="entry.alert.level === 'out_of_stock'">
              {{ sentence(entry) }}
            </span>
          </li>
        }
      </ul>
    }
  </div>
</fold-card>
