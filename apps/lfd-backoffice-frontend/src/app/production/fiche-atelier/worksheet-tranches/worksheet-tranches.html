<span class="wt-list">
  @for (tranche of reading().tranches; track $index) {
    @if (!$first) {
      <span class="wt-sep" aria-hidden="true">·</span>
    }
    <span
      class="wt-tranche"
      [class.is-covered]="tranche.covered"
      [class.is-next]="tranche.next"
      data-tranche
      >{{ tranche.label }}</span
    >
  }
  <span class="wt-produced">— sorti {{ producedLabel() }}</span>
</span>
@if (reading().missing; as missing) {
  <fold-badge variant="warning" [content]="missing" data-tranche-missing />
}
