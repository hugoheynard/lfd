@if (stepOf(); as station) {
  <app-line-step
    [line]="line()"
    [workstationId]="station"
    [busy]="busy()"
    [class.is-linked]="linked()"
    [attr.data-line]="line().sku"
    (done)="stepDone.emit()"
    (red)="stepRed.emit()"
    (undone)="stepUndone.emit()"
  />
} @else {
  @switch (level()) {
    @case ('always_green') {
      <app-line-always-green
        [line]="line()"
        [busy]="busy()"
        [stepsWaiting]="stepsWaiting()"
        [class.is-linked]="linked()"
        [attr.data-line]="line().sku"
        (problem)="problem.emit()"
      />
    }
    @case ('simple') {
      <app-line-simple
        [line]="line()"
        [busy]="busy()"
        [doneWaiting]="doneWaiting()"
        [stepsWaiting]="stepsWaiting()"
        [class.is-linked]="linked()"
        [attr.data-line]="line().sku"
        (done)="done.emit()"
        (problem)="problem.emit()"
      />
    }
    @case ('detailed') {
      <app-worksheet-line
        [line]="line()"
        [busy]="busy()"
        [now]="now()"
        [pending]="pending()"
        [shortcuts]="shortcuts()"
        [stepsWaiting]="stepsWaiting()"
        [class.is-linked]="linked()"
        [attr.data-line]="line().sku"
        (recorded)="recorded.emit($event)"
        (cancelled)="cancelled.emit($event)"
      />
    }
  }
}
