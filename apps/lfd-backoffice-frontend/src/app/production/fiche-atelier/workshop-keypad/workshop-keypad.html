<fold-panel-header [title]="data().productName" subtitle="Pièces sorties" closeLabel="Fermer" />

<fold-panel-body>
  <div class="wk-body">
    <p class="wk-display" aria-live="polite">
      <span class="wk-value" data-keypad-value>{{ shown() || '0' }}</span>
      <span class="wk-after">{{ after() }}</span>
    </p>

    <!-- Les raccourcis POSENT une valeur ; seul « Déclarer » enregistre. -->
    <div class="wk-presets" role="group" aria-label="Raccourcis">
      @for (preset of presets(); track preset.key) {
        <button
          foldButton
          type="button"
          size="sm"
          [emphasis]="isPicked(preset) ? 'solid' : 'outline'"
          [intent]="isPicked(preset) ? 'primary' : 'neutral'"
          [attr.data-keypad-preset]="preset.key"
          (click)="pick(preset)"
        >
          {{ preset.label }}
        </button>
      }
    </div>

    <div class="wk-keys" role="group" aria-label="Pavé numérique">
      @for (digit of digits; track digit) {
        <button
          foldButton
          class="wk-key"
          type="button"
          size="lg"
          emphasis="outline"
          intent="neutral"
          [attr.data-keypad-digit]="digit"
          (click)="press(digit)"
        >
          {{ digit }}
        </button>
      }
      <button
        foldButton
        class="wk-key"
        type="button"
        size="lg"
        emphasis="soft"
        intent="neutral"
        aria-label="Effacer tout"
        (click)="clear()"
      >
        C
      </button>
      <button
        foldButton
        class="wk-key"
        type="button"
        size="lg"
        emphasis="outline"
        intent="neutral"
        data-keypad-digit="0"
        (click)="press('0')"
      >
        0
      </button>
      <button
        foldButton
        class="wk-key"
        type="button"
        size="lg"
        emphasis="soft"
        intent="neutral"
        aria-label="Effacer un chiffre"
        (click)="erase()"
      >
        ⌫
      </button>
    </div>
  </div>
</fold-panel-body>

<fold-panel-footer align="end">
  <button
    foldButton
    class="wk-declare"
    type="button"
    size="lg"
    [disabled]="!valid()"
    (click)="declare()"
  >
    {{ declareLabel() }}
  </button>
</fold-panel-footer>
