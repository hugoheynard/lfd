<section class="bgl-label" [attr.aria-label]="'Étiquette ' + bag().label" data-bag-label-sheet>
  <p class="bgl-reference" data-bag-reference>{{ order().reference }}</p>
  <p class="bgl-customer">{{ order().customerLabel }}</p>
  <p class="bgl-method" data-bag-method>
    @if (order().color; as color) {
      <span
        class="bgl-color"
        [style.background-color]="color"
        aria-hidden="true"
        data-bag-color
      ></span>
    }
    {{ order().fulfillmentLabel }}
  </p>
  <p class="bgl-when" data-bag-when>{{ order().when }}</p>
  @if (bag().of > 1) {
    <p class="bgl-rank" data-bag-rank>Sac {{ bag().rank }}/{{ bag().of }}</p>
  }
  @if (order().handoverUrl !== '') {
    <app-qr-code class="bgl-qr" [url]="order().handoverUrl" data-bag-qr />
  }
</section>
