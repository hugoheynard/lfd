<p class="pc-band">
  <span class="pc-band-title">Containers</span>
  <span class="pc-band-rule" aria-hidden="true"></span>
  <span class="pc-band-sum">{{ count() }} container{{ count() > 1 ? 's' : '' }}</span>
</p>

<div class="pc-list">
  <!-- Des tuiles, pas des numéros : le seul chiffre de ce bloc est celui que le
       serveur a compté, dans la bande. Décoratives pour un lecteur d'écran, qui
       lit déjà ce compte-là. -->
  @for (slot of slots(); track $index) {
    <div class="co-container" aria-hidden="true"></div>
  } @empty {
    <p class="pc-none">Aucun container déclaré.</p>
  }
</div>
