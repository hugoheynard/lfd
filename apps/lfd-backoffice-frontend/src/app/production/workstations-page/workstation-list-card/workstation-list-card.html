<fold-card data-workstation-list>
  <fold-element-title
    cardHeader
    variant="title"
    title="Les postes"
    subtitle="Dans l’ordre des fiches de poste. Un poste archivé ne range plus rien : ses produits redeviennent « à ranger »."
  >
    @if (canWrite() && shelfSeeds().length > 0) {
      <button
        titleAction
        foldButton
        size="sm"
        emphasis="outline"
        [disabled]="busy()"
        (click)="fromShelves()"
        data-from-shelves
      >
        Partir des rayons
      </button>
    }
  </fold-element-title>

  <div class="body">
    @for (station of workstations(); track station.id; let index = $index; let last = $last) {
      <div class="station" [attr.data-workstation]="station.id">
        @if (canWrite()) {
          <fold-input
            class="name"
            size="sm"
            [label]="'Poste ' + (index + 1)"
            [value]="draftOf(station.id)"
            (valueChange)="setDraft(station.id, $event)"
          />
          <button
            foldButton
            size="sm"
            emphasis="soft"
            [disabled]="busy() || !renamable(station)"
            (click)="rename(station)"
            data-rename
          >
            Renommer
          </button>
          <fold-button-icon
            icon="chevron-up"
            size="sm"
            tooltip="Monter"
            [disabled]="busy() || index === 0"
            (clicked)="move(index, -1)"
            data-move-up
          />
          <fold-button-icon
            icon="chevron-down"
            size="sm"
            tooltip="Descendre"
            [disabled]="busy() || last"
            (clicked)="move(index, 1)"
            data-move-down
          />
          <fold-inline-confirm
            intent="danger"
            [message]="'Archiver « ' + station.name + ' » ?'"
            (confirmed)="archive(station)"
          >
            <button foldButton size="sm" emphasis="soft" intent="danger" [disabled]="busy()">
              Archiver
            </button>
          </fold-inline-confirm>
        } @else {
          <span class="name">{{ index + 1 }}. {{ station.name }}</span>
        }
      </div>
    } @empty {
      <fold-empty-state
        title="Aucun poste"
        subtitle="Ajoutez les postes du fournil, ou partez des rayons de la boutique pour un premier jeu à renommer."
      >
        <fold-icon empty-icon name="croissant" size="lg" />
      </fold-empty-state>
    }

    @if (canWrite()) {
      <div class="station">
        <fold-input
          class="name"
          size="sm"
          label="Nouveau poste"
          placeholder="Pâtisserie, tourier…"
          [value]="newName()"
          (valueChange)="newName.set($event)"
          data-new-name
        />
        <button
          foldButton
          size="sm"
          icon="plus"
          [disabled]="busy() || newName().trim() === ''"
          (click)="declare()"
          data-declare
        >
          Ajouter
        </button>
      </div>
    }

    @if (refusal(); as message) {
      <fold-callout variant="alert" announce data-workstation-refusal>{{ message }}</fold-callout>
    }
  </div>
</fold-card>
