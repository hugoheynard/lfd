<fold-page-layout title="Postes">
  <p description>
    Le fournil s’organise en postes : chaque produit est fait par un poste, quel que soit son rayon
    à la boutique.
  </p>

  @switch (state()) {
    @case ('loading') {
      <fold-loading message="Lecture des postes…" />
    }
    @case ('error') {
      <fold-empty-state tone="alert" title="Les postes n’ont pas pu être lus.">
        <button foldButton emphasis="outline" (click)="load()" data-retry>Réessayer</button>
      </fold-empty-state>
    }
    @default {
      @if (view(); as page) {
        <div class="cards">
          <app-production-grouping-card
            [display]="display()"
            [unplacedOrdered]="unplacedOrdered()"
            [canWrite]="canSetMode()"
            [canRead]="canReadMode()"
            (saved)="load()"
          />
          <app-workstation-list-card
            [workstations]="page.workstations"
            [products]="page.products"
            [canWrite]="canWrite()"
            (changed)="load()"
          />
          <app-workstation-products-card
            [products]="page.products"
            [offCatalog]="page.offCatalog"
            [workstations]="page.workstations"
            [unplacedCount]="page.unplacedCount"
            [canWrite]="canWrite()"
            [unplacedFirst]="unplacedFirst()"
            (changed)="load()"
          />
        </div>
      }
    }
  }
</fold-page-layout>
