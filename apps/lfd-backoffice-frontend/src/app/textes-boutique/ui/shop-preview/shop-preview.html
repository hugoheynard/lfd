<div class="sp-column">
  @if (src; as url) {
    <div class="sp-toolbar">
      <fold-view-toggle
        size="sm"
        ariaLabel="Étape de la commande"
        [options]="stageOptions()"
        [value]="stage()"
        (valueChange)="setStage($event)"
      />
      @if (stage() === 'outside') {
        <fold-view-toggle
          size="sm"
          ariaLabel="Écran hors commande"
          [options]="outsideOptions()"
          [value]="link.step()"
          (valueChange)="setOutside($event)"
        />
      }
    </div>
    @if (stepTitle(); as title) {
      <p class="sp-step">{{ title }}</p>
    }
    @if (note(); as text) {
      <fold-callout variant="info">{{ text }}</fold-callout>
    }
    <div class="sp-toolbar">
      <fold-view-toggle
        size="sm"
        ariaLabel="Largeur de l’aperçu"
        [options]="viewportOptions"
        [value]="link.viewport()"
        (valueChange)="setViewport($event)"
      />
      @if (scaleLabel(); as label) {
        <span class="sp-scale">{{ label }}</span>
      }
      <button
        foldButton
        size="sm"
        emphasis="outline"
        intent="neutral"
        type="button"
        (click)="openWindow()"
      >
        Ouvrir dans une fenêtre
      </button>
    </div>
    @if (link.detached()) {
      <fold-empty-state
        title="L’aperçu est ouvert dans une autre fenêtre"
        subtitle="Il y suit vos modifications comme ici. Fermez-la, ou ramenez-le dans cette colonne."
      >
        <fold-icon empty-icon name="view" />
        <button foldButton type="button" (click)="bringBack()">Ramener ici</button>
      </fold-empty-state>
    } @else {
      @let s = scale();
      <div class="sp-box" [style.width.px]="s.boxWidth" [style.height.px]="s.boxHeight">
        <iframe
          #frame
          class="sp-frame"
          title="Aperçu de la boutique"
          [style.width.px]="s.frameWidth"
          [style.height.px]="s.frameHeight"
          [style.transform]="'scale(' + s.k + ')'"
          [src]="url"
          (load)="loaded()"
        ></iframe>
      </div>
    }
  } @else {
    <fold-empty-state
      title="Aperçu indisponible"
      subtitle="L’adresse de l’application d’aperçu n’est pas configurée pour ce back-office. Les textes s’éditent et se publient quand même."
    >
      <fold-icon empty-icon name="eye-off" />
    </fold-empty-state>
  }
</div>
