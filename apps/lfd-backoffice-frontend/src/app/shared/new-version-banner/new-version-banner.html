@if (visible()) {
  <fold-callout variant="info" appearance="flat" icon="reload" announce>
    Une nouvelle version est disponible. Finissez votre opération, puis rechargez la page.
    <button foldButton actions size="sm" emphasis="soft" type="button" (click)="reload()">
      Recharger
    </button>
  </fold-callout>
}
