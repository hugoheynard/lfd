<fold-card>
  <fold-element-title variant="title" [level]="3" [title]="title()" [subtitle]="subtitle()" />
  <div class="form">
    @if (image(); as door) {
      <img
        class="preview"
        [src]="door.url"
        [alt]="textIn(door.alt, 'fr')"
        [style.object-position]="positionOf(door.focal)"
      />
      <div class="field-group">
        <span class="caption">Langue</span>
        <fold-view-toggle
          size="sm"
          ariaLabel="Langue écrite"
          [options]="localeOptions"
          [value]="locale()"
          (valueChange)="pickLocale($event)"
        />
      </div>
      <fold-input
        size="sm"
        optional
        [label]="altLabel()"
        [hint]="altHint()"
        [value]="textIn(door.alt, locale())"
        (valueChange)="setAlt($event)"
      />
      <div class="actions">
        <button foldButton type="button" size="sm" emphasis="outline" (click)="choose()">
          Changer d’image
        </button>
        <button foldButton type="button" size="sm" emphasis="soft" (click)="remove()">
          Retirer
        </button>
      </div>
    } @else {
      <div class="preview empty" aria-hidden="true"></div>
      <span class="caption">{{ emptyCaption() }}</span>
      <button foldButton type="button" size="sm" emphasis="outline" (click)="choose()">
        Choisir dans la médiathèque
      </button>
    }
  </div>
</fold-card>
