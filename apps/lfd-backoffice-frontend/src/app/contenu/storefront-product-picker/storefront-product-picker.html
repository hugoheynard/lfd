<div class="picker">
  <lfd-product-search size="sm" [(query)]="query" [count]="matches().length" />
  <fold-listbox
    size="sm"
    label="Article"
    placeholder="Choisir un article"
    [hint]="hint()"
    [options]="options()"
    [value]="sku()"
    (selectionChange)="picked.emit($event)"
  />
</div>
