<div class="search">
  <fold-combobox
    size="sm"
    filter="none"
    clearOnSelect
    label="Article à ajouter"
    placeholder="Ajouter un article : nom ou référence"
    emptyText="Aucun article ne correspond."
    loadingText="Recherche…"
    [delayMs]="250"
    [hint]="hint()"
    [loading]="loading()"
    [options]="options()"
    (searchChange)="search($event)"
    (selectionChange)="pick($event)"
  >
    <ng-template #option let-o>
      <span class="option">
        @if (o.value.thumbnailUrl; as url) {
          <img class="thumb" [src]="url" alt="" />
        } @else {
          <span class="thumb thumb-none"><fold-icon name="package" [size]="16" /></span>
        }
        <span class="option-text">
          <span>{{ o.value.name }}</span>
          <span class="muted">{{ o.value.shelf }} · {{ o.value.sku }}</span>
        </span>
      </span>
    </ng-template>
  </fold-combobox>
  @if (failed()) {
    <fold-callout appearance="inset" variant="alert" announce>
      La recherche n'a pas abouti. Réessayez dans un instant.
    </fold-callout>
  }
</div>
