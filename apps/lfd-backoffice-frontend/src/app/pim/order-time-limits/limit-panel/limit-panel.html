<fold-panel-header [title]="heading()" />

<div class="body">
  <fold-callout appearance="inset" variant="neutral">
    S'applique à <strong>{{ label() }}</strong
    >, et à toutes ses déclinaisons.
  </fold-callout>

  <fold-listbox
    label="Le délai"
    [options]="daysChoices"
    [value]="daysBefore()"
    (selectionChange)="onDays($event)"
  />

  <!-- `<input type="time">` en natif : fold ne couvre pas les heures, et le
       contrôle du navigateur vaut mieux qu'un masque maison. -->
  <label class="time">
    <span class="time-label">L'heure</span>
    <input type="time" [value]="time()" (change)="onTime($event)" />
  </label>

  <!-- Pas de rattrapage par produit (Hugo, 2026-10-21) : le dire, parce que
       l'écran en proposait un. -->
  <fold-callout variant="info">{{ recap() }}</fold-callout>
  <fold-callout appearance="inset" variant="neutral">
    Pas de rattrapage sur un produit&nbsp;: le seul rattrapage est celui de la règle générale
    (Réglages › Commandes › Heure limite), où une dérogation peut s'accorder.
  </fold-callout>
</div>

<div class="actions">
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton [disabled]="!canSubmit()" (click)="submit()">
    {{ isCreate() ? 'Poser la limite' : 'Enregistrer' }}
  </button>
</div>
