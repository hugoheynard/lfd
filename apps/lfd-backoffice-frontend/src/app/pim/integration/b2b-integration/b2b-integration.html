<div class="integration">
  <!-- Ce qu'est ce canal, et son état. Il n'y a rien à connecter : le canal
       est interne. -->
  <fold-hero-card accent="gradient" [accentBar]="true" padding="lg">
    <div class="hero">
      <div class="hero-head">
        <span class="hero-mark"><fold-icon name="shopping-bag" [size]="28" /></span>
        <div class="hero-titles">
          <fold-element-title title="Canal de vente" />
          <h2 class="hero-title">Boutique B2B</h2>
          <p class="hero-sub">Celle qui facture. Le catalogue y descend, rien n'en remonte.</p>
        </div>
        <fold-status-badge status="success" label="Interne" />
      </div>

      <fold-field-list>
        <fold-field label="Transport">En processus — aucun réseau traversé</fold-field>
        <fold-field label="Identifiants">Aucun : ni domaine, ni jeton à faire tourner</fold-field>
        <fold-field label="Ce qui descend"
          >Familles, articles, prix canonique, taux de TVA</fold-field
        >
        <fold-field label="Quand">À chaque changement d'une fiche, par ses faits</fold-field>
      </fold-field-list>
    </div>
  </fold-hero-card>
</div>
