<!-- Le sélecteur de CETTE section : il ne fait basculer que les textes
     alternatifs. Le nom d'un fichier, ses dimensions et l'image elle-même ne se
     traduisent pas. -->
<app-lang-switch
  [lang]="locale()"
  (langChange)="locale.set($event)"
  [missing]="store.media.missing()"
  ariaLabel="Langue des textes alternatifs"
/>

@if (missingHint(); as hint) {
  <fold-callout appearance="inset" variant="warning">{{ hint }}</fold-callout>
}

<app-media-gallery
  [slots]="store.media.items()"
  [locale]="locale()"
  [incomplete]="incompleteIndexes()"
  (edit)="edit($event)"
/>

<!-- 🔴 Le seul geste d'ajout depuis le 2026-09-23. Il remplace une zone de
     dépôt qui visait une route disparue — et le fonds se remplit désormais
     depuis la médiathèque, où l'on tague. -->
<p class="from-library">
  <button foldButton (click)="pickFromLibrary()">Choisir dans la médiathèque</button>
</p>
