@if (store.lineage().origin; as origin) {
  <fold-callout variant="info">
    Née de la déclinaison « {{ origin.variantName.fr }} » ({{ origin.variantSku }}) de la fiche
    <fold-link (clicked)="open(origin.productId)">
      « {{ origin.productName.fr }} » ({{ origin.productSku }}) </fold-link
    >.
  </fold-callout>
}

@if (retirable()) {
  <div class="make-default">
    <p id="make-default-suspended">{{ suspended }}</p>
    <button foldButton emphasis="soft" disabled aria-describedby="make-default-suspended">
      Faire de cette déclinaison la déclinaison par défaut
    </button>
  </div>
}
