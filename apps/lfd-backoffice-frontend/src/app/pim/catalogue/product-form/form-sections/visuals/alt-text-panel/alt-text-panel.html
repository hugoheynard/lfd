<fold-panel-header
  title="Visuel"
  subtitle="Ce que cette fiche en fait. Son étiquette et sa description vivent dans la médiathèque."
/>

<div class="body">
  <!-- L'image, en grand : on ne choisit pas l'usage d'une image qu'on ne voit
       pas, et décider de la retirer demande de la regarder. -->
  @if (data().url !== '') {
    <img class="preview" [src]="data().url" alt="" />
  }

  @if (role(); as chosen) {
    <!-- Les cinq USAGES, et leur ratio dit dans le libellé : c'est au moment
         de choisir qu'on a besoin de savoir quelle forme le canal attend, pas
         dans une documentation qu'on ira lire un autre jour. -->
    <fold-listbox label="Usage" [value]="chosen" (selectionChange)="role.set($event)">
      @for (entry of roles | keyvalue; track entry.key) {
        <fold-option [value]="entry.key">{{ entry.value }}</fold-option>
      }
    </fold-listbox>
  }
</div>

<div class="foot">
  <!-- RETIRER de la fiche, jamais de la bibliothèque : l'image reste
       disponible pour une autre fiche. Sa suppression se fait à la
       médiathèque, et seulement quand plus personne ne l'affiche. -->
  <button foldButton emphasis="outline" intent="danger" (click)="remove()">
    Retirer de la fiche
  </button>
  <button foldButton emphasis="outline" (click)="cancel()">Annuler</button>
  <button foldButton (click)="submit()">Enregistrer</button>
</div>
