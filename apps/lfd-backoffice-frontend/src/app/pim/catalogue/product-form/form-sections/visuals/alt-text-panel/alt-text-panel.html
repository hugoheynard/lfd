<fold-panel-header
  title="Visuel"
  subtitle="Son nom pour l'équipe, sa description pour qui ne le voit pas."
/>

<div class="body">
  <!-- L'image, en grand : on ne décrit pas une image qu'on ne voit pas. -->
  @if (data().url !== '') {
    <img class="preview" [src]="data().url" alt="" />
  }

  <!-- Le NOM identifie le fichier pour l'équipe : court, non traduit, fait pour
       retrouver. Il ne remplace pas la description, il répond à une autre
       question. -->
  <fold-input
    label="Nom du visuel"
    hint="Pour le retrouver dans la bibliothèque. Il ne se traduit pas."
    [value]="name()"
    (valueChange)="name.set($event)"
  />

  <p class="section-label">Description</p>

  @for (locale of locales; track locale) {
    <fold-input
      [label]="names[locale]"
      [required]="locale === sourceLocale"
      [value]="valueOf(locale)"
      (valueChange)="write(locale, $event)"
    />
  }

  <!-- La désignation vit ICI, à côté du nom et de l'alternative : c'est le seul
       endroit où l'on voit l'image en grand, et choisir le packshot demande de
       la regarder — même raison que le retrait, juste en dessous. -->
  @if (isMain() !== undefined) {
    <fold-checkbox
      label="Visuel principal"
      hint="Celui que les canaux montrent quand ils n'en montrent qu'un. Un seul par fiche : le désigner rend les autres à la galerie."
      [checked]="isMain() === true"
      (checkedChange)="isMain.set($event)"
    />
  }

  <p class="note">
    Le français fait foi : une langue laissée vide retombe sur lui plutôt que d'afficher du vide.
  </p>
</div>

<footer class="foot">
  <!-- Le retrait vit ICI parce que c'est ici qu'on voit l'image en grand :
       décider de jeter un visuel demande de le regarder. -->
  <button foldButton emphasis="soft" intent="danger" (click)="remove()">Retirer</button>
  <span class="foot-spacer"></span>
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton (click)="submit()">Enregistrer</button>
</footer>
