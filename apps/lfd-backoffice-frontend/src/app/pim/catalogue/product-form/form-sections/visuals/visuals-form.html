<!-- 🔴 Plus de sélecteur de langue ici depuis le 2026-09-23 : cette section ne
     porte plus aucun texte. L'étiquette et l'alternative décrivent l'image, pas
     l'emploi qu'une fiche en fait, et se saisissent dans la médiathèque. -->
<!-- Des visuels, et aucun que la boutique montre : c'est l'état qui a passé
     pour une panne le 2026-10-10. Rien quand la fiche n'en a aucun — le vide
     de la grille le dit déjà. -->
@if (store.noPublishedMedia()) {
  <fold-callout variant="warning">
    Aucun visuel de cette fiche n'est publié. Donnez à l'un d'eux l'usage Ouverture ou Vignette de
    rayon pour qu'il paraisse en boutique.
  </fold-callout>
}
<app-media-gallery [slots]="store.media()" (edit)="editMedia($event)" />

<!-- 🔴 Le seul geste d'ajout depuis le 2026-09-23. Il était en second, à côté
     d'un dépôt ; le dépôt est parti dans le panneau, et ce bouton est devenu
     la porte — d'où l'emphase pleine plutôt que le contour. -->
<p class="from-library">
  <button foldButton (click)="pickFromLibrary()">Choisir dans la médiathèque</button>
</p>
