<!-- 🔴 Plus de sélecteur de langue ici depuis le 2026-09-23 : cette section ne
     porte plus aucun texte. L'étiquette et l'alternative décrivent l'image, pas
     l'emploi qu'une fiche en fait, et se saisissent dans la médiathèque. -->
<app-media-gallery
  [slots]="store.media()"
  [busy]="store.uploading()"
  (edit)="editMedia($event)"
  (picked)="store.uploadMedia($event)"
/>

<!-- CHOISIR plutôt que redéposer. Le geste est à côté du dépôt et non à sa
     place : une image neuve entre toujours par le dépôt, et une image qui
     existe n'a aucune raison d'être renvoyée. -->
<p class="from-library">
  <button foldButton emphasis="outline" (click)="pickFromLibrary()">
    Choisir dans la médiathèque
  </button>
</p>
