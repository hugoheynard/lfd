<fold-page-layout [title]="title()" icon="mail">
  <fold-back-link pageEyebrow icon="arrow-back" label="Email Templates" routerLink="/emails" />
  @if (known(); as space) {
    <app-mail-space-tabs [space]="space" />
    <div class="sp-cards">
      <app-mail-sender-card [space]="space" nature="transactional" data-nature="transactional" />
      @if (sendsMarketing()) {
        <app-mail-sender-card [space]="space" nature="marketing" data-nature="marketing" />
      }
    </div>
  } @else {
    <fold-empty-state
      tone="alert"
      title="L’expéditeur n’a pas pu être lu"
      [subtitle]="'« ' + space() + ' » n’est pas un espace d’e-mails.'"
    />
  }
</fold-page-layout>
