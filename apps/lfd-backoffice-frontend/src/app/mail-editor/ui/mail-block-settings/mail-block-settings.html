@let current = block();
<div class="settings">
  @switch (current.kind) {
    @case ('button') {
      <fold-input
        type="url"
        label="Adresse du bouton"
        hint="Une adresse complète, commençant par https://"
        [value]="current.href"
        (valueChange)="setHref($event)"
        data-href
      />
    }
    @case ('image') {
      <button
        foldButton
        size="sm"
        emphasis="soft"
        icon="image"
        type="button"
        (click)="pickImage()"
        data-pick-image
      >
        {{ current.src === '' ? 'Choisir dans la médiathèque' : 'Changer d’image' }}
      </button>
      <fold-listbox
        size="sm"
        label="Format"
        hint="L’image envoyée est recadrée à ce format à la publication."
        [options]="formatOptions"
        [value]="current.format ?? 'original'"
        (selectionChange)="setFormat($event)"
        data-image-format-choice
      />
      @if (current.src !== '') {
        <app-mail-image-focal
          [src]="current.src"
          [focal]="current.focal"
          (focalChange)="setFocal($event)"
        />
      }
      <fold-checkbox
        label="Image décorative"
        hint="Elle n’apporte aucune information : pas de texte de remplacement, pas de lien."
        [checked]="current.decorative === true"
        (checkedChange)="setDecorative($event)"
        data-decorative
      />
      @if (current.decorative !== true) {
        <fold-input
          [label]="'Texte de remplacement (' + locale().toUpperCase() + ')'"
          hint="Ce que l’image dit, pour qui ne la voit pas."
          [value]="altText()"
          (valueChange)="setAlt($event)"
          data-alt
        />
        <fold-input
          type="url"
          label="Lien de l’image (facultatif)"
          hint="Une adresse complète, commençant par https://"
          [value]="current.href ?? ''"
          (valueChange)="setImageHref($event)"
          data-image-href
        />
      }
    }
    @case ('callout') {
      <fold-listbox
        size="sm"
        label="Ton de l’encadré"
        [options]="toneOptions"
        [value]="current.tone"
        (selectionChange)="setTone($event)"
        data-tone
      />
    }
    @case ('columns') {
      @for (width of current.widths; track $index) {
        <fold-listbox
          size="sm"
          [label]="'Largeur de la colonne ' + ($index + 1)"
          [options]="widthOptions"
          [value]="width"
          (selectionChange)="setWidth($index, $event)"
          [attr.data-width]="$index"
        />
      }
      <fold-listbox
        size="sm"
        label="Ajouter dans"
        [options]="cellOptions()"
        [value]="targetCell()"
        (selectionChange)="targetCell.set($event)"
        data-target-cell
      />
      <app-mail-block-library [items]="cellItems" (picked)="addToCell($event)" />
    }
  }
</div>
