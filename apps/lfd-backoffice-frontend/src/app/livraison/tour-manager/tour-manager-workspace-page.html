<!-- Le bandeau, sur le modèle de celui de la Supervision : il reste quand on change d'onglet. -->
<header class="masthead" foldSurface="chrome" data-tour-manager-masthead>
  <div class="masthead-row">
    <fold-view-toggle
      ariaLabel="Ce que Tour manager montre"
      activeStyle="raised"
      [options]="viewOptions()"
      [value]="view()"
      (valueChange)="pickView($event)"
      data-tour-manager-tabs
    />
    <div class="day-nav" data-day-nav>
      <fold-view-toggle
        ariaLabel="Jour de livraison"
        activeStyle="raised"
        [options]="dayOptions"
        [value]="days.dayValue()"
        (valueChange)="days.pickRelative($event)"
        data-day-toggle
      />
      <app-day-calendar
        [selected]="days.day()"
        [today]="days.today"
        [custom]="days.dayValue() === ''"
        (pick)="days.show($event)"
      />
    </div>
    @if (canPrintDossier()) {
      <button
        foldButton
        emphasis="outline"
        size="sm"
        icon="print"
        (click)="printDossier()"
        data-print-dossier
      >
        Imprimer le dossier du jour
      </button>
    }
    <span class="stamp" data-stamp>{{ stamp() }}</span>
  </div>
  @if (pdfFailed()) {
    <fold-callout variant="alert" data-pdf-failed>
      Le dossier des tournées n’a pas pu être téléchargé. Vérifiez la connexion et réessayez.
    </fold-callout>
  }
  @if (blockedPdfUrl(); as url) {
    <fold-callout variant="info" data-pdf-blocked>
      Le navigateur a bloqué l’ouverture d’un nouvel onglet.
      <a foldButton emphasis="outline" size="sm" [href]="url" download="dossier-des-tournees.pdf">
        Télécharger le dossier
      </a>
    </fold-callout>
  }
</header>
<router-outlet />
