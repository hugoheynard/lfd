<fold-card data-routing-settings>
  <div class="settings">
    <fold-element-title variant="title" title="Calcul des tournées" [subtitle]="provenance()">
      @if (canWrite() && state().status === 'ready') {
        <button
          titleAction
          foldButton
          size="sm"
          [loading]="saving()"
          [disabled]="!canSave()"
          (click)="save()"
          data-save-routing
        >
          Enregistrer
        </button>
      }
    </fold-element-title>

    @if (refusal(); as message) {
      <fold-callout variant="alert" announce data-routing-refusal>{{ message }}</fold-callout>
    }

    @switch (state().status) {
      @case ('loading') {
        <fold-loading message="Lecture des réglages du calcul…" />
      }
      @case ('error') {
        <fold-callout variant="alert" data-routing-error>
          Les réglages du calcul n’ont pas pu être lus.
          <button actions foldButton size="sm" emphasis="outline" (click)="retry()">
            Réessayer
          </button>
        </fold-callout>
      }
      @case ('ready') {
        <div class="fields">
          <fold-time
            label="Départ quand rien ne presse"
            hint="L’heure de départ d’une tournée qu’aucune échéance ne presse ; une échéance peut faire partir plus tôt, dès minuit."
            [value]="earliest()"
            [readOnly]="!canWrite()"
            (valueChange)="earliest.set($event)"
            data-earliest
          />
          <fold-number-input
            label="Durée maximale d’une tournée (min)"
            hint="Aller, arrêts et retour."
            integer
            [value]="maxRound()"
            [min]="1"
            [readOnly]="!canWrite()"
            (valueChange)="maxRound.set($event)"
            data-max-round
          />
          <fold-number-input
            label="Temps de livraison sur place (min)"
            hint="Se garer, décharger, faire signer, revenir — par défaut pour toutes les adresses ; une adresse peut avoir le sien dans le carnet."
            integer
            [value]="stop()"
            [min]="0"
            [readOnly]="!canWrite()"
            (valueChange)="stop.set($event)"
            data-stop-minutes
          />
          <fold-number-input
            label="Marge de sécurité (min)"
            [hint]="safetyMarginHint()"
            integer
            [value]="safetyMargin()"
            [min]="0"
            [readOnly]="!canWrite()"
            (valueChange)="safetyMargin.set($event)"
            data-safety-margin
          />
          <fold-number-input
            label="Jeu entre bacs (cm)"
            hint="L’écart laissé entre deux piles au plan de chargement, pour sortir un bac de sa rangée."
            integer
            [value]="binGap()"
            [min]="0"
            [max]="10"
            [readOnly]="!canWrite()"
            (valueChange)="binGap.set($event)"
            data-bin-gap
          />
          <fold-listbox
            label="Proposer par défaut en"
            [options]="modeOptions"
            [value]="mode()"
            [disabled]="!canWrite()"
            (selectionChange)="mode.set($event)"
            data-default-mode
          />
          <fold-listbox
            label="Contenant par défaut d’une commande"
            hint="Ce qu’occupe une commande dont ni les bacs ni les contenances ne disent rien. « Aucun » : elle est placée sans contrôle, et sa tournée dite « place non vérifiée »."
            [options]="binTypeOptions()"
            [value]="defaultBinType()"
            [disabled]="!canWrite()"
            (selectionChange)="defaultBinType.set($event)"
            data-default-bin-type
          />
          @if (hasDefaultContainer()) {
            <fold-number-input
              label="Nombre de bacs par défaut"
              integer
              [value]="defaultBinCount()"
              [min]="1"
              [readOnly]="!canWrite()"
              (valueChange)="defaultBinCount.set($event)"
              data-default-bin-count
            />
          }
        </div>
        <fold-checkbox
          label="Plusieurs passages par véhicule"
          hint="Sinon, ce qui ne tient pas dans une tournée reste à répartir."
          [checked]="multiplePassages()"
          [disabled]="!canWrite()"
          (checkedChange)="multiplePassages.set($event)"
          data-multiple-passages
        />
      }
    }
  </div>
</fold-card>
