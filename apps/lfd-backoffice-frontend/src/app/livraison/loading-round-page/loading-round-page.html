<fold-page-layout class="lrp-page">
  <app-loading-round
    [roundId]="roundId()"
    [canWrite]="canWrite()"
    layout="depot"
    [departure]="departure"
    (viewChange)="view.set($event)"
  >
    <fold-breadcrumb ariaLabel="Fil d’Ariane" [items]="crumbs()" data-loading-crumbs />
  </app-loading-round>
</fold-page-layout>
