<fold-page-layout icon="truck" [title]="title()">
  <fold-back-link pageActions label="Toutes les tournées" routerLink="/livraison/chargement" />
  @if (view(); as view) {
    <p description>
      {{ dayLabel(view.day) }} — chaque bac scanné se charge dans ce véhicule, et le bas de l’écran
      dit ce qui manque encore.
    </p>
  }

  <app-loading-round
    [roundId]="roundId()"
    [canWrite]="canWrite()"
    [departure]="departure"
    (viewChange)="view.set($event)"
  />
</fold-page-layout>
