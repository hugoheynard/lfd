<fold-card data-transfer-stop>
  <div class="mts-body">
    <fold-element-title variant="title" icon="truck" [title]="title()" [subtitle]="subtitle()">
      @if (status(); as status) {
        <fold-badge
          titleAction
          [variant]="open() ? 'info' : 'success'"
          [content]="status"
          data-transfer-status
        />
      }
    </fold-element-title>

    <div class="mts-facts">
      @if (address(); as address) {
        <span data-transfer-address>{{ address }}</span>
      }
      <strong data-transfer-bins>{{ bins() }}</strong>
    </div>

    @for (section of sections(); track section.key) {
      <section class="mts-section" [attr.data-manifest-section]="section.key">
        <fold-element-title
          variant="eyebrow"
          [title]="section.title"
          [subtitle]="section.subtitle"
        />
        <app-transfer-lines [lines]="section.totals" />
      </section>
    }

    @if (sections().length > 1) {
      <section class="mts-section" data-manifest-total>
        <fold-element-title variant="eyebrow" title="Tout le transfert, par article" />
        <app-transfer-lines [lines]="stop().totals" />
      </section>
    }

    @if (goTo(); as href) {
      <a
        foldButton
        block
        size="lg"
        icon="map-pin"
        [href]="href"
        target="_blank"
        rel="noopener"
        data-go-to
      >
        Aller à ce site
      </a>
    }

    @if (gestures() && open()) {
      <fold-inline-confirm
        intent="primary"
        message="Les bacs du transfert sont déchargés au site : l'arrêt se clôt."
        [labels]="{ confirm: 'Remis au site' }"
        [loading]="busy()"
        (confirmed)="dropped.emit(stop())"
      >
        <button foldButton block size="lg" icon="check" [disabled]="busy()" data-site-drop>
          Remis au site
        </button>
      </fold-inline-confirm>
    }
  </div>
</fold-card>
