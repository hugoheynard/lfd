<div class="form" data-handover-form>
  <app-proof-photo prompt="Prendre en photo la commande déposée" [(photo)]="photo" />

  @if (signatureRequired()) {
    <fold-input
      label="Nom de qui signe"
      placeholder="Tel qu’il le dit"
      [hint]="'De ' + nameMin + ' à ' + nameMax + ' caractères'"
      [value]="receiverName()"
      (valueChange)="receiverName.set($event)"
      data-receiver-name
    />
    <span class="label">Signature exigée : faites signer au doigt</span>
    <app-signature-pad (signed)="signature.set($event)" />
    <app-proof-photo
      prompt="Prendre en photo le bon signé"
      [(photo)]="signedSlip"
      data-signed-slip
    />
  }

  @if (refusal(); as refusal) {
    <fold-callout variant="alert" data-handover-refusal>{{ refusal }}</fold-callout>
  }

  <div class="row">
    <button
      foldButton
      emphasis="outline"
      intent="neutral"
      [disabled]="sending()"
      (click)="cancelled.emit()"
    >
      Annuler
    </button>
    <button
      foldButton
      [loading]="sending()"
      [disabled]="!canSend()"
      (click)="send()"
      data-send-handover
    >
      Valider la livraison
    </button>
  </div>
</div>
