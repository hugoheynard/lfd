<fold-page-layout icon="clock" title="Heures limites de commande">
  @switch (state()) {
    @case ('loading') {
      <fold-loading message="Chargement des points de retrait…" />
    }
    @case ('error') {
      <fold-empty-state tone="alert" title="Impossible de charger les points de retrait">
        <button foldButton (click)="load()">Réessayer</button>
      </fold-empty-state>
    }
    @case ('ready') {
      <app-cutoffs-section [points]="points()" />
    }
  }
</fold-page-layout>
