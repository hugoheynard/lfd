<fold-page-layout icon="list" title="Motifs des demandes">
  <p description>
    Ce que le client choisit en écrivant ou en signalant un problème de commande, l'adresse où
    chaque demande part par e-mail, et sa priorité dans la boîte des demandes.
  </p>

  <fold-nav-layout>
    <fold-tabs
      tabNav
      #bar="foldTabs"
      size="compact"
      activeStyle="fill"
      background="surface"
      [tabs]="tabs"
      [(activeKey)]="tab"
    />

    <fold-tab-panel [tabs]="bar" [key]="tab()">
      <app-request-reasons-list [kind]="tab()" />
    </fold-tab-panel>
  </fold-nav-layout>
</fold-page-layout>
