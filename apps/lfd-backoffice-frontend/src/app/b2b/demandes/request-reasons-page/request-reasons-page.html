<!-- Pas de `fold-page-layout` : l'en-tête — titre, icône, description — est
     celui de la coquille `CommercialPage`, lu dans `COMMERCIAL_VIEWS`. -->
<fold-nav-layout>
  <fold-tabs
    tabNav
    #bar="foldTabs"
    size="compact"
    activeStyle="fill"
    background="surface"
    [tabs]="tabs"
    [(activeKey)]="tab"
  />

  <fold-tab-panel [tabs]="bar" [key]="tab()">
    <app-request-reasons-list [kind]="tab()" />
  </fold-tab-panel>
</fold-nav-layout>
