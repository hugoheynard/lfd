<div class="rrl-list">
  @switch (state()) {
    @case ('loading') {
      <fold-loading message="Chargement des motifs…" />
    }
    @case ('error') {
      <fold-empty-state tone="alert" title="Impossible de charger les motifs">
        <button foldButton (click)="load()">Réessayer</button>
      </fold-empty-state>
    }
    @case ('ready') {
      <fold-element-title
        variant="caps"
        title="Motifs proposés"
        subtitle="Ce que le client choisit, dans cet ordre."
      >
        @if (canWrite()) {
          <button
            titleAction
            foldButton
            icon="plus"
            size="sm"
            type="button"
            (click)="add()"
            data-add
          >
            Ajouter un motif
          </button>
        }
      </fold-element-title>
      @for (row of rows(); track row.reason.id) {
        <fold-card data-reason>
          <fold-element-title
            variant="title"
            [title]="row.reason.label.fr"
            [subtitle]="row.subtitle"
          >
            <div titleAction class="rrl-row-actions">
              <fold-badge
                [variant]="priorityVariants[row.reason.priority]"
                [content]="priorityLabels[row.reason.priority]"
                data-priority
              />
              @if (!row.reason.active) {
                <fold-badge variant="neutral" content="Non proposé" data-inactive />
              }
              <button
                foldButton
                emphasis="outline"
                size="sm"
                type="button"
                (click)="openReason(row.reason)"
                data-open
              >
                {{ canWrite() ? 'Corriger' : 'Voir' }}
              </button>
            </div>
          </fold-element-title>
        </fold-card>
      } @empty {
        <fold-empty-state
          title="Aucun motif"
          subtitle="Sans motif, la boutique n'a rien à proposer pour ce type de demande."
          data-empty
        >
          <fold-icon empty-icon name="mail" />
        </fold-empty-state>
      }
    }
  }
</div>
