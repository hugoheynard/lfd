<div class="cph-list">
  <fold-element-title
    variant="caps"
    title="Numéros"
    subtitle="Affichés sur la carte, dans cet ordre, au public choisi."
  >
    @if (canWrite()) {
      <button
        titleAction
        foldButton
        icon="plus"
        size="sm"
        type="button"
        (click)="add()"
        data-add-phone
      >
        Ajouter un numéro
      </button>
    }
  </fold-element-title>

  @for (phone of rows(); track phone.id) {
    <fold-card data-phone>
      <fold-element-title variant="title" [title]="phone.label.fr" [subtitle]="phone.number">
        <div titleAction class="cph-actions">
          <fold-badge variant="neutral" [content]="audienceLabels[phone.audience]" />
          @if (!phone.active) {
            <fold-badge variant="warning" content="Masqué" data-hidden />
          }
          <button
            foldButton
            emphasis="outline"
            size="sm"
            type="button"
            (click)="openPhone(phone)"
            data-open-phone
          >
            {{ canWrite() ? 'Corriger' : 'Voir' }}
          </button>
        </div>
      </fold-element-title>
    </fold-card>
  } @empty {
    <fold-empty-state
      title="Aucun numéro"
      subtitle="La boutique affiche son numéro actuel tant qu'aucun n'est réglé."
      data-phones-empty
    >
      <fold-icon empty-icon name="phone" />
    </fold-empty-state>
  }
</div>
