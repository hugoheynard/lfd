<fold-callout variant="info">
  <div class="body">
    <h2 class="title">{{ title() }}</h2>
    <p>
      Arrivés du référentiel, ils ne sont servis à une audience qu'une fois validés pour elle.
      Chacun se valide sous sa ligne.
    </p>
  </div>
  <button
    actions
    foldButton
    size="sm"
    type="button"
    emphasis="outline"
    intent="neutral"
    (click)="showPending.emit()"
  >
    Voir les articles en attente
  </button>
  <button actions foldButton size="sm" type="button" [loading]="busy()" (click)="approveAll()">
    Tout valider
  </button>
</fold-callout>
