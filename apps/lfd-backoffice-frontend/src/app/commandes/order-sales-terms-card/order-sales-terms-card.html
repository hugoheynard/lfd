@switch (state()) {
  @case ('error') {
    <fold-callout variant="alert" data-doc-state>
      Les CGV de cette commande n’ont pas pu être lues.
      <button foldButton size="sm" emphasis="soft" (click)="retry()">Réessayer</button>
    </fold-callout>
  }
  @case ('ready') {
    @if (sentence(); as text) {
      <app-document-row
        icon="contracts"
        title="Conditions générales de vente"
        [meta]="text"
        data-order-sales-terms-sentence
      >
        @if (fileUrl(); as url) {
          <a
            rowActions
            foldButton
            size="sm"
            emphasis="soft"
            [href]="url"
            target="_blank"
            rel="noopener"
            data-order-sales-terms-pdf
            >Télécharger</a
          >
        }
      </app-document-row>
    } @else {
      <app-document-row
        icon="contracts"
        title="Conditions générales de vente"
        meta="Commande passée avant l’enregistrement des CGV : aucune version n’est connue."
        data-order-sales-terms-unknown
      />
    }
  }
}
