@if (rows().length > 0) {
  <fold-callout appearance="inset" variant="warning" data-item-limit-overrides>
    <div class="overrides">
      <p class="override-title">Limites de produit dépassées ({{ rows().length }})</p>
      @for (row of rows(); track $index) {
        <!-- Trois lignes : quoi et quelle limite ; la demande (le motif, tel que
             l'équipe l'a écrit) ; qui l'a acceptée, quand et où. -->
        <div class="override" data-item-limit-override>
          <p class="override-what" data-override-what>
            <strong>{{ row.product }}</strong> — limite {{ row.limit }}
          </p>
          <p class="override-why" data-override-why>« {{ row.reason }} »</p>
          <p class="override-who" data-override-who>
            Acceptée par {{ row.by }}, le {{ row.recordedAt | date: 'dd/MM/yyyy à HH:mm' }},
            {{ row.origin }}
          </p>
        </div>
      }
    </div>
  </fold-callout>
}
