<fieldset class="bcf" data-budget-commitment>
  <legend class="bcf-legend">Engagement budgétaire</legend>
  @if (requirementsFailed()) {
    <fold-callout variant="alert" data-budget-commitment-unread>
      Les exigences de ce payeur n’ont pas pu être lues : la saisie reste possible, et la validation
      dira ce qui manque.
    </fold-callout>
  }
  @if (onQuote()) {
    <p class="bcf-standing" data-budget-commitment-on-quote>{{ onQuoteLine }}</p>
  } @else {
    <fold-input
      label="N° d’engagement"
      [required]="numberRequired()"
      [optional]="!numberRequired()"
      optionalLabel="facultatif"
      [hint]="numberHint()"
      [(value)]="number"
      data-budget-commitment-number
    />
    @if (standingLine(); as line) {
      <p class="bcf-standing" data-budget-commitment-standing>{{ line }}</p>
    }
  }
  <fold-input
    label="Code service"
    [required]="serviceCodeRequired()"
    [optional]="!serviceCodeRequired()"
    optionalLabel="facultatif"
    [hint]="serviceCodeHint()"
    [(value)]="serviceCode"
    data-budget-commitment-service
  />
</fieldset>
