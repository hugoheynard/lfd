@switch (state()) {
  @case ('loading') {
    <fold-loading message="Chargement de la commande…" />
  }
  @case ('error') {
    <fold-empty-state tone="alert" title="Impossible de charger cette commande">
      <button foldButton (click)="load()">Réessayer</button>
    </fold-empty-state>
  }
  @default {
    @if (order(); as o) {
      <!-- `audience="staff"` : les mêmes étapes que chez le client, mais
           chacune dit ce qu'elle veut dire dans l'atelier. Au téléphone, le
           commercial a l'écran du client sous les yeux, augmenté — jamais un
           autre écran. -->
      <!-- 🔴 `selectableLines` n'est vrai qu'ICI : l'explication s'appuie sur
           la trace ENTIÈRE, que les routes clientes ne servent plus (R27).
           Le même composant, deux publics, un geste de plus au comptoir. -->
      <lfd-order-detail
        audience="staff"
        [order]="o"
        [documents]="documents()"
        [selectableLines]="true"
        (lineSelected)="explain($event)"
        (documentAsked)="onDocument($event)"
      >
        <!-- L'autre geste staff sur une commande passée : l'annuler, tant
             qu'elle n'est pas au compte à produire (annulation-par-le-staff.md,
             C3.8). Absent sans le droit, désactivé avec la raison sinon. -->
        <!-- Modifier (plan de modification, M3, §6) : ce que le serveur dit de la
             modification, avec sa raison quand elle est bloquée. -->
        <app-order-revise-action
          actions
          [orderId]="o.id"
          [revisability]="o.revisability"
          [cancellability]="o.cancellability"
        />
        <app-order-cancel
          actions
          [orderId]="o.id"
          [cancellability]="o.cancellability"
          (cancelled)="load()"
        />
      </lfd-order-detail>

      <!-- Le manque signalé au colisage (E6a) : rien sans signalement en vigueur. -->
      <app-order-shortfall-banner [shortfall]="o.shortfall" [lines]="o.lines" />
      <!-- La décision du départ (E6b), sous le bandeau : rien sans manque signalé. -->
      <app-order-shortfall-decision
        [orderId]="o.id"
        [shortfall]="o.shortfall"
        [lines]="o.lines"
        (decided)="onShortfallDecided()"
      />

      <!-- L'argent à rendre d'une commande annulée (C4.9) : rien sans demande. -->
      <app-order-refund-banner [orderId]="o.id" [refund]="o.refund" (retried)="load()" />

      <!-- Les remboursements Stripe constatés : rien quand il n'y en a pas. -->
      <app-order-refunds-card [refunds]="o.refunds" />

      <!-- Les bons de livraison (plan E5a, § 3) : rien avant l'arrêt du plan. -->
      <app-order-delivery-notes-card [orderId]="o.id" [refresh]="notesRefresh()" />

      <!-- La facture et les avoirs de la commande (E5c) : rien quand il n'y en a pas. -->
      <app-order-invoices-card [orderId]="o.id" />

      <!-- La preuve de livraison : rien quand la commande n'a pas été remise à la porte. -->
      <app-handover-proof-card [orderId]="o.id" />

      <!-- Les CGV figées à la passation (plan des CGV, C4) : texte, révision, PDF. -->
      <app-order-sales-terms-card [orderId]="o.id" />

      <!-- Les faits du journal qui touchent la commande, le plus récent d'abord. -->
      <app-order-history-card [orderId]="o.id" />
      <!-- Les versions qu'une modification a remplacées (plan de modification, §6). -->
      @if (o.revision > 0) {
        <app-order-revisions-card [orderId]="o.id" />
      }
    }
  }
}
