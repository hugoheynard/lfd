@switch (state()) {
  @case ('error') {
    <fold-callout variant="alert" data-order-mails-error data-doc-state>
      Les e-mails de cette commande n’ont pas pu être lus.
      <button foldButton size="sm" emphasis="soft" (click)="retry()">Réessayer</button>
    </fold-callout>
  }
  @case ('ready') {
    <div class="rows" data-order-mails>
      @for (line of lines(); track line.id) {
        <app-document-row icon="mail" [meta]="line.meta" [attr.data-order-mail]="line.id">
          @if (canOpenSends()) {
            <a
              rowTitle
              routerLink="/emails/envois"
              [queryParams]="{ envoi: line.id }"
              [attr.title]="line.template"
              data-order-mail-link
              >{{ line.title }}</a
            >
          } @else {
            <span rowTitle [attr.title]="line.template">{{ line.title }}</span>
          }
          <fold-badge
            ngProjectAs="[rowActions]"
            radius="square"
            [variant]="line.status.tone"
            [content]="line.status.label"
            data-order-mail-status
          />
          @if (line.failure; as failure) {
            <fold-callout
              ngProjectAs="[rowBelow]"
              appearance="inset"
              variant="alert"
              data-order-mail-failure
              >{{ failure }}</fold-callout
            >
          }
        </app-document-row>
      }
    </div>
  }
}
