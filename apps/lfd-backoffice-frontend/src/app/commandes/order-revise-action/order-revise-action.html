@if (allowed()) {
  @if (blocker(); as why) {
    @if (quiet()) {
      <p class="quiet" data-revise-blocked>{{ why }}</p>
    } @else {
      <fold-callout appearance="inset" variant="info" data-revise-blocked>{{ why }}</fold-callout>
    }
  } @else {
    <a foldButton size="sm" emphasis="outline" [routerLink]="link()" data-revise-trigger>
      {{ label() }}
    </a>
  }
}
