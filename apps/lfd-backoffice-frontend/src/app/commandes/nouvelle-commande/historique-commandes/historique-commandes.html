@if (orders().length === 0) {
  <fold-empty-state
    title="Aucune commande"
    subtitle="Ce compte n'a encore rien commandé — le catalogue est à côté."
  />
} @else {
  <ul class="his-list">
    @for (row of visible(); track row.id) {
      <li>
        <lfd-order-row
          [order]="row"
          [selected]="selectedId() === row.id"
          (open)="select.emit(row.id)"
        />
      </li>
    }
  </ul>

  @if (orders().length > pageSize) {
    <fold-paginator
      class="his-pages"
      [currentPage]="page()"
      [totalItems]="orders().length"
      [pageSize]="pageSize"
      [pageSizeOptions]="[]"
      [siblingCount]="0"
      (pageChange)="page.set($event)"
    />
  }
}
