<fold-panel-header title="Panier" [subtitle]="data().companyName" (closed)="close()" />

<app-panier-commande
  class="pnl-body"
  [headed]="false"
  [cart]="data().cart"
  [draft]="data().draft"
  [companyName]="data().companyName"
  [buyers]="data().buyers"
  [pickups]="data().pickups"
  [addresses]="data().addresses"
  [zones]="data().zones"
  [deliveryAvailability]="data().deliveryAvailability"
  [audience]="data().audience"
  [preferredPickupId]="data().preferredPickupId"
  [settlesOnAccount]="data().settlesOnAccount"
  [canKeepAddress]="data().canKeepAddress"
  [counterPlaceId]="data().counterPlaceId"
  [shelfIssue]="data().shelfIssue()"
  [estimate]="data().estimate()"
  [estimateReady]="data().estimateReady()"
  [linkOffered]="data().linkOffered"
  (place)="onPlace($event)"
/>
