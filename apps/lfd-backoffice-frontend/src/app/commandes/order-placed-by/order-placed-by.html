@let l = lines();
<fold-card data-placed-by>
  <lfd-section-title title="Contact" />
  <div class="contact">
    <p class="person" data-placed-by-person>{{ l.person }}</p>
    <p class="reach" data-placed-by-email>
      <fold-icon name="mail" size="sm" tone="muted" aria-hidden="true" />
      <fold-link [href]="'mailto:' + l.email">{{ l.email }}</fold-link>
    </p>
    @if (l.phone; as phone) {
      <p class="reach" data-placed-by-phone>
        <fold-icon name="phone" size="sm" tone="muted" aria-hidden="true" />
        <fold-link [href]="'tel:' + phone">{{ phone }}</fold-link>
      </p>
    }
  </div>
</fold-card>
