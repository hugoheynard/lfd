@switch (state()) {
  @case ('loading') {
    <fold-loading message="Chargement des brouillons…" />
  }
  @case ('error') {
    <fold-empty-state
      tone="alert"
      title="Impossible de charger les brouillons"
      subtitle="La lecture a échoué — les brouillons, eux, sont intacts."
    >
      <button foldButton (click)="load()">Réessayer</button>
    </fold-empty-state>
  }
  @default {
    @if (rows().length === 0) {
      <fold-empty-state
        icon="edit"
        title="Aucun brouillon"
        subtitle="Une saisie mise de côté par « Enregistrer le brouillon » se retrouve ici."
      />
    } @else {
      <ul class="odl-list">
        @for (draft of rows(); track draft.companyId) {
          <li>
            <fold-card
              padding="md"
              [interactive]="true"
              [ariaLabel]="'Reprendre la saisie de ' + draft.companyName"
              (activated)="resume(draft)"
              [attr.data-draft]="draft.companyId"
            >
              <span class="odl-row">
                <strong>{{ draft.companyName }}</strong>
                <span class="odl-saved">{{ savedLabel(draft) }}</span>
              </span>
            </fold-card>
          </li>
        }
      </ul>
    }
  }
}
