@switch (state()) {
  @case ('loading') {
    <fold-loading message="Chargement des brouillons…" />
  }
  @case ('error') {
    <fold-empty-state
      tone="alert"
      title="Impossible de charger les brouillons"
      subtitle="La lecture a échoué — les brouillons, eux, sont intacts."
    >
      <button foldButton (click)="load()">Réessayer</button>
    </fold-empty-state>
  }
  @default {
    <!-- La table des autres listes : une ligne rouvre la saisie du compte. -->
    <fold-data-table
      hover
      clickable
      density="compact"
      caption="Brouillons de commande"
      [columns]="columns"
      [rows]="rows()"
      [rowKey]="rowKey"
      [empty]="empty"
      (rowClick)="resume($event)"
    >
      <ng-template foldCell="savedAt" let-row>
        <span class="odl-stack" [attr.data-draft]="row.companyId">
          <span>{{ date(row) }}</span>
          <span class="odl-time">{{ time(row) }}</span>
        </span>
      </ng-template>
      <ng-template foldCell="companyName" let-row>{{ row.companyName }}</ng-template>
      <ng-template foldCell="savedByName" let-row>{{ row.savedByName ?? '—' }}</ng-template>
    </fold-data-table>
  }
}
