@if (loadError()) {
  <fold-callout variant="alert" data-order-delivery-notes-error data-doc-state>
    Impossible de lire les bons de livraison de cette commande.
    <button foldButton size="sm" emphasis="soft" (click)="retry()">Réessayer</button>
  </fold-callout>
} @else if (notes().length > 0) {
  <div class="rows" data-order-delivery-notes>
    @for (note of notes(); track note.number) {
      <!-- Imprimer : le bon de TRANSPORT, celui que le livreur emporte (l'impression
           est tracée). Télécharger : le bon CHIFFRÉ du client quand il existe,
           sinon le bon de transport. -->
      <app-document-row
        icon="truck"
        [title]="'Bon de livraison ' + note.number"
        [meta]="meta(note)"
        [attr.data-delivery-note]="note.number"
      >
        <button
          rowActions
          foldButton
          size="sm"
          emphasis="soft"
          [attr.title]="note.money !== null ? 'Le bon chiffré du client' : 'Le bon de transport'"
          (click)="download(note)"
          data-doc-download
          [attr.data-download-client]="note.money !== null ? '' : null"
        >
          Télécharger
        </button>
        <button
          rowActions
          foldButton
          size="sm"
          emphasis="soft"
          title="Le bon de transport, pour le livreur"
          (click)="print(note)"
          data-doc-print
          data-print-carrier
        >
          Imprimer
        </button>
        @if (note.reprintNeeded) {
          <fold-callout
            ngProjectAs="[rowBelow]"
            appearance="inset"
            variant="warning"
            [attr.data-reprint-needed]="note.number"
          >
            {{ reprintSentence }}
          </fold-callout>
        }
      </app-document-row>
    }
  </div>
}
