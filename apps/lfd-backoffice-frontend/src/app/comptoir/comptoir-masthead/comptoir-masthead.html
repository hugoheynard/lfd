<!-- Une rangée : on va à une vue à gauche, et le retrait dit où il en est à
     droite. Si la largeur manque, la part du retrait passe dessous, EN BLOC,
     dans la même bande. -->
<header class="masthead" foldSurface="chrome">
  <fold-view-nav
    class="masthead-views"
    [items]="views()"
    direction="horizontal"
    size="comfortable"
    justify="start"
    activeStyle="fill"
    background="transparent"
  />

  @if (holdsCounter()) {
    <app-handover-masthead />
  }
</header>
