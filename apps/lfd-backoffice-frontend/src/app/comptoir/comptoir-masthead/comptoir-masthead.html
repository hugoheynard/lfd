<!-- Deux rangées (Hugo, 2026-10-12) : d'abord où l'on est — point de retrait,
     compteurs, journée —, puis les vues du comptoir dessous, en pleine largeur. -->
<header class="masthead" foldSurface="chrome">
  @if (holdsCounter()) {
    <app-handover-masthead />
  }

  <fold-view-nav
    [items]="views()"
    direction="horizontal"
    size="comfortable"
    justify="stretch"
    activeStyle="fill"
    background="transparent"
  />
</header>
