<!-- Deux rangées (Hugo, 2026-10-12) : d'abord où l'on est — point de retrait,
     compteurs, journée —, puis les vues du comptoir dessous, en pleine largeur. -->
<header class="masthead" foldSurface="chrome">
  @if (holdsCounter()) {
    <app-handover-masthead />
  }

  <!-- Les vues en onglets ; « Nouvelle commande » est un geste, pas une vue :
       un bouton, qui ouvre le même dialogue que la liste des commandes. -->
  <div class="masthead-row">
    <fold-view-nav
      class="masthead-views"
      [items]="views()"
      direction="horizontal"
      size="comfortable"
      justify="stretch"
      activeStyle="fill"
      background="transparent"
    />
    @if (canPlace() && !narrow()) {
      <button foldButton intent="primary" (click)="openNewOrder()" data-new-order>
        Nouvelle commande
      </button>
    }
  </div>
</header>

<!-- Au téléphone, l'action principale flotte en bas à droite, sous le pouce. -->
@if (canPlace() && narrow()) {
  <app-new-order-fab origin="/comptoir" [point]="activePoint()" />
}
