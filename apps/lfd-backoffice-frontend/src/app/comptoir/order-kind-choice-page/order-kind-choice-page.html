<fold-page-layout title="Nouvelle commande">
  <fold-back-link pageEyebrow [routerLink]="target()" [label]="backLabel()" />
  <div class="choices">
    <fold-card interactive ariaLabel="Commande pro" (activated)="go(pro)" data-choice-pro>
      <fold-element-title
        variant="title"
        icon="customer-account"
        title="Commande pro"
        subtitle="Pour un compte pro actif : on cherche le compte, puis on saisit sa commande."
      />
    </fold-card>
    <fold-card
      interactive
      ariaLabel="Commande particulier"
      (activated)="go(particular)"
      data-choice-particular
    >
      <fold-element-title
        variant="title"
        icon="shopping-cart"
        title="Commande particulier"
        subtitle="Pour un particulier, au retrait : elle se règle à la caisse de la boutique, en venant."
      />
    </fold-card>
  </div>
</fold-page-layout>
