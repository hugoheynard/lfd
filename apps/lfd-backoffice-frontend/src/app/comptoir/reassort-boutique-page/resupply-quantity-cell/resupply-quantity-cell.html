<div
  class="quantity"
  [attr.data-resupply-quantity]="row().sku"
  (focusout)="commit()"
  (keydown.enter)="commit()"
>
  @for (amount of downSteps(); track amount) {
    <button
      class="shortcut"
      foldButton
      type="button"
      emphasis="soft"
      intent="neutral"
      size="sm"
      [disabled]="!quantity()"
      (click)="stepDown(amount)"
    >
      −{{ amount | saleQuantity: row().saleUnit }}
    </button>
  }
  <!-- En mobile, la case seule ouvre le dialogue des raccourcis. -->
  <div class="cell" (click)="openDialog()">
    <fold-number-input
      size="sm"
      align="center"
      [placeholder]="row().saleUnit === 'weight' ? 'g' : ''"
      [readOnly]="phone()"
      [value]="quantity()"
      (valueChange)="setQuantity($event)"
      [min]="0"
      integer
    />
  </div>
  @if (row().saleUnit === 'weight') {
    <span class="muted" [attr.data-resupply-weight]="row().sku">
      @if (quantity(); as grams) {
        {{ grams | saleQuantity: 'weight' }}
      } @else {
        en grammes
      }
    </span>
  }
  @for (amount of upSteps(); track amount) {
    <button
      class="shortcut"
      foldButton
      type="button"
      emphasis="soft"
      intent="neutral"
      size="sm"
      (click)="step(amount)"
    >
      +{{ amount | saleQuantity: row().saleUnit }}
    </button>
  }
</div>
