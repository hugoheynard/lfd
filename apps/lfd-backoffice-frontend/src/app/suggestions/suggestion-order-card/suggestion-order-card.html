<fold-card>
  <div class="card">
    <fold-element-title
      variant="title"
      title="Quand plusieurs suggestions s'appliquent"
      subtitle="Au même endroit et au même moment, laquelle passe d'abord."
    />
    <p class="current">
      La plus récente : la dernière règle créée passe d'abord. Par priorité : la priorité la plus
      haute d'abord, puis la plus récente.
    </p>
    @if (order() !== null) {
      @if (canWrite()) {
        <fold-view-toggle
          ariaLabel="Ordre des suggestions"
          size="sm"
          [options]="options"
          [value]="order() ?? ''"
          (valueChange)="choose($event)"
        />
      } @else {
        <p class="current">Réglage actuel : {{ label() }}.</p>
      }
    }
    @if (failure(); as message) {
      <fold-callout appearance="inset" variant="alert" announce>{{ message }}</fold-callout>
    }
  </div>
</fold-card>
