<!-- Un sous-compte peut suivre le tarif de son principal : c'est la décision
     du commercial (sous-comptes, Q9), et elle se prend ici, à côté des
     prix qu'elle concerne. Rien pour un compte sans principal. -->
<app-pricing-follow [companyId]="id()" />

@switch (state()) {
  @case ('loading') {
    <fold-loading message="Lecture des tarifs du compte…" />
  }
  @case ('error') {
    <fold-empty-state
      tone="alert"
      title="Impossible de charger les tarifs"
      subtitle="La lecture a échoué — les prix accordés, eux, sont intacts."
    >
      <button foldButton (click)="load()">Réessayer</button>
    </fold-empty-state>
  }
  @default {
    @switch (mode()) {
      @case ('empty') {
        <!--
          **Rien de négocié, donc rien à lire.** Un état vide plutôt que la
          grille de saisie ouverte : cet onglet se consulte cent fois pour une
          fois qu'on l'édite, et présenter d'emblée quatre-vingt-douze champs
          vides ferait passer la lecture pour une saisie abandonnée.
        -->
        <fold-empty-state
          title="Aucune mercuriale"
          subtitle="Ce compte paie le tarif catalogue pro. Établir une mercuriale y pose un tarif négocié, article par article, sur une période datée."
        >
          @if (canWrite()) {
            <button foldButton (click)="compose()" data-compose>Poser une mercuriale</button>
          }
        </fold-empty-state>
      }

      @case ('posed') {
        <!--
          **On peut préparer la suivante pendant que celle-ci tourne.** Sans ce
          bouton, l'entrée en composition n'existait que dans l'état vide : il
          aurait fallu clore le tarif en cours pour commencer à négocier le
          prochain, c'est-à-dire laisser le client au tarif catalogue entre les
          deux. Le serveur, lui, ne refuse que le CHEVAUCHEMENT — préparer
          janvier en septembre n'en est pas un.
        -->
        @if (canWrite()) {
          <div class="tf-head-actions tf-start">
            <button foldButton (click)="compose()" data-compose>Préparer une mercuriale</button>
          </div>
        }

        @for (mercuriale of mercuriales(); track mercuriale.id) {
          <app-posed-mercuriale
            [companyId]="id()"
            [mercuriale]="mercuriale"
            [categories]="categories()"
            (changed)="onAmended()"
          />
        }
      }

      @case ('composing') {
        <app-mercuriale-composer
          [companyId]="id()"
          [categories]="categories()"
          [blocked]="blocking().length > 0"
          [(label)]="label"
          [(validFrom)]="validFrom"
          [(validTo)]="validTo"
          [(draft)]="draft"
          (posed)="onPosed()"
          (discarded)="onDiscarded()"
        />
      }
    }
  }
}

<!-- Le journal du tarif vit sous la grille, quel que soit l'état de sa
     lecture : il répond à « depuis quand suit-il ce tarif ? », une autre
     question que « combien paie-t-il ? ». -->
<app-tariff-journal-card [companyId]="id()" />
