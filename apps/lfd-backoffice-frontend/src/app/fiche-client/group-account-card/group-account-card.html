<fold-card>
  <fold-element-title cardHeader variant="title" icon="company" title="Compte de groupe" />
  <div class="body">
    <p class="state" data-group-state>
      @if (checked()) {
        <strong>Compte de groupe, sans livraison.</strong> Il négocie pour ses sous-comptes et ne
        commande pas pour lui-même.
      } @else {
        Ce compte commande pour lui-même.
      }
    </p>

    @if (confirming()) {
      <!-- Un changement de nature du compte : il se confirme, en disant ce
           qu'il retire ou ce qu'il exige. -->
      <fold-inline-confirm
        [open]="true"
        [intent]="checked() ? 'primary' : 'danger'"
        [message]="confirmMessage()"
        [loading]="saving()"
        (confirmed)="apply()"
        (cancelled)="confirming.set(false)"
        data-group-confirm
      >
        <span hidden></span>
      </fold-inline-confirm>
    } @else {
      <button
        foldButton
        size="sm"
        [emphasis]="checked() ? 'outline' : 'solid'"
        (click)="confirming.set(true)"
        data-group-toggle
      >
        {{ checked() ? 'Désactiver' : 'Activer' }}
      </button>
    }

    @if (refusal(); as refusal) {
      <fold-callout variant="alert" data-group-refusal>{{ refusal }}</fold-callout>
    }
  </div>
</fold-card>
