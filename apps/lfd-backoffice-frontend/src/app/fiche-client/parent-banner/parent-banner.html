<!-- Détacher se fait depuis le principal depuis le 2026-10-20 : c'est sa
     page Sous-comptes qui montre ce que le détachement lui retire. -->
<fold-callout variant="info" icon="company" data-parent-banner>
  {{ kindLabel() }}
  <a [routerLink]="['/comptes-clients', parent().id]">{{ parent().enseigne }}</a
  >.
  <a
    actions
    foldButton
    size="sm"
    emphasis="outline"
    [routerLink]="['/comptes-clients', parent().id, 'sous-comptes']"
    data-parent-settle
  >
    Régler depuis {{ parent().enseigne }}
  </a>
</fold-callout>
