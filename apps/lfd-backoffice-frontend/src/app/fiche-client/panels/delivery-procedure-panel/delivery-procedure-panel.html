<fold-panel-header title="Procédure de livraison" [subtitle]="subtitle()" />

<fold-panel-body>
  <app-delivery-deposit-toggle
    [companyId]="data().companyId"
    [addressId]="data().address.id"
    [depositAllowed]="data().address.depositAllowed"
    (changed)="data().onDepositChange($event)"
  />

  <lfd-delivery-procedure-editor
    [addressId]="data().address.id"
    [canEdit]="true"
    (stepCountChange)="data().onStepCountChange($event)"
  />
</fold-panel-body>

<fold-panel-footer align="end">
  <button foldButton type="button" emphasis="outline" intent="neutral" (click)="close()">
    Fermer
  </button>
</fold-panel-footer>
