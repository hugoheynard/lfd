<!-- En LECTURE depuis le 2026-10-20 : le suivi se règle dans la grille de la
     page Sous-comptes du principal, où l'on voit tous ses sites ensemble. -->
<fold-callout [variant]="current() === null ? 'neutral' : 'info'" data-follow-parent>
  @if (current() !== null) {
    <span data-follow-since>
      {{ label() }} : suit
      <a [routerLink]="['/comptes-clients', parent().id]">{{ parent().enseigne }}</a>
      depuis le {{ since() }}. {{ hint() }}
    </span>
  } @else {
    <span>{{ label() }} : ne suit pas {{ parent().enseigne }}.</span>
  }
  <a
    actions
    foldButton
    size="sm"
    emphasis="outline"
    [routerLink]="['/comptes-clients', parent().id, 'sous-comptes']"
    data-follow-settle
  >
    Régler depuis {{ parent().enseigne }}
  </a>
</fold-callout>
