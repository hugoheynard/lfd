@if (subAccounts().length > 0) {
  <fold-card>
    <fold-element-title
      cardHeader
      variant="title"
      icon="company"
      [title]="'Sous-comptes · ' + subAccounts().length"
    >
      <a
        titleAction
        foldButton
        size="sm"
        emphasis="outline"
        [routerLink]="['/comptes-clients', companyId(), 'sous-comptes']"
      >
        Gérer
      </a>
    </fold-element-title>

    <ul class="children">
      @for (child of subAccounts(); track child.id) {
        <li class="child" data-sub-account>
          <a class="child-name" [routerLink]="['/comptes-clients', child.id]">
            {{ child.enseigne }}
          </a>
          <span class="child-city">{{ child.city ?? 'Sans adresse de livraison' }}</span>
          <fold-status-badge [status]="child.status" [label]="statusLabels[child.status]" />
        </li>
      }
    </ul>
  </fold-card>
}
