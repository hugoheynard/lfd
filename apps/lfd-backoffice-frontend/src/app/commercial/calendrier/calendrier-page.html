<section class="cal">
  <div class="cal-bar">
    <!-- Un seul flux : pas de chips. Filtrer une liste qui n'a qu'une source ne
         peut que la vider. -->
    <fold-calendar-toolbar [(date)]="date" [(view)]="view" [today]="today()" [views]="views" />
  </div>

  @if (state() === 'error') {
    <fold-callout appearance="inset" variant="alert" announce>
      Les rendez-vous n'ont pas pu être chargés — le backend B2B est-il démarré&nbsp;?
    </fold-callout>
  }

  <div class="cal-body">
    <div class="cal-grid">
      @switch (view()) {
        @case ('week') {
          <fold-calendar-week
            [date]="date()"
            [events]="events()"
            [today]="today()"
            (eventClick)="openEvent($event)"
          />
        }
        @case ('day') {
          <fold-calendar-day
            [date]="date()"
            [events]="events()"
            [today]="today()"
            (eventClick)="openEvent($event)"
          />
        }
        @default {
          <fold-calendar-month
            [(month)]="date"
            [events]="events()"
            [today]="today()"
            maxLanes="4"
            (eventClick)="openEvent($event)"
          />
        }
      }
    </div>

    <aside class="cal-aside">
      <fold-calendar-agenda
        [from]="today() ?? date()"
        [events]="events()"
        [(mode)]="agendaMode"
        [(collapsed)]="agendaCollapsed"
        (eventClick)="openEvent($event)"
      />
    </aside>
  </div>
</section>
