<fold-card surface="sunken" padding="md">
  <fold-page-section title="Réductions de retrait sur ce site" separator>
    @if (loadError(); as message) {
      <fold-empty-state tone="alert" title="Les réductions ne s'affichent pas" [subtitle]="message">
        <button foldButton size="sm" type="button" (click)="load()">Réessayer</button>
      </fold-empty-state>
    } @else if (catalogue(); as current) {
      <div class="audiences">
        @for (audience of audiences; track audience) {
          <app-audience-discount-card
            [site]="site()"
            [audience]="audience"
            [catalogue]="current"
            [readOnly]="readOnly()"
            (saved)="saved.emit()"
          />
        }
      </div>
    } @else {
      <fold-loading message="Lecture du catalogue publié…" />
    }
  </fold-page-section>
</fold-card>
