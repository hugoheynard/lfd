<fold-panel-header [title]="heading()" />

<div class="body">
  <fold-select
    label="La limite tombe"
    [value]="daysBefore().toString()"
    (valueChange)="onDaysBefore($event)"
  >
    @for (choice of daysBeforeChoices; track choice.value) {
      <option [value]="choice.value">{{ choice.label }}</option>
    }
  </fold-select>

  <!-- `<input type="time">` en natif : Signal Forms ne couvre pas les dates et
       heures, et le contrôle du navigateur est meilleur que tout masque maison. -->
  <label class="time">
    <span class="time-label">À quelle heure</span>
    <input type="time" [value]="time()" (change)="onTime($event)" required />
  </label>

  <fold-select
    label="Rattrapage après l'heure"
    hint="Fenêtre pendant laquelle un client en retard est refusé AVEC une invitation à appeler, au lieu d'un refus sec."
    [value]="graceMinutes().toString()"
    (valueChange)="onGrace($event)"
  >
    @for (choice of graceChoices; track choice.value) {
      <option [value]="choice.value">{{ choice.label }}</option>
    }
  </fold-select>

  @if (!timeIsValid()) {
    <fold-callout variant="alert">Renseignez une heure au format HH:MM.</fold-callout>
  }

  <!-- Une règle se relit en une phrase avant d'être enregistrée : c'est là qu'on
       voit qu'on a écrit « le jour même » en pensant « la veille ». -->
  <fold-callout variant="info">{{ recap() }}</fold-callout>
</div>

<div class="actions">
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton [disabled]="!canSubmit()" (click)="submit()">
    {{ isCreate() ? 'Poser' : 'Enregistrer' }}
  </button>
</div>
