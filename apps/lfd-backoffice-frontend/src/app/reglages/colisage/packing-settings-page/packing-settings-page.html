<fold-page-layout icon="package" title="Colisage">
  <p description>
    Ce que le poste de colisage permet. Chaque réglage s'applique dès qu'on le change.
  </p>

  @switch (state()) {
    @case ('loading') {
      <fold-loading message="Chargement des réglages du colisage…" />
    }
    @case ('error') {
      <fold-empty-state tone="alert" title="Impossible de charger les réglages du colisage">
        <button foldButton (click)="load()">Réessayer</button>
      </fold-empty-state>
    }
    @case ('ready') {
      <fold-card>
        <fold-element-title cardHeader variant="title" title="Bacs de livraison" />

        <!-- Par l'identité de la vue : un refus remet une vue neuve, et la case
             recréée revient à l'état servi au lieu de garder le clic refusé. -->
        @for (view of shown(); track view) {
          <fold-checkbox
            label="Partager une moitié de bac"
            hint="Au poste, une commande livrée peut prendre la moitié libre d'un bac déjà déclaré pour l'arrêt voisin de sa tournée. Désactivé, le bouton « Partager une moitié » disparaît du poste ; les bacs déjà partagés restent tels quels."
            [checked]="view.halfSharing"
            (checkedChange)="setHalfSharing($event)"
            [disabled]="!canWrite() || saving()"
            data-half-sharing
          />
        }

        @if (failure(); as message) {
          <fold-callout variant="alert" announce>{{ message }}</fold-callout>
        }
      </fold-card>
    }
  }
</fold-page-layout>
