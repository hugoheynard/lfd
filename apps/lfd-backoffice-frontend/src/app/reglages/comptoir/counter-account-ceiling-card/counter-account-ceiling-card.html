<fold-card data-counter-account-ceiling>
  <fold-element-title
    cardHeader
    variant="title"
    title="Plafond des comptes ouverts au comptoir"
    subtitle="Au-delà de ce dû, une commande au compte d'un compte ouvert au comptoir est refusée jusqu'à sa conversion. Vide : aucun plafond, le défaut."
  />

  @switch (state()) {
    @case ('loading') {
      <fold-loading message="Chargement du plafond…" />
    }
    @case ('error') {
      <fold-empty-state tone="alert" title="Impossible de charger le plafond">
        <button foldButton (click)="load()">Réessayer</button>
      </fold-empty-state>
    }
    @case ('ready') {
      <div class="body">
        <p class="text" data-counter-account-ceiling-value>{{ current() }}. {{ lastChange() }}</p>

        @if (canWrite()) {
          <div class="edit">
            <fold-number-input
              label="Plafond du dû, en euros"
              hint="Laissez vide pour n'avoir aucun plafond."
              [value]="euros()"
              (valueChange)="draft.set($event)"
              [min]="0"
              [decimals]="2"
              [disabled]="pending()"
              data-counter-account-ceiling-input
            />
            <button
              foldButton
              size="sm"
              [disabled]="!canSave()"
              [loading]="pending()"
              (click)="save()"
              data-counter-account-ceiling-save
            >
              Enregistrer
            </button>
          </div>
          @if (!isValid()) {
            <fold-callout variant="alert">Le plafond ne peut pas être négatif.</fold-callout>
          }
        }

        @if (failure(); as message) {
          <fold-callout variant="alert" announce>{{ message }}</fold-callout>
        }
      </div>
    }
  }
</fold-card>
