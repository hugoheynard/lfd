<!-- Pas de `title` sur le layout : la bande de tête du comptoir, au-dessus,
     porte les onglets, le point ouvert et la journée (Hugo, 2026-10-12). -->
<fold-page-layout>
  <!--
    **La file et le sac, côte à côte.** Un `fold-aside-layout` et non un panneau
    modal : au comptoir on lit la file ET ce qu'on tend, on passe de l'une à
    l'autre sans rien fermer. Une modale `inert`e la file derrière elle, ce qui
    est exactement le geste qu'on ne veut pas ici.

    Le rail est là dans TOUS les états, vide compris : sa place est réservée, et
    la file ne se réorganise pas sous les doigts au premier clic.
  -->
  <!--
    **Sur écran étroit, le sac est une feuille qui MONTE sur la file.**

    🔴 Empilé, il n'apparaissait pas : `fold-aside-layout` range sa colonne sous
    le centre, donc toucher une ligne posait le sac hors de l'écran, sous une
    file de dix lignes, et rien ne bougeait sous le doigt. Le geste attendu est
    celui d'un téléphone — on touche, ça monte, on referme.

    `inert` sur la file pendant ce temps : la feuille la recouvre, et un clavier
    qui continuerait de la parcourir derrière tabulerait dans le vide.
  -->
  <fold-aside-layout
    #board
    class="board"
    asideRightLabel="Détail du retrait"
    [class.is-stacked]="stacked()"
    [class.has-selection]="selected() !== null"
  >
    <div class="board-queue" [inert]="stacked() && selected() !== null">
      @switch (store.state()) {
        @case ('loading') {
          <fold-loading message="Lecture de la file…" />
        }
        @case ('error') {
          <fold-empty-state
            tone="alert"
            title="File illisible"
            subtitle="La lecture a échoué — les commandes, elles, sont intactes."
          >
            <button foldButton (click)="store.load()">Réessayer</button>
          </fold-empty-state>
        }
        @default {
          @if (store.refreshFailed()) {
            <fold-callout variant="alert">
              La file n'a pas pu être relue — elle peut ne plus être à jour.
            </fold-callout>
          }
          <!-- Par POINT : un point sans commande a désormais son onglet. -->
          @if (store.rows().length === 0) {
            <fold-empty-state
              title="Personne n'attend ce jour-là"
              subtitle="Aucune commande n'est attendue à ce point de retrait à cette date."
            >
              <fold-icon empty-icon name="package-check" />
            </fold-empty-state>
          } @else {
            <!-- ⚠️ Le panneau veut l'INSTANCE des onglets, qui vivent dans la
               bande de tête — un autre composant. La bande la publie au store ;
               d'où le `@if` qui attend qu'elle se résolve, une passe plus tard. -->
            @if (store.tabBar(); as bar) {
              <fold-tab-panel [tabs]="bar" [key]="store.activeTab()">
                <!--
                **La barre de la file.** Le scan est ici et nulle part ailleurs
                depuis le 2026-09-11 : il y en avait un par ligne ET un dans la
                bande, et ils faisaient le MÊME appel. Le code lu résout la
                commande à lui seul — la ligne cliquée n'apportait qu'une
                contradiction possible, et elle n'existait que parce qu'on avait
                cliqué quelque part d'abord.

                🔴 Le scan par ligne a coûté une colonne de 8,5 rem à la file.
                Rendue au nom du client, qui est ce qu'on y cherche.
              -->
                <div class="file-head">
                  <div class="file-said">
                    <fold-element-title variant="eyebrow" [title]="eyebrow()" />
                    <p class="file-hint">par créneau, le plus ancien en tête</p>
                  </div>

                  <!-- Les deux gestes ensemble : ils passent à la ligne EN BLOC
                     quand la colonne se resserre, au lieu de laisser le bouton
                     descendre seul sous une boîte qui reste en haut. -->
                  <div class="file-tools">
                    <!-- 🔴 `[(value)]` et non `(searchChange)` : la file est DÉJÀ
                     en mémoire, et un délai n'ajouterait ici que de la latence
                     entre la frappe et ce qu'on voit. Le compte annoncé vient
                     de la file elle-même — c'est elle qui filtre, donc elle
                     seule sait combien il reste. -->
                    <fold-search
                      class="file-search"
                      placeholder="Client, référence, créneau…"
                      ariaLabel="Filtrer la file"
                      size="sm"
                      [(value)]="query"
                      [resultCount]="matches()"
                      [resultLabel]="matches() === 1 ? 'ligne' : 'lignes'"
                      placement="end"
                    />

                    <button class="file-scan" foldButton icon="qr-code" (click)="scan(null)">
                      Scanner un code
                    </button>
                  </div>
                </div>

                <app-queue-table
                  [entries]="store.rows()"
                  [query]="query()"
                  [day]="store.day()"
                  [now]="store.now()"
                  [busyId]="remindingId()"
                  [reminded]="remindedIds()"
                  [canRemind]="canRemind()"
                  (opened)="select($event)"
                  (reminder)="remind($event)"
                />
              </fold-tab-panel>
            }
          }
        }
      }
    </div>

    <app-handover-detail
      asideRight
      [entry]="selected()"
      [day]="store.day()"
      (remitted)="store.load()"
      (scanned)="scan($event)"
      (cleared)="clearSelection()"
    />
  </fold-aside-layout>
</fold-page-layout>
