<fold-panel-header [title]="title()" [subtitle]="data()?.reference ?? ''" />

<fold-panel-body>
  @switch (state()) {
    @case ('loading') {
      <fold-loading message="Lecture du bon…" />
    }
    @case ('error') {
      <fold-empty-state tone="alert" [title]="title() + ' illisible'" [subtitle]="refusal() ?? ''">
        <button foldButton (click)="load()">Réessayer</button>
      </fold-empty-state>
    }
    @case ('ready') {
      @if (source(); as pdf) {
        <iframe class="cn-page" [title]="title()" [src]="pdf"></iframe>
      }
    }
  }
</fold-panel-body>

<fold-panel-footer>
  <button foldButton emphasis="outline" intent="neutral" (click)="close()">Fermer</button>
</fold-panel-footer>
