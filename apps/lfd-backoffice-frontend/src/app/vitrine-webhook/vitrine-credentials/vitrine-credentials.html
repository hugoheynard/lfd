<div class="vcr-fields">
  <fold-callout variant="warning">
    Copiez-les maintenant et transmettez-les à l’agence : ils ne seront plus jamais affichés. Si
    vous les perdez, régénérez-les.
  </fold-callout>
  <fold-input
    label="Secret de signature"
    hint="L’agence vérifie avec lui l’en-tête Vitrine-Signature de chaque envoi."
    [readOnly]="true"
    [value]="credentials().signingSecret"
    data-secret
  />
  <fold-input
    label="Clé de lecture"
    hint="À envoyer dans l’en-tête X-Vitrine-Key des lectures GET /vitrine/…"
    [readOnly]="true"
    [value]="credentials().readKey"
    data-read-key
  />
</div>
