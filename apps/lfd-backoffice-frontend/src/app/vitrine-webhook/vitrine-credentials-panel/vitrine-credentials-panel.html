<fold-panel-header
  title="Régénérer le secret et la clé"
  [subtitle]="data().name"
  closeLabel="Fermer"
/>

<fold-panel-body>
  @if (rotated(); as credentials) {
    <app-vitrine-credentials [credentials]="credentials" />
  } @else {
    <fold-callout variant="warning">
      Les anciens cessent de valoir à l’instant : tant que l’agence n’a pas les nouveaux, elle
      refuse nos envois et ses lectures sont refusées.
    </fold-callout>
    @if (refusal(); as message) {
      <fold-callout variant="alert" announce>{{ message }}</fold-callout>
    }
  }
</fold-panel-body>

<fold-panel-footer align="end">
  @if (rotated()) {
    <button foldButton intent="primary" type="button" (click)="close()" data-done>
      J’ai noté le secret et la clé
    </button>
  } @else {
    <button foldButton emphasis="outline" intent="neutral" type="button" (click)="close()">
      Annuler
    </button>
    <button
      foldButton
      intent="danger"
      type="button"
      [loading]="saving()"
      (click)="rotate()"
      data-rotate
    >
      Régénérer
    </button>
  }
</fold-panel-footer>
