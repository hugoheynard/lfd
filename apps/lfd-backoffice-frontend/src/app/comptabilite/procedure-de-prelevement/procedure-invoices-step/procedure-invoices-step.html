<div class="pi-stack">
  <fold-callout
    [variant]="
      view().state === 'to_do' ? 'warning' : view().state === 'partial' ? 'info' : 'neutral'
    "
    [attr.data-invoices-reason]="view().reason"
  >
    {{ sentence() }}
  </fold-callout>

  @if (view().orders.length > 0) {
    <div class="pi-figures" role="group" aria-label="Filtrer les commandes">
      @for (figure of figures(); track figure.status) {
        <button
          type="button"
          class="pi-figure"
          [class.pi-figure--zero]="figure.count === 0"
          [attr.aria-pressed]="filter() === figure.status"
          [attr.data-figure]="figure.status"
          (click)="toggle(figure.status)"
        >
          <span class="pi-figure-count">{{ figure.count }}</span>
          <span class="pi-figure-label">{{ figure.label }}</span>
        </button>
      }
    </div>
  }

  @if (issuable(); as issue) {
    <div>
      <button
        foldButton
        icon="receipt"
        [loading]="pending()"
        (click)="onIssue(issue.closesAt)"
        data-issue-invoices
      >
        {{ issue.label }}
      </button>
    </div>
  }

  @if (view().orders.length > 0) {
    <app-procedure-orders [orders]="orders()" />
  }

  @if (view().closure; as closure) {
    <app-month-invoices [view]="closure" />
  }

  <!-- Les factures carte qui ne sont pas parties : rien quand il n'y en a pas. -->
  <app-card-invoice-signals [canWrite]="canWrite()" />
</div>
