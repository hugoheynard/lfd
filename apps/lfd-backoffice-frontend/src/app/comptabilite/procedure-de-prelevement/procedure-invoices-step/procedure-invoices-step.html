<div class="pi-stack">
  <p class="pi-figures" data-invoice-figures>
    <span data-figure-unconfirmed
      ><strong>{{ unconfirmedCount() }}</strong> bon(s) à constater</span
    >
    <span data-figure-missing
      ><strong>{{ view().missingOrderCount }}</strong> bon(s) sans facture</span
    >
    <span data-figure-issued
      ><strong>{{ issuedCount() }}</strong> facture(s) émise(s)</span
    >
  </p>

  @if (sentence(); as said) {
    <fold-callout
      [variant]="view().state === 'to_do' ? 'warning' : 'neutral'"
      [attr.data-invoices-reason]="view().reason"
    >
      {{ said }}
    </fold-callout>
  }

  <!-- 1. En tête : les bons de la période qui bloquent leur facture. -->
  <app-unconfirmed-deliveries [orders]="view().unconfirmedDeliveries" />

  <!-- 2. La clôture : ses factures, ses signalements, ses lots, « Émettre ». -->
  @if (view().closure; as closure) {
    <app-month-invoices
      [view]="closure"
      [canWrite]="canWrite()"
      [pending]="pending()"
      (issue)="issue.emit($event)"
    />
  }

  <!-- 3. Les bons écartés du dernier lot. -->
  @if (exclusions().length > 0) {
    <app-excluded-orders
      [exclusions]="exclusions()"
      [canWrite]="canWrite()"
      (settle)="settle.emit($event)"
    />
  }

  <!-- 4. Les factures carte qui ne sont pas parties : rien quand il n'y en a pas. -->
  <app-card-invoice-signals [canWrite]="canWrite()" />
</div>
