<fold-page-section
  title="Dates des modes"
  description="Chaque client suit un mode — mensuel par défaut — et le choisit sur sa fiche. Ici, les dates de chaque mode : elles valent pour tous les clients qui le suivent."
  separator
>
  <div class="bm-stack">
    <p class="bm-said" data-modes-closure-time>{{ closureTime }}</p>
    @for (mode of entity().billingModes; track mode.mode) {
      <app-billing-mode-row
        [entityId]="entity().id"
        [mode]="mode"
        [busy]="busy()"
        (saved)="saved.emit($event)"
      />
    }
  </div>
</fold-page-section>
