@if (loading()) {
  <fold-loading message="Lecture des soldes de points…" />
} @else if (loadError(); as message) {
  <fold-empty-state tone="alert" title="Impossible de lire les soldes" [subtitle]="message">
    <button foldButton (click)="load()">Réessayer</button>
  </fold-empty-state>
} @else if (rows().length === 0) {
  <fold-empty-state
    title="Aucun solde de points"
    subtitle="Aucun titulaire n'a encore gagné ni reçu de points."
  >
    <fold-icon empty-icon name="coins" />
  </fold-empty-state>
} @else {
  <div class="stack">
    @if (actionError(); as message) {
      <fold-callout appearance="inset" variant="alert" announce>{{ message }}</fold-callout>
    }

    <fold-card>
      <fold-data-table
        caption="Soldes de points par titulaire"
        narrowLayout="cards"
        zebra
        [columns]="columns()"
        [rows]="rows()"
        [rowKey]="rowKey"
      >
        <ng-template foldCell="holder" let-row>
          <span class="strong">{{ nameOf(row) }}</span>
        </ng-template>

        <ng-template foldCell="kind" let-row>
          <fold-badge variant="neutral" [content]="kindOf(row)" />
        </ng-template>

        <ng-template foldCell="points" let-row>{{ pointsOf(row) }} points</ng-template>

        <ng-template foldCell="actions" let-row>
          <button foldButton size="sm" emphasis="outline" (click)="adjust(row)">Ajuster</button>
        </ng-template>
      </fold-data-table>
    </fold-card>
  </div>
}
