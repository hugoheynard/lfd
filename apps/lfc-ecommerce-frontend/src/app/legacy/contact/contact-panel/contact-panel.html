<fold-panel-header title="Nous contacter" subtitle="Une question, un besoin ? On vous répond." />

<div class="body">
  <section class="cp-block">
    <p class="cp-label">Contact direct</p>
    <!-- Un numéro : le lien direct ; plusieurs : le dialogue « Nous appeler ». -->
    @if (phones().length === 1) {
      <a class="cp-row" [href]="telHref(phones()[0]!.number)">
        <fold-icon name="phone" [size]="18" />
        <span>{{ phones()[0]!.number }}</span>
      </a>
    } @else {
      <button type="button" class="cp-row" (click)="call()">
        <fold-icon name="phone" [size]="18" />
        <span>Nous appeler</span>
      </button>
    }
    <!-- « Écrire » ouvre le dialogue « Nous écrire » de la boutique, et non plus
         un `mailto:` (plan « Nous écrire », §4). -->
    <button type="button" class="cp-row" (click)="write()">
      <fold-icon name="mail" [size]="18" />
      <span>Nous écrire</span>
    </button>
    <p class="cp-hours">{{ hours }}</p>
  </section>

  <section class="cp-block">
    <p class="cp-label">Prendre rendez-vous</p>
    <p class="cp-text">Choisissez un créneau parmi nos disponibilités réelles.</p>
    <button type="button" class="cp-book" (click)="book()">
      <fold-icon name="calendar" [size]="18" />
      <span>Prendre rendez-vous</span>
    </button>
  </section>

  <div class="foot">
    <button foldButton emphasis="outline" intent="neutral" (click)="close()">Fermer</button>
  </div>
</div>
