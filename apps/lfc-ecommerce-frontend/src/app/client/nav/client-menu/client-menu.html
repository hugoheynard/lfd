<!-- `(close)` couvre les deux sorties que le natif gère seul : `Escape` et
     l'appel programmé — l'écran reste la seule source de vérité. -->
<dialog #dlg class="menu" [attr.aria-labelledby]="labelId" (close)="closed.emit()">
  <div class="bar">
    <button class="close" type="button" [attr.aria-label]="t().nav.close" (click)="closed.emit()">
      <fold-icon name="close" />
    </button>
    <span class="bar-label" [id]="labelId">{{ t().chrome.menu }}</span>
  </div>

  <div class="body">
    <h2 class="hello">{{ hello() }}</h2>
    <!-- La ligne d'identité. À un seul espace, la réf veut un SOUS-TITRE
         statique et pas un déroulant qui ne mène nulle part : c'est l'adresse
         du compte qui la porte. -->
    @if (identity.email(); as email) {
      <p class="who"><span class="who-rule" aria-hidden="true"></span>{{ email }}</p>
    }

    <!-- Le sélecteur d'espace, le même qu'au bureau : à partir d'une société (plan D8). -->
    @if (workspace.hasChoice()) {
      <!-- Une LISTE DÉROULANTE, plus des boutons empilés (Hugo, 2026-10-27) :
           l'espace en cours s'y lit, et les autres s'y choisissent. -->
      <fold-listbox
        class="spaces"
        [label]="t().chrome.workspaceChoice"
        [options]="spaceOptions()"
        [value]="workspace.current()"
        (selectionChange)="choose($event)"
      />
    }

    <a class="new-order" routerLink="/boutique" (click)="closed.emit()">
      <fold-icon class="new-order-plus" name="plus" />
      <span class="new-order-title">{{ t().nav.newOrder }}</span>
      <fold-icon class="new-order-caret" name="chevron-right" />
    </a>

    <nav class="dests" [attr.aria-label]="t().chrome.menu">
      @for (item of nav.items(); track item.id) {
        <button
          class="dest"
          type="button"
          [class.is-on]="nav.current() === item.route"
          [disabled]="!item.ready"
          [attr.aria-current]="nav.current() === item.route ? 'page' : null"
          (click)="go(item.route)"
        >
          <span class="dest-label">{{ item.label }}</span>
          @if (!item.ready) {
            <span class="dest-soon">{{ t().nav.soon }}</span>
          } @else if (item.count) {
            <span class="dest-count" [class.is-warn]="item.warn">{{ item.count }}</span>
          } @else if (nav.current() === item.route) {
            <span class="dest-dot" aria-hidden="true"></span>
          }
        </button>
      }
    </nav>
  </div>

  <div class="foot">
    <div class="lang-row">
      <span class="lang-label">{{ t().chrome.lang }}</span>
      <app-lang-switch />
    </div>
    <!-- La déconnexion ne vit ici QUE parce que le pouce n'a pas d'autre endroit
         où l'atteindre : en desktop c'est une action de compte, et la réf la
         garde hors de la navigation. -->
    <!-- Le profil de la PERSONNE, à côté de sa déconnexion : au bureau, les deux
         vivent dans le menu de l'initiale ; ici, le pouce n'a que ce menu.
         Une DESTINATION depuis le 2026-09-22 : `go` ferme le menu puis navigue,
         exactement comme les autres entrées — plus de dialogue à ouvrir
         par-dessus un `<dialog>` modal, donc plus d'ordre à orchestrer. -->
    <button class="logout profile" type="button" (click)="go('/mon-profil')">
      {{ t().chrome.myProfile }}
    </button>
    <button class="logout" type="button" (click)="logout()">{{ t().nav.logout }}</button>
  </div>
</dialog>
