<div class="banner">
  <!-- La RANGÉE : le texte d'un bord, l'action de l'autre. Elle existe pour que
       ce qui se projette SOUS le bandeau ne vienne pas se ranger à côté du
       titre — sans elle, un troisième enfant tombait dans la même ligne. -->
  <div class="row">
    <div class="titles">
      @if (kicker()) {
        <p class="kicker">{{ kicker() }}</p>
      }
      <h1 class="title">{{ title() }}</h1>
      @if (lead()) {
        <p class="lead">{{ lead() }}</p>
      }
    </div>
    <!-- L'action, s'il y en a une. Son absence n'est pas gérée ici mais en CSS
         (`:only-child`) : c'est une question de mise en page, pas d'état. -->
    <ng-content select="[banner-action]" />
  </div>

  <!-- Ce qui se lit SOUS le titre, pleine largeur : un rail d'étapes, un
       rappel. Rien de projeté = rien dans le DOM, donc aucune place prise, et
       le titre reste seul dans sa rangée — ce qui le recentre, comme avant. -->
  <ng-content select="[banner-below]" />
</div>
