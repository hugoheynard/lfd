@if (groups().length > 0) {
  <section class="usuals" [attr.aria-label]="t().shop.usuals">
    <h2 class="usuals-title">{{ t().shop.usuals }}</h2>
    <div class="usuals-cards">
      @for (group of groups(); track group.key) {
        <app-usual-group-card [group]="group" />
      }
    </div>
  </section>
}
