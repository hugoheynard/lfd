<button class="suggestion" type="button" (click)="take()">
  <span class="sign" aria-hidden="true"><fold-icon name="plus" /></span>
  <span class="pitch">
    <span class="pitch-title">{{ card().title }}</span>
    <span class="pitch-line">{{ card().line }} · {{ card().price }} {{ card().suffix }}</span>
  </span>
</button>
