<!-- Chaque erreur vit SOUS SON CHAMP (RGAA 11.10, lot A3) : fold la relie à
     l'entrée (`aria-describedby`, `aria-invalid`) et l'annonce (`role="alert"`).
     Un champ vide ne se dit qu'à l'envoi (`reveal`) ; une adresse mal formée,
     dès qu'on quitte le champ. -->
<fold-input
  autocomplete="given-name"
  [label]="t().cart.guestFirstName"
  [hint]="t().cart.guestFirstNameHint"
  [required]="true"
  [value]="firstName()"
  [errors]="firstNameErrors()"
  [(touched)]="firstNameTouched"
  (valueChange)="firstName.set($event)"
/>

<fold-input
  type="email"
  autocomplete="email"
  [label]="t().cart.guestEmail"
  [hint]="t().cart.guestEmailHint"
  [required]="true"
  [value]="email()"
  [errors]="emailErrors()"
  [(touched)]="emailTouched"
  (valueChange)="email.set($event)"
/>

<!-- 🔴 Le second champ est la SEULE barrière avant un envoi irréversible :
     le QR part par courriel, et un visiteur n'a pas d'espace où le retrouver.
     L'écart se dit en QUITTANT ce champ, pas pendant qu'on le tape : il ne
     peut qu'être incomplet à ce moment-là — d'où `touched` tenu ici. -->
<fold-input
  type="email"
  autocomplete="email"
  [label]="t().cart.guestEmailAgain"
  [required]="true"
  [value]="emailAgain()"
  [errors]="emailAgainErrors()"
  [touched]="confirmLeft()"
  (valueChange)="typeConfirmation($event)"
  (touchedChange)="leaveConfirmation($event)"
/>

<fold-input
  type="tel"
  autocomplete="tel"
  [label]="t().cart.guestPhone"
  [hint]="t().cart.guestPhoneHint"
  [required]="true"
  [value]="phone()"
  [errors]="phoneErrors()"
  [(touched)]="phoneTouched"
  (valueChange)="phone.set($event)"
/>
