<!-- L'écart entre les deux adresses se dit en QUITTANT la confirmation, pas
     pendant qu'on la tape : elle ne peut qu'être incomplète à ce moment-là. -->
@if (mismatch()) {
  <fold-callout variant="alert" announce>{{ t().cart.guestEmailMismatch }}</fold-callout>
}

<fold-input
  [label]="t().cart.guestFirstName"
  [hint]="t().cart.guestFirstNameHint"
  [required]="true"
  [value]="firstName()"
  (valueChange)="firstName.set($event)"
/>

<fold-input
  type="email"
  [label]="t().cart.guestEmail"
  [hint]="t().cart.guestEmailHint"
  [required]="true"
  [value]="email()"
  (valueChange)="email.set($event)"
/>

<!-- 🔴 Le second champ est la SEULE barrière avant un envoi irréversible :
     le QR part par courriel, et un visiteur n'a pas d'espace où le retrouver. -->
<fold-input
  type="email"
  [label]="t().cart.guestEmailAgain"
  [required]="true"
  [value]="emailAgain()"
  (valueChange)="typeConfirmation($event)"
  (touchedChange)="leaveConfirmation($event)"
/>

<fold-input
  type="tel"
  [label]="t().cart.guestPhone"
  [hint]="t().cart.guestPhoneHint"
  [required]="true"
  [value]="phone()"
  (valueChange)="phone.set($event)"
/>
