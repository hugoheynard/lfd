<!-- 🔴 UNE SEULE FORME depuis le 2026-09-21 (Hugo : « le panier devient un
     dialog comme le reste »). Il y en avait trois pour la même chose : un lien
     vers la page en pile, un popover au bureau, et la page elle-même. Le
     dialogue les remplace — il s'ouvre par-dessus le rayon aux deux largeurs,
     centré au bureau, en feuille du bas en pile, et c'est `dialogSide()` qui
     tranche au moment du geste.

     ⚠️ Ce qui est perdu, et assumé : le popover se lisait sans rien ouvrir de
     modal. Mais il ne montrait qu'un extrait — ni le mode de service, ni
     l'invite d'identité, ni le bouton qui porte le montant — et son pied
     menait de toute façon au panier entier. Une surface qui renvoie toujours
     vers une autre n'est pas une surface, c'est un détour.

     `shopping-cart` et non `basket` (Hugo, 2026-09-20). Le panier à anse de
     fold est le glyphe des boutiques en ligne génériques ; la maquette dessine
     un CADDIE — corbeille sur deux roues, exactement le tracé de fold sous ce
     nom-là. Deux icônes possibles pour un seul mot français : c'est le dessin
     qu'on choisit, pas le nom. -->
<button class="pill" type="button" [attr.aria-label]="label()" (click)="void openCart()">
  <fold-icon class="glyph" name="shopping-cart" />
  @if (!cart.isEmpty()) {
    <span class="count" aria-hidden="true">{{ cart.count() }}</span>
    <span class="total wide-only" aria-hidden="true">{{ total() }}</span>
  }
</button>
