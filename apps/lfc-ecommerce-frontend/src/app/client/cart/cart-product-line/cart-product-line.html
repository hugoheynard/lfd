<span class="what">
  <!-- La marque `*` d'une ligne hors remise de retrait, renvoyée sous le décompte. -->
  @if (excluded()) {
    <span class="name"
      ><span aria-hidden="true">{{ name() }} <span class="excluded">*</span></span
      ><span class="sr-only">{{ excludedName() }}</span></span
    >
  } @else {
    <span class="name">{{ name() }}</span>
  }
  <span class="unit">{{ unit() }}</span>
  @if (weight(); as shown) {
    <span class="unit" data-weight>{{ shown }}</span>
  }
  @if (madeToOrder(); as limit) {
    <span class="made-to-order" data-made-to-order>{{ limit }}</span>
  }
</span>

<span class="sum">{{ sum() }}</span>

<!-- − et + DE CHAQUE CÔTÉ d'un champ plus grand (Hugo, 2026-10-27) : le
     stepper empilé était trop petit pour le doigt. La quantité se tape
     toujours directement — douze croissants ne se règlent pas en douze appuis. -->
<label class="sr-only" [for]="qty.inputId">{{ quantityLabel() }}</label>
<fold-number-input
  #qty
  class="qty"
  size="md"
  align="center"
  spinner="plusminus"
  controls="outside"
  integer
  [min]="minimum()"
  [step]="step()"
  [value]="quantity()"
  (valueChange)="onQuantity($event)"
/>

<!-- La corbeille retire la LIGNE, pas une pièce : c'est le geste qu'on cherche
     quand on a changé d'avis, et c'est aussi le seul chemin vers zéro — le
     champ s'arrête à un. -->
<button class="drop" type="button" [attr.aria-label]="dropLabel()" (click)="dropped.emit()">
  <fold-icon name="bin" />
</button>
