<ng-template clientBanner>
  <app-client-banner-block [title]="copy().title" [lead]="lead()" />
</ng-template>

<div class="page">
  <fold-back-link routerLink="/mes-sites" [label]="copy().back" />

  @switch (screen()) {
    @case ('loading') {
      <fold-loading [message]="copy().loading" />
    }
    @case ('unknown') {
      <fold-empty-state
        data-unknown-site
        [title]="copy().unknownSiteTitle"
        [subtitle]="copy().unknownSiteBody"
      >
        <fold-icon empty-icon name="lock" />
      </fold-empty-state>
    }
    @case ('failed') {
      <fold-empty-state
        tone="alert"
        data-menu-failed
        [title]="copy().loadFailedTitle"
        [subtitle]="copy().loadFailedBody"
      >
        <button foldButton emphasis="solid" intent="primary" type="button" (click)="retry()">
          {{ copy().retry }}
        </button>
      </fold-empty-state>
    }
    @default {
      <fold-callout variant="info" data-menu-state>
        {{ stateLine() }}
        @if (canFollowCommon()) {
          <div actions>
            <button
              foldButton
              size="sm"
              emphasis="outline"
              type="button"
              data-follow-common
              [disabled]="switching()"
              (click)="followCommon()"
            >
              {{ copy().followCommon }}
            </button>
          </div>
        }
      </fold-callout>
      @if (switchRefusal(); as message) {
        <fold-callout variant="alert" announce data-switch-refusal>{{ message }}</fold-callout>
      }
      <app-site-menu-editor
        [initial]="initial()"
        [unsaved]="unsaved()"
        [save]="saveOwn"
        [sources]="otherSites()"
        [readSource]="readSite"
      />
    }
  }
</div>
