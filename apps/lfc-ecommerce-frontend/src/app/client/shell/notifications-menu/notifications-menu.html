<!-- Ce que les deux cloches montrent, déclaré une fois. -->
<ng-template #glyph>
  <fold-icon name="bell" />
  @if (feed.unread(); as count) {
    <span class="badge" aria-hidden="true">{{ count }}</span>
  }
</ng-template>

<!-- EN PILE : la feuille du bas. Un second clic la referme. -->
<button
  class="bell in-pocket"
  type="button"
  [attr.aria-label]="bellLabel()"
  [attr.aria-expanded]="sheetOpen()"
  (click)="toggleSheet()"
>
  <ng-container [ngTemplateOutlet]="glyph" />
</button>

<!-- AU BUREAU : le popover. -->
<fold-popover class="pop at-desk" placement="bottom-end" [(open)]="open">
  <button class="bell" type="button" foldPopoverTrigger="dialog" [attr.aria-label]="bellLabel()">
    <ng-container [ngTemplateOutlet]="glyph" />
  </button>

  <div foldPopoverPanel class="panel">
    <app-notifications-feed-view (closeRequested)="close()" />
  </div>
</fold-popover>
