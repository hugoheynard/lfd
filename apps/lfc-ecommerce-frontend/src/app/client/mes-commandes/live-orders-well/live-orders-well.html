<!-- Le puits DIT qu'il y a autre chose à droite : sans le glyphe et les puces,
     le débordement passe pour un accident de mise en page. -->
<fold-well #rail class="well" scrollable [title]="title()" [subtitle]="subtitle()">
  <span wellLead class="well-glyph" aria-hidden="true"><fold-icon name="arrow-right" /></span>

  <!-- La sortie vers l'historique vit dans la TÊTE et non sous les cartes : elle
       n'est pas la suite du rail, elle en est l'alternative. -->
  <button titleAction class="all" type="button" (click)="allAsked.emit()">
    {{ allLabel() }}
  </button>

  @for (order of orders(); track order.reference) {
    <app-track-card class="rail-card" [order]="order" (qrAsked)="qrAsked.emit(order.id)" />
  }

  <fold-scroll-indicator
    wellFoot
    class="dots"
    variant="morse"
    [count]="orders().length"
    [active]="rail.active()"
    [markerLabel]="dotLabel()"
    (picked)="rail.goTo($event)"
  />
</fold-well>
