<fold-card
  class="card"
  interactive
  padding="none"
  radius="lg"
  data-test="pro-featured-card"
  [ariaLabel]="card().label"
  (activated)="activated.emit()"
>
  <!-- La carte est un bouton nommé par `ariaLabel` : son image est décorative
       (RGAA 1.2) — l'alternative répéterait le nom, ou lirait une URL. -->
  <div class="art">
    <img
      class="art-image"
      [src]="card().src"
      [appHouseMark]="card().src"
      [attr.srcset]="card().srcset || null"
      sizes="(min-width: 1100px) 33vw, (min-width: 600px) 50vw, 100vw"
      alt=""
      [style.object-position]="card().position"
      loading="lazy"
      decoding="async"
    />
  </div>
  <div class="body">
    <h3 class="name">{{ card().name }}</h3>
    @if (card().note; as note) {
      <p class="note">{{ note }}</p>
    }
    @if (price(); as label) {
      <p class="price" data-test="featured-price">{{ label }}</p>
    }
    @if (perKilo(); as hint) {
      <p class="per-kilo" data-test="featured-per-kilo">{{ hint }}</p>
    }
  </div>
</fold-card>
