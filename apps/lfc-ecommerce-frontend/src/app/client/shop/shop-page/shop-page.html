<!-- LE BANDEAU — la boutique a le même en-tête que les autres écrans. Le titre
     du rayon y monte : il l'écrivait une seconde fois sous la recherche, dans un
     registre plus faible que celui de la page qu'il nomme. -->
<!-- 🔴 TOUT CE QUI CHEVAUCHE LA DESCENTE VIT DANS LA DESCENTE.
     Les termes ont d'abord été posés dans la page, avec une marge négative pour
     mordre sur le bandeau : ils passaient dessous, et ni `z-index: 1` ni `3`
     n'y changeaient rien. La cause n'est pas l'empilement mais le CLIPPING —
     la page vit dans un conteneur qui défile (`.content-scroll`), et rien n'en
     déborde (mesuré le 2026-09-17 : 32 px masqués, sur toute la remontée).
     C'est la même leçon que l'accueil, prise par l'autre bout. -->
<ng-template clientBanner>
  <app-client-banner-block titleAlign="start" [kicker]="chrome.kicker()" [title]="shop.heading()">
    <!-- Le rail SOUS le titre, pleine largeur — le layout de l'accueil, à
         l'identique. `banner-below` et non `banner-action` : l'action se range
         à DROITE du titre, ce qui est une autre grammaire, et laisser le slot
         d'action vide recentrait le titre.
         `3` : où l'on en est — les deux premières sont franchies, puisqu'on
         n'arrive ici qu'en y ayant répondu, ou en les ayant volontairement
         sautées par « je visite la boutique ». -->
    <app-public-steps banner-below [current]="3" [answers]="stepAnswers()" />
  </app-client-banner-block>

  <!-- LES TERMES DE LA COMMANDE, au bas de la descente — juste avant le rayon.
       Ils ont REMPLACÉ la carte de panier qui vivait ici : les deux rappelaient
       le même service, et ce fichier avait déjà corrigé ce doublon une fois
       (« deux surfaces pour le même contexte, une de trop »).
       Ce qu'elle portait en plus — pièces, total, régler — est dans la barre du
       bas, qui suit le rayon à toutes les largeurs. Seul « porter au compte »
       disparaît : il était explicitement marqué MAQUETTE dans son propre code,
       faute de condition de règlement sur un écran servi sans jeton. -->
  <app-public-command-terms-summary
    class="terms"
    (houseRequested)="changeHouse()"
    (timeRequested)="changeTime()"
  />
</ng-template>

<div class="shop">
  <fold-search
    class="search"
    [(value)]="shop.query"
    [placeholder]="t().shop.searchPlaceholder"
    [ariaLabel]="t().shop.searchPlaceholder"
    [clearLabel]="t().shop.clearSearch"
    [resultCount]="shop.products().length"
    [resultLabel]="t().shop.piecesUnit"
  />

  <app-shelf-nav class="shelves" [active]="shop.activeShelf()" (picked)="shop.browse($event)" />

  <app-shelf-banner class="banner" [shelf]="shop.shelf()" (opened)="openStory.set(shop.shelf())" />

  @switch (status()) {
    @case ('failed') {
      <!-- L'échec est un ÉTAT, pas un écran vide : on dit ce qui s'est passé et
           on offre le seul geste utile. -->
      <fold-empty-state
        class="grid"
        tone="alert"
        [title]="t().shop.loadFailedTitle"
        [subtitle]="t().shop.loadFailedHint"
      >
        <button foldButton type="button" (click)="retry()">{{ t().shop.loadRetry }}</button>
      </fold-empty-state>
    }
    @case ('ready') {
      <app-shelf-grid class="grid" [products]="shop.products()" (opened)="openPiece.set($event)" />
    }
    @default {
      <fold-loading class="grid" [message]="t().shop.loading" />
    }
  }
</div>

<!-- La barre du bas suit le rayon à TOUTES les largeurs : le bandeau, lui,
     défile avec la page, et le compte disparaîtrait au premier écran parcouru.
     Elle ouvre le tiroir plutôt que de changer d'écran — on n'a pas fini de
     choisir quand on vérifie ce qu'on a pris. -->
@if (!cart.isEmpty()) {
  <app-cart-bar
    class="cartbar"
    [label]="cartLabel()"
    [where]="whereLabel()"
    [total]="totalLabel()"
    (opened)="cartOpen.set(true)"
  />
}

<app-cart-panel [open]="cartOpen()" (closed)="cartOpen.set(false)" (paid)="pay()" />

<app-product-sheet
  [product]="piece()"
  [quantity]="pieceQuantity()"
  [orderable]="access.shop() !== 'browse'"
  (closed)="openPiece.set(null)"
  (added)="cart.add(openPiece() ?? '')"
  (removed)="cart.remove(openPiece() ?? '')"
/>

<app-shelf-sheet [shelf]="openStory()" (closed)="openStory.set(null)" />
