@if (item(); as piece) {
  <app-product-tile
    [product]="piece"
    [shape]="shape()"
    [mediaFit]="mediaFit()"
    [mediaSide]="mediaSide()"
    [tone]="tone()"
    [quantity]="cart.quantityOf(piece.sku)"
    (opened)="actions.productOpened.next(piece.sku)"
    (added)="actions.productAdded.next(piece.sku)"
  />
}
