<button class="row" type="button" (click)="opened.emit()">
  <span class="tile" aria-hidden="true"><fold-icon [name]="icon()" /></span>
  <span class="text">
    @if (lead(); as word) {
      <span class="lead">{{ word }}</span>
    }
    <span class="title">{{ title() }}</span>
    <span class="sub">{{ sub() }}</span>
  </span>
  @if (action(); as label) {
    <span class="action">{{ label }}</span>
  } @else {
    <fold-icon class="chevron" name="chevron-right" aria-hidden="true" />
  }
</button>
