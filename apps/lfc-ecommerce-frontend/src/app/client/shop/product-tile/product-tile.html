<div
  class="tile"
  [class]="layout()"
  [class.featured]="featured()"
  [class.contain]="mediaFit() === 'contain'"
>
  <div class="media">
    <button class="photo" type="button" [attr.aria-label]="product().name" (click)="opened.emit()">
      <!-- `sizes` dit la place RÉELLE que le CSS donnera : sans lui, le
           navigateur suppose la pleine largeur de la fenêtre et choisit
           toujours la plus grande. Deux colonnes en pile ; au-delà du pli, cinq
           au plus — un best-seller en couvre deux. -->
      <img
        [src]="artSrc()"
        [attr.srcset]="artSrcset() || null"
        [attr.sizes]="sizes()"
        [attr.alt]="art().alt"
        [style.object-position]="artPosition()"
        loading="lazy"
        decoding="async"
      />
    </button>

    @if (product().isFeatured) {
      <span class="badge">★ {{ t().product.bestSeller }}</span>
    }

    <!-- La quantité au panier, en pastille sur la photo (Hugo, 2026-10-11) :
         le « + » garde sa place et son sens, et ce qu'on a pris se lit là où
         l'œil reconnaît l'article. Le lecteur d'écran l'entend par les
         boutons, qui portent le nom de l'article. -->
    @if (quantity() > 0) {
      <span class="count" aria-hidden="true">{{ quantity() }}</span>
    }
  </div>

  <div class="content">
    <button class="body" type="button" (click)="opened.emit()">
      <span class="name">{{ product().name }}</span>
      @if (product().note; as note) {
        <!-- Le texte court, sur TOUTES les cartes (Hugo, 2026-09-24) — coupé à
             deux lignes pour que les rangées gardent une hauteur. La fiche le
             donne en entier. Le best-seller le porte sans coupe, au bureau. -->
        <span class="note">{{ note }}</span>
      }
    </button>

    <div class="foot">
      <span class="price">
        <!-- Le tarif catalogue, barré, quand ce client paie moins. Il ne
             s'affiche que sur les articles négociés : une rature sur tout le
             rayon ne dirait plus rien, et sur aucun elle cacherait ce qu'on lui
             a consenti. -->
        @if (striked(); as catalogue) {
          <s class="price-was">{{ catalogue }}</s>
        }
        {{ price() }}
        <span class="price-ht">{{ showsTtc() ? t().shop.ttcSuffix : t().shop.htSuffix }}</span>
      </span>

      @if (gate().label; as closedLabel) {
        <!-- Un article d'opération pas encore (ou plus) ouverte : l'état prend la
             place du « + » — l'ajouter ferait un panier que la caisse refuse. -->
        <fold-badge variant="neutral" [content]="closedLabel" />
      } @else {
        <!-- Le « + » ne bouge JAMAIS (Hugo, 2026-10-11) : il ajoutait, puis
             devenait le chiffre, et le doigt qui revenait ajouter tombait sur
             un compteur. Une fois l'article pris, un « − » plus petit paraît
             à sa gauche ; la quantité, elle, est sur la photo. -->
        <div class="steps">
          @if (quantity() > 0) {
            <button
              class="quick less"
              type="button"
              [attr.aria-label]="removeLabel()"
              (click)="removed.emit()"
            >
              <fold-icon name="minus" />
            </button>
          }
          <button class="quick" type="button" [attr.aria-label]="addLabel()" (click)="added.emit()">
            <fold-icon name="plus" />
          </button>
        </div>
      }
    </div>
  </div>
</div>
