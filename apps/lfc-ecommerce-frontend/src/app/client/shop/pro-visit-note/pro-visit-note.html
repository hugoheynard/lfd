@if (visit.active()) {
  <fold-callout variant="info" icon="info">
    {{ t().shop.proVisitNote }}
    <button actions foldButton size="sm" type="button" (click)="signIn()">
      {{ t().shop.proVisitSignIn }}
    </button>
    <button
      actions
      foldButton
      size="sm"
      emphasis="outline"
      intent="neutral"
      type="button"
      (click)="showTtc()"
    >
      {{ t().shop.proVisitShowTtc }}
    </button>
  </fold-callout>
}
