<div class="said">
  <!-- Pas de surtitre réglé, pas de surtitre : aucun repli (Hugo, 2026-10-09). -->
  @if (copy().kicker) {
    <p class="kicker">{{ copy().kicker }}</p>
  }
  <!-- La coupe du titre vient du DICTIONNAIRE, jamais d'un `<br>` : une
       traduction n'a pas à connaître le HTML, et l'italien ne se plie pas où le
       français se plie. -->
  <h2 class="title">{{ copy().title }}</h2>
  <p class="who">{{ copy().who }}</p>
</div>

<!-- 🔴 APPELER D'ABORD, ET EN PLEIN : c'est la hiérarchie de la source, et elle
     dit quelque chose — un imprévu se règle au téléphone, pas par écrit. -->
<div class="acts">
  <!-- Un seul numéro : « Appeler » EST son lien `tel:`. Plusieurs : il ouvre
       « Nous appeler », qui les montre tous — un dialogue pour un seul choix
       serait une étape pour rien. -->
  @if (copy().phones.length === 1) {
    <a class="call" [href]="telHref(copy().phones[0]!.number)">
      <span>{{ copy().call }}</span>
      <span class="number">{{ copy().phones[0]!.number }}</span>
    </a>
  } @else {
    <button class="call" type="button" (click)="call()">{{ copy().call }}</button>
  }
  <button class="write" type="button" (click)="write()">{{ copy().write }}</button>
</div>
