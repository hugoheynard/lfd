<div class="said">
  <p class="kicker">{{ copy().kicker }}</p>
  <!-- La coupe du titre vient du DICTIONNAIRE, jamais d'un `<br>` : une
       traduction n'a pas à connaître le HTML, et l'italien ne se plie pas où le
       français se plie. -->
  <h2 class="title">{{ copy().title }}</h2>
  <p class="who">{{ copy().who }}</p>
</div>

<!-- 🔴 APPELER D'ABORD, ET EN PLEIN : c'est la hiérarchie de la source, et elle
     dit quelque chose — un imprévu se règle au téléphone, pas par écrit. -->
<div class="acts">
  <!-- Un bouton par numéro : le premier en plein, les suivants plus discrets. -->
  @for (phone of copy().phones; track $index; let first = $first) {
    <a class="call" [class.more]="!first" [href]="telHref(phone.number)">
      <span>{{ copy().call }}{{ phone.label ? ' · ' + phone.label : '' }}</span>
      <span class="number">{{ phone.number }}</span>
    </a>
  }
  <button class="write" type="button" (click)="write()">{{ copy().write }}</button>
</div>
