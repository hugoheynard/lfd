<div class="said">
  <p class="kicker">{{ copy().kicker }}</p>
  <!-- La coupe du titre vient du DICTIONNAIRE, jamais d'un `<br>` : une
       traduction n'a pas à connaître le HTML, et l'italien ne se plie pas où le
       français se plie. -->
  <h2 class="title">{{ copy().title }}</h2>
  <p class="who">{{ copy().who }}</p>
</div>

<!-- 🔴 APPELER D'ABORD, ET EN PLEIN : c'est la hiérarchie de la source, et elle
     dit quelque chose — un imprévu se règle au téléphone, pas par écrit. La
     mention de l'heure creuse vient APRÈS les deux boutons : elle ne retient
     pas, elle évite un appel qui sonnerait dans le vide. -->
<div class="acts">
  <a class="call" [href]="phoneHref">{{ copy().call }}</a>
  <a class="write" [href]="mailHref">{{ copy().write }}</a>
  <p class="note">{{ copy().note }}</p>
</div>
