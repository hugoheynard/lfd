<!-- 🔴 LE SUR-TITRE EST LE PREMIER ÉLÉMENT, comme la référence — c'est tout
     l'objet de cette découpe. `fold-panel-header` rend son `subtitle` APRÈS le
     titre et n'a pas de slot avant lui ; le sur-titre y était donc relégué en
     second rang. Il prend désormais l'en-tête à lui seul, en variante
     `eyebrow` — fold le rend petit, gras, en capitales desserrées, ce que la
     maquette écrit à la main (Archivo 900, tracking .2em). Le grand titre ouvre
     le corps, juste dessous. -->
<fold-panel-header variant="eyebrow" [title]="kicker()" [closeLabel]="c().close" />

<fold-panel-body>
  <h2 class="screen">{{ c().title }}</h2>
  <p class="lead">{{ c().lead }}</p>

  @if (days().length === 0) {
    <!-- Aucune journée accordée par le serveur : on le dit, on n'en invente
         pas une. -->
    <fold-empty-state [title]="c().days.none" [subtitle]="c().empty.subtitle" />
  } @else {
    <div class="days" role="tablist" [attr.aria-label]="c().title">
      @for (tab of days(); track tab.day) {
        <button
          class="day"
          type="button"
          role="tab"
          [class.on]="day() === tab.day"
          [attr.aria-selected]="day() === tab.day"
          (click)="showDay(tab.day)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    @if (loading()) {
      <!-- Pendant la lecture, l'écran ne dit RIEN d'autre : annoncer « aucun
           créneau » ici serait une affirmation fausse. -->
      <!-- ⚠️ `fold-loading` et non `fold-loading-state` : le second est le nom
           de la CLASSE, et un élément inconnu ne rend rien sans que le
           typecheck s'en aperçoive — il ne lit pas les gabarits. -->
      <fold-loading [message]="c().loading" />
    } @else if (slots().length === 0) {
      <fold-empty-state [title]="c().empty.title" [subtitle]="c().empty.subtitle" />
    } @else {
      <div class="slots" role="radiogroup" [attr.aria-label]="c().title">
        @for (slot of slots(); track slot.startAt) {
          <!-- 🔴 Un créneau complet reste VISIBLE et fermé : on ne fait pas
               disparaître une heure, on dit qu'elle est prise et on nomme la
               suivante. Une absence serait un refus muet. -->
          <button
            class="slot"
            type="button"
            role="radio"
            [class.on]="picked()?.startAt === slot.startAt"
            [class.full]="!slot.open"
            [disabled]="!slot.open"
            [attr.aria-checked]="picked()?.startAt === slot.startAt"
            (click)="pick(slot)"
          >
            <span class="head">
              <span class="hour">{{ hourOf(slot) }}</span>
              @if (!slot.open) {
                <span class="tag is-full">{{ c().full.tag }}</span>
              } @else if (slot.badge) {
                <!-- Le badge vient du VENDEUR, saisi par plage en back-office.
                     C'est la seule phrase de cette carte qui ait une source. -->
                <span class="tag">{{ slot.badge }}</span>
              }
            </span>

            @if (!slot.open) {
              <span class="note">{{ fullNote(slot) }}</span>
            }
          </button>
        }
      </div>
    }
  }
</fold-panel-body>

<!-- `between` : « Retour » au bord gauche, l'action au droit — la répartition
     de la référence. ⚠️ Son « Retour » est un texte NU ; l'échelle de fold va
     de `solid` à `soft` et n'a pas de degré sans fond. `soft`/`neutral` en est
     le cran le plus discret, et je préfère cet écart à un bouton maison qui
     perdrait l'état de focus et la hauteur tactile. -->
<fold-panel-footer align="between">
  <button foldButton emphasis="soft" intent="neutral" size="lg" type="button" (click)="back()">
    {{ c().back }}
  </button>

  <!-- L'action NOMME l'heure : « Je prends 6 h 30 ». Un bouton qui dirait
       seulement « Continuer » obligerait à remonter pour vérifier. -->
  <button
    foldButton
    emphasis="solid"
    intent="primary"
    size="lg"
    type="button"
    [disabled]="picked() === null"
    (click)="confirm()"
  >
    {{ ctaLabel() }}
    <!-- La flèche de la référence. Décorative : un lecteur d'écran qui lirait
         « flèche vers la droite » après l'heure n'apprendrait rien de plus. -->
    <span aria-hidden="true">→</span>
  </button>
</fold-panel-footer>
