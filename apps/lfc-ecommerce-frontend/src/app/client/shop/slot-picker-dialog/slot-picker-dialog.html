<!-- 🔴 LE SUR-TITRE EST LE PREMIER ÉLÉMENT, comme la référence — c'est tout
     l'objet de cette découpe. `fold-panel-header` rend son `subtitle` APRÈS le
     titre et n'a pas de slot avant lui ; le sur-titre y était donc relégué en
     second rang. Il prend désormais l'en-tête à lui seul, en variante
     `eyebrow` — fold le rend petit, gras, en capitales desserrées, ce que la
     maquette écrit à la main (Archivo 900, tracking .2em). Le grand titre ouvre
     le corps, juste dessous. -->
<fold-panel-header variant="eyebrow" [title]="kicker()" [closeLabel]="c().close" />

<fold-panel-body>
  <!-- La question et son chapô forment un bloc, séparé du corps par un filet :
       sans lui, la première rangée de créneaux se lit comme la suite du
       paragraphe. -->
  <div class="intro">
    <h2 class="screen">{{ c().title }}</h2>
    <p class="lead">{{ c().lead }}</p>
  </div>

  <!-- 🔴 LE JOUR EST UN FAIT, PAS UN CHOIX (Hugo, 2026-10-27). Il vient du
       panneau du jour ; « Je change de date » y retourne, puis revient ici sur
       la même maison. Plus d'onglets : c'était le vieux panneau. -->
  <div class="days">
    <span class="day on">{{ dayLabel() }}</span>
  </div>
  <button class="change-day" type="button" (click)="changeDay()">
    {{ c().days.change }}
  </button>

  @if (loading()) {
    <!-- Pendant la lecture, l'écran ne dit RIEN d'autre : annoncer « aucun
           créneau » ici serait une affirmation fausse. -->
    <!-- ⚠️ `fold-loading` et non `fold-loading-state` : le second est le nom
           de la CLASSE, et un élément inconnu ne rend rien sans que le
           typecheck s'en aperçoive — il ne lit pas les gabarits. -->
    <fold-loading [message]="c().loading" />
  } @else if (slots().length === 0) {
    <fold-empty-state [title]="c().empty.title" [subtitle]="c().empty.subtitle" />
  } @else {
    <!-- 🔴 LES CRÉNEAUX SONT GROUPÉS PAR FOURNÉE, comme la maquette
           (`captures/09-adresse-quand.png`). Le badge quitte la carte pour
           devenir le SUR-TITRE de son groupe : il désignait une plage, pas une
           heure, et le répéter sur chacune des quatre cartes d'une même fournée
           le faisait lire comme un attribut du créneau.

           ⚠️ La maquette titre en deux temps — « MATIN · SORTIE DE FOURNÉE ».
           Seule la seconde moitié a une source ; le moment de la journée n'en a
           aucune, et le déduire de l'heure ferait appeler « après-ski » un
           créneau de 16 h en plein août. -->
    <div class="batches" role="radiogroup" appRovingRadioGroup [attr.aria-label]="c().title">
      @for (batch of batches(); track $index) {
        @if (batch.label) {
          <p class="batch-label">{{ batch.label }}</p>
        }

        <div class="slots">
          @for (slot of batch.slots; track slot.startAt) {
            <!-- 🔴 Un créneau complet reste VISIBLE et fermé : on ne fait pas
                   disparaître une heure, on dit qu'elle est prise et on nomme
                   la suivante. Une absence serait un refus muet. -->
            <button
              class="slot"
              type="button"
              role="radio"
              [class.on]="picked()?.startAt === slot.startAt"
              [class.full]="!slot.open"
              [disabled]="!slot.open"
              [attr.aria-checked]="picked()?.startAt === slot.startAt"
              (click)="pick(slot)"
            >
              <!-- 🔴 L'HEURE DE DÉBUT SEULE (Hugo, 2026-09-20 : « au niveau
                     des horaires on ne donne que la première heure »).
                     La tuile a porté l'intervalle quelques heures — « 7 h –
                     7 h 15 » — parce que les deux bornes sont dans le contrat.
                     Mais ce point découpe au quart d'heure : la seconde borne
                     se déduisait de la suivante, et douze tuiles répétaient
                     deux fois la même information. On choisit une heure, pas
                     une fenêtre. -->
              <span class="hour">{{ hourOf(slot) }}</span>
              @if (isCurrent(slot)) {
                <span class="tag">{{ c().current }}</span>
              }
              <!-- Un créneau ouvert ne dit rien de plus que son heure : seul
                     « Complet » se signale (Hugo, 2026-10-28). Là où il n'y a
                     plus de place, la carte ORIENTE : elle nomme la prochaine
                     heure libre. -->
              @if (!slot.open) {
                <span class="state">{{ c().state.full }}</span>
                <span class="note">{{ fullNote(slot) }}</span>
              }
            </button>
          }
        </div>
      }
    </div>
  }
</fold-panel-body>

<!-- LA BARRE DU PANIER EST LE PIED (plan `plan-barre-qui-accompagne.md`,
     Hugo, 2026-10-27) : plus de « Retour » ni de bouton « Je prends … » — la
     croix de l'en-tête ferme, et un clic sur une heure avance. -->
<app-cart-bar docked />
