<fold-panel-header variant="eyebrow" [title]="c().kicker" [closeLabel]="c().close" />

<fold-panel-body>
  <h2 class="screen">{{ c().title }}</h2>

  <div class="choices">
    <button foldButton block emphasis="outline" type="button" (click)="pick('date')">
      {{ c().changeDate }}
    </button>
    @if (pickup()) {
      <button foldButton block emphasis="outline" type="button" (click)="pick('time')">
        {{ c().changeTime }}
      </button>
      @if (data().severalPlaces) {
        <button foldButton block emphasis="outline" type="button" (click)="pick('place')">
          {{ c().changePlace }}
        </button>
      }
    } @else {
      <button foldButton block emphasis="outline" type="button" (click)="pick('address')">
        {{ c().changeAddress }}
      </button>
    }
    @if (data().otherOpen) {
      <button foldButton block emphasis="outline" type="button" (click)="pick('mode')">
        {{ pickup() ? c().toDelivery : c().toPickup }}
      </button>
    }
  </div>
</fold-panel-body>

<!-- La barre du panier en pied, comme aux étapes du jour et de l'heure (Hugo,
     2026-10-27) : elle dit le choix qu'on s'apprête à modifier. -->
<app-cart-bar docked />
