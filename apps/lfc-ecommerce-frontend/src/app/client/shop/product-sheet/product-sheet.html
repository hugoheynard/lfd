@if (product(); as piece) {
  <app-client-dialog
    placement="sheet"
    [open]="true"
    [kicker]="shelf()"
    [title]="piece.name"
    (closed)="closed.emit()"
  >
    <span dialog-media class="photo">
      @if (art(); as visual) {
        <!-- `sizes` : l'ouverture occupe toute la largeur du panneau, plafonné
             à 40rem. Sans cette indication, le navigateur suppose la pleine
             largeur de la fenêtre et prend toujours la plus grande. -->
        <img
          [src]="artSrc()"
          [attr.srcset]="artSrcset() || null"
          sizes="(min-width: 40rem) 40rem, 100vw"
          [attr.alt]="visual.alt"
          decoding="async"
        />
      }
      @if (piece.isFeatured) {
        <span class="signature">{{ t().product.signature }}</span>
      }
    </span>

    <div class="sheet">
      <p class="note">{{ piece.note }}</p>

      <dl class="facts">
        @for (fact of facts(); track fact.key) {
          <div class="fact">
            <dt>{{ fact.key }}</dt>
            <dd>{{ fact.value }}</dd>
          </div>
        }
      </dl>
    </div>

    <div dialog-foot class="foot">
      @if (orderable()) {
        <app-quantity-rail
          size="lg"
          [quantity]="quantity()"
          [addLabel]="addLabel()"
          [removeLabel]="removeLabel()"
          (added)="added.emit()"
          (removed)="removed.emit()"
        />

        <button class="cta" type="button" (click)="added.emit()">{{ cta() }}</button>
      } @else {
        <p class="soon">{{ t().shop.orderingSoon }}</p>
      }
    </div>
  </app-client-dialog>
}
