<!-- 🔴 TOUT DANS LA CARTE (handoff `handoff-inscription`, captures 03 et 04) :
     titre, promesse, fournisseur, filet, champs, action. Le bouton Google et le
     filet vivaient DEHORS, au-dessus d'elle : on lisait deux blocs, donc deux
     décisions, alors qu'il n'y en a qu'une — ouvrir un compte — avec deux
     chemins pour la prendre. -->
<fold-card class="signup">
  <form class="form" (submit)="$event.preventDefault(); submit()">
    <div class="head">
      <h2 class="title">{{ t().signup.submit }}</h2>
      <p class="pitch">{{ t().signup.pitch }}</p>
    </div>

    <!-- Le fournisseur d'abord, l'e-mail ensuite (Hugo, 2026-09-17 : « le même
         panel que Sushi Shop ») : un clic suffit à qui a un compte Google, et le
         formulaire reste là pour les autres.
         Aucun rattachement : une adresse Google déjà portée par un compte est
         refusée par l'API, pas doublée (plan `plan-connexion-sociale.md`).

         🔴 Facebook est arrivé le 2026-09-21 (Hugo), et il est CÂBLÉ : la
         façade porte `continueWithFacebook`, qui part droit chez le
         fournisseur comme celui de Google. Ce qu'il exige en plus ne vit pas
         ici — la connexion doit être activée dans le tenant Auth0, faute de
         quoi le bouton se heurte à « connection not found » (cf.
         `FACEBOOK_CONNECTION`). -->
    <div class="social">
      <button
        foldButton
        class="social-button"
        emphasis="outline"
        intent="neutral"
        size="lg"
        type="button"
        [block]="true"
        (click)="wantsGoogle.emit()"
      >
        <img class="social-logo" src="brand/google-g.svg" alt="" width="20" height="20" />
        {{ t().signup.google }}
      </button>
      <button
        foldButton
        class="social-button"
        emphasis="outline"
        intent="neutral"
        size="lg"
        type="button"
        [block]="true"
        (click)="wantsFacebook.emit()"
      >
        <img class="social-logo" src="brand/facebook-f.svg" alt="" width="20" height="20" />
        {{ t().signup.facebook }}
      </button>
    </div>

    <app-rule-ou [label]="t().signup.orEmail" />

    <div class="fields">
      <fold-input
        class="f-first"
        size="lg"
        [label]="t().signup.firstName"
        autocomplete="given-name"
        [placeholder]="t().signup.firstNamePlaceholder"
        [(value)]="firstName"
      />
      <fold-input
        class="f-tel"
        size="lg"
        type="tel"
        [label]="t().signup.tel"
        autocomplete="tel"
        [placeholder]="t().signup.telPlaceholder"
        [(value)]="tel"
      />
      <fold-input
        class="f-mail"
        size="lg"
        type="email"
        [label]="t().signup.email"
        autocomplete="email"
        [placeholder]="t().signup.emailPlaceholder"
        [(value)]="email"
      />
    </div>

    <div class="submit">
      <button
        foldButton
        class="cta"
        emphasis="solid"
        intent="primary"
        size="lg"
        type="submit"
        [disabled]="!complete()"
      >
        {{ t().signup.open }}
      </button>
      <p class="fine">{{ t().signup.fine }}</p>
    </div>

    <!-- Le pied de la carte propose l'AUTRE porte, sous un filet : c'est la
         dernière chose qu'on lit, et elle rattrape qui s'est trompé de porte
         après avoir vu ce que celle-ci demande. -->
    <p class="other-door">
      {{ t().doors.toProLead }}
      <button class="link" type="button" (click)="wantsPro.emit()">
        {{ t().pro.openAccount }}
      </button>
    </p>
  </form>
</fold-card>

<app-rule-ou class="only-narrow" />

<app-door-card
  class="only-narrow"
  tone="solid"
  icon="arrow-right"
  [title]="t().doors.alreadyTitle"
  [sub]="t().doors.alreadySub"
  (opened)="wantsLogin.emit(email())"
/>

<p class="legal">{{ t().signup.legal }}</p>
