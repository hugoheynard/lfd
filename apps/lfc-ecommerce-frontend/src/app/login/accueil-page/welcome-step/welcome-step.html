<div class="head">
  <p class="eyebrow">{{ t().signup.eyebrow }}</p>
  <p class="already">
    {{ t().signup.alreadyLead }}
    <button class="link" type="button" (click)="wantsLogin.emit(email())">
      {{ t().signup.alreadyLink }}
    </button>
  </p>
</div>

<!-- 🔴 LE PANNEAU D'ENTRÉE (Hugo, 2026-09-17 : « le même panel que Sushi
     Shop »). Le fournisseur d'abord, l'e-mail ensuite : un clic suffit à qui a
     un compte Google, et le formulaire reste là pour les autres.
     Aucun rattachement : une adresse Google déjà portée par un compte est
     refusée par l'API, pas doublée (plan `plan-connexion-sociale.md`). -->
<div class="social">
  <button
    foldButton
    class="social-button"
    emphasis="outline"
    intent="neutral"
    size="lg"
    type="button"
    [block]="true"
    (click)="wantsGoogle.emit()"
  >
    <img class="social-logo" src="brand/google-g.svg" alt="" width="20" height="20" />
    {{ t().signup.google }}
  </button>
</div>

<app-rule-ou />

<fold-card class="signup">
  <form class="form" [class.folded]="!expanded()" (submit)="$event.preventDefault(); submit()">
    <p class="pitch">{{ t().signup.pitch }}</p>

    <div #fields class="fields" [id]="fieldsId">
      <fold-input
        class="f-first"
        size="lg"
        [label]="t().signup.firstName"
        autocomplete="given-name"
        [placeholder]="t().signup.firstNamePlaceholder"
        [(value)]="firstName"
      />
      <fold-input
        class="f-tel"
        size="lg"
        type="tel"
        [label]="t().signup.tel"
        autocomplete="tel"
        [placeholder]="t().signup.telPlaceholder"
        [hint]="t().signup.telHint"
        [(value)]="tel"
      />
      <fold-input
        class="f-mail"
        size="lg"
        type="email"
        [label]="t().signup.email"
        autocomplete="email"
        [placeholder]="t().signup.emailPlaceholder"
        [(value)]="email"
      />
    </div>

    <div class="submit">
      <!-- Deux boutons, un seul montré à la fois : le pli est une affaire de
           largeur, et seul le CSS la connaît sans risquer de se tromper au rendu
           serveur. Celui qui est caché sort aussi de l'ordre de tabulation. -->
      <button
        foldButton
        class="cta cta-open"
        emphasis="solid"
        intent="primary"
        size="lg"
        type="button"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="fieldsId"
        (click)="expand()"
      >
        {{ t().signup.open }}
      </button>
      <button
        foldButton
        class="cta cta-submit"
        emphasis="solid"
        intent="primary"
        size="lg"
        type="submit"
        [disabled]="!complete()"
      >
        {{ t().signup.submit }}
      </button>
      <span class="fine-inline">{{ t().signup.fineInline }}</span>
    </div>
  </form>
</fold-card>

<p class="fine">{{ t().signup.fine }}</p>

<app-rule-ou class="only-narrow" />

<app-door-card
  class="only-narrow"
  tone="solid"
  icon="arrow-right"
  [title]="t().doors.alreadyTitle"
  [sub]="t().doors.alreadySub"
  (opened)="wantsLogin.emit(email())"
/>

<app-event-card (opened)="wantsQuote.emit()" />

@if (quotePending()) {
  <fold-callout variant="info">{{ t().event.pending }}</fold-callout>
}

<app-callback-block
  [title]="t().pro.title"
  [pitch]="t().pro.pitch"
  [cta]="t().pro.cta"
  [phone]="phone()"
  [bookedSlot]="bookedSlot()"
  (wantsCallback)="wantsCallback.emit()"
  (cancelled)="cancelledCallback.emit()"
>
  <a class="pro-door" routerLink="/ouverture-compte-pro">
    {{ t().pro.openAccount }}
    <fold-icon name="arrow-right" aria-hidden="true" />
  </a>
</app-callback-block>

<p class="legal">{{ t().signup.legal }}</p>
