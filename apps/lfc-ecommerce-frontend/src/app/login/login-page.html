<main class="login">
  <section class="login-card">
    <div class="login-brand">
      <span class="login-mark" aria-hidden="true">B2B</span>
      <span class="login-wordmark">La Folie Coffee</span>
    </div>

    <h1 class="login-title">{{ copy().title }}</h1>
    <p class="login-lead">{{ copy().lead }}</p>

    @if (facade.isLoading()) {
      <div class="login-loading" role="status">
        <fold-spinner />
        <span>{{ copy().checking }}</span>
      </div>
    } @else {
      <button foldButton emphasis="solid" intent="primary" block type="button" (click)="signIn()">
        {{ copy().signIn }}
      </button>
      <button foldButton emphasis="outline" intent="neutral" block type="button" (click)="signUp()">
        {{ copy().signUp }}
      </button>
      <p class="login-hint">{{ copy().hint }}</p>
    }
  </section>
</main>
