<div class="cm">
  @if (showState()) {
    <div class="cm-head">
      @if (inherited()) {
        <fold-badge content="Hérité de la gamme" variant="neutral" />
      } @else {
        <fold-badge content="Personnalisé" variant="warning" />
        <button
          foldButton
          emphasis="soft"
          intent="neutral"
          size="sm"
          (click)="revert.emit()"
        >
          Revenir au défaut de la gamme
        </button>
      }
    </div>
  }

  <div class="cm-table">
    <div class="cm-row cm-row--head">
      <span class="cm-label"></span>
      <span class="cm-cell cm-col">À emporter</span>
      <span class="cm-cell cm-col">Sur place</span>
    </div>

    <div class="cm-row">
      <span class="cm-label">{{ boutiques.b1 }}</span>
      <span class="cm-cell">
        <fold-checkbox
          [ariaLabel]="boutiques.b1 + ' — à emporter'"
          [checked]="channels().b1.emporter"
          (checkedChange)="setCell('b1', 'emporter', $event)"
        />
      </span>
      <span class="cm-cell">
        <fold-checkbox
          [ariaLabel]="boutiques.b1 + ' — sur place'"
          [checked]="channels().b1.surPlace"
          (checkedChange)="setCell('b1', 'surPlace', $event)"
        />
      </span>
    </div>

    <div class="cm-row">
      <span class="cm-label">{{ boutiques.b2 }}</span>
      <span class="cm-cell">
        <fold-checkbox
          [ariaLabel]="boutiques.b2 + ' — à emporter'"
          [checked]="channels().b2.emporter"
          (checkedChange)="setCell('b2', 'emporter', $event)"
        />
      </span>
      <span class="cm-cell">
        <fold-checkbox
          [ariaLabel]="boutiques.b2 + ' — sur place'"
          [checked]="channels().b2.surPlace"
          (checkedChange)="setCell('b2', 'surPlace', $event)"
        />
      </span>
    </div>
  </div>
</div>
