<svg
  class="diagram"
  viewBox="0 0 740 420"
  role="img"
  aria-label="Trois calques ordonnés — TVA, disponibilité, display — composent l'output de chaque vitrine"
>
  <defs>
    <marker
      id="flow-arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path class="arrowhead" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <!-- Calque 1 · TVA -->
  <rect class="layer" x="190" y="20" width="360" height="60" rx="12" />
  <circle class="num-badge" cx="224" cy="50" r="15" />
  <text class="num" x="224" y="55">1</text>
  <text class="layer-title" x="252" y="46">TVA</text>
  <text class="layer-sub" x="252" y="64">le régime fiscal — hérité par canal</text>

  <path class="branch" d="M370 80 L370 100" marker-end="url(#flow-arrow)" />

  <!-- Calque 2 · Disponibilité -->
  <rect class="layer" x="190" y="102" width="360" height="60" rx="12" />
  <circle class="num-badge" cx="224" cy="132" r="15" />
  <text class="num" x="224" y="137">2</text>
  <text class="layer-title" x="252" y="128">Disponibilité</text>
  <text class="layer-sub" x="252" y="146">canaux : boutique × à emporter / sur place</text>

  <path class="branch" d="M370 162 L370 182" marker-end="url(#flow-arrow)" />

  <!-- Calque 3 · Display -->
  <rect class="layer" x="190" y="184" width="360" height="60" rx="12" />
  <circle class="num-badge" cx="224" cy="214" r="15" />
  <text class="num" x="224" y="219">3</text>
  <text class="layer-title" x="252" y="210">Display user</text>
  <text class="layer-sub" x="252" y="228">le rendu de la vitrine</text>

  <!-- Composition → vitrines -->
  <text class="edge-label" x="370" y="270">composent</text>
  <path class="branch" d="M370 244 L370 278" />
  <path class="branch" d="M370 278 L210 278 L210 300" marker-end="url(#flow-arrow)" />
  <path class="branch" d="M370 278 L530 278 L530 300" marker-end="url(#flow-arrow)" />

  <!-- Vitrines = les sorties -->
  <rect class="vitrine" x="70" y="302" width="280" height="80" rx="12" />
  <text class="vitrine-tag" x="88" y="326">vitrine</text>
  <text class="box-title" x="210" y="348">Click &amp; collect public</text>
  <text class="box-sub" x="210" y="366">à emporter · en ligne</text>

  <rect class="vitrine" x="390" y="302" width="280" height="80" rx="12" />
  <text class="vitrine-tag" x="408" y="326">vitrine</text>
  <text class="box-title" x="530" y="348">Sur place</text>
  <text class="box-sub" x="530" y="366">QR table · immédiat</text>
</svg>
