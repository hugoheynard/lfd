<fold-app-shell #shell="foldAppShell" [(mobileNavOpen)]="mobileNavOpen">
  <!-- Primary rail — the app menu. Expanded by default, collapsible via the
       built-in chevron. Becomes an off-canvas drawer ≤768px. -->
  <fold-menu
    railPrimary
    collapsible
    tint="primary"
    [level]="hosted ? 'secondary' : 'primary'"
    [(expanded)]="menuExpanded"
  >
    <a header class="rail-brand" routerLink="/" aria-label="LFC PIM — accueil">
      <span class="pim-mark" aria-hidden="true">PIM</span>
      @if (menuExpanded()) {
        <span class="rail-wordmark">LFC-PIM</span>
      }
    </a>

    <a
      fold-menu-item
      icon="grid"
      label="Produits"
      routerLink="/produits"
      routerLinkActive
      #produitsRla="routerLinkActive"
      [active]="produitsRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <a
      fold-menu-item
      icon="folder"
      label="Catégories"
      routerLink="/categories"
      routerLinkActive
      #categoriesRla="routerLinkActive"
      [active]="categoriesRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <a
      fold-menu-item
      icon="sliders"
      label="Régimes de TVA"
      routerLink="/tva"
      routerLinkActive
      #tvaRla="routerLinkActive"
      [active]="tvaRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <a
      fold-menu-item
      icon="org-chart"
      label="Collections"
      routerLink="/collections"
      routerLinkActive
      #collectionsRla="routerLinkActive"
      [active]="collectionsRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <a
      fold-menu-item
      icon="upload"
      label="Publication"
      routerLink="/publication"
      routerLinkActive
      #publicationRla="routerLinkActive"
      [active]="publicationRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <a
      fold-menu-item
      icon="company"
      label="Emplacements"
      routerLink="/emplacements"
      routerLinkActive
      #empRla="routerLinkActive"
      [active]="empRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <a
      fold-menu-item
      icon="shopify"
      label="Intégrations"
      routerLink="/integration"
      routerLinkActive
      #integrationRla="routerLinkActive"
      [active]="integrationRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <a
      footer
      fold-menu-item
      icon="library"
      label="Documentation"
      routerLink="/documentation"
      routerLinkActive
      #docRla="routerLinkActive"
      [active]="docRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <a
      footer
      fold-menu-item
      icon="settings"
      label="Réglages"
      routerLink="/reglages"
      routerLinkActive
      #reglagesRla="routerLinkActive"
      [active]="reglagesRla.isActive"
      (click)="mobileNavOpen.set(false)"
    ></a>
    <button
      footer
      fold-menu-item
      icon="logout"
      label="Déconnexion"
      type="button"
      (click)="logout()"
    ></button>
  </fold-menu>

  <!-- Header -->
  <div header foldSurface="chrome" class="app-header">
    <fold-button-icon
      class="app-hamburger"
      [icon]="mobileNavOpen() ? 'close' : 'menu'"
      tooltip="Ouvrir la navigation"
      [attr.aria-expanded]="mobileNavOpen()"
      [attr.aria-controls]="shell.drawerId"
      (clicked)="mobileNavOpen.set(!mobileNavOpen())"
    />

    <fold-search class="app-search" placeholder="Rechercher un produit, une référence…" />

    <div class="app-header-actions">
      <fold-avatar name="Folie Douce" size="sm" />
    </div>
  </div>

  <!-- Content -->
  <router-outlet />

  <!-- Hôte unique des side-panels (création de régime, etc.). -->
  <fold-panel-host />
</fold-app-shell>
