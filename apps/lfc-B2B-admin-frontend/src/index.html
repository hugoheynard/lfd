<!doctype html>
<html lang="fr" data-theme="navi">
  <head>
    <meta charset="utf-8" />
    <title>LFC B2B admin</title>
    <base href="/" />
    <!-- Déclarer l'icône coupe la requête d'office vers /favicon.ico — que
         l'app ne servait pas, d'où le 404 à chaque chargement. En SVG : une
         pastille nette à toutes les tailles, et le bleu du rail plutôt que le
         logo Angular que portaient les trois autres apps. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- `viewport-fit=cover` : sans lui, iOS borde la page de bandes noires sur un
         écran à encoche ET laisse `env(safe-area-inset-*)` à zéro — les marges de
         sécurité du CSS ne s'appliqueraient donc jamais. Sans effet ailleurs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Coque iOS (Capacitor) : barre d'état en texte sombre sur notre fond clair. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LFC Admin" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
