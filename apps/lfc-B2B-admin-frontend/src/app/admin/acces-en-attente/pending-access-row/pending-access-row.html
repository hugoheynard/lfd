<fold-card>
  <div class="row">
    <div class="who">
      <span class="name">{{ row().name }}</span>
      <!-- L'icône avant l'adresse : sur une carte où le nom et la société sont
           déjà du texte, elle donne à l'e-mail sa nature d'un coup d'œil, sans
           le mot « e-mail ». -->
      <span class="email">
        <fold-icon name="mail" [size]="14" />
        {{ row().person.email }}
      </span>
      <span class="meta">
        @if (row().person.companyId; as companyId) {
          <a [routerLink]="['/comptes-clients', companyId]">
            {{ row().person.companyName }}
          </a>
        } @else {
          <!-- Un membre de l'équipe n'a pas de fiche société où aller : son
               rattachement est sa fonction. -->
          {{ row().person.companyName }}
        }
        · attend {{ row().waiting }}
      </span>
    </div>
    <!-- Un lien FRAIS à chaque clic : celui de l'ouverture serait mort depuis
         longtemps. -->
    <button
      foldButton
      class="copy"
      intent="primary"
      emphasis="soft"
      icon="copy"
      [disabled]="busy()"
      [attr.aria-label]="'Copier le lien de ' + row().name"
      (click)="copy.emit()"
    >
      <!-- Le libellé tombe sur étroit, l'icône reste. Une carte de téléphone n'a
           pas la place d'un verbe, et le geste se devine : c'est le seul bouton
           de la ligne. Le nom passe en `aria-label`, sinon on perdrait DE QUI on
           copie le lien — trois boutons « Copier » identiques au lecteur
           d'écran. -->
      <span class="copy-label">Copier le lien</span>
    </button>
  </div>
</fold-card>
