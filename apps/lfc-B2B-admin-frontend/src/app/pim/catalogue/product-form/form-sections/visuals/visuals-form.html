<!-- Le sélecteur de CETTE section. Il ne fait basculer QUE les textes
     alternatifs : le nom, l'URL et les dimensions d'un visuel ne se traduisent
     pas, et l'image encore moins. -->
<app-lang-switch
  [lang]="store.mediaLocale()"
  (langChange)="store.mediaLocale.set($event)"
  [missing]="store.mediaMissing()"
  ariaLabel="Langue des textes alternatifs"
/>

<!-- UN avertissement pour la galerie, pas un par vignette. Répété sur chaque
     tuile, le message devenait le motif de fond de la section : on ne lisait
     plus que lui, donc plus rien. Ici il compte, il nomme les langues, et les
     tuiles concernées se signalent par leur liseré. -->
@if (missingHint(); as hint) {
  <fold-callout appearance="inset" variant="warning">{{ hint }}</fold-callout>
}

<app-media-gallery
  [slots]="store.media()"
  [locale]="store.mediaLocale()"
  [incomplete]="incompleteIndexes()"
  [busy]="store.uploading()"
  (edit)="editMedia($event)"
  (picked)="store.uploadMedia($event)"
/>
