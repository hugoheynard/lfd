@if (store.dirtySections().length >= 2) {
  <section class="pr-block" aria-labelledby="pr-dirty">
    <fold-element-title
      id="pr-dirty"
      [title]="store.dirtySections().length + ' sections modifiées'"
    />
    <fold-card>
      <ul class="pr-list">
        @for (section of store.dirtySections(); track section.key) {
          <li>
            <span class="pr-dot" aria-hidden="true"></span>
            {{ section.label }}
          </li>
        }
      </ul>
      <button foldButton class="pr-cta" [loading]="store.busy()" (click)="saveAll.emit()">
        Tout enregistrer
      </button>
    </fold-card>
  </section>
}

<section class="pr-block" aria-labelledby="pr-completeness">
  <fold-element-title id="pr-completeness" title="Complétude" />
  <fold-card>
    <fold-meter
      class="pr-meter"
      label="Complétude"
      [value]="done()"
      [max]="total()"
      [tone]="tone()"
      showValue
    />

    @for (row of rows(); track row.key) {
      <div class="pr-check">
        <fold-checklist [items]="row.items" [stateLabels]="stateLabels" />

        @if (row.children.length > 0) {
          <fold-disclosure class="pr-langs">
            <span summary>{{ row.doneChildren }}/{{ row.children.length }} langues</span>
            <fold-checklist [items]="row.children" [stateLabels]="stateLabels" />
          </fold-disclosure>
        }
      </div>
    }
  </fold-card>
</section>
