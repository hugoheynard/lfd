<div class="grid">
  <label class="field">
    <span class="field-label">Prix (€)</span>
    <input
      class="native-input"
      type="number"
      step="0.01"
      min="0"
      [value]="store.priceEur() ?? ''"
      (input)="store.priceEur.set(numberValue($event))"
    />
  </label>
  <label class="field">
    <span class="field-label">Poids (g)</span>
    <input
      class="native-input"
      type="number"
      step="1"
      min="0"
      [value]="store.weightGrams() ?? ''"
      (input)="store.weightGrams.set(numberValue($event))"
    />
  </label>
</div>
