<!-- Le sélecteur de CETTE section. Il ne fait basculer QUE les textes
     alternatifs : le rôle, l'URL et les dimensions d'un visuel ne se traduisent
     pas, et l'image encore moins. -->
<app-lang-switch
  [lang]="store.mediaLocale()"
  (langChange)="store.mediaLocale.set($event)"
  [missing]="store.mediaMissing()"
  [hint]="missingHint()"
  ariaLabel="Langue des textes alternatifs"
/>

<div class="stack">
  <div class="media">
    @for (slot of store.media(); track $index) {
      <div class="media-row">
        <!-- L'aperçu réserve sa place quand on connaît la taille : sans ratio,
             la liste saute au chargement de chaque image. -->
        <div class="media-thumb" [style.aspect-ratio]="ratioOf(slot)">
          @if (slot.url !== '') {
            <img [src]="slot.url" [alt]="store.mediaAlt($index)" loading="lazy" />
          }
        </div>
        <div class="media-fields">
          <fold-listbox
            [value]="slot.role"
            (selectionChange)="store.setMedia($index, 'role', $event)"
          >
            @for (role of roles; track role.value) {
              <fold-option [value]="role.value">{{ role.label }}</fold-option>
            }
          </fold-listbox>
          <!-- Accessibilité ET référencement : ce champ n'était pas exposé, et
               le texte alternatif retombait donc sur l'URL. C'est le SEUL champ
               d'image qui se traduit — le sélecteur en haut le fait basculer. -->
          <fold-input
            [placeholder]="altPlaceholder()"
            [value]="store.mediaAlt($index)"
            (valueChange)="store.setMediaAlt($index, $event)"
          />
          @if (slot.url === '') {
            <fold-input
              placeholder="https://…"
              [value]="slot.url"
              (valueChange)="store.setMedia($index, 'url', $event)"
            />
          } @else {
            <span class="media-meta">{{ metaOf(slot) }}</span>
          }
        </div>
        <button
          foldButton
          emphasis="soft"
          intent="neutral"
          size="sm"
          (click)="store.removeMedia($index)"
        >
          Retirer
        </button>
      </div>
    } @empty {
      <p class="media-empty">Aucun visuel. Déposez une image pour commencer.</p>
    }
  </div>

  <div class="media-actions">
    <label class="media-pick" [class.is-busy]="store.uploading()">
      <input
        type="file"
        accept="image/png,image/jpeg,image/webp"
        [disabled]="store.uploading()"
        (change)="pick($event)"
      />
      <span>{{ store.uploading() ? 'Dépôt…' : 'Déposer une image' }}</span>
    </label>
    <!-- Le chemin historique reste ouvert : le catalogue existant est fait
         d'URL saisies, et rien ne les a rapatriées. -->
    <button foldButton emphasis="outline" size="sm" (click)="store.addMedia()">
      Ajouter par URL
    </button>
  </div>
</div>

<!-- Le pied de section, comme les autres panneaux enregistrables. Les visuels
     n'en avaient pas : ils se saisissaient dans le vide. -->
