<p class="panel-desc">Le master ; chaque canal en dérivera ses tailles.</p>
<fold-card class="stack">
  <fold-callout appearance="inset" variant="info">
    La persistance des visuels n'est pas encore branchée (stockage média à venir).
  </fold-callout>
  <div class="media">
    @for (slot of store.media(); track $index) {
      <div class="media-row">
        <fold-listbox
          [value]="slot.role"
          (selectionChange)="store.setMedia($index, 'role', $event)"
        >
          @for (role of roles; track role.value) {
            <fold-option [value]="role.value">{{ role.label }}</fold-option>
          }
        </fold-listbox>
        <fold-input
          placeholder="https://…"
          [value]="slot.url"
          (valueChange)="store.setMedia($index, 'url', $event)"
        />
        <button
          foldButton
          emphasis="soft"
          intent="neutral"
          size="sm"
          (click)="store.removeMedia($index)"
        >
          Retirer
        </button>
      </div>
    }
  </div>
  <button foldButton emphasis="outline" size="sm" (click)="store.addMedia()">
    Ajouter un visuel
  </button>
</fold-card>

<!-- Le pied de section, comme les autres panneaux enregistrables. Les visuels
     n'en avaient pas : ils se saisissaient dans le vide. -->
<div class="section-footer">
  <button foldButton size="sm" (click)="store.saveMedia()">Enregistrer</button>
  <span class="section-status">{{ store.statusText('visuels') }}</span>
</div>
