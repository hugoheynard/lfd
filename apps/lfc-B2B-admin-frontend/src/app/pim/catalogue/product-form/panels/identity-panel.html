<p class="panel-desc">Le strict nécessaire pour exister au catalogue.</p>
<fold-card>
  <div class="grid">
    <fold-input
      label="Nom du produit"
      required
      [value]="store.name()"
      (valueChange)="store.name.set($event)"
    />
    <fold-listbox label="Nature" [value]="store.kind()" (selectionChange)="store.setKind($event)">
      @for (option of store.kinds; track option.value) {
        <fold-option [value]="option.value">{{ option.label }}</fold-option>
      }
    </fold-listbox>
    <fold-listbox
      label="Famille"
      [value]="store.categoryId()"
      (selectionChange)="store.setCategory($event)"
    >
      @for (category of store.categories(); track category.id) {
        <fold-option [value]="category.id">{{ category.name.fr }}</fold-option>
      }
    </fold-listbox>
    <fold-input
      label="Référence — SKU"
      [hint]="store.isEdit() ? 'Figée après création.' : 'Calculée si laissée vide.'"
      [value]="store.sku()"
      [disabled]="store.isEdit()"
      (valueChange)="store.sku.set($event)"
    />
  </div>
  @if (store.isEdit()) {
    <div class="section-footer">
      <button foldButton size="sm" (click)="store.saveIdentity()">Enregistrer</button>
      <span class="section-status">{{ store.statusText('identite') }}</span>
    </div>
  }
</fold-card>
