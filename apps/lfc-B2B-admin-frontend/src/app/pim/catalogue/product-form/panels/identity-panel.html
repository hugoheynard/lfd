<!-- Le sélecteur appartient à CETTE section, et il ne fait basculer que le nom.
     La famille, la nature et le slug ne se traduisent pas — un sélecteur de page
     les aurait fait basculer avec, ou aurait laissé croire qu'ils basculent. -->
<app-lang-switch
  [lang]="store.nameLocale()"
  (langChange)="store.nameLocale.set($event)"
  [missing]="store.nameMissing()"
  [hint]="missingHint()"
  ariaLabel="Langue du nom"
/>

<div class="grid">
  <fold-input
    [label]="nameLabel()"
    [required]="store.nameLocale() === sourceLocale"
    [value]="store.name()"
    (valueChange)="store.setName($event)"
  />
  <fold-listbox
    label="Famille"
    [value]="store.categoryId()"
    (selectionChange)="store.setCategory($event)"
  >
    @for (category of store.categories(); track category.id) {
      <fold-option [value]="category.id">{{ category.name.fr }}</fold-option>
    }
  </fold-listbox>
  <fold-listbox label="Nature" [value]="store.kind()" (selectionChange)="store.setKind($event)">
    @for (option of store.kinds; track option.value) {
      <fold-option [value]="option.value">{{ option.label }}</fold-option>
    }
  </fold-listbox>

  <!-- Le slug est LU, jamais saisi : il est figé à la création, parce qu'une URL
       qui change casse les liens et le référencement acquis. Il naît de la
       première publication, donc il peut manquer sur un brouillon — et on le dit
       plutôt que d'afficher une valeur « proposée » qui prétendrait connaître
       l'algorithme du serveur.

       La RÉFÉRENCE, elle, a quitté ce panneau : elle vit maintenant dans la
       ligne de faits de l'en-tête, avec la famille et le nombre de déclinaisons.
       La répéter ici en ferait un champ de formulaire qui n'en est pas un. -->
  @if (store.isEdit()) {
    <fold-field-list>
      <fold-field label="Slug">
        @if (store.slug(); as slug) {
          <code class="sku">{{ slug }}</code>
        } @else {
          <span class="muted">attribué à la première publication</span>
        }
      </fold-field>
    </fold-field-list>
  }
</div>
