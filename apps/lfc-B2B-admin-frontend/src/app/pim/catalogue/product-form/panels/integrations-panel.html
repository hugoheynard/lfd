<!-- DEUX blocs côte à côte, plus un troisième niveau d'onglets. Deux états vides
     derrière trois niveaux de navigation ne se justifient pas, et l'ajout d'un
     champ Shopify ne doit pas créer une page. -->
<div class="channels">
  <section class="channel">
    <fold-element-title variant="eyebrow" title="Boutique B2B" />
    <p class="muted">
      La plateforme professionnelle lit le nom, le prix et les allergènes du référentiel. Elle n'a
      pas de champ propre — et c'est une information, pas un manque.
    </p>
  </section>

  <section class="channel">
    <fold-element-title variant="eyebrow" title="Shopify" />
    <!-- Le handle vit ICI et non dans l'identité : c'est une URL de boutique en
         ligne, donc une propriété du CANAL. Le B2B ne s'en sert pas — un
         professionnel qui commande en gros ne cherche pas le produit sur Google. -->
    <fold-field-list>
      <fold-field label="Handle">
        @if (store.slug(); as slug) {
          <code class="sku">{{ slug }}</code>
        } @else {
          <span class="muted">attribué à la première poussée</span>
        }
      </fold-field>
    </fold-field-list>
    <p class="muted">Les tags et l'état de synchronisation viendront ici.</p>
  </section>
</div>
