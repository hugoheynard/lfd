<div class="stack">
  <div class="grid">
    @for (field of fields; track field.key) {
      <fold-input
        [label]="field.label"
        [value]="store.editorial()[field.key]"
        (valueChange)="store.setEditorial(field.key, $event)"
      />
    }
  </div>
  <label class="field">
    <span class="field-label">Description longue</span>
    <textarea
      class="native-input native-textarea"
      rows="4"
      [value]="store.editorial().descriptionLong"
      (input)="store.setEditorial('descriptionLong', textValue($event))"
    ></textarea>
  </label>
  <label class="field">
    <span class="field-label">Récit / savoir-faire</span>
    <textarea
      class="native-input native-textarea"
      rows="3"
      [value]="store.editorial().story"
      (input)="store.setEditorial('story', textValue($event))"
    ></textarea>
  </label>
</div>
