<fold-data-table
  [columns]="columns()"
  [rows]="regimes()"
  [rowKey]="rowKey"
  mobileLayout="auto-cards"
  zebra
  toolbarSurface="accent"
  [empty]="emptyState"
>
  <div foldToolbar class="table-toolbar">
    <span class="toolbar-title">
      <fold-icon name="tax" size="sm" />
      Taux de TVA
    </span>
  </div>

  <ng-template foldCell="name" let-r
    ><strong>{{ r.name }}</strong></ng-template
  >

  <ng-template foldCell="description" let-r>
    <span class="muted">{{ r.description || '—' }}</span>
  </ng-template>

  <ng-template foldCell="rate" let-r>
    <fold-badge [content]="format(r.percent)" variant="accent" />
  </ng-template>

  <!-- Le compte d'usages : ce qui dit, avant même d'ouvrir le taux, qu'il est
       visé — la base pose un `Restrict`, elle refusera la suppression. -->
  <ng-template foldCell="usage" let-r>
    @if (usageTotal(r) === 0) {
      <span class="muted">Aucune famille</span>
    } @else {
      <span class="usage">
        <fold-badge [content]="usageTotal(r) + ' famille(s)'" variant="neutral" />
        <span class="muted">{{ usageLabel(r) }}</span>
      </span>
    }
  </ng-template>

  <!-- Les trois points nus : une affordance, pas un bouton. Une seule action
       par ligne — ouvrir le taux — donc rien à choisir dans un menu. -->
  <ng-template foldCell="actions" let-r>
    <button
      type="button"
      class="row-open"
      [attr.aria-label]="'Ouvrir « ' + r.name + ' »'"
      (click)="open(r)"
    >
      <fold-icon name="more-vertical" size="sm" />
    </button>
  </ng-template>
</fold-data-table>
