<div class="cm">
  @if (showState()) {
    <div class="cm-head">
      @if (inherited()) {
        <fold-badge content="Hérité de la gamme" variant="neutral" />
      } @else {
        <fold-badge content="Personnalisé" variant="warning" />
        <button foldButton emphasis="soft" intent="neutral" size="sm" (click)="revert.emit()">
          Revenir au défaut de la gamme
        </button>
      }
    </div>
  }

  <div class="cm-table">
    <div class="cm-row cm-row--head">
      <span class="cm-label"></span>
      <fold-element-title class="cm-cell" title="À emporter" />
      <fold-element-title class="cm-cell" title="Sur place" />
    </div>

    <!-- Une ligne par emplacement RÉEL. C'étaient deux lignes en dur, dont
         l'une nommait une boutique absente du référentiel. -->
    @for (location of locations(); track location.id) {
      <div class="cm-row">
        <span class="cm-label">{{ location.name }}</span>
        <span class="cm-cell">
          <fold-checkbox
            [ariaLabel]="location.name + ' — à emporter'"
            [checked]="isOn(location.id, 'emporter')"
            (checkedChange)="setCell(location.id, 'emporter', $event)"
          />
        </span>
        <span class="cm-cell">
          <fold-checkbox
            [ariaLabel]="location.name + ' — sur place'"
            [checked]="isOn(location.id, 'surPlace')"
            (checkedChange)="setCell(location.id, 'surPlace', $event)"
          />
        </span>
      </div>
    } @empty {
      <!-- « Il n'y en a aucun » et « je n'ai pas pu les lire » rendaient la
           même ligne — et la première invite à recréer ce qui existe déjà. -->
      <div class="cm-row">
        @if (unreadable(); as reason) {
          <span class="cm-label cm-empty">Emplacements illisibles — {{ reason }}</span>
        } @else {
          <span class="cm-label cm-empty">
            Aucun emplacement. Créez-en un dans <strong>Emplacements</strong>.
          </span>
        }
      </div>
    }

    <!-- La plateforme B2B : UNE case, pas une paire. Un professionnel qui
         commande en gros ne consomme ni sur place ni à emporter — lui donner
         deux colonnes inventerait un choix qui n'existe pas. -->
    <div class="cm-row">
      <span class="cm-label">Plateforme B2B</span>
      <span class="cm-cell cm-cell--wide">
        <fold-checkbox
          ariaLabel="Plateforme B2B"
          [checked]="channels().b2b"
          (checkedChange)="setB2b($event)"
        />
      </span>
    </div>
  </div>
</div>
