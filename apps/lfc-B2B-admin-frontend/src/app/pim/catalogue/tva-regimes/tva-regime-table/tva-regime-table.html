<fold-data-table
  [columns]="columns()"
  [rows]="regimes()"
  [rowKey]="rowKey"
  zebra
  toolbarSurface="accent"
  [empty]="emptyState"
>
  <div foldToolbar class="table-toolbar">
    <span class="toolbar-title">
      <fold-icon name="sliders" size="sm" />
      Régimes
    </span>
  </div>

  <ng-template foldCell="name" let-r
    ><strong>{{ r.name }}</strong></ng-template
  >

  <ng-template foldCell="description" let-r>
    <span class="muted">{{ r.description || '—' }}</span>
  </ng-template>

  <ng-template foldCell="rate" let-r>
    <fold-badge [content]="format(r.percent)" variant="accent" />
  </ng-template>

  <!-- Le compte d'usages : ce qui dit, AVANT le menu de suppression, qu'un
       régime est visé — la base pose un `Restrict`, elle refusera. -->
  <ng-template foldCell="usage" let-r>
    @if (usageTotal(r) === 0) {
      <span class="muted">Aucune famille</span>
    } @else {
      <span class="usage">
        <fold-badge [content]="usageTotal(r) + ' famille(s)'" variant="neutral" />
        <span class="muted">{{ usageLabel(r) }}</span>
      </span>
    }
  </ng-template>

  <ng-template foldCell="actions" let-r>
    <fold-dropdown ariaLabel="Actions du régime" placement="bottom-end">
      <button
        foldPopoverTrigger
        foldButton
        emphasis="soft"
        intent="neutral"
        size="sm"
        aria-label="Actions"
      >
        <fold-icon name="more-vertical" size="sm" />
      </button>
      <fold-dropdown-item icon="edit" (selected)="openEdit(r)"> Modifier </fold-dropdown-item>
      <fold-dropdown-item icon="bin" tone="danger" (selected)="openDelete(r)">
        Supprimer
      </fold-dropdown-item>
    </fold-dropdown>
  </ng-template>
</fold-data-table>
