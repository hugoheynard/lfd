<fold-page-layout icon="publish" title="Publication">
  <!-- Deux mensonges retirés le 2026-09-02. « À l'heure programmée » décrivait
       une planification qui n'existe nulle part — ni `@nestjs/schedule`, ni
       `@Cron`, et tous les workflows d'ops sont en `workflow_dispatch`. Et
       « approuver » était un QUATRIÈME mot pour le geste que les boutons
       appellent « Simuler » et « Envoyer ». -->
  <p description>
    Le catalogue FOLIE COFFEE poussé vers ses canaux. On <strong>simule</strong>, on vérifie ce qui
    partirait, puis on <strong>envoie</strong> — un geste manuel, à chaque fois. Rien n'est édité
    ici&nbsp;: la source reste le catalogue.
  </p>

  <fold-nav-layout>
    <fold-tabs
      tabNav
      [tabs]="tabs"
      [(activeKey)]="activeTab"
      direction="horizontal"
      size="compact"
      justify="stretch"
      background="surface"
      activeStyle="fill"
      #ref="foldTabs"
    />

    <fold-tab-panel [tabs]="ref" key="shopify">
      <!-- Les collections de taxe AVANT le tableau des produits : c'est leur
           ordre réel — une fiche ne peut se rattacher à une collection qui
           n'existe pas encore. Ce bloc vivait sous « Taux de TVA », où il
           faisait du référentiel un second point d'envoi vers Shopify. -->
      <fold-page-section title="Collections de taxe">
        <app-publication-vat-collections />
      </fold-page-section>

      <fold-page-section title="Produits">
        <app-publication-shopify />
      </fold-page-section>
    </fold-tab-panel>

    <fold-tab-panel [tabs]="ref" key="b2b">
      <app-publication-b2b />
    </fold-tab-panel>
  </fold-nav-layout>
</fold-page-layout>
