<fold-page-layout icon="publish" title="Publication">
  <p description>
    Le catalogue FOLIE COFFEE poussé vers ses canaux. On <strong>pré-pousse</strong>, on vérifie les
    fiches et les changements, puis on <strong>approuve</strong> — tout de suite ou à l'heure
    programmée. Rien n'est édité ici : la source reste le catalogue.
  </p>

  <fold-nav-layout>
    <!-- La densité `compact` est la bonne ici ; c'est sa HAUTEUR qui ne l'est
         pas. Fold lui donne 8 px de marge au-dessus et au-dessous d'une icône
         de 16 px, pour un libellé de 10 px : la barre fait 36 px pour deux
         lignes de texte minuscule. On la resserre dans la feuille de la page
         (cf. `.tab-bar-item`) — la vraie place de ce réglage est fold, où le
         ratio marge/typo de `compact` mériterait d'être revu. -->
    <fold-tabs
      tabNav
      [tabs]="tabs"
      [(activeKey)]="activeTab"
      direction="horizontal"
      size="compact"
      background="surface"
      activeStyle="fill"
      #ref="foldTabs"
    />

    <fold-tab-panel [tabs]="ref" key="shopify">
      <!-- Les collections de taxe AVANT le tableau des produits : c'est leur
           ordre réel — une fiche ne peut se rattacher à une collection qui
           n'existe pas encore. Ce bloc vivait sous « Taux de TVA », où il
           faisait du référentiel un second point d'envoi vers Shopify. -->
      <fold-page-section title="Collections de taxe">
        <app-publication-tva-collections />
      </fold-page-section>

      <fold-page-section title="Produits">
        <app-publication-shopify />
      </fold-page-section>
    </fold-tab-panel>

    <fold-tab-panel [tabs]="ref" key="b2b">
      <app-publication-b2b />
    </fold-tab-panel>
  </fold-nav-layout>
</fold-page-layout>
