<div class="tt-field">
  <p class="tt-title">
    {{ scaleLabel() }} déclenchante, par palier de {{ baselineLabel() }}
    <fold-info
      text="Le seuil descend quand la référence monte : ×5 sur un produit pris à l'unité n'est pas un incident, +30 % sur un produit pris par 100 en est un."
      label="Pourquoi des paliers"
    />
  </p>

  <!-- On range au `focusout`, pas à la frappe : trier pendant la saisie faisait
       sauter la ligne éditée sous le curseur. -->
  @for (tier of bounded(); track revision() + '-' + $index) {
    <div class="tt-row">
      <fold-number-input
        label="Jusqu'à (quantité)"
        size="sm"
        [min]="1"
        [value]="tier.upToQuantity"
        [disabled]="disabled()"
        (valueChange)="setBound(indexOfBounded($index), $event)"
        (focusout)="commit()"
      />
      <fold-number-input
        label="Alerter au-delà de (%)"
        size="sm"
        [min]="5"
        [max]="maxPercent()"
        [value]="tier.thresholdPercent"
        [disabled]="disabled()"
        (valueChange)="setPercent(indexOfBounded($index), $event)"
        (focusout)="commit()"
      />
      <button
        type="button"
        class="tt-remove"
        [disabled]="disabled()"
        [attr.aria-label]="'Retirer le palier jusqu’à ' + tier.upToQuantity"
        (click)="removeTier(indexOfBounded($index))"
      >
        ×
      </button>
    </div>
  }

  <!-- Le palier ouvert ne se supprime pas : sans lui, les plus gros volumes ne
       seraient couverts par aucun seuil, donc jamais surveillés. -->
  @if (openTier(); as last) {
    <div class="tt-row tt-row--open">
      <span class="tt-open-label">Au-delà</span>
      <fold-number-input
        label="Alerter au-delà de (%)"
        size="sm"
        [min]="5"
        [max]="maxPercent()"
        [value]="last.thresholdPercent"
        [disabled]="disabled()"
        (valueChange)="setPercent(indexOfOpen(), $event)"
        (focusout)="commit()"
      />
    </div>
  }

  <button foldButton emphasis="outline" size="sm" [disabled]="disabled()" (click)="addTier()">
    Ajouter un palier
  </button>
</div>
