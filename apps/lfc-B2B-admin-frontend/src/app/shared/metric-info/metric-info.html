<button
  type="button"
  class="trigger"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
  (mouseenter)="open.set(true)"
  (mouseleave)="open.set(false)"
  (focus)="open.set(true)"
  (blur)="open.set(false)"
>
  <span aria-hidden="true">i</span>
</button>
@if (open()) {
  <span class="bubble" role="tooltip">{{ text() }}</span>
}
