<fold-panel-header
  title="Créer un compte client"
  subtitle="Identité de la société et contact principal."
/>

<div class="body">
  <p class="section-label">Identité légale</p>
  <lfd-company-identity-fields [value]="identity()" (valueChange)="identity.set($event)" />

  <p class="section-label">Contact principal</p>
  <lfd-contact-fields [value]="contact()" (valueChange)="contact.set($event)" />

  <p class="note">
    Le compte est créé <strong>en attente de validation</strong> : il faudra l'activer après
    vérification des pièces.
  </p>
</div>

<footer class="foot">
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton intent="primary" [disabled]="!canSubmit() || submitting()" (click)="submit()">
    Créer le compte
  </button>
</footer>
