<svg
  class="diagram"
  viewBox="0 0 740 316"
  role="img"
  aria-label="À emporter et vente pro portent le même taux, mais pas les mêmes obligations : preuve d'achat, prix, informations transmises et traçabilité diffèrent"
>
  <text class="head" x="395" y="20">À emporter</text>
  <text class="head-sub" x="395" y="35">comptoir, en ligne</text>
  <text class="head" x="618" y="20">Vente pro</text>
  <text class="head-sub" x="618" y="35">revendeur professionnel</text>
  <line class="rule" x1="14" y1="46" x2="726" y2="46" />

  <!-- LA LIGNE QUI NE DIFFÈRE PAS. Elle est en tête, et pas en note de bas de
       page : c'est elle qui rend la colonne discutable, donc c'est elle qu'il
       faut regarder d'abord. -->
  <text class="row" x="14" y="72">Taux de TVA</text>
  <rect class="cell cell-same" x="290" y="54" width="210" height="26" rx="7" />
  <text class="cell-text" x="395" y="72">5,5 %</text>
  <rect class="cell cell-same" x="510" y="54" width="216" height="26" rx="7" />
  <text class="cell-text" x="618" y="72">5,5 %</text>
  <text class="verdict verdict-same" x="14" y="90">↳ identique — la loi n'impose rien ici</text>

  <line class="rule-soft" x1="14" y1="102" x2="726" y2="102" />

  <text class="row" x="14" y="128">Preuve d'achat</text>
  <text class="cell-plain" x="395" y="128">un ticket</text>
  <text class="cell-strong" x="618" y="128">une facture, mentions obligatoires</text>

  <text class="row" x="14" y="168">Prix appliqué</text>
  <text class="cell-plain" x="395" y="168">le tarif public</text>
  <text class="cell-strong" x="618" y="168">une mercuriale négociée</text>

  <text class="row" x="14" y="208">Informations à transmettre</text>
  <text class="cell-plain" x="395" y="208">affichées en boutique</text>
  <text class="cell-strong" x="618" y="208">fiche transmise au revendeur</text>

  <text class="row" x="14" y="248">Si un lot est rappelé</text>
  <text class="cell-plain" x="395" y="248">on ne sait pas qui prévenir</text>
  <text class="cell-strong" x="618" y="248">on sait exactement qui</text>

  <line class="rule" x1="14" y1="268" x2="726" y2="268" />
  <text class="foot" x="14" y="292">
    Zéro différence fiscale. Quatre différences de RESPONSABILITÉ — c'est pour elles que la colonne
    existe.
  </text>
  <text class="foot-sub" x="14" y="310">
    Duplication choisie, donc écrite : sans elle, une ligne vendue à un professionnel serait
    indiscernable d'une vente au comptoir.
  </text>
</svg>
