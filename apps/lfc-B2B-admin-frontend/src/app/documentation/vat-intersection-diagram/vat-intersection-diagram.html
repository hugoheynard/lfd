<svg
  class="diagram"
  viewBox="0 0 740 250"
  role="img"
  aria-label="Le taux se règle sur le couple article et carte : le croissant est à 5,5 % à emporter et à 10 % sur place"
>
  <!-- En-têtes : les cartes -->
  <text class="head" x="330" y="34">À emporter</text>
  <text class="head" x="500" y="34">Sur place</text>
  <text class="head" x="666" y="34">Vente pro</text>
  <line class="rule" x1="16" y1="46" x2="724" y2="46" />

  <!-- Croissant -->
  <text class="row" x="16" y="82">Croissant</text>
  <g>
    <rect class="cell" x="266" y="60" width="128" height="34" rx="8" />
    <text class="cell-text" x="330" y="82">5,5 %</text>
  </g>
  <g>
    <rect class="cell" x="436" y="60" width="128" height="34" rx="8" />
    <text class="cell-text" x="500" y="82">10 %</text>
  </g>
  <g>
    <rect class="cell" x="602" y="60" width="128" height="34" rx="8" />
    <text class="cell-text" x="666" y="82">5,5 %</text>
  </g>

  <!-- Café -->
  <text class="row" x="16" y="130">Café</text>
  <g>
    <rect class="cell" x="266" y="108" width="128" height="34" rx="8" />
    <text class="cell-text" x="330" y="130">10 %</text>
  </g>
  <g>
    <rect class="cell" x="436" y="108" width="128" height="34" rx="8" />
    <text class="cell-text" x="500" y="130">10 %</text>
  </g>
  <text class="empty" x="666" y="130">non réglé</text>

  <!-- Bouteille de vin -->
  <text class="row" x="16" y="178">Bouteille de vin</text>
  <g>
    <rect class="cell" x="266" y="156" width="128" height="34" rx="8" />
    <text class="cell-text" x="330" y="178">20 %</text>
  </g>
  <g>
    <rect class="cell" x="436" y="156" width="128" height="34" rx="8" />
    <text class="cell-text" x="500" y="178">20 %</text>
  </g>
  <g>
    <rect class="cell" x="602" y="156" width="128" height="34" rx="8" />
    <text class="cell-text" x="666" y="178">20 %</text>
  </g>

  <line class="rule" x1="16" y1="204" x2="724" y2="204" />
  <text class="foot" x="16" y="228">
    Le taux est à l'INTERSECTION. Une carte ne « vaut » pas 10 % — c'est ce croissant-là, vendu
    comme ça, qui vaut 10 %.
  </text>
</svg>
