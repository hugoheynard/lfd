<!-- L'adresse d'abord, et elle suffit : c'est elle qui dit au serveur si cette
     personne a déjà un espace. Aucune recherche : la liste des sociétés d'une
     personne ne regarde ni le commercial ni le client qu'il est en train de
     servir.

     ⚠️ L'aide ne promet PAS un « lien de mot de passe ». Le serveur a trois
     issues (cf. `GrantAccountAccess.grant`) : identité créée + lien, lien
     réémis, ou — si la personne est déjà cliente ACTIVE — un simple « cette
     société a rejoint votre espace », sans aucun lien. Promettre un lien dans
     les trois cas ferait conclure à un échec d'envoi dans le troisième.

     Et l'aide reste volontairement muette sur laquelle des trois : le dire
     apprendrait au commercial que cette adresse est déjà connue de la
     plateforme, donc que cette personne travaille avec un autre de nos
     clients. Même raison que la phrase unique de `openingMessage`. -->
<fold-input
  label="E-mail du détenteur"
  type="email"
  [required]="emailRequired()"
  [optional]="!emailRequired()"
  optionalLabel="facultatif"
  hint="son adresse suffit : c'est par elle que son accès arrive"
  [value]="email()"
  (valueChange)="email.set($event)"
/>

<div class="hp-row">
  <fold-input
    label="Prénom"
    optional
    optionalLabel="facultatif"
    [value]="firstName()"
    (valueChange)="firstName.set($event)"
  />
  <fold-input
    label="Nom"
    optional
    optionalLabel="facultatif"
    [value]="lastName()"
    (valueChange)="lastName.set($event)"
  />
</div>

<fold-input
  label="Téléphone"
  type="tel"
  optional
  optionalLabel="facultatif"
  hint="pas nécessaire maintenant ; il le sera pour activer le compte"
  [value]="phone()"
  (valueChange)="phone.set($event)"
/>
