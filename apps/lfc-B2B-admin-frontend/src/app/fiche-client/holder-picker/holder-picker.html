<!-- L'adresse d'abord, et elle suffit : c'est par elle que le détenteur
     recevra son mot de passe, et c'est elle qui dit au serveur s'il a déjà un
     espace. Aucune recherche : la liste des sociétés d'une personne ne regarde
     ni le commercial ni le client qu'il est en train de servir. -->
<fold-input
  label="E-mail du détenteur"
  type="email"
  [required]="emailRequired()"
  [optional]="!emailRequired()"
  hint="c'est par là qu'il recevra son lien de mot de passe"
  [value]="email()"
  (valueChange)="email.set($event)"
/>

<div class="hp-row">
  <fold-input label="Prénom" optional [value]="firstName()" (valueChange)="firstName.set($event)" />
  <fold-input label="Nom" optional [value]="lastName()" (valueChange)="lastName.set($event)" />
</div>

<fold-input
  label="Téléphone"
  type="tel"
  optional
  hint="au moins un numéro joignable sera nécessaire pour activer le compte"
  [value]="phone()"
  (valueChange)="phone.set($event)"
/>
