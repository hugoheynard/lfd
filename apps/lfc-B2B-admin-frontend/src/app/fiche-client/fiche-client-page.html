<fold-page-layout icon="company" [title]="company()?.raisonSociale ?? 'Fiche client'">
  <button pageActions foldButton emphasis="outline" size="sm" icon="chevron-left" (click)="back()">
    Retour
  </button>

  @switch (state()) {
    @case ('loading') {
      <p class="state">Chargement…</p>
    }
    @case ('error') {
      <div class="state">
        <p>Impossible de charger la fiche.</p>
        <button foldButton (click)="load()">Réessayer</button>
      </div>
    }
    @case ('notfound') {
      <div class="state">
        <p>Société introuvable.</p>
        <button foldButton emphasis="outline" (click)="back()">Retour à la liste</button>
      </div>
    }
    @case ('ready') {
      @if (company(); as c) {
        <div class="fiche">
          <lfd-company-reference-card [reference]="c.reference" label="Référence client" />

          @if (identity(); as id) {
            <lfd-company-identity-card
              [identity]="id"
              [canManage]="false"
              [canManageKbis]="false"
              [canAccessKbis]="false"
            />
          }

          <lfd-company-contacts-card [contacts]="contacts()" [canManage]="false" />
        </div>
      }
    }
  }
</fold-page-layout>
