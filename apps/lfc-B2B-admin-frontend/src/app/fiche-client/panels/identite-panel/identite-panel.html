<fold-panel-header title="Identité" subtitle="Tout est corrigeable — y compris le greffe." />

<div class="body">
  @if (legalMissing()) {
    <!-- En TÊTE, et en avertissement : c'est la raison pour laquelle ce panneau
         vient d'être ouvert. En gris entre deux champs, la phrase disait la
         chose la plus lourde de l'écran sur le ton le plus léger. -->
    <fold-callout variant="warning">
      Ce compte a été ouvert sans ses papiers. Sans eux, il ne pourra pas être activé.
    </fold-callout>
  }

  <!-- Les MÊMES champs que le formulaire client — un seul fragment, une seule
       règle de TVA. Les deux copies avaient divergé : celle-ci affirmait encore
       « obligatoire pour cette forme juridique » sans qu'aucune forme soit
       choisie. -->
  <lfd-company-identity-fields [(value)]="draft" [enseigneOptional]="true" />
</div>

<footer class="foot">
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton intent="primary" [disabled]="submitting()" (click)="submit()">
    Enregistrer
  </button>
</footer>
