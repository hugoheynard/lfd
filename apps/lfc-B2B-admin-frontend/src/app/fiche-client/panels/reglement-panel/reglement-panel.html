<fold-panel-header
  title="Condition de règlement"
  subtitle="Le terme convenu — écrit par le commercial."
/>

<div class="body">
  <fold-select label="Condition convenue" [value]="term()" (valueChange)="onSelect($event)">
    @for (option of options; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </fold-select>
</div>

<footer class="foot">
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton intent="primary" [disabled]="submitting()" (click)="submit()">
    Enregistrer
  </button>
</footer>
