<fold-page-layout icon="company" [title]="title()">
  <button pageActions foldButton emphasis="outline" size="sm" icon="chevron-left" (click)="back()">
    Retour
  </button>

  <!-- L'épingle vit dans l'en-tête du compte, pas dans une vue : on décide de
       suivre un client, pas une de ses pages. -->
  <button
    pageActions
    foldButton
    size="sm"
    icon="star"
    [emphasis]="isPinned() ? 'solid' : 'outline'"
    (click)="togglePin()"
  >
    {{ isPinned() ? 'Épinglé' : 'Épingler' }}
  </button>

  <!-- `fold-nav-layout`, et non un div à nous : c'est LUI qui tient l'écart
       nav↔contenu et qui neutralise la gouttière de page sous la barre, pour
       que les cartes s'alignent sur le menu qui les nomme. Refaire cette
       composition à la main, c'était réécrire ces règles — et les rater. -->
  <fold-nav-layout>
    <fold-view-nav
      tabNav
      class="fc-tabs"
      [items]="tabs"
      direction="horizontal"
      size="comfortable"
      [collapsed]="navCollapsed()"
      activeStyle="fill"
      background="surface"
    />

    <router-outlet />
  </fold-nav-layout>
</fold-page-layout>
