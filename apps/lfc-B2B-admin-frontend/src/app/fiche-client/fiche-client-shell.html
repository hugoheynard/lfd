<!-- `customer-account` et non `company` : l'en-tête nomme LE DOSSIER du client,
     pas la société. Le bâtiment revient à l'onglet « Informations », qui montre
     l'identité légale et le détenteur — les deux portaient le même glyphe, et
     ils ne se distinguaient que par le mot.

     C'est aussi le glyphe de la liste dont on vient : passer de « Comptes
     clients » à la fiche garde la même image, ce qui dit qu'on est descendu
     dans un élément, pas arrivé ailleurs. -->
<fold-page-layout icon="customer-account" [title]="title()">
  <button pageActions foldButton emphasis="outline" size="sm" icon="chevron-left" (click)="back()">
    Retour
  </button>

  <!-- L'épingle vit dans l'en-tête du compte, pas dans une vue : on décide de
       suivre un client, pas une de ses pages. -->
  <button
    pageActions
    foldButton
    size="sm"
    icon="star"
    [emphasis]="isPinned() ? 'solid' : 'outline'"
    (click)="togglePin()"
  >
    {{ isPinned() ? 'Épinglé' : 'Épingler' }}
  </button>

  <!-- `fold-nav-layout`, et non un div à nous : c'est LUI qui tient l'écart
       nav↔contenu et qui neutralise la gouttière de page sous la barre, pour
       que les cartes s'alignent sur le menu qui les nomme. Refaire cette
       composition à la main, c'était réécrire ces règles — et les rater.

       Rail LATÉRAL, comme le PIM et le poste commercial. Une fiche client a
       huit onglets : en barre horizontale ils débordaient et devenaient
       défilants — donc des onglets qu'on ne voit qu'en balayant, sans savoir
       qu'ils sont là. Verticalement, ils tiennent tous à l'écran.

       Il vit DANS le `fold-page-layout` : l'en-tête porte le nom du client et
       ses actions (retour, épingle), qui valent pour le compte entier et non
       pour une de ses pages. `nav.stacked()` mesure la largeur du LAYOUT et
       replie seul en barre — plus besoin d'écouter le viewport. -->
  <fold-nav-layout #nav placement="side" [foldAt]="896">
    <fold-view-nav
      tabNav
      class="fc-tabs"
      [items]="tabs"
      [collapsed]="nav.stacked()"
      size="comfortable"
      activeStyle="underline"
      background="transparent"
    />

    <router-outlet />
  </fold-nav-layout>
</fold-page-layout>
