<fold-page-layout icon="company" [title]="title()">
  <button pageActions foldButton emphasis="outline" size="sm" icon="chevron-left" (click)="back()">
    Retour
  </button>

  <!-- L'épingle vit dans l'en-tête du compte, pas dans une vue : on décide de
       suivre un client, pas une de ses pages. -->
  <button
    pageActions
    foldButton
    size="sm"
    icon="star"
    [emphasis]="isPinned() ? 'solid' : 'outline'"
    (click)="togglePin()"
  >
    {{ isPinned() ? 'Épinglé' : 'Épingler' }}
  </button>

  <!-- Barre horizontale en `fill`, accolée à la première carte de la vue —
       même composition que Réglages → Commercial. Voir le SCSS pour pourquoi
       l'écart est serré plutôt qu'au rythme de page. -->
  <div class="fc-shell">
    <fold-view-nav
      class="fc-tabs"
      [items]="tabs"
      direction="horizontal"
      size="comfortable"
      [collapsed]="navCollapsed()"
      activeStyle="fill"
      background="surface"
    />

    <router-outlet />
  </div>
</fold-page-layout>
