<!-- Pas de `title` sur le layout : la page porte son `<h1>` dans le bandeau, et
     deux titres de premier niveau sur un écran n'en font aucun. Même partition
     que la tarification, dont ce bandeau reprend le support et le rythme. -->
<fold-page-layout>
  <!--
    **Le bandeau de tête du compte.** Posé sur le CHROME, pleine largeur : le
    verdict sur le chrome, l'établi sur le papier — c'est la partition du
    back-office, et un compte client n'avait pas de raison d'y échapper.

    Il porte ce qui vaut pour le compte ENTIER et non pour une de ses vues : d'où
    l'on vient, qui c'est, dans quel état, et ce qu'il pèse. Les huit onglets en
    dessous changent ; ceci ne change pas.
  -->
  <fold-page-section bleed stack class="masthead" foldSurface="chrome">
    <!-- Le retour NOMME sa destination. « Retour » seul oblige à se souvenir
         d'où l'on vient — et on arrive ici depuis la liste, depuis le cockpit,
         depuis une recherche. Un lien, pas un bouton : c'est une navigation, et
         elle doit s'ouvrir dans un onglet si quelqu'un le demande. -->
    <a class="masthead-back" routerLink="/commercial/comptes-clients">
      <fold-icon name="chevron-left" size="sm" />
      Comptes clients
    </a>

    <div class="masthead-head">
      <div class="masthead-identity">
        <h1 class="masthead-title">{{ title() }}</h1>
        @if (sheet(); as view) {
          <fold-badge [content]="statusLabel()" [variant]="statusTone()" />
          <!-- La référence est ce qu'on se dicte au téléphone : elle vit à côté
               du nom, pas dans un onglet qu'il faudrait aller ouvrir. -->
          <span class="masthead-reference">{{ view.reference }}</span>
        }
      </div>

      <!-- L'épingle vit dans l'en-tête du compte, pas dans une vue : on décide
           de suivre un client, pas une de ses pages. -->
      <div class="masthead-actions">
        <button
          foldButton
          size="sm"
          icon="star"
          [emphasis]="isPinned() ? 'solid' : 'outline'"
          (click)="togglePin()"
        >
          {{ isPinned() ? 'Épinglé' : 'Épingler' }}
        </button>
      </div>
    </div>

    <!-- Les chiffres du compte, visibles depuis les HUIT onglets. Ils vivaient
         au milieu du tableau de bord : il fallait y revenir pour savoir ce que
         pesait le client dont on lisait les commandes.

         Rien quand la lecture a échoué : quatre cartes vides diraient « ce
         compte n'a rien acheté », ce qui est une autre affirmation. -->
    @if (sheet(); as view) {
      <app-compte-chiffres [stats]="view.stats" [onChrome]="true" />
    }

    <!--
      **La barre d'onglets, DANS le bandeau.** Pas en dessous : posée dans la
      section, elle ne peut pas s'en détacher — ni au défilement, ni quand une
      marge bouge. C'est le motif de la boutique, où la rangée de destinations
      termine la descente du bandeau au lieu de flotter sur le papier.

      🔴 Elle était un rail LATÉRAL jusqu'au 2026-09-08, et sa raison écrite
      tenait : « huit onglets débordaient et devenaient défilants — donc des
      onglets qu'on ne voit qu'en balayant ». Le débordement est RÉEL et mesuré :
      en `comfortable`, les huit font 1112 px pour 985 px utiles à 1440 px de
      fenêtre, donc le dernier onglet est hors champ. (`compact` les ferait
      tenir à 985 px pile.)

      Le confort l'emporte quand même, et c'est un arbitrage assumé : fold fait
      défiler seul depuis 0.15, et un onglet hors champ reste atteignable là où
      un onglet replié à son icône ne se lit plus. C'est le compromis que la
      boutique a déjà tranché pour ses six destinations.
    -->
    <fold-view-nav
      class="fc-tabs"
      [items]="tabs"
      direction="horizontal"
      size="comfortable"
      activeStyle="fill"
      background="transparent"
    />
  </fold-page-section>

  <router-outlet />
</fold-page-layout>
