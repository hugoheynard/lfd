@switch (state()) {
  @case ('loading') {
    <fold-loading message="Chargement de la fiche…" />
  }
  @case ('error') {
    <fold-empty-state
      tone="alert"
      title="Impossible de charger la fiche commerciale"
      subtitle="La lecture a échoué — le dossier, lui, est intact."
    >
      <button foldButton (click)="load()">Réessayer</button>
    </fold-empty-state>
  }
  @default {
    @if (sheet(); as view) {
      <app-customer-sheet [sheet]="view" (changed)="load()" />
    }
  }
}
