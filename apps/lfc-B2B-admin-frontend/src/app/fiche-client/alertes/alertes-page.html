<p class="al-intro sec-hint">
  Les règles ci-dessous sont celles de la plateforme. Ce compte peut les suivre, en désactiver une,
  ou porter la sienne — le réglage global reste rappelé dans tous les cas.
</p>

@if (loading()) {
  <fold-loading message="Chargement des règles…" />
} @else if (failed()) {
  <fold-empty-state tone="alert" title="Les règles n'ont pas pu être chargées">
    <button foldButton (click)="load(id())">Réessayer</button>
  </fold-empty-state>
} @else {
  <div class="al-list">
    @for (rule of rules(); track rule.kind) {
      <app-account-alert-card
        [rule]="rule"
        [busy]="saving() === rule.kind"
        (override)="applyOverride($event)"
        (revert)="revert(rule.kind)"
      />
    }
  </div>

  <app-alert-journal
    [alerts]="alerts()"
    [busy]="acknowledging()"
    (acknowledge)="acknowledge($event)"
  />
}
