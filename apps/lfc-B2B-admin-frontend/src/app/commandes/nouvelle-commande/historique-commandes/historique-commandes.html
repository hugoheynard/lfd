<h2 class="his-title">Ses commandes</h2>

@if (loading()) {
  <fold-loading message="Chargement…" />
} @else if (orders().length === 0) {
  <fold-empty-state
    title="Aucune commande"
    subtitle="Ce compte n'a encore rien commandé — le catalogue est au milieu."
  />
} @else {
  <ul class="his-list">
    @for (row of orders(); track row.id) {
      <li>
        <lfd-order-row
          dense
          [order]="row"
          [selected]="selectedId() === row.id"
          (open)="select.emit(row.id)"
        />
      </li>
    }
  </ul>
}
