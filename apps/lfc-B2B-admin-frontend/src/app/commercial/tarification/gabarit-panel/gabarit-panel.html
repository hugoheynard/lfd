<fold-panel-header
  [title]="heading()"
  subtitle="Une grille de prix : un palier, et c'est un prix fixe ; plusieurs, et c'est une grille."
/>

<div class="body">
  <fold-input
    label="Nom du gabarit"
    hint="Ce que le client lira dans la trace de son prix — « Mercuriale Club Med »."
    placeholder="Mercuriale Club Med"
    [value]="label()"
    (valueChange)="label.set($event)"
  />

  <div class="add">
    <fold-select label="Ajouter un article" [value]="pick()" (valueChange)="pick.set($event)">
      @for (item of addable(); track item.sku) {
        <option [value]="item.sku">{{ item.name }} — {{ euros(item.unitPriceCents) }}</option>
      }
    </fold-select>
    <button foldButton emphasis="outline" [disabled]="addable().length === 0" (click)="addLine()">
      Ajouter
    </button>
  </div>

  @for (line of lines(); track line.sku) {
    <section class="line">
      <header class="line-head">
        <div class="line-id">
          <span class="line-name">{{ line.productName }}</span>
          <!-- Le tarif catalogue est là PENDANT la saisie : c'est au moment de
               taper 0,80 € qu'on a besoin de savoir qu'il est à 1,00 €. -->
          <span class="line-catalog">
            @if (line.catalogPriceCents === null) {
              hors catalogue
            } @else {
              catalogue {{ euros(line.catalogPriceCents) }}
            }
          </span>
        </div>
        <button
          foldButton
          emphasis="soft"
          intent="danger"
          (click)="removeLine(line.sku)"
          [attr.aria-label]="'Retirer ' + line.productName"
        >
          Retirer
        </button>
      </header>

      @for (tier of line.tiers; track $index) {
        <div class="tier">
          <fold-input
            label="À partir de"
            inputmode="numeric"
            placeholder="1"
            [value]="tier.minQuantity"
            (valueChange)="setTier(line.sku, $index, 'minQuantity', $event)"
          />
          <fold-input
            label="Prix unitaire (€ HT)"
            inputmode="decimal"
            placeholder="0,80"
            [value]="tier.unitPrice"
            (valueChange)="setTier(line.sku, $index, 'unitPrice', $event)"
          />
          @if (line.tiers.length > 1) {
            <button
              foldButton
              emphasis="soft"
              intent="neutral"
              (click)="removeTier(line.sku, $index)"
              [attr.aria-label]="'Retirer le palier ' + ($index + 1)"
            >
              −
            </button>
          }
        </div>
      }

      <!-- Le seul geste qui fait passer d'un prix fixe à une grille. Pas de
           sélecteur « fixe / paliers » : il aurait suggéré deux objets là où il
           n'y en a qu'un, et il aurait fallu décider ce qu'on fait des paliers
           en rebasculant sur « fixe ». -->
      <button foldButton emphasis="soft" (click)="addTier(line.sku)">Ajouter un palier</button>
    </section>
  }
</div>

<footer class="actions">
  <button foldButton emphasis="soft" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton [disabled]="!canSave()" (click)="save()">
    {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
  </button>
</footer>
