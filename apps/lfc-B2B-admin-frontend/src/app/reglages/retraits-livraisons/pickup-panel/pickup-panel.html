<fold-panel-header [title]="heading()" subtitle="Adresse du laboratoire de retrait." />

<div class="body">
  <lfd-address-fields [(value)]="draft" kind="facturation" />

  <fold-checkbox
    label="Point de retrait par défaut"
    hint="proposé d'office au checkout tant que la livraison n'existe pas"
    [checked]="draft().isDefault"
    (checkedChange)="setDefault($event)"
  />

  <lfd-hours-form
    legend="Heures de retrait"
    hint="Les deux plages restent séparées : une commande doit tenir dans l'une d'elles, jamais à cheval sur le creux entre les deux."
    [(value)]="opening"
  >
    @if (noOpening()) {
      <p class="opening-hint">
        Sans aucune heure déclarée, ce point accepte n'importe quelle heure de retrait.
      </p>
    }
  </lfd-hours-form>

  <lfd-price-alteration-field
    label="Réduction de retrait"
    lockedDirection="decrease"
    noneLabel="Aucune réduction sur ce point"
    [value]="discountAlteration()"
    (valueChange)="setDiscount($event)"
  />
</div>

<fold-panel-footer>
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton intent="primary" [disabled]="!canSubmit() || saving()" (click)="submit()">
    {{ isCreate() ? 'Ajouter' : 'Enregistrer' }}
  </button>
</fold-panel-footer>
