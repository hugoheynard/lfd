<fold-panel-header [title]="heading()" subtitle="Un secteur de codes postaux et son frais." />

<div class="body">
  <div class="rows">
    <span class="rows-label">Codes postaux couverts</span>
    <p class="rows-hint">
      Un <strong>code postal</strong> (73150) matche exactement ; un
      <strong>préfixe</strong> (731) couvre tout le secteur. Le plus précis gagne.
    </p>

    @for (row of rows(); track row.id) {
      <div class="row">
        <fold-select
          class="row-type"
          [value]="row.type"
          (valueChange)="setType(row.id, $any($event))"
        >
          <option value="postcode">Code postal</option>
          <option value="prefix">Préfixe</option>
        </fold-select>
        <fold-input
          class="row-value"
          [placeholder]="row.type === 'postcode' ? '73150' : '731'"
          [value]="row.value"
          (valueChange)="setValue(row.id, $event)"
        />
        <fold-button-icon
          icon="close"
          size="sm"
          tone="critical"
          tooltip="Retirer"
          [disabled]="rows().length <= 1"
          (clicked)="removeRow(row.id)"
        />
      </div>
    }

    <button foldButton emphasis="outline" intent="neutral" size="sm" icon="plus" (click)="addRow()">
      Ajouter
    </button>
  </div>

  <fold-input
    label="Libellé"
    optional
    placeholder="Val d'Isère"
    [value]="label()"
    (valueChange)="label.set($event)"
  />

  <app-cart-adjustment-field
    label="Frais de livraison"
    [allowNone]="false"
    [value]="fee()"
    (valueChange)="fee.set($event)"
  />
</div>

<footer class="foot">
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton intent="primary" [disabled]="!canSubmit() || saving()" (click)="submit()">
    {{ isCreate() ? 'Ajouter' : 'Enregistrer' }}
  </button>
</footer>
