<fold-panel-header [title]="heading()" subtitle="Un secteur de codes postaux et son frais." />

<div class="body">
  <div class="prefixes">
    <fold-input
      label="Codes postaux"
      placeholder="73150 73320 731"
      hint="un ou plusieurs, séparés par un espace — un code complet (73150) ou un préfixe de secteur (731). Le plus précis gagne."
      [value]="prefixesText()"
      (valueChange)="prefixesText.set($event)"
    />
    @if (prefixes().length > 0) {
      <div class="chips">
        @for (prefix of prefixes(); track prefix) {
          <fold-badge [content]="prefix" variant="neutral" radius="square" />
        }
      </div>
    }
  </div>
  <fold-input
    label="Libellé"
    optional
    placeholder="Val d'Isère"
    [value]="label()"
    (valueChange)="label.set($event)"
  />
  <app-cart-adjustment-field
    label="Frais de livraison"
    [allowNone]="false"
    [value]="fee()"
    (valueChange)="fee.set($event)"
  />
</div>

<footer class="foot">
  <button foldButton emphasis="outline" intent="neutral" (click)="cancel()">Annuler</button>
  <button foldButton intent="primary" [disabled]="!canSubmit() || saving()" (click)="submit()">
    {{ isCreate() ? 'Ajouter' : 'Enregistrer' }}
  </button>
</footer>
