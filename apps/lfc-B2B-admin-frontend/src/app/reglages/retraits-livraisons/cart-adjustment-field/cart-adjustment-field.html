<div class="caf">
  <span class="caf-label">{{ label() }}</span>
  <div class="caf-row">
    <div class="caf-seg" role="group" [attr.aria-label]="label()">
      @for (m of modes(); track m.key) {
        <button
          type="button"
          class="caf-mode"
          [class.is-on]="mode() === m.key"
          (click)="setMode(m.key)"
        >
          {{ m.label }}
        </button>
      }
    </div>
    @if (mode() !== 'none') {
      <fold-number-input
        class="caf-amount"
        [min]="0"
        [value]="amount()"
        (valueChange)="setAmount($event)"
      />
    }
  </div>
</div>
