<section class="axis" aria-label="Frise des décisions tarifaires">
  <!-- Les graduations : des repères connus — « sept. 26 » — et non des
       intervalles réguliers dont personne ne sait ce qu'ils valent. -->
  <div class="ruler" aria-hidden="true">
    @for (tick of ticks(); track tick.at) {
      <span class="tick" [style.left.%]="tick.percent">{{ tick.label }}</span>
    }
  </div>

  <!--
    La piste entière écoute le pointeur : un clic pose un marqueur, un clic
    maintenu puis glissé ouvre une zone. Les barres restent dessous pendant le
    geste — c'est tout l'intérêt de viser ICI plutôt que dans deux champs.
  -->
  <div
    class="track"
    role="application"
    aria-label="Poser un marqueur, ou glisser pour ouvrir une période"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
  >
    @if (zone(); as band) {
      <span class="zone" [style.left.%]="band.left" [style.width.%]="band.width"></span>
    }

    <span class="today" [style.left.%]="todayPercent()" aria-hidden="true"></span>

    <ul class="rows">
      @for (row of rows(); track row.id) {
        <li class="row">
          <span class="bar" [style.left.%]="row.left" [style.width.%]="row.width">
            <span class="bar-label">{{ row.label }}</span>
          </span>
        </li>
      }
    </ul>

    @for (marker of markers(); track $index) {
      <span class="marker" [style.left.%]="marker" aria-hidden="true">
        <span class="marker-head"></span>
      </span>
    }
  </div>
</section>
