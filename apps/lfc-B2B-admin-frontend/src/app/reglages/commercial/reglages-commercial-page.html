<fold-view-nav
        [items]="sections"
        [(activeKey)]="section"
        direction="horizontal"
        size="comfortable"
        activeStyle="fill"
        background="transparent"
/>
<!--TODO : une fois fold view nav sticky, mettre en place sticky nav-->

@switch (section()) {
    @case ('marches') {
        <app-market-card />
    }
    @case ('alertes') {
        <app-alerts-card />
    }
    @default {
        <app-availability-card />
    }
}
