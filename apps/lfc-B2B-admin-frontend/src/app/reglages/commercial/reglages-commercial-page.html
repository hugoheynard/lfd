<fold-card>
  <h2 class="section-title">Alertes acquisition</h2>
  <p class="section-desc">
    La couleur d'un créneau en attente d'activation monte avec le nombre de jours sans traitement :
    neutre, puis ambre, puis rouge. Ces seuils pilotent le calendrier d'acquisition du commercial.
  </p>

  <div class="fields">
    <label class="field">
      <span class="field-label">Avertissement (ambre) à partir de</span>
      <span class="field-control">
        <input
          #warn
          type="number"
          min="1"
          inputmode="numeric"
          class="field-input"
          [value]="settings.warnDays()"
          (change)="settings.setWarnDays(+warn.value)"
        />
        <span class="field-suffix">jours</span>
      </span>
    </label>

    <label class="field">
      <span class="field-label">Alerte (rouge) à partir de</span>
      <span class="field-control">
        <input
          #alert
          type="number"
          [min]="settings.warnDays()"
          inputmode="numeric"
          class="field-input"
          [value]="settings.alertDays()"
          (change)="settings.setAlertDays(+alert.value)"
        />
        <span class="field-suffix">jours</span>
      </span>
    </label>
  </div>
</fold-card>
