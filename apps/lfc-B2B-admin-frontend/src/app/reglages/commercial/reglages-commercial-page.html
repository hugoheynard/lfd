<div class="rc">
  <fold-view-nav
    class="rc-nav"
    [items]="sections"
    [(activeKey)]="section"
    direction="horizontal"
    size="comfortable"
    activeStyle="fill"
    background="transparent"
  />

  <div class="rc-body">
    @switch (section()) {
      @case ('marches') {
        <app-market-card />
      }
      @case ('alertes') {
        <app-alerts-card />
      }
      @default {
        <app-availability-card />
      }
    }
  </div>
</div>
