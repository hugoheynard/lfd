<fold-card>
  <fold-element-title
    variant="title"
    icon="bell"
    title="Réglage des alertes"
    subtitle="La couleur d'un dossier en attente monte avec les jours sans traitement."
  />

  <!-- L'échelle, montrée plutôt que décrite. -->
  <div class="al-scale" aria-hidden="true">
    <span class="al-step al-step--neutral">
      <span class="al-dot"></span>
      Récent
    </span>
    <span class="al-arrow">→</span>
    <span class="al-step al-step--warn">
      <span class="al-dot"></span>
      Dès {{ settings.warnDays() }} j
    </span>
    <span class="al-arrow">→</span>
    <span class="al-step al-step--alert">
      <span class="al-dot"></span>
      Dès {{ settings.alertDays() }} j
    </span>
  </div>

  <div class="al-fields">
    <fold-number-input
      label="Avertissement (ambre)"
      hint="Jours d'attente avant que le dossier passe en ambre."
      [min]="1"
      [value]="settings.warnDays()"
      (valueChange)="setWarn($event)"
    />

    <fold-number-input
      label="Alerte (rouge)"
      hint="Jamais avant le seuil d'avertissement."
      [min]="settings.warnDays()"
      [value]="settings.alertDays()"
      (valueChange)="setAlert($event)"
    />
  </div>

  <p class="sec-hint al-scope">
    Enregistré sur ce navigateur — ces seuils ne sont pas encore partagés avec le reste de l'équipe.
  </p>
</fold-card>
