@if (state() === 'error') {
  <fold-callout variant="alert">
    Le chargement ou l'enregistrement a échoué.
    <button type="button" class="sec-link" (click)="load()">Réessayer</button>
  </fold-callout>
}

<app-week-grid-card [draft]="draft()" (changed)="onChanged($event)" />

<app-booking-policy-card
  [draft]="draft()"
  (changed)="onChanged($event)"
  (persisted)="onPersisted($event)"
/>

<app-exceptions-card [draft]="draft()" (changed)="onChanged($event)" />

<!-- La semaine type et les exceptions s'enregistrent ensemble : elles décrivent
     la même grille, et une moitié sans l'autre ouvrirait des créneaux non voulus.
     Les règles, elles, ont leur propre bouton — elles ne touchent pas la grille. -->
<div class="av-save">
  @if (saved()) {
    <span class="sec-saved">Enregistré.</span>
  }
  <button foldButton [disabled]="saving()" (click)="save()">
    {{ saving() ? 'Enregistrement…' : 'Enregistrer la grille' }}
  </button>
</div>

<app-slots-preview-card [days]="preview()" />
