@if (state() === 'error') {
  <fold-callout variant="alert">
    Le chargement ou l'enregistrement a échoué.
    <button type="button" class="sec-link" (click)="load()">Réessayer</button>
  </fold-callout>
}

<app-week-grid-card [draft]="draft()" (changed)="onChanged($event)" />

<app-booking-policy-card [draft]="draft()" (changed)="onChanged($event)" />

<app-exceptions-card [draft]="draft()" (changed)="onChanged($event)" />

<!-- Une barre d'action, pas une carte : les trois cartes ci-dessus s'enregistrent
     ensemble, en un seul appel. -->
<div class="av-save">
  @if (saved()) {
    <span class="sec-saved">Enregistré.</span>
  }
  <button foldButton [disabled]="saving()" (click)="save()">
    {{ saving() ? 'Enregistrement…' : 'Enregistrer les disponibilités' }}
  </button>
</div>

<app-slots-preview-card [days]="preview()" />
