@if (auth.isLoading()) {
  <!-- Auth0 résout la session : squelette neutre. -->
  <div class="app-boot" role="status" aria-label="Chargement">
    <fold-spinner />
  </div>
} @else if (auth.isAuthenticated()) {
  <fold-app-shell #shell="foldAppShell" footerBehavior="scroll" [(mobileNavOpen)]="mobileNavOpen">
    <!-- Rail primaire = LE switcher d'apps de la suite. -->
    <fold-menu railPrimary tint="primary" [expanded]="true">
      <a header class="rail-brand" routerLink="/" aria-label="La Folie Coffee — Suite">
        <span class="brand-mark" aria-hidden="true">LFC</span>
        <span class="rail-wordmark">Suite</span>
      </a>

      @for (app of apps; track app.id) {
        <a
          fold-menu-item
          [icon]="app.icon"
          [label]="app.title"
          [routerLink]="[app.routePath]"
          routerLinkActive
          #rla="routerLinkActive"
          [active]="rla.isActive"
          (click)="mobileNavOpen.set(false)"
        ></a>
      }

      <button
        footer
        fold-menu-item
        icon="logout"
        label="Déconnexion"
        type="button"
        (click)="auth.logout()"
      ></button>
    </fold-menu>

    <!-- Header mince. -->
    <div header foldSurface="chrome" class="app-header">
      <span class="app-context">Suite interne</span>
    </div>

    <!-- L'app montée. Elle apportera son propre menu (donnée du remote). -->
    <router-outlet />

    <!-- Hôte unique des side-panels. -->
    <fold-panel-host />
  </fold-app-shell>
} @else {
  <!-- Non authentifié : porte de login unique de la suite. -->
  <div class="app-login">
    <div class="login-card">
      <span class="brand-mark" aria-hidden="true">LFC</span>
      <h1>La Folie Coffee — Suite</h1>
      <p>Outillage interne. Connectez-vous pour accéder aux apps.</p>
      <button type="button" class="login-btn" (click)="auth.login()">Se connecter</button>
    </div>
  </div>
}
