# Infrastructure de dev locale — uniquement l'état persistant dont les apps ont
# besoin. Les apps elles-mêmes tournent sur l'hôte (`pnpm lfc-suite:dev:watch`)
# pour garder le HMR rapide ; ce fichier ne porte que l'état externe.
#
# Usage :
#   pnpm dev:infra              # démarre (docker compose up -d)
#   pnpm dev:infra:down         # arrête, garde les données
#   pnpm dev:infra:nuke         # arrête ET détruit les volumes (repart de zéro)
#
# Miroir prod : Neon (Postgres managé, ADR-09). Même contrat de connexion via
# `DATABASE_URL` — seule l'URL change. En dev :
#   DATABASE_URL="postgresql://lfc:lfc@localhost:5433/lfc_pim?schema=public"
#
# Même principe pour le stockage objet : la prod est Cloudflare R2, le dev est
# MinIO. Les deux parlent S3, et `S3StorageService` pose déjà
# `forcePathStyle: true` — c'est l'`endpoint` qui change, rien d'autre.

services:
  postgres:
    image: postgres:17-alpine
    container_name: lfd-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lfc
      POSTGRES_PASSWORD: lfc
      POSTGRES_DB: lfc_pim
    # Port hôte 5433 (et non 5432) : 5432 est déjà occupé sur cette machine.
    # Même logique que l'API sur 3100 pour éviter le 3000 de SH3PHERD.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lfc -d lfc_pim"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Stockage objet compatible S3 — le R2 du poste de dev.
  #
  # Le KBIS et le mandat SEPA passaient par un `DocumentStore` qui, faute de
  # `STORAGE_*`, refusait poliment : on développait le dépôt de pièces sans
  # jamais déposer de pièce. MinIO rend le flux RÉEL en local — mêmes octets,
  # même SDK, même chemin de code que la prod.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lfd-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Identifiants de DEV, en clair et assumés : ce conteneur n'écoute que sur
      # la boucle locale et ne contient que des pièces de test.
      MINIO_ROOT_USER: lfc
      MINIO_ROOT_PASSWORD: lfclfclfc
    # Ports hôte décalés comme Postgres (5433) : 9000 est un port trop courant
    # pour le réserver. 9100 = API S3, 9101 = console web.
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Crée le bucket au démarrage, puis sort. Sans lui, la première pièce déposée
  # tomberait sur un `NoSuchBucket` — en prod le bucket R2 est créé une fois à
  # la main, ici il doit renaître avec le volume (`dev:infra:nuke`).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: lfd-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set lfd http://minio:9000 lfc lfclfclfc &&
             mc mb --ignore-existing lfd/lfc-b2b-dev &&
             echo 'bucket lfc-b2b-dev prêt'"

volumes:
  postgres-data:
  minio-data:
